n/chapter-10/audio/275638503c.mp3", "tension": "/assets/avcn/chapter-10/audio/2dc14fd755.mp3", "shutdown": "/assets/avcn/chapter-10/audio/99d662cef2.mp3", "Maintenance is defined as any activity such as tests, measurements, replacements, adjustments, lubrication and repairs": "/assets/avcn/chapter-10/audio/c645b41c5d.mp3", "Maintenance": "/assets/avcn/chapter-10/audio/2447d7df04.mp3", "defined as": "/assets/avcn/chapter-10/audio/b8453ff252.mp3", "activity": "/assets/avcn/chapter-10/audio/adc3ae9239.mp3", "tests": "/assets/avcn/chapter-10/audio/32ae7cb92c.mp3", "measurements": "/assets/avcn/chapter-10/audio/da7f0ba55f.mp3", "replacements": "/assets/avcn/chapter-10/audio/7ef9a1f2d4.mp3", "adjustments": "/assets/avcn/chapter-10/audio/cccbbfffd7.mp3", "repairs": "/assets/avcn/chapter-10/audio/1a38ea4794.mp3", "which is intended to retain or restore a functional unit in or to a specified state in which it can perform its required functions.": "/assets/avcn/chapter-10/audio/1da070ee86.mp3", "retain": "/assets/avcn/chapter-10/audio/425d8b791f.mp3", "intended to": "/assets/avcn/chapter-10/audio/a543fea386.mp3", "restore": "/assets/avcn/chapter-10/audio/a58f9df427.mp3", "functional": "/assets/avcn/chapter-10/audio/8b12125e32.mp3", "unit": "/assets/avcn/chapter-10/audio/40359a8ee7.mp3", "specified state": "/assets/avcn/chapter-10/audio/8787ef09c5.mp3", "perform": "/assets/avcn/chapter-10/audio/5652fa4d46.mp3", "required": "/assets/avcn/chapter-10/audio/abea7c4178.mp3", "Plants typically utilize two types of maintenance management: (1) corrective maintenance, or (2) preventive maintenance.": "/assets/avcn/chapter-10/audio/9f360c135f.mp3", "corrective": "/assets/avcn/chapter-10/audio/b0f6f28f18.mp3", "preventive": "/assets/avcn/chapter-10/audio/177901ce06.mp3", "plants": "/assets/avcn/chapter-10/audio/7579b854b2.mp3", "typically": "/assets/avcn/chapter-10/audio/f2080080a6.mp3", "utilize": "/assets/avcn/chapter-10/audio/e2cc819e1c.mp3", "types": "/assets/avcn/chapter-10/audio/50 udio/7a8f6d5585.mp3", "went": "/assets/avcn/chapter-10/audio/6a08c36769.mp3", "feet": "/assets/avcn/chapter-10/audio/0941131dc9.mp3", "above": "/assets/avcn/chapter-10/audio/00483350d1.mp3", "Atlantic": "/assets/avcn/chapter-10/audio/e7ff00610d.mp3", "With Flight 236 en route from Toronto to Lisbon, carrying 306 people, the fuel line ruptured, resulting in a major leak.": "/assets/avcn/chapter-10/audio/edeaa9e569.mp3", "ruptured": "/assets/avcn/chapter-10/audio/f66dadccc5.mp3", "en route": "/assets/avcn/chapter-10/audio/9f652b13f8.mp3", "carrying": "/assets/avcn/chapter-10/audio/1e32b26d6c.mp3", "resulting in": "/assets/avcn/chapter-10/audio/159e5301a2.mp3", "major": "/assets/avcn/chapter-10/audio/0e31f60b98.mp3", "Less than two hours later, the aircraft was completely out of fuel, gliding silently through the night sky.": "/assets/avcn/chapter-10/audio/8f9d7a5c0b.mp3", "gliding": "/assets/avcn/chapter-10/audio/2f387e8dba.mp3", "less than": "/assets/avcn/chapter-10/audio/47b0cb2387.mp3", "aircraft": "/assets/avcn/chapter-10/audio/a49970565a.mp3", "completely": "/assets/avcn/chapter-10/audio/a2d58cbdac.mp3", "out of fuel": "/assets/avcn/chapter-10/audio/803137b0b1.mp3", "silently": "/assets/avcn/chapter-10/audio/235aad919d.mp3", "sky": "/assets/avcn/chapter-10/audio/b053e8d4b7.mp3", "Preventive maintenance is the routine maintenance of machinery and equipment.": "/assets/avcn/chapter-10/audio/cec5d7a19e.mp3", "Lubrication is the action of applying oil or grease to a component.": "/assets/avcn/chapter-10/audio/a8654adf64.mp3", "Detection is the process of noticing something that is not easy to see.": "/assets/avcn/chapter-10/audio/014037cf3e.mp3", "Preventive maintenance is done to reduce unplanned equipment failures.": "/assets/avcn/chapter-10/audio/76b84afebc.mp3", "Companies follow a schedule to mitigate the chances of unplanned downtime.": "/assets/avcn/chapter-10/audio/8f29c071f2.mp3", "We check the casing regularly to find signs of corrosion.": "/assets/avcn/chapter-10/audio/aaa562b07f.mp3", "hydraulic pipe": "/assets/avcn/chapter-10/audio/05f0290593.mp3", "A good maintenance plan starts with early  of problems, before the machine stops. Putting oil or grease on moving parts is called . When a bearing is worn out,  is needed. The technician takes a  from the store and fits it. Doing these jobs on time reduces the  of accidents.": "/assets/avcn/chapter-10/audio/72ca1c963f.mp3", "bearing": "/assets/avcn/chapter-10/audio/04d608a180.mp3", "A part that lets a shaft or wheel turn smoothly.": "/assets/avcn/chapter-10/audio/e93bcebb44.mp3", "belt": "/assets/avcn/chapter-10/audio/4bcbef76cd.mp3", "oil filter": "/assets/avcn/chapter-10/audio/c62c37ee3d.mp3", "gasket": "/assets/avcn/chapter-10/audio/a665ec088f.mp3", "oil seal": "/assets/avcn/chapter-10/audio/58a8dda253.mp3", "hydraulic hose": "/assets/avcn/chapter-10/audio/f1bae03e54.mp3", "motor oil": "/assets/avcn/chapter-10/audio/e415d2768d.mp3", "crack": "/assets/avcn/chapter-10/audio/a463c8d344.mp3", "Maintenance (giáo trình viết “Maintenace”)": "/assets/avcn/chapter-10/audio/9124a396a5.mp3", "Câu giáo trình viết “which intended … in can perform”": "/assets/avcn/chapter-10/audio/c542ce4711.mp3", "Maintenace": "/assets/avcn/chapter-10/audio/093be86cf3.mp3", "which intended … in can perform": "/assets/avcn/chapter-10/audio/1faa9db034.mp3"};
let curAudio = null;
const KEY = "avcn-flashcard-ch10";
TERMS.forEach((t, i) => { t.id = i; });
// Cặp từ đồng nghĩa trong chương: không cho làm phương án nhiễu của nhau (hai đáp án cùng đúng).
const SAME = [["coolant", "cutting fluid"]];
const clash = (a, b) => a.term === b.term || SAME.some((p) => p.includes(a.term) && p.includes(b.term));
const view = document.getElementById("view");
let box = {};
try { box = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { box = {}; }
const boxOf = (t) => box[t.id] || 1;
function save() { try { localStorage.setItem(KEY, JSON.stringify(box)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function speak(text) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (AUDIO[text]) {
    const a = new Audio(AUDIO[text]);
    curAudio = a;
    a.play().catch((e) => { if (curAudio === a && !(e && e.name === "AbortError")) speakBrowser(text); });
    return;
  }
  speakBrowser(text);
}
function speakBrowser(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  const score = (x) => {
    const l = x.lang.replace("_", "-").toLowerCase();
    if (!l.startsWith("en")) return -1;
    let s = l === "en-us" ? 10 : 5;
    if (/premium|enhanced|neural|natural|online/i.test(x.name)) s += 30;
    if (/\b(samantha|ava|allison|evan|nicky|zoe|aria|jenny|guy|google us english)\b/i.test(x.name)) s += 20;
    if (/\b(fred|albert|zarvox|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|kathy|organ|princess|ralph|trinoids|whisper|superstar)\b/i.test(x.name)) s -= 40;
    if (x.localService === false) s += 5;
    return s;
  };
  const v = speechSynthesis.getVoices().filter((x) => score(x) >= 0).sort((a, b) => score(b) - score(a))[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
view.addEventListener("click", (e) => { const b = e.target.closest("[data-speak]"); if (b) speak(b.dataset.speak); });
function front(t) {
  return (t.img ? `<img class="pic" src="${t.img}" alt="">` : "") + `<p class="def">${esc(t.def)}</p>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Thẻ Leitner 3 hộp: hộp 1 hiện nhiều nhất; "Nhớ rồi" đẩy lên một hộp, "Chưa nhớ" về hộp 1.
let current = null;
function pickCard() {
  const weights = { 1: 6, 2: 3, 3: 1 };
  const pool = TERMS.filter((t) => t !== current);
  const total = pool.reduce((s, t) => s + weights[boxOf(t)], 0);
  let r = Math.random() * total;
  for (const t of pool) { r -= weights[boxOf(t)]; if (r <= 0) return t; }
  return pool[0];
}
function boxesHtml() {
  const c = { 1: 0, 2: 0, 3: 0 };
  TERMS.forEach((t) => c[boxOf(t)]++);
  return `<div class="boxes"><div><b>${c[1]}</b>Hộp 1 · chưa nhớ</div><div><b>${c[2]}</b>Hộp 2 · đang nhớ</div><div><b>${c[3]}</b>Hộp 3 · đã thuộc</div></div>`;
}
function renderLeitner() {
  current = pickCard();
  const t = current;
  view.innerHTML = boxesHtml() + `<div class="card">${front(t)}<p class="hint">Nghĩ ra từ tiếng Anh trước, rồi mới lật thẻ.</p>
    <div id="back" class="back" hidden>
      <p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p>
      <p class="vi">${esc(t.vi)}</p>
      <div class="row"><button class="btn btn-bad" id="no">Chưa nhớ</button><button class="btn btn-ok" id="yes">Nhớ rồi</button></div>
    </div>
    <button class="btn btn-main" id="flip">Lật thẻ</button></div>`;
  document.getElementById("flip").onclick = (e) => { e.target.remove(); document.getElementById("back").hidden = false; speak(t.term); };
  view.querySelector("#no").onclick = () => { box[t.id] = 1; save(); renderLeitner(); };
  view.querySelector("#yes").onclick = () => { box[t.id] = Math.min(3, boxOf(t) + 1); save(); renderLeitner(); };
}

// Nhìn ảnh (hoặc đọc định nghĩa nếu từ không có ảnh) chọn 1 trong 4 từ — đúng dạng Part 1 của đề cuối kỳ.
let quiz = null;
function startQuiz() { quiz = { order: shuffle(TERMS.slice()), i: 0, right: 0 }; renderQuiz(); }
function renderQuiz() {
  if (quiz.i >= quiz.order.length) {
    view.innerHTML = `<div class="card done"><p class="term" style="justify-content:center">${quiz.right}/${quiz.order.length}</p><p class="vi">${quiz.right >= 16 ? "Rất tốt! Em đã sẵn sàng cho Part 1." : "Ôn lại các từ sai ở chế độ Thẻ 3 hộp rồi làm lại nhé."}</p><button class="btn btn-main" id="again">Làm lại</button></div>`;
    document.getElementById("again").onclick = startQuiz;
    return;
  }
  const t = quiz.order[quiz.i];
  const opts = shuffle([t, ...shuffle(TERMS.filter((x) => !clash(x, t)).filter((x, k, a) => a.findIndex((y) => y.term === x.term) === k)).slice(0, 3)]);
  view.innerHTML = `<p class="score">Câu ${quiz.i + 1}/${quiz.order.length} · đúng ${quiz.right}</p><div class="card">${front(t)}
    <div class="opts">${opts.map((o, k) => `<button data-k="${k}">${"abcd"[k]}. ${esc(o.term)}</button>`).join("")}</div><div id="after"></div></div>`;
  view.querySelectorAll(".opts button").forEach((b) => b.onclick = () => {
    const pick = opts[+b.dataset.k];
    const ok = pick === t;
    if (ok) quiz.right++; else box[t.id] = 1;
    save();
    view.querySelectorAll(".opts button").forEach((x) => { x.disabled = true; if (opts[+x.dataset.k] === t) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad");
    document.getElementById("after").innerHTML = `<div class="back"><p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p><p class="vi">${esc(t.vi)}</p></div><button class="btn btn-main" id="next">Câu tiếp</button>`;
    document.getElementById("next").onclick = () => { quiz.i++; renderQuiz(); };
    speak(t.term);
  });
}

const tabs = { leitner: document.getElementById("t-leitner"), quiz: document.getElementById("t-quiz") };
function setMode(m) {
  tabs.leitner.setAttribute("aria-selected", m === "leitner");
  tabs.quiz.setAttribute("aria-selected", m === "quiz");
  m === "leitner" ? renderLeitner() : startQuiz();
}
tabs.leitner.onclick = () => setMode("leitner");
tabs.quiz.onclick = () => setMode("quiz");
setMode("leitner");
</script>
