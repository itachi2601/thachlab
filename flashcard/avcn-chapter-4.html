, "allowed amount": "/assets/avcn/chapter-4/audio/e356b82f25.mp3", "This is often given as a deviation (difference) from a precise size.": "/assets/avcn/chapter-4/audio/6e4ba0a9d8.mp3", "often": "/assets/avcn/chapter-4/audio/6c99118b16.mp3", "given as": "/assets/avcn/chapter-4/audio/78500c7fe3.mp3", "The drawing below shows a shaft with a specified diameter of 88mm, plus or minus (±) 0.05 mm.": "/assets/avcn/chapter-4/audio/01a35d0ca8.mp3", "plus or minus": "/assets/avcn/chapter-4/audio/828777dc85.mp3", "drawing": "/assets/avcn/chapter-4/audio/7d8e86e6fa.mp3", "shaft": "/assets/avcn/chapter-4/audio/3ff16b96cf.mp3", "specified": "/assets/avcn/chapter-4/audio/1c1eeb45d7.mp3", "diameter": "/assets/avcn/chapter-4/audio/f5399e57d0.mp3", "This means the diameter may deviate 0.05mm either side of this size.": "/assets/avcn/chapter-4/audio/a133391b8e.mp3", "deviate": "/assets/avcn/chapter-4/audio/a8f3c36cc0.mp3", "means": "/assets/avcn/chapter-4/audio/d4b0f96c50.mp3", "either side": "/assets/avcn/chapter-4/audio/e0b61f4fcc.mp3", "Therefore, diameters of 87.95mm and 88.05mm, which are slightly inaccurate, are still permissible (allowed), as they are within tolerance.": "/assets/avcn/chapter-4/audio/acb031dd86.mp3", "inaccurate": "/assets/avcn/chapter-4/audio/df741ccdbc.mp3", "slightly": "/assets/avcn/chapter-4/audio/b1402c2865.mp3", "within tolerance": "/assets/avcn/chapter-4/audio/7e3092b331.mp3", "However, diameters of 87.94mm or 88.06mm are not permissible – they are outside tolerance.": "/assets/avcn/chapter-4/audio/0e131d90f5.mp3", "outside": "/assets/avcn/chapter-4/audio/bd13008179.mp3", "However": "/assets/avcn/chapter-4/audio/117db74148.mp3", "not permissible": "/assets/avcn/chapter-4/audio/cf86198806.mp3", "When the permissible deviation in the size is very small, we say it is a tight tolerance (or a close tolerance).": "/assets/avcn/chapter-4/audio/ed1607e302.mp3", "tight": "/assets/avcn/chapter-4/audio/ccc0c1492f.mp3", "very small": "/assets/avcn/chapter-4/audio/e339fff555.mp3", "close": "/assets/avcn/chapter-4/audio/a2154dcca6.mp3", "A large permissible deviation is a loose tolerance.": "/assets/avcn/chapter-4/audio/02425debac.mp3", "loose": "/assets/avcn/chapter-4/audio/932b76d089.mp3", "large": "/assets/avcn/chapter-4/audio/38413ab6d9.mp3", "Machining a metal component to a tolerance of ±0.1mm is relatively easy to do, so this tolerance is loose.": "/assets/avcn/chapter-4/audio/0075477b2d.mp3", "Machining": "/assets/avcn/chapter-4/audio/7ba930bf17.mp3", "metal component": "/assets/avcn/chapter-4/audio/717765dad2.mp3", "relatively": "/assets/avcn/chapter-4/audio/d1999da5e8.mp3", "easy to do": "/assets/avcn/chapter-4/audio/230b7211b6.mp3", "But a tolerance of just ±0.01mm is a tight tolerance in metal working.": "/assets/avcn/chapter-4/audio/5f1af4ab76.mp3", "just": "/assets/avcn/chapter-4/audio/f4be1509df.mp3", "metal working": "/assets/avcn/chapter-4/audio/8aee93ce29.mp3", "It prevents you from rounding off a fastener.": "/assets/avcn/chapter-4/audio/bf775b3c81.mp3", "A table of conversion prevents you from making mistakes.": "/assets/avcn/chapter-4/audio/b348fff255.mp3", "A washer prevents the nut from damaging the surface.": "/assets/avcn/chapter-4/audio/cd0289b2c6.mp3", "If you don't know an item's size, use a micrometer to measure it.": "/assets/avcn/chapter-4/audio/284e488152.mp3", "If the hole is deep, use a depth micrometer to measure it.": "/assets/avcn/chapter-4/audio/e67bb36672.mp3", "The Millau Viaduct is a big bridge in France. Its  length is 2,460 m. The maximum  between two supports is 342 m. The tallest support has a  of 245 m, measured from the ground to the deck. The deck has a  of 32 m and a  of 4.2 m.": "/assets/avcn/chapter-4/audio/596463c8b8.mp3", "feeler gauge": "/assets/avcn/chapter-4/audio/43ee9ab716.mp3", "dial indicator": "/assets/avcn/chapter-4/audio/ae5ae27807.mp3", "tape measure": "/assets/avcn/chapter-4/audio/4a2d268fc2.mp3", "spirit level": "/assets/avcn/chapter-4/audio/678a57fb40.mp3", "Machining a metal component to a tolerance of ±0.1mm is relatively ways to do, so this tolerance is loose.": "/assets/avcn/chapter-4/audio/dd26f40cc0.mp3", "ways to do": "/assets/avcn/chapter-4/audio/5dbc93382a.mp3"};
let curAudio = null;
const KEY = "avcn-flashcard-ch4";
TERMS.forEach((t, i) => { t.id = i; });
// Cặp từ đồng nghĩa trong chương: không cho làm phương án nhiễu của nhau (hai đáp án cùng đúng).
const SAME = [["coolant", "cutting fluid"]];
const clash = (a, b) => a.term === b.term || SAME.some((p) => p.includes(a.term) && p.includes(b.term));
const view = document.getElementById("view");
let box = {};
try { box = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { box = {}; }
const boxOf = (t) => box[t.id] || 1;
function save() { try { localStorage.setItem(KEY, JSON.stringify(box)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function speak(text) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (AUDIO[text]) {
    const a = new Audio(AUDIO[text]);
    curAudio = a;
    a.play().catch((e) => { if (curAudio === a && !(e && e.name === "AbortError")) speakBrowser(text); });
    return;
  }
  speakBrowser(text);
}
function speakBrowser(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  const score = (x) => {
    const l = x.lang.replace("_", "-").toLowerCase();
    if (!l.startsWith("en")) return -1;
    let s = l === "en-us" ? 10 : 5;
    if (/premium|enhanced|neural|natural|online/i.test(x.name)) s += 30;
    if (/\b(samantha|ava|allison|evan|nicky|zoe|aria|jenny|guy|google us english)\b/i.test(x.name)) s += 20;
    if (/\b(fred|albert|zarvox|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|kathy|organ|princess|ralph|trinoids|whisper|superstar)\b/i.test(x.name)) s -= 40;
    if (x.localService === false) s += 5;
    return s;
  };
  const v = speechSynthesis.getVoices().filter((x) => score(x) >= 0).sort((a, b) => score(b) - score(a))[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
view.addEventListener("click", (e) => { const b = e.target.closest("[data-speak]"); if (b) speak(b.dataset.speak); });
function front(t) {
  return (t.img ? `<img class="pic" src="${t.img}" alt="">` : "") + `<p class="def">${esc(t.def)}</p>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Thẻ Leitner 3 hộp: hộp 1 hiện nhiều nhất; "Nhớ rồi" đẩy lên một hộp, "Chưa nhớ" về hộp 1.
let current = null;
function pickCard() {
  const weights = { 1: 6, 2: 3, 3: 1 };
  const pool = TERMS.filter((t) => t !== current);
  const total = pool.reduce((s, t) => s + weights[boxOf(t)], 0);
  let r = Math.random() * total;
  for (const t of pool) { r -= weights[boxOf(t)]; if (r <= 0) return t; }
  return pool[0];
}
function boxesHtml() {
  const c = { 1: 0, 2: 0, 3: 0 };
  TERMS.forEach((t) => c[boxOf(t)]++);
  return `<div class="boxes"><div><b>${c[1]}</b>Hộp 1 · chưa nhớ</div><div><b>${c[2]}</b>Hộp 2 · đang nhớ</div><div><b>${c[3]}</b>Hộp 3 · đã thuộc</div></div>`;
}
function renderLeitner() {
  current = pickCard();
  const t = current;
  view.innerHTML = boxesHtml() + `<div class="card">${front(t)}<p class="hint">Nghĩ ra từ tiếng Anh trước, rồi mới lật thẻ.</p>
    <div id="back" class="back" hidden>
      <p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p>
      <p class="vi">${esc(t.vi)}</p>
      <div class="row"><button class="btn btn-bad" id="no">Chưa nhớ</button><button class="btn btn-ok" id="yes">Nhớ rồi</button></div>
    </div>
    <button class="btn btn-main" id="flip">Lật thẻ</button></div>`;
  document.getElementById("flip").onclick = (e) => { e.target.remove(); document.getElementById("back").hidden = false; speak(t.term); };
  view.querySelector("#no").onclick = () => { box[t.id] = 1; save(); renderLeitner(); };
  view.querySelector("#yes").onclick = () => { box[t.id] = Math.min(3, boxOf(t) + 1); save(); renderLeitner(); };
}

// Nhìn ảnh (hoặc đọc định nghĩa nếu từ không có ảnh) chọn 1 trong 4 từ — đúng dạng Part 1 của đề cuối kỳ.
let quiz = null;
function startQuiz() { quiz = { order: shuffle(TERMS.slice()), i: 0, right: 0 }; renderQuiz(); }
function renderQuiz() {
  if (quiz.i >= quiz.order.length) {
    view.innerHTML = `<div class="card done"><p class="term" style="justify-content:center">${quiz.right}/${quiz.order.length}</p><p class="vi">${quiz.right >= 16 ? "Rất tốt! Em đã sẵn sàng cho Part 1." : "Ôn lại các từ sai ở chế độ Thẻ 3 hộp rồi làm lại nhé."}</p><button class="btn btn-main" id="again">Làm lại</button></div>`;
    document.getElementById("again").onclick = startQuiz;
    return;
  }
  const t = quiz.order[quiz.i];
  const opts = shuffle([t, ...shuffle(TERMS.filter((x) => !clash(x, t)).filter((x, k, a) => a.findIndex((y) => y.term === x.term) === k)).slice(0, 3)]);
  view.innerHTML = `<p class="score">Câu ${quiz.i + 1}/${quiz.order.length} · đúng ${quiz.right}</p><div class="card">${front(t)}
    <div class="opts">${opts.map((o, k) => `<button data-k="${k}">${"abcd"[k]}. ${esc(o.term)}</button>`).join("")}</div><div id="after"></div></div>`;
  view.querySelectorAll(".opts button").forEach((b) => b.onclick = () => {
    const pick = opts[+b.dataset.k];
    const ok = pick === t;
    if (ok) quiz.right++; else box[t.id] = 1;
    save();
    view.querySelectorAll(".opts button").forEach((x) => { x.disabled = true; if (opts[+x.dataset.k] === t) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad");
    document.getElementById("after").innerHTML = `<div class="back"><p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p><p class="vi">${esc(t.vi)}</p></div><button class="btn btn-main" id="next">Câu tiếp</button>`;
    document.getElementById("next").onclick = () => { quiz.i++; renderQuiz(); };
    speak(t.term);
  });
}

const tabs = { leitner: document.getElementById("t-leitner"), quiz: document.getElementById("t-quiz") };
function setMode(m) {
  tabs.leitner.setAttribute("aria-selected", m === "leitner");
  tabs.quiz.setAttribute("aria-selected", m === "quiz");
  m === "leitner" ? renderLeitner() : startQuiz();
}
tabs.leitner.onclick = () => setMode("leitner");
tabs.quiz.onclick = () => setMode("quiz");
setMode("leitner");
</script>
