avcn/chapter-6/audio/00acf43834.mp3", "Without this gas, the hot metal would combine with the oxygen in the air, and this would weaken the weld.": "/assets/avcn/chapter-6/audio/ec462fa43a.mp3", "combine": "/assets/avcn/chapter-6/audio/b62d8c4d13.mp3", "weaken": "/assets/avcn/chapter-6/audio/a19c04e4cc.mp3", "without": "/assets/avcn/chapter-6/audio/0cc11c7a70.mp3", "hot": "/assets/avcn/chapter-6/audio/85ccf426c7.mp3", "air": "/assets/avcn/chapter-6/audio/c66ec11c42.mp3", "In gas welding, heat comes from a torch which burns oxyfuel – a mixture of oxygen (O₂) and a gas fuel.": "/assets/avcn/chapter-6/audio/6631dfd950.mp3", "gas welding": "/assets/avcn/chapter-6/audio/c8271e28e4.mp3", "comes from": "/assets/avcn/chapter-6/audio/24a5c3e09b.mp3", "burns": "/assets/avcn/chapter-6/audio/25f67b81ca.mp3", "oxyfuel": "/assets/avcn/chapter-6/audio/e088fc5abb.mp3", "a mixture of": "/assets/avcn/chapter-6/audio/24ce6d1a0e.mp3", "gas fuel": "/assets/avcn/chapter-6/audio/e2547c117d.mp3", "The gas fuel burns much hotter in oxygen than it would in the air.": "/assets/avcn/chapter-6/audio/63e3cc24fc.mp3", "hotter": "/assets/avcn/chapter-6/audio/0fb66a5a77.mp3", "much": "/assets/avcn/chapter-6/audio/dfe81ef17e.mp3", "in the air": "/assets/avcn/chapter-6/audio/0fe81cbf88.mp3", "The most common fuel is acetylene (C₂H₂) – called oxyacetylene when mixed with oxygen.": "/assets/avcn/chapter-6/audio/51365fd2ed.mp3", "oxyacetylene": "/assets/avcn/chapter-6/audio/f0a00e20f1.mp3", "the most common": "/assets/avcn/chapter-6/audio/fdd3e0932c.mp3", "fuel": "/assets/avcn/chapter-6/audio/959ff4aac3.mp3", "mixed with": "/assets/avcn/chapter-6/audio/30f270aeb5.mp3", "Welding rods provide filler but flux is not required, as the burning oxyfuel produces carbon dioxide (CO₂) which acts as a shielding gas.": "/assets/avcn/chapter-6/audio/9d2f6e98b0.mp3", "required": "/assets/avcn/chapter-6/audio/abea7c4178.mp3", "burning": "/assets/avcn/chapter-6/audio/f519974925.mp3", "acts as": "/assets/avcn/chapter-6/audio/64e7d2eb5e.mp3", "In gas metal arc welding (GMAW) – often called MIG welding (metal inert gas) –": "/assets/avcn/chapter-6/audio/61ab17491c.mp3", "MIG welding": "/assets/avcn/chapter-6/audio/ca6cb3c758.mp3", "often called": "/assets/avcn/chapter-6/audio/d1ccf6b556.mp3", "inert": "/assets/avcn/chapter-6/audio/2ce610d953.mp3", "an arc is struck between the work piece and a wire which is made of the same metal as the base metal.": "/assets/avcn/chapter-6/audio/b5aaddf2c3.mp3", "struck": "/assets/avcn/chapter-6/audio/b76fa00391.mp3", "wire": "/assets/avcn/chapter-6/audio/16a5b07b1e.mp3", "the same … as": "/assets/avcn/chapter-6/audio/cd8f8b83cb.mp3", "The wire acts as a consumable electrode, supplying filler.": "/assets/avcn/chapter-6/audio/896d425103.mp3", "supplying": "/assets/avcn/chapter-6/audio/a72f9968d6.mp3", "consumable electrode": "/assets/avcn/chapter-6/audio/e05b864522.mp3", "A shielding gas, often argon (Ar), is blown onto the weld pool.": "/assets/avcn/chapter-6/audio/110231cdcd.mp3", "blown": "/assets/avcn/chapter-6/audio/016edb3185.mp3", "In gas tungsten arc welding (GTAW) – often called TIG welding (Tungsten Inert Gas) –": "/assets/avcn/chapter-6/audio/b8a07731d5.mp3", "TIG welding": "/assets/avcn/chapter-6/audio/3796a77480.mp3", "tungsten": "/assets/avcn/chapter-6/audio/528a09af6b.mp3", "an arc comes from an electrode made of tungsten (W).": "/assets/avcn/chapter-6/audio/f65b5d5962.mp3", "However, the tungsten is non-consumable – it does not melt, and is not consumed as filler during the welding process.": "/assets/avcn/chapter-6/audio/23227a36b4.mp3", "melt": "/assets/avcn/chapter-6/audio/a162cc58fb.mp3", "however": "/assets/avcn/chapter-6/audio/28d95e09f4.mp3", "consumed": "/assets/avcn/chapter-6/audio/a4a875d59c.mp3", "welding process": "/assets/avcn/chapter-6/audio/ad5e5d8041.mp3", "A separate welding rod is used to supply filler, if required.": "/assets/avcn/chapter-6/audio/f0d63160eb.mp3", "separate": "/assets/avcn/chapter-6/audio/7da0171002.mp3", "supply": "/assets/avcn/chapter-6/audio/039e5b3e72.mp3", "is used to": "/assets/avcn/chapter-6/audio/83a8b0ca28.mp3", "if required": "/assets/avcn/chapter-6/audio/9ed5cf7142.mp3", "As with MIG welding, a shielding gas such as argon is blown onto the weld.": "/assets/avcn/chapter-6/audio/332a86015d.mp3", "such as": "/assets/avcn/chapter-6/audio/06ba079209.mp3", "as with": "/assets/avcn/chapter-6/audio/fb932124f1.mp3", "blown onto": "/assets/avcn/chapter-6/audio/03d8a86c9c.mp3", "In gas welding, heat comes from a torch which burns oxyfuel.": "/assets/avcn/chapter-6/audio/8244153018.mp3", "An arc is struck between the work piece and a wire which is made of the same metal as the base metal.": "/assets/avcn/chapter-6/audio/7d6c955d67.mp3", "The rod is coated with a material called flux, which produces a shielding gas.": "/assets/avcn/chapter-6/audio/9f4a638c30.mp3", "A separate welding rod is used to supply filler.": "/assets/avcn/chapter-6/audio/53b61bd21f.mp3", "Welding is used to join components of the same base metal.": "/assets/avcn/chapter-6/audio/99f576ce2c.mp3", "A shielding gas is blown onto the weld.": "/assets/avcn/chapter-6/audio/9939bdd3c2.mp3", "Different metals can be  together, but it is more difficult than welding the same base metal. Both metals become  in the weld pool. When the pool cools, the metals may not  properly. This can leave , such as cracks, in the weld zone. As the metals contract at different rates, residual  builds up around the joint.": "/assets/avcn/chapter-6/audio/abe68b54da.mp3", "An electrical conductor used to strike an arc.": "/assets/avcn/chapter-6/audio/71814971d3.mp3", "electrode holder": "/assets/avcn/chapter-6/audio/0398d35980.mp3", "chipping hammer": "/assets/avcn/chapter-6/audio/ae481f619f.mp3", "wire brush": "/assets/avcn/chapter-6/audio/0ece54ba22.mp3", "gas regulator": "/assets/avcn/chapter-6/audio/d1318c9409.mp3"};
let curAudio = null;
const KEY = "avcn-flashcard-ch6";
TERMS.forEach((t, i) => { t.id = i; });
// Cặp từ đồng nghĩa trong chương: không cho làm phương án nhiễu của nhau (hai đáp án cùng đúng).
const SAME = [["coolant", "cutting fluid"]];
const clash = (a, b) => a.term === b.term || SAME.some((p) => p.includes(a.term) && p.includes(b.term));
const view = document.getElementById("view");
let box = {};
try { box = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { box = {}; }
const boxOf = (t) => box[t.id] || 1;
function save() { try { localStorage.setItem(KEY, JSON.stringify(box)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function speak(text) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if (AUDIO[text]) {
    const a = new Audio(AUDIO[text]);
    curAudio = a;
    a.play().catch(() => speakBrowser(text));
    return;
  }
  speakBrowser(text);
}
function speakBrowser(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  const score = (x) => {
    const l = x.lang.replace("_", "-").toLowerCase();
    if (!l.startsWith("en")) return -1;
    let s = l === "en-us" ? 10 : 5;
    if (/premium|enhanced|neural|natural|online/i.test(x.name)) s += 30;
    if (/\b(samantha|ava|allison|evan|nicky|zoe|aria|jenny|guy|google us english)\b/i.test(x.name)) s += 20;
    if (/\b(fred|albert|zarvox|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|kathy|organ|princess|ralph|trinoids|whisper|superstar)\b/i.test(x.name)) s -= 40;
    if (x.localService === false) s += 5;
    return s;
  };
  const v = speechSynthesis.getVoices().filter((x) => score(x) >= 0).sort((a, b) => score(b) - score(a))[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
view.addEventListener("click", (e) => { const b = e.target.closest("[data-speak]"); if (b) speak(b.dataset.speak); });
function front(t) {
  return (t.img ? `<img class="pic" src="${t.img}" alt="">` : "") + `<p class="def">${esc(t.def)}</p>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Thẻ Leitner 3 hộp: hộp 1 hiện nhiều nhất; "Nhớ rồi" đẩy lên một hộp, "Chưa nhớ" về hộp 1.
let current = null;
function pickCard() {
  const weights = { 1: 6, 2: 3, 3: 1 };
  const pool = TERMS.filter((t) => t !== current);
  const total = pool.reduce((s, t) => s + weights[boxOf(t)], 0);
  let r = Math.random() * total;
  for (const t of pool) { r -= weights[boxOf(t)]; if (r <= 0) return t; }
  return pool[0];
}
function boxesHtml() {
  const c = { 1: 0, 2: 0, 3: 0 };
  TERMS.forEach((t) => c[boxOf(t)]++);
  return `<div class="boxes"><div><b>${c[1]}</b>Hộp 1 · chưa nhớ</div><div><b>${c[2]}</b>Hộp 2 · đang nhớ</div><div><b>${c[3]}</b>Hộp 3 · đã thuộc</div></div>`;
}
function renderLeitner() {
  current = pickCard();
  const t = current;
  view.innerHTML = boxesHtml() + `<div class="card">${front(t)}<p class="hint">Nghĩ ra từ tiếng Anh trước, rồi mới lật thẻ.</p>
    <div id="back" class="back" hidden>
      <p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p>
      <p class="vi">${esc(t.vi)}</p>
      <div class="row"><button class="btn btn-bad" id="no">Chưa nhớ</button><button class="btn btn-ok" id="yes">Nhớ rồi</button></div>
    </div>
    <button class="btn btn-main" id="flip">Lật thẻ</button></div>`;
  document.getElementById("flip").onclick = (e) => { e.target.remove(); document.getElementById("back").hidden = false; speak(t.term); };
  view.querySelector("#no").onclick = () => { box[t.id] = 1; save(); renderLeitner(); };
  view.querySelector("#yes").onclick = () => { box[t.id] = Math.min(3, boxOf(t) + 1); save(); renderLeitner(); };
}

// Nhìn ảnh (hoặc đọc định nghĩa nếu từ không có ảnh) chọn 1 trong 4 từ — đúng dạng Part 1 của đề cuối kỳ.
let quiz = null;
function startQuiz() { quiz = { order: shuffle(TERMS.slice()), i: 0, right: 0 }; renderQuiz(); }
function renderQuiz() {
  if (quiz.i >= quiz.order.length) {
    view.innerHTML = `<div class="card done"><p class="term" style="justify-content:center">${quiz.right}/${quiz.order.length}</p><p class="vi">${quiz.right >= 16 ? "Rất tốt! Em đã sẵn sàng cho Part 1." : "Ôn lại các từ sai ở chế độ Thẻ 3 hộp rồi làm lại nhé."}</p><button class="btn btn-main" id="again">Làm lại</button></div>`;
    document.getElementById("again").onclick = startQuiz;
    return;
  }
  const t = quiz.order[quiz.i];
  const opts = shuffle([t, ...shuffle(TERMS.filter((x) => !clash(x, t)).filter((x, k, a) => a.findIndex((y) => y.term === x.term) === k)).slice(0, 3)]);
  view.innerHTML = `<p class="score">Câu ${quiz.i + 1}/${quiz.order.length} · đúng ${quiz.right}</p><div class="card">${front(t)}
    <div class="opts">${opts.map((o, k) => `<button data-k="${k}">${"abcd"[k]}. ${esc(o.term)}</button>`).join("")}</div><div id="after"></div></div>`;
  view.querySelectorAll(".opts button").forEach((b) => b.onclick = () => {
    const pick = opts[+b.dataset.k];
    const ok = pick === t;
    if (ok) quiz.right++; else box[t.id] = 1;
    save();
    view.querySelectorAll(".opts button").forEach((x) => { x.disabled = true; if (opts[+x.dataset.k] === t) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad");
    document.getElementById("after").innerHTML = `<div class="back"><p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p><p class="vi">${esc(t.vi)}</p></div><button class="btn btn-main" id="next">Câu tiếp</button>`;
    document.getElementById("next").onclick = () => { quiz.i++; renderQuiz(); };
    speak(t.term);
  });
}

const tabs = { leitner: document.getElementById("t-leitner"), quiz: document.getElementById("t-quiz") };
function setMode(m) {
  tabs.leitner.setAttribute("aria-selected", m === "leitner");
  tabs.quiz.setAttribute("aria-selected", m === "quiz");
  m === "leitner" ? renderLeitner() : startQuiz();
}
tabs.leitner.onclick = () => setMode("leitner");
tabs.quiz.onclick = () => setMode("quiz");
setMode("leitner");
</script>
