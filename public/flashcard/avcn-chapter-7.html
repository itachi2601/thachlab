65c0727bb.mp3", "tubes": "/assets/avcn/chapter-7/audio/03bd71356a.mp3", "for example": "/assets/avcn/chapter-7/audio/13979c6d35.mp3", "At the same time, the metal cools and becomes solid.": "/assets/avcn/chapter-7/audio/7db1589b09.mp3", "solid": "/assets/avcn/chapter-7/audio/e19ab1667e.mp3", "at the same time": "/assets/avcn/chapter-7/audio/ae3718722d.mp3", "cools": "/assets/avcn/chapter-7/audio/86d4ab323b.mp3", "becomes": "/assets/avcn/chapter-7/audio/5ec84372cd.mp3", "Sand casting is the most widely used casting process because of its flexibility, heat resistance, and relatively low cost.": "/assets/avcn/chapter-7/audio/23b6a42a78.mp3", "Sand casting": "/assets/avcn/chapter-7/audio/3492d23411.mp3", "flexibility": "/assets/avcn/chapter-7/audio/7662c57732.mp3", "the most widely used": "/assets/avcn/chapter-7/audio/f84a5b05e8.mp3", "relatively low cost": "/assets/avcn/chapter-7/audio/a76dd4eac3.mp3", "The sand casting process involves the use of a furnace, metal, pattern, and sand mold.": "/assets/avcn/chapter-7/audio/0e70f75c6a.mp3", "involves the use of": "/assets/avcn/chapter-7/audio/119f741fe3.mp3", "sand mold": "/assets/avcn/chapter-7/audio/55ce029f29.mp3", "The metal is melted in the furnace and then ladled and poured into the cavity of the sand mold, which is formed by the pattern.": "/assets/avcn/chapter-7/audio/7dd289e2f8.mp3", "ladled": "/assets/avcn/chapter-7/audio/24f1b3bada.mp3", "cavity": "/assets/avcn/chapter-7/audio/a9ffe430a9.mp3", "is melted": "/assets/avcn/chapter-7/audio/60fd0d55e3.mp3", "poured into": "/assets/avcn/chapter-7/audio/4a7db186e8.mp3", "is formed by": "/assets/avcn/chapter-7/audio/a3f4f8dba1.mp3", "The sand casting is used to produce a wide variety of metal components with complex geometries.": "/assets/avcn/chapter-7/audio/ff9eaa6ecd.mp3", "complex geometries": "/assets/avcn/chapter-7/audio/0ad3285feb.mp3", "is used to produce": "/assets/avcn/chapter-7/audio/30205f7314.mp3", "a wide variety of": "/assets/avcn/chapter-7/audio/723d469173.mp3", "metal components": "/assets/avcn/chapter-7/audio/64c0f5a3e5.mp3", "These parts can vary greatly in size and weight, ranging from a couple ounces to several tons.": "/assets/avcn/chapter-7/audio/8bd92fbfa9.mp3", "ounces": "/assets/avcn/chapter-7/audio/6b93ee121a.mp3", "tons": "/assets/avcn/chapter-7/audio/ab6b2b88cc.mp3", "vary greatly": "/assets/avcn/chapter-7/audio/81c7e97f46.mp3", "size and weight": "/assets/avcn/chapter-7/audio/a7a31351c3.mp3", "ranging from … to …": "/assets/avcn/chapter-7/audio/7549d9978c.mp3", "a couple": "/assets/avcn/chapter-7/audio/5c88234601.mp3", "Some smaller sand cast parts include components as gears, pulleys, crankshafts, connecting rods, and propellers.": "/assets/avcn/chapter-7/audio/8edad720ec.mp3", "gears": "/assets/avcn/chapter-7/audio/c3a01110e4.mp3", "pulleys": "/assets/avcn/chapter-7/audio/5370d9c157.mp3", "smaller": "/assets/avcn/chapter-7/audio/23e18f714b.mp3", "include": "/assets/avcn/chapter-7/audio/ba734f367a.mp3", "crankshafts": "/assets/avcn/chapter-7/audio/5c7253dd96.mp3", "connecting rods": "/assets/avcn/chapter-7/audio/1f906c9338.mp3", "propellers": "/assets/avcn/chapter-7/audio/2c47957711.mp3", "Larger applications include housings for large equipment and heavy machine bases.": "/assets/avcn/chapter-7/audio/4baddda864.mp3", "housings": "/assets/avcn/chapter-7/audio/3850c71e78.mp3", "larger applications": "/assets/avcn/chapter-7/audio/caf6dcb15c.mp3", "equipment": "/assets/avcn/chapter-7/audio/abde12756d.mp3", "heavy machine bases": "/assets/avcn/chapter-7/audio/8f97607245.mp3", "Sand casting is also common in producing automobile components, such as engine blocks, engine manifolds, cylinder heads, and transmission cases.": "/assets/avcn/chapter-7/audio/2817ad0a79.mp3", "engine blocks": "/assets/avcn/chapter-7/audio/2ec48986c1.mp3", "is also common in": "/assets/avcn/chapter-7/audio/e9e81f60a6.mp3", "producing": "/assets/avcn/chapter-7/audio/50be359960.mp3", "automobile components": "/assets/avcn/chapter-7/audio/5665b25b59.mp3", "engine manifolds": "/assets/avcn/chapter-7/audio/bcf8ec3555.mp3", "cylinder heads": "/assets/avcn/chapter-7/audio/961987044a.mp3", "transmission cases": "/assets/avcn/chapter-7/audio/0b67959756.mp3", "Casting involves heating metal until it becomes molten.": "/assets/avcn/chapter-7/audio/d921a322e0.mp3", "Extrusion involves heating metal and forcing it through a die.": "/assets/avcn/chapter-7/audio/4e5b08f6be.mp3", "Metal components can be formed by sintering.": "/assets/avcn/chapter-7/audio/b3073ac69d.mp3", "cope": "/assets/avcn/chapter-7/audio/fe2a2e98f3.mp3", "drag": "/assets/avcn/chapter-7/audio/3ff35a5eec.mp3", "sand": "/assets/avcn/chapter-7/audio/375653dda2.mp3", "sprue": "/assets/avcn/chapter-7/audio/9cf0bb8a67.mp3", "gate": "/assets/avcn/chapter-7/audio/c28b45142b.mp3", "ladle": "/assets/avcn/chapter-7/audio/d9092e92af.mp3", "Sand casting has simple steps. First, the  is placed inside the lower box, called the  box, and sand is packed tightly around it. Then the upper box, the  box, is placed over it. After the pattern is removed,  metal is poured into the cavity and left to .": "/assets/avcn/chapter-7/audio/8173db406f.mp3", "Passing metal between rollers to reduce its thickness.": "/assets/avcn/chapter-7/audio/83973b2c1b.mp3", "A very hot chamber used for heating or melting metal.": "/assets/avcn/chapter-7/audio/5371615a82.mp3", "ingot": "/assets/avcn/chapter-7/audio/86c3bd47fa.mp3", "crucible": "/assets/avcn/chapter-7/audio/0ea8ce961a.mp3", "anvil": "/assets/avcn/chapter-7/audio/a27104ab14.mp3"};
let curAudio = null;
const KEY = "avcn-flashcard-ch7";
TERMS.forEach((t, i) => { t.id = i; });
// Cặp từ đồng nghĩa trong chương: không cho làm phương án nhiễu của nhau (hai đáp án cùng đúng).
const SAME = [["coolant", "cutting fluid"]];
const clash = (a, b) => a.term === b.term || SAME.some((p) => p.includes(a.term) && p.includes(b.term));
const view = document.getElementById("view");
let box = {};
try { box = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { box = {}; }
const boxOf = (t) => box[t.id] || 1;
function save() { try { localStorage.setItem(KEY, JSON.stringify(box)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function speak(text) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if (AUDIO[text]) {
    const a = new Audio(AUDIO[text]);
    curAudio = a;
    a.play().catch(() => speakBrowser(text));
    return;
  }
  speakBrowser(text);
}
function speakBrowser(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  const score = (x) => {
    const l = x.lang.replace("_", "-").toLowerCase();
    if (!l.startsWith("en")) return -1;
    let s = l === "en-us" ? 10 : 5;
    if (/premium|enhanced|neural|natural|online/i.test(x.name)) s += 30;
    if (/\b(samantha|ava|allison|evan|nicky|zoe|aria|jenny|guy|google us english)\b/i.test(x.name)) s += 20;
    if (/\b(fred|albert|zarvox|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|kathy|organ|princess|ralph|trinoids|whisper|superstar)\b/i.test(x.name)) s -= 40;
    if (x.localService === false) s += 5;
    return s;
  };
  const v = speechSynthesis.getVoices().filter((x) => score(x) >= 0).sort((a, b) => score(b) - score(a))[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
view.addEventListener("click", (e) => { const b = e.target.closest("[data-speak]"); if (b) speak(b.dataset.speak); });
function front(t) {
  return (t.img ? `<img class="pic" src="${t.img}" alt="">` : "") + `<p class="def">${esc(t.def)}</p>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Thẻ Leitner 3 hộp: hộp 1 hiện nhiều nhất; "Nhớ rồi" đẩy lên một hộp, "Chưa nhớ" về hộp 1.
let current = null;
function pickCard() {
  const weights = { 1: 6, 2: 3, 3: 1 };
  const pool = TERMS.filter((t) => t !== current);
  const total = pool.reduce((s, t) => s + weights[boxOf(t)], 0);
  let r = Math.random() * total;
  for (const t of pool) { r -= weights[boxOf(t)]; if (r <= 0) return t; }
  return pool[0];
}
function boxesHtml() {
  const c = { 1: 0, 2: 0, 3: 0 };
  TERMS.forEach((t) => c[boxOf(t)]++);
  return `<div class="boxes"><div><b>${c[1]}</b>Hộp 1 · chưa nhớ</div><div><b>${c[2]}</b>Hộp 2 · đang nhớ</div><div><b>${c[3]}</b>Hộp 3 · đã thuộc</div></div>`;
}
function renderLeitner() {
  current = pickCard();
  const t = current;
  view.innerHTML = boxesHtml() + `<div class="card">${front(t)}<p class="hint">Nghĩ ra từ tiếng Anh trước, rồi mới lật thẻ.</p>
    <div id="back" class="back" hidden>
      <p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p>
      <p class="vi">${esc(t.vi)}</p>
      <div class="row"><button class="btn btn-bad" id="no">Chưa nhớ</button><button class="btn btn-ok" id="yes">Nhớ rồi</button></div>
    </div>
    <button class="btn btn-main" id="flip">Lật thẻ</button></div>`;
  document.getElementById("flip").onclick = (e) => { e.target.remove(); document.getElementById("back").hidden = false; speak(t.term); };
  view.querySelector("#no").onclick = () => { box[t.id] = 1; save(); renderLeitner(); };
  view.querySelector("#yes").onclick = () => { box[t.id] = Math.min(3, boxOf(t) + 1); save(); renderLeitner(); };
}

// Nhìn ảnh (hoặc đọc định nghĩa nếu từ không có ảnh) chọn 1 trong 4 từ — đúng dạng Part 1 của đề cuối kỳ.
let quiz = null;
function startQuiz() { quiz = { order: shuffle(TERMS.slice()), i: 0, right: 0 }; renderQuiz(); }
function renderQuiz() {
  if (quiz.i >= quiz.order.length) {
    view.innerHTML = `<div class="card done"><p class="term" style="justify-content:center">${quiz.right}/${quiz.order.length}</p><p class="vi">${quiz.right >= 16 ? "Rất tốt! Em đã sẵn sàng cho Part 1." : "Ôn lại các từ sai ở chế độ Thẻ 3 hộp rồi làm lại nhé."}</p><button class="btn btn-main" id="again">Làm lại</button></div>`;
    document.getElementById("again").onclick = startQuiz;
    return;
  }
  const t = quiz.order[quiz.i];
  const opts = shuffle([t, ...shuffle(TERMS.filter((x) => !clash(x, t)).filter((x, k, a) => a.findIndex((y) => y.term === x.term) === k)).slice(0, 3)]);
  view.innerHTML = `<p class="score">Câu ${quiz.i + 1}/${quiz.order.length} · đúng ${quiz.right}</p><div class="card">${front(t)}
    <div class="opts">${opts.map((o, k) => `<button data-k="${k}">${"abcd"[k]}. ${esc(o.term)}</button>`).join("")}</div><div id="after"></div></div>`;
  view.querySelectorAll(".opts button").forEach((b) => b.onclick = () => {
    const pick = opts[+b.dataset.k];
    const ok = pick === t;
    if (ok) quiz.right++; else box[t.id] = 1;
    save();
    view.querySelectorAll(".opts button").forEach((x) => { x.disabled = true; if (opts[+x.dataset.k] === t) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad");
    document.getElementById("after").innerHTML = `<div class="back"><p class="term">${esc(t.term)} <span class="ipa">${esc(t.ipa)}</span> <button class="speak" data-speak="${esc(t.term)}" aria-label="Nghe">🔊</button></p><p class="vi">${esc(t.vi)}</p></div><button class="btn btn-main" id="next">Câu tiếp</button>`;
    document.getElementById("next").onclick = () => { quiz.i++; renderQuiz(); };
    speak(t.term);
  });
}

const tabs = { leitner: document.getElementById("t-leitner"), quiz: document.getElementById("t-quiz") };
function setMode(m) {
  tabs.leitner.setAttribute("aria-selected", m === "leitner");
  tabs.quiz.setAttribute("aria-selected", m === "quiz");
  m === "leitner" ? renderLeitner() : startQuiz();
}
tabs.leitner.onclick = () => setMode("leitner");
tabs.quiz.onclick = () => setMode("quiz");
setMode("leitner");
</script>
