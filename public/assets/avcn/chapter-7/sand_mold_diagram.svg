<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <pattern id="sand7" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f1e7c8"/><circle cx="3" cy="3" r="1.4" fill="#b59f6b"/><circle cx="9" cy="8" r="1.4" fill="#b59f6b"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- cope (upper box) and drag (lower box), filled with packed sand -->
  <rect x="210" y="150" width="380" height="90" fill="url(#sand7)" stroke="#1e293b" stroke-width="3"/>
  <rect x="210" y="240" width="380" height="100" fill="url(#sand7)" stroke="#1e293b" stroke-width="3"/>
  <!-- cavity -->
  <rect x="340" y="212" width="120" height="56" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <!-- gate: channel from sprue to cavity -->
  <rect x="460" y="232" width="40" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <!-- sprue: vertical channel -->
  <rect x="500" y="150" width="24" height="98" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <rect x="502" y="232" width="20" height="14" fill="#ffffff"/>
  <!-- parting line -->
  <line x1="210" y1="240" x2="590" y2="240" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- ladle, tilted, pouring molten metal -->
  <polygon points="538,96 626,52 656,108 596,138" fill="#94a3b8" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
  <line x1="538" y1="96" x2="626" y2="52" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <line x1="652" y1="100" x2="716" y2="70" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path d="M540 100 C528 116 516 128 512 150" stroke="#f97316" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- leader lines -->
  <g stroke="#0284c7" stroke-width="2.5" fill="none">
    <line x1="112" y1="185" x2="212" y2="185"/>
    <line x1="112" y1="295" x2="212" y2="295"/>
    <line x1="560" y1="305" x2="738" y2="305"/>
    <line x1="112" y1="250" x2="342" y2="250"/>
    <line x1="524" y1="190" x2="738" y2="190"/>
    <line x1="480" y1="250" x2="480" y2="352"/>
    <line x1="714" y1="76" x2="738" y2="76"/>
  </g>
  <g font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="92" cy="185" r="20" fill="#0284c7"/><text x="92" y="193">1</text>
    <circle cx="92" cy="295" r="20" fill="#0284c7"/><text x="92" y="303">2</text>
    <circle cx="758" cy="305" r="20" fill="#0284c7"/><text x="758" y="313">3</text>
    <circle cx="92" cy="250" r="20" fill="#0284c7"/><text x="92" y="258">4</text>
    <circle cx="758" cy="190" r="20" fill="#0284c7"/><text x="758" y="198">5</text>
    <circle cx="480" cy="372" r="20" fill="#0284c7"/><text x="480" y="380">6</text>
    <circle cx="758" cy="76" r="20" fill="#0284c7"/><text x="758" y="84">7</text>
  </g>
</svg>
