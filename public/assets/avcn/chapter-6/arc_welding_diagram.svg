<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <pattern id="hatch6" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="10" stroke="#94a3b8" stroke-width="2"/>
    </pattern>
    <radialGradient id="arc6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>
  <!-- shielding gas cloud -->
  <ellipse cx="420" cy="232" rx="95" ry="50" fill="#38bdf8" fill-opacity="0.22" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- base metal -->
  <rect x="70" y="272" width="660" height="72" fill="url(#hatch6)" stroke="#334155" stroke-width="2.5"/>
  <!-- solid weld (already cooled) -->
  <path d="M120 272 Q140 246 200 250 Q260 244 340 272 Z" fill="#a16207" stroke="#1e293b" stroke-width="2.5"/>
  <!-- weld pool (molten) -->
  <path d="M338 272 Q352 252 396 252 Q432 252 442 272 Z" fill="#f97316" stroke="#9a3412" stroke-width="2.5"/>
  <!-- welding rod: bare core + flux coating, tilted -->
  <g transform="translate(425 252) rotate(48)">
    <rect x="-4" y="-258" width="8" height="254" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>
    <rect x="-11" y="-215" width="22" height="185" fill="#b45309" stroke="#1e293b" stroke-width="2.5"/>
  </g>
  <!-- arc -->
  <circle cx="428" cy="246" r="26" fill="url(#arc6)"/>
  <path d="M418 258 L426 244 L421 244 L432 230 L428 242 L434 242 Z" fill="#facc15" stroke="#92400e" stroke-width="1.5"/>
  <!-- leader lines -->
  <g stroke="#0284c7" stroke-width="2.5" fill="none">
    <line x1="710" y1="66" x2="606" y2="94"/>
    <line x1="710" y1="150" x2="516" y2="172"/>
    <line x1="280" y1="150" x2="420" y2="240"/>
    <line x1="160" y1="196" x2="336" y2="230"/>
    <line x1="395" y1="378" x2="388" y2="264"/>
    <line x1="240" y1="378" x2="240" y2="258"/>
    <line x1="660" y1="378" x2="610" y2="330"/>
  </g>
  <g font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="730" cy="62" r="20" fill="#0284c7"/><text x="730" y="70">1</text>
    <circle cx="730" cy="148" r="20" fill="#0284c7"/><text x="730" y="156">2</text>
    <circle cx="260" cy="136" r="20" fill="#0284c7"/><text x="260" y="144">3</text>
    <circle cx="140" cy="192" r="20" fill="#0284c7"/><text x="140" y="200">4</text>
    <circle cx="395" cy="388" r="20" fill="#0284c7"/><text x="395" y="396">5</text>
    <circle cx="240" cy="388" r="20" fill="#0284c7"/><text x="240" y="396">6</text>
    <circle cx="680" cy="388" r="20" fill="#0284c7"/><text x="680" y="396">7</text>
  </g>
</svg>
