<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="700" fill="white"/>

  <!-- Title -->
  <text x="300" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#000">
    Bài tập 3: Phay 4 lỗ vuông + Bo góc R5
  </text>
  <text x="300" y="55" font-size="14" text-anchor="middle" fill="#666">
    Phôi: 50×50×8 mm | Chiều sâu cắt ngoài: 2mm | Chiều sâu lỗ: 6mm
  </text>

  <!-- Main part view (left side) -->
  <g id="top-view">
    <text x="50" y="100" font-size="12" font-weight="bold" fill="#000">Hình chiếu trên (Mặt phẳng XY):</text>

    <!-- Phôi outline -->
    <rect x="80" y="120" width="200" height="200" fill="none" stroke="#000" stroke-width="2"/>

    <!-- Bo góc R5 -->
    <circle cx="100" cy="140" r="20" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="5,5"/>
    <circle cx="260" cy="140" r="20" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="5,5"/>
    <circle cx="260" cy="300" r="20" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="5,5"/>
    <circle cx="100" cy="300" r="20" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="5,5"/>

    <!-- 4 lỗ vuông Ø6 -->
    <circle cx="100" cy="140" r="6" fill="none" stroke="#FF0000" stroke-width="2"/>
    <circle cx="260" cy="140" r="6" fill="none" stroke="#FF0000" stroke-width="2"/>
    <circle cx="260" cy="300" r="6" fill="none" stroke="#FF0000" stroke-width="2"/>
    <circle cx="100" cy="300" r="6" fill="none" stroke="#FF0000" stroke-width="2"/>

    <!-- Chiều dài/rộng phôi -->
    <line x1="70" y1="330" x2="310" y2="330" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="325" x2="70" y2="335" stroke="#000" stroke-width="1"/>
    <line x1="310" y1="325" x2="310" y2="335" stroke="#000" stroke-width="1"/>
    <text x="190" y="350" font-size="12" text-anchor="middle" fill="#000">50mm</text>

    <line x1="50" y1="120" x2="50" y2="320" stroke="#000" stroke-width="1"/>
    <line x1="45" y1="120" x2="55" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="45" y1="320" x2="55" y2="320" stroke="#000" stroke-width="1"/>
    <text x="30" y="225" font-size="12" text-anchor="end" fill="#000">50mm</text>

    <!-- Kích thước lỗ từ cạnh -->
    <line x1="80" y1="115" x2="100" y2="115" stroke="#666" stroke-width="1"/>
    <line x1="80" y1="110" x2="80" y2="120" stroke="#666" stroke-width="1"/>
    <line x1="100" y1="110" x2="100" y2="120" stroke="#666" stroke-width="1"/>
    <text x="90" y="105" font-size="10" text-anchor="middle" fill="#666">8mm</text>

    <!-- Gốc W -->
    <circle cx="80" cy="320" r="4" fill="#000"/>
    <text x="65" y="345" font-size="12" font-weight="bold" fill="#000">W</text>

    <!-- Chú thích -->
    <text x="80" y="380" font-size="11" fill="#0066CC">━ Bo góc R5</text>
    <circle cx="70" cy="373" r="2.5" fill="none" stroke="#0066CC" stroke-width="1"/>
    <text x="280" y="380" font-size="11" fill="#FF0000">● Lỗ Ø6</text>
  </g>

  <!-- Side view (right side) -->
  <g id="side-view">
    <text x="420" y="100" font-size="12" font-weight="bold" fill="#000">Hình chiếu cạnh (Mặt phẳng XZ):</text>

    <!-- Phôi -->
    <rect x="370" y="120" width="200" height="80" fill="none" stroke="#000" stroke-width="2"/>

    <!-- Chiều cao phôi -->
    <line x1="350" y1="120" x2="350" y2="200" stroke="#000" stroke-width="1"/>
    <line x1="345" y1="120" x2="355" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="345" y1="200" x2="355" y2="200" stroke="#000" stroke-width="1"/>
    <text x="330" y="165" font-size="12" text-anchor="end" fill="#000">8mm</text>

    <!-- Chiều sâu cắt -->
    <line x1="580" y1="120" x2="580" y2="140" stroke="#FF6600" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="575" y1="120" x2="585" y2="120" stroke="#FF6600" stroke-width="1"/>
    <line x1="575" y1="140" x2="585" y2="140" stroke="#FF6600" stroke-width="1"/>
    <text x="595" y="135" font-size="10" text-anchor="start" fill="#FF6600">2mm</text>

    <!-- Chiều sâu lỗ -->
    <line x1="580" y1="140" x2="580" y2="200" stroke="#FF0000" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="575" y1="140" x2="585" y2="140" stroke="#FF0000" stroke-width="1"/>
    <line x1="575" y1="200" x2="585" y2="200" stroke="#FF0000" stroke-width="1"/>
    <text x="595" y="175" font-size="10" text-anchor="start" fill="#FF0000">6mm</text>

    <!-- Chú thích -->
    <text x="370" y="240" font-size="11" fill="#FF6600">━ Chiều sâu phay ngoài: 2mm</text>
    <text x="370" y="260" font-size="11" fill="#FF0000">━ Chiều sâu lỗ: 6mm</text>
  </g>

  <!-- Dimensions reference -->
  <g id="dimensions">
    <text x="50" y="450" font-size="12" font-weight="bold" fill="#000">Các kích thước tọa độ (mm):</text>
    <text x="50" y="475" font-size="11" fill="#333">Khoảng cách từ cạnh (W): 8mm</text>
    <text x="50" y="495" font-size="11" fill="#333">Vị trí lỗ từ W: X=8, Y=8 (góc 1)</text>
    <text x="50" y="515" font-size="11" fill="#333">                  X=42, Y=8 (góc 2)</text>
    <text x="50" y="535" font-size="11" fill="#333">                  X=42, Y=42 (góc 3)</text>
    <text x="50" y="555" font-size="11" fill="#333">                  X=8, Y=42 (góc 4)</text>
    <text x="50" y="575" font-size="11" fill="#333">Đường kính lỗ: Ø6mm</text>
    <text x="50" y="595" font-size="11" fill="#333">Bo góc: R5mm</text>
  </g>

  <!-- Grid reference -->
  <line x1="0" y1="640" x2="600" y2="640" stroke="#DDD" stroke-width="1"/>
  <text x="10" y="670" font-size="10" fill="#999">Bản vẽ kỹ thuật - Bài tập 3 Điền khuyết chương trình phay</text>
  <text x="590" y="670" font-size="10" text-anchor="end" fill="#999">Mức dễ (level: de)</text>
</svg>