# Test đơn vị cho hàm thuần (chấm điểm, thang luyện tập, tiến độ, rubric CNC): `npm test` (vitest).
name: Test

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
