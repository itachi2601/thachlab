const D={"batch":"mo-ho-opus-giu-lai-2026-10-18","rows":[{"id":736081,"ghiChu":"Opus đã sửa: Đề \"Thang sóng điện từ trong bài gồm mấy vùng sóng? Điền số.\" → \"Xếp các vùng sóng vô tuyến, tia hồng ngoại, ánh sáng nhìn thấy, tia tử ngoại, tia X, tia gamma theo tần số tăng dần. Tia tử ngoại đứng ở vị trí thứ mấy? Điền số.\"; đáp án 6 → 4.\nNgười soát lần 2: Giải ra 4 (VTĐ, HN, AS, TN) đúng, nhưng câu mới đã đổi từ 'đếm số vùng' sang 'vị trí của tia tử ngoại' và đổi đáp án 6 thành 4, đồng thời liệt kê sẵn thứ tự nên câu gần như tầm thường: sửa xa đề gốc, cần GV duyệt (hoặc giữ ý đếm vùng và nêu rõ danh sách 6 vùng).","deXuat":"ĐỀ MỚI: Xếp các vùng của thang sóng điện từ gồm sóng vô tuyến, tia hồng ngoại, ánh sáng nhìn thấy, tia tử ngoại, tia X và tia gamma theo thứ tự tần số tăng dần. Tia tử ngoại đứng ở vị trí thứ mấy? Điền số.\nĐáp số: 4","grade":"12","qtype":"short_answer","q":{"form":"ly_thuyet","type":"short_answer","topic":"Điện từ trường và sóng điện từ","answer":"6","question":"Thang sóng điện từ trong bài gồm mấy vùng sóng? Điền số.","difficulty":"de","explanation":"Sáu vùng: vô tuyến, hồng ngoại, nhìn thấy, tử ngoại, tia X, tia gamma.","theorySection":1,"difficultySource":"ai"}},{"id":1181801,"ghiChu":"Opus đã sửa: Phương án A \"máy hút ẩm.\" → \"máy lọc bụi tĩnh điện.\".\nNgười soát lần 2: Máy lọc bụi tĩnh điện là đáp án hợp lý nhưng do Opus tự thay phương án A ('máy hút ẩm') chứ không phải vá lỗi chữ, tức là đoán nguồn gốc; phương án C 'máy lọc nước' cũng có thể gây tranh cãi (điện phân) và điện trường trong máy lọc bụi không đều tuyệt đối. Nên GV đối chiếu đề gốc rồi duyệt.","deXuat":"ĐỀ MỚI: Ứng dụng của hạt điện tích chuyển động trong điện trường đều có trong\nA. máy lọc bụi tĩnh điện.\nB. máy phát điện.\nC. máy lọc nước.\nD. máy giặt.\nĐáp án: A","grade":"11","qtype":"multiple_choice","q":{"form":"ly_thuyet","type":"multiple_choice","topic":"Chuyển động của điện tích trong điện trường đều","answer":0,"options":["máy hút ẩm.","máy phát điện.","máy lọc nước.","máy giặt."],"question":"Ứng dụng của hạt điện tích chuyển động trong điện trường đều có trong","difficulty":"trung-binh","explanation":"","difficultySource":"ai"}},{"id":681684,"ghiChu":"Opus đã sửa: Câu hỏi \"Tìm quãng đường xe đi được cho đến lúc dừng hẳn là bao nhiêu mét?\" → \"Tốc độ của xe lúc bắt đầu chậm dần là bao nhiêu m/s?\"; đáp án 100 → 20.\nNgười soát lần 2: Tự giải ra v0=20 m/s (T=10 s, a=2). Đáp số đúng và khớp bài toán quen thuộc, nhưng Opus đổi đại lượng cần tìm (quãng đường 100 -> tốc độ đầu) và đổi đáp án DB 100 thành 20; xa đề gốc nên cần giáo viên duyệt trước khi đăng.","deXuat":"ĐỀ MỚI: Một xe chuyển động chậm dần đều cho đến khi dừng lại. Quãng đường xe đi được trong giây đầu tiên gấp 19 lần quãng đường xe đi được trong giây cuối cùng. Quãng đường đi được trong cả giai đoạn này là 100 m. Tốc độ của xe lúc bắt đầu chậm dần là bao nhiêu m/s?\nĐáp số: 20","grade":"10","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Bài toán hai xe gặp nhau, phanh gấp","answer":"100","question":"Một xe chuyển động chậm dần đều cho đến khi dừng lại. Quãng đường xe đi được trong giây đầu tiên gấp 19 lần quãng đường xe đi được trong giây cuối cùng. Quãng đường đi được trong cả giai đoạn này là 100 m. Tìm quãng đường xe đi được cho đến lúc dừng hẳn là bao nhiêu mét?","difficulty":"kho","explanation":"","difficultySource":"ai"}},{"id":683312,"ghiChu":"Opus đã sửa: Ý d: \"…vận tốc của vật là 35cm.\" → \"…vận tốc của vật là 35 m/s.\"; đáp án ý d Sai → Đúng.\nNgười soát lần 2: Tự giải: v=5+30=35 m/s nên nếu ý d ghi 35 m/s là Đúng, nhưng Opus đổi đáp án ý d từ Sai (DB) sang Đúng. Ý d gốc \"35cm\" sai đơn vị có thể là bẫy cố ý; cần giáo viên quyết giữ bẫy hay sửa lỗi gõ.","deXuat":"ĐỀ MỚI: Cho phương trình vận tốc chuyển động của một vật có dạng như sau: v = 5 + 6t (m/s). Xác định Đúng – Sai của các phát biểu sau\na) Vận tốc ban đầu là 5m/s. → Đúng\nb) Ban đầu vật đứng yên. → Sai\nc) Vật chuyển động chậm dần đều. → Sai\nd) Sau 5 s kể từ lúc t = 0 thì vận tốc của vật là 35 m/s. → Đúng","grade":"10","qtype":"true_false","q":{"form":"ly_thuyet","type":"true_false","topic":"Các công thức của chuyển động thẳng biến đổi đều","question":"Cho phương trình vận tốc chuyển động của một vật có dạng như sau: v = 5 + 6t (m/s). Xác định Đúng – Sai của các phát biểu sau","difficulty":"de","statements":[{"text":"Vận tốc ban đầu là 5m/s.","answer":true},{"text":"Ban đầu vật đứng yên.","answer":false},{"text":"Vật chuyển động chậm dần đều.","answer":false},{"text":"Sau 5s kể từ lúc t = 0 thì vận tốc của vật là 35cm.","answer":false}],"explanation":"","difficultySource":"ai"}},{"id":670225,"ghiChu":"Opus đã sửa: Bỏ bảng vỡ (các dòng \"T (0C)…(Pa/K)\" và \"$\\frac{p}{T}$\" thừa cuối đề), thay bằng ba lần đo: t = 28 °C, 58 °C, 73 °C ứng với p = 1,00; 1,10; 1,15 (×10⁵ Pa).\nNgười soát lần 2: p/T: 332,23; 332,33; 332,37 → trung bình 332,31 → 332 (dùng 273,15 vẫn 332). Nhiệt độ 28, 58, 73 °C là dựng lại để khớp 332, hợp lý nhưng nên báo giáo viên.","deXuat":"ĐỀ MỚI: Một học sinh tiến hành thí nghiệm khảo sát sự phụ thuộc của áp suất p theo nhiệt độ tuyệt đối T. Trong đó, bình thủy tinh hình cầu có nút kín, trong có chứa khí được nối thông với áp kế qua một ống nhỏ. Bình thủy tinh được nhúng trong một bình nước, nhiệt độ của nước được đo bởi một nhiệt kế. Đun nóng từ từ nước trong bình rồi ghi lại nhiệt độ t chỉ bởi nhiệt kế và áp suất p chỉ bởi áp kế, thu được kết quả: Lần 1: t = 28 °C, p = 1,00·10 5 Pa. Lần 2: t = 58 °C, p = 1,10·10 5 Pa. Lần 3: t = 73 °C, p = 1,15·10 5 Pa. Tỉ số p/T có giá trị trung bình xấp xỉ bằng bao nhiêu Pa/K (làm tròn đến phần nguyên, chỉ làm tròn kết quả cuối cùng khi tính giá trị trung bình)?\nĐáp số: 332","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Quá trình đẳng áp và định luật Charles","answer":"332","question":"Một học sinh tiến hành thí nghiệm khảo sát sự phụ thuộc của áp suất p theo nhiệt độ tuyệt đối T. Trong đó, bình thủy tinh hình cầu có nút kín, trong có chứa khí được nối thông với áp kế qua một ống nhỏ. Bình thủy tinh được nhúng trong một bình nước, nhiệt độ của nước được đo bởi một nhiệt kế. Đun nóng từ từ nước trong bình rồi ghi lại giá trị nhiệt độ t được chỉ bởi nhiệt kế và áp suất p được chỉ bởi áp kế thu được kết quả ở bảng sau:\u003cbr>T (0C)\u003cbr>T (K)\u003cbr>P (x105 Pa)\u003cbr>(Pa/K)\u003cbr>1,00\u003cbr>1,10\u003cbr>1,15\u003cbr>Tỉ số p/T có giá trị trung bình xấp xỉ bằng bao nhiêu Pa/K (làm tròn đến phần nguyên, chỉ làm tròn kết quả cuối cùng khi tính giá trị trung bình)?\u003cbr>$\\frac{p}{T}\\left(Pa/K\\right)$","difficulty":"trung-binh","explanation":"","difficultySource":"ai"}},{"id":575511,"ghiChu":"Opus đã sửa: Thêm dữ kiện: \"Một ô tô vừa chạy xong, nhiệt độ lốp trước bên phải là 37 °C, lốp sau bên phải là 35 °C.\" vào trước câu hỏi; thêm \"bao nhiêu?\" ở cuối.\nNgười soát lần 2: ΔT=37−35=2 K. Số liệu 37 và 35 °C dựng lại nhưng hợp lý (lốp nóng sau khi chạy).","deXuat":"ĐỀ MỚI: Một ô tô vừa chạy xong, nhiệt độ lốp trước bên phải là 37 °C, lốp sau bên phải là 35 °C. Nhiệt độ lốp trước bên phải và lốp sau bên phải chênh lệch nhau bao nhiêu?\nA. 275K.\nB. 2K.\nC. 273K.\nD. 0K.\nĐáp án: B","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Thang Celsius và thang Kelvin","answer":1,"options":["275K.","2K.","273K.","0K."],"question":"Nhiệt độ lốp trước bên phải và lốp sau bên phải chênh lệch nhau","difficulty":"de","explanation":"","difficultySource":"ai"}},{"id":682429,"ghiChu":"Opus đã sửa: Câu hỏi \"Cho hiệu suất của một số thiết bị như bảng dưới đây.\" → \"Hiệu suất của một số thiết bị: động cơ hơi nước 17%; máy phát điện 95%; động cơ điện 90%; động cơ ô tô 25%.\"\nNgười soát lần 2: Hao phí nhỏ nhất ứng với hiệu suất cao nhất = máy phát điện. Bảng số 17%/95%/90%/25% do Opus tự dựng nhưng đúng bậc độ lớn thực tế, thứ hạng không mâu thuẫn.","deXuat":"ĐỀ MỚI: Hiệu suất của một số thiết bị như sau: động cơ hơi nước 17%; máy phát điện 95%; động cơ điện 90%; động cơ ô tô 25%. Thiết bị nào có năng lượng hao phí nhỏ nhất (tính theo tỉ lệ năng lượng toàn phần)?\nA. Động cơ hơi nước.\nB. Máy phát điện.\nC. Động cơ điện.\nD. Động cơ ô tô.\nĐáp án: B","grade":"10","qtype":"multiple_choice","q":{"form":"ly_thuyet","type":"multiple_choice","topic":"Hao phí năng lượng và cách giảm hao phí","answer":1,"options":["Động cơ hơi nước.","Máy phát điện.","Động cơ điện.","Động cơ ô tô."],"question":"Cho hiệu suất của một số thiết bị như bảng dưới đây. Thiết bị nào có năng lượng hao phí nhỏ nhất?","difficulty":"de","explanation":"","difficultySource":"ai"}},{"id":1247023,"ghiChu":"Opus đã sửa: Ý a: \"dao động với vận tốc 9,83 cm/s\" → \"dao động với tốc độ 9,83 cm/s\"; ý b: \"Sóng âm là sóng dọc.\" → \"Sóng âm này truyền trong không khí là sóng ngang.\"; ý d: \"400 cm\" → \"400 m\". Đáp án giữ Đ, S, Đ, Đ.\nNgười soát lần 2: A=5 cm,ω=4π,λ=20 m,v=40 m/s: a: |v|=20π·sin(0,05π)=9,83 cm/s đúng; b 'sóng âm trong không khí là sóng ngang' sai; c đúng; d 40·10=400 m đúng. Lưu ý v=40 m/s không thực tế cho âm trong không khí (≈340 m/s), nhỏ mâu thuẫn ở ý b nhưng không ảnh hưởng chấm.","deXuat":"ĐỀ MỚI: Một âm truyền theo trục Ox có phương trình $u=5 cos\\left(4\\pi t+0,1\\pi x\\right)$ cm, trong đó thời gian t tính bằng s, x tính bằng m. Biên độ sóng không đổi trong quá trình truyền đi. Các mệnh đề sau đúng hay sai?\na) Điểm M có tọa độ x = 50 cm tại thời điểm t = 2 phút dao động với tốc độ 9,83 cm/s. → Đúng\nb) Sóng âm này truyền trong không khí là sóng ngang. → Sai\nc) Biên độ sóng là 5 cm. → Đúng\nd) Quãng đường sóng truyền được trong thời gian 10 s là 400 m. → Đúng","grade":"11","qtype":"true_false","q":{"form":"bai_tap","type":"true_false","topic":"Phương trình sóng và đồ thị sóng","question":"Một âm truyền theo trục Ox có phương trình  $u=5 cos\\left(4\\pi t+0,1\\pi x\\right)$  cm, trong đó thời gian t tính bằng s, x tính bằng m. Biên độ sóng không đổi trong quá trình truyền đi. Các mệnh đề sau đúng hay sai?","difficulty":"kho","statements":[{"text":"Điểm M có tọa độ x = 50 cm tại thời điểm t = 2 phút dao động với vận tốc 9,83 cm/s.","answer":true},{"text":"Sóng âm là sóng dọc.","answer":true},{"text":"Biên độ sóng là 5 cm.","answer":true},{"text":"Quãng đường sóng truyền được trong thời gian 10 s là 400 cm.","answer":false}],"explanation":"","difficultySource":"ai"}}]};
const KEY="duyet-"+D.batch;let fh=null,state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}

function blocks(q){let h='<div class="q">'+(q.question||"")+'</div>';
 if(Array.isArray(q.options))h+='<div class="blk">'+q.options.map((o,i)=>'<div>'+"ABCD"[i]+'. '+(typeof o==="string"?o:(o.text??JSON.stringify(o)))+'</div>').join("")+'</div>';

 if(q.answer!==undefined&&!Array.isArray(q.statements))h+='<div class="blk"><b>Đáp án:</b> '+esc(JSON.stringify(q.answer))+'</div>';
 if(q.explanation)h+='<div class="blk"><b>Lời giải:</b><br>'+q.explanation+'</div>';return h}
document.getElementById("m").innerHTML=D.rows.map(r=>{const s=state[r.id]||{};return '<section data-id="'+r.id+'"><h2>#'+r.id+' <span class="mut">lớp '+esc(r.grade)+' · '+esc(r.qtype)+'</span></h2>'

 +'<textarea placeholder="Yêu cầu sửa / ghi chú cho Claude (ví dụ: V₁ = 10.10^-3 m³, đổi cả phần đề lẫn đáp án)">'+esc(s.note||"")+'</textarea></div></section>'}).join("");
function out(){return JSON.stringify({batch:D.batch,savedAt:new Date().toISOString(),items:Object.fromEntries(Object.entries(state).map(([k,v])=>[k,v]))},null,2)}
const st=document.getElementById("st");
async function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
 if(!fh){return}try{const w=await fh.createWritable();await w.write(out());await w.close();st.className="ok";st.textContent="Đã lưu "+new Date().toLocaleTimeString("vi")+" → "+fh.name}catch(e){st.className="bad";st.textContent="Lưu lỗi: "+e.message}}
