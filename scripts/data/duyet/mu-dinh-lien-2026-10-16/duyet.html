<script>
const D={"batch":"mu-dinh-lien-2026-10-16","rows":[{"id":386808,"ghiChu":"\"khối lượng riêng của nước biển là 103 kg/m³\" — có thể là 10^3 (làm tròn) hoặc 1,03.10^3 mất dấu phẩy.","deXuat":"10^3 kg/m³ nếu đề cho gần đúng; thầy xem lời giải để chọn.","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Quá trình đẳng nhiệt và định luật Boyle","answer":3,"options":["15 cm\u003csup>3\u003c/sup>.","15,5 cm\u003csup>3\u003c/sup>.","16 cm\u003csup>3\u003c/sup>.","16,5 cm\u003csup>3\u003c/sup>."],"question":"Một có thể tích 1,5 cm\u003csup>3\u003c/sup> tạo ra từ khoang tàu ngầm đang lặn ở độ sâu 100 m dưới mực nước biển. Giả sử nhiệt độ của bọt khí là không đổi, biết khối lượng riêng của nước biển là 103 kg/m\u003csup>3\u003c/sup>, áp suất khí quyển là $p_0$ = 10\u003csup>5\u003c/sup> Pa và g = 10 m/s\u003csup>2\u003c/sup>. Khi bọt khí này nổi lên mặt nước thì sẽ có thể tích bằng","difficulty":"trung-binh","explanation":"Chọn đáp án D\u003cbr>$pV=const\\Rightarrow p_0V_0=\\left(p_0+Dgh\\right)V$\u003cbr>$\\Rightarrow 10^5.V_0=\\left(10^5+10^3.10.100\\right).1,5\\Rightarrow V_0=16,5cm^3$","difficultySource":"ai"}},{"id":456760,"ghiChu":"\"nước biển … xấp xỉ 103 kg/m³\" — tương tự câu 386808.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Quá trình đẳng nhiệt và định luật Boyle","answer":"4,5","question":"Trong một chuyến lặn biển khám phá rạn san hô tại đảo Cô Tô, một thợ lặn đang ở độ sâu 35m do gặp sự cố đã nổi lên mặt nước quá nhanh. Việc giảm áp suất đột ngột làm cho khí nitrogen hòa tan trong máu và mô bị giải phóng, hình thành các bọt khí (coi là khí lí tưởng). Đây là nguyên nhân chính gây ra hội chứng giảm áp rất nguy hiểm cho thợ lặn. Giả sử sự chênh lệch nhiệt độ trong quá trình người này nổi lên là không đáng kể và áp suất khí nitrogen trong cơ thể luôn cân bằng với áp suất của môi trường tác dụng lên người thợ lặn. Cho biết khối lượng riêng của nước biển tại khu vực Cô Tô xấp xỉ 103 kg/m\u003csup>3\u003c/sup>, áp suất khí quyển trên mặt biển là 10\u003csup>5\u003c/sup> Pa. Lấy g = 10 m/s\u003csup>2\u003c/sup>. Nếu một bọt khí nitrogen được hình thành trong mạch máu ở độ sâu 35m thì khi người thợ lặn lên đến mặt nước, thể tích của bọt khí này đã tăng lên bao nhiêu lần (làm tròn kết quả đến chữ số hàng phần mười)? \u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/1790259979371-hinh-6.jpg\" alt=\"Hình 6\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"trung-binh","explanation":"Đáp số 4,5\u003cbr>Trạng thái 1 (ở độ sâu h = 35 m):\u003cbr>Áp suất tác dụng lên bọt khí là:\u003cbr>$p_1=p_0+\\rho .g.h=10^5+10^3.10.35=4,5.10^5(Pa)$\u003cbr>Trạng thái 2 (ở trên mặt nước):\u003cbr>Áp suất tác dụng lên bọt khí bằng áp suất khí quyển:\u003cbr>$p_2=p_0=10^5(Pa)$\u003cbr>Áp dụng định luật Boyle:\u003cbr>$p_1V_1=p_2V_2\\Rightarrow \\frac{V_2}{V_1}=\\frac{p_1}{p_2}=\\frac{4,5.10^5}{10^5}=4,5$  (lần).\u003cbr>Vậy thể tích bọt khí tăng lên 4,5 lần.","difficultySource":"ai"}},{"id":580779,"ghiChu":"Đáp số \"1030 quả\" — có thể là 10^30 quả hoặc số thật 1030.","deXuat":"","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Vận dụng phương trình trạng thái","answer":1,"options":["769 quả.","868 quả.","525 quả.","1030 quả."],"question":"Một bình bằng thép dung tích 25 lít dùng van xả (hình bên) chứa khí Hydrogen ở áp suất 6 MPa và nhiệt độ  $37^∘C$ . Chỉ dùng bình này sẽ bơm được bao nhiêu quả bóng bay mà dung tích mỗi quả là 1,5 lít, áp suất và nhiệt độ khí trong mỗi quả bóng là  $1,05.10^5 Pa$  và  $15^∘C$ , biết rằng nhiệt độ của bình thép sau khi bơm bằng  $15^∘C$\u003cbr>\u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/1791045436050-hinh-10.png\" alt=\"Hình 10\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"kho","explanation":"Phương pháp:\u003cbr>− Thể tích của khí trước khi bơm vào bóng là:  $V=1,5n+25$\u003cbr>$Taøi lieäu ñöôïc phaùt haønh taïi Website: thukhoadaihoc.vn$\u003cbr>− Áp dụng phương trình trạng thái khí lý tưởng:  $\\frac{pV}{T}=const$\u003cbr>Cách giải:\u003cbr>− Thể tích của khí trước khi bơm vào bóng là: V =1,5n+25.\u003cbr>− Áp dụng phương trình trạng thái khí lý tưởng, ta có:\u003cbr>$\\begin{aligned}\\end{aligned}\\frac{pV}{T}=const\\Rightarrow \\frac{6.10^6.25}{37+273}=\\frac{1,05.10^5.\\left(1,5n+25\\right)}{15+273}Website: thukhoadaihoc.vn$\u003cbr>$\\Rightarrow n\\approx$ 868 (quả)","difficultySource":"ai"}},{"id":665123,"ghiChu":"\"19,3 1010 MeV\" — thiếu dấu nhân, nghi là 19,3.10^10 MeV.","deXuat":"19,3.10^{10} MeV","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Năng lượng toả ra của phản ứng hạt nhân","answer":2,"options":["19,3 1010 MeV.","6,02.10\u003csup>23\u003c/sup> MeV.","12,4.10\u003csup>23\u003c/sup> MeV.","16,4.10\u003csup>23\u003c/sup> MeV."],"question":"Cho rằng một hạt nhân Uranium  ${}_{92}^{235}U$  khi phân hạch thì tỏa ra năng lượng là 200 MeV. Năng lượng tỏa ra khi 2,35 g Uranium  ${}_{92}^{235}U$  phân hạch hết gần giá trị nào nhất sau đây?","difficulty":"trung-binh","explanation":"Công thức: số mol n = m/M; số hạt nhân N = n·N_A; năng lượng tỏa ra Q = N·ΔE (ΔE là năng lượng một hạt nhân tỏa ra khi phân hạch).\u003cbr>Thay số: n = 2,35/235 = 0,01 mol ⇒ N = 0,01 × 6,02×10²³ = 6,02×10²¹ hạt; Q = 6,02×10²¹ × 200 ≈ 12,4×10²³ MeV.\u003cbr>Kết quả: chọn C.\u003cbr>$n=\\frac{m}{M}=\\frac{2,35}{235}=0,01 mol$\u003cbr>$N=nN_A=0,01.6,02.10^{23}=6,02.10^{21}$\u003cbr>$Q=N\\Delta E=6,02.10^{21}.200\\approx 12,4.10^{23}MeV$","difficultySource":"ai"}},{"id":685831,"ghiChu":"\"thực hiện được công 106 J trong thời gian 1 giờ\" (và 1 ngày) — nghi 10^6 J, nhưng cũng có thể là số thật.","deXuat":"","grade":"10","qtype":"multiple_choice","q":{"form":"ly_thuyet","type":"multiple_choice","topic":"Công suất của động cơ, máy kéo","answer":2,"options":["khi máy bơm hoạt động bình thường, nó thực hiện được công 3,6.10\u003csup>6\u003c/sup> J trong thời gian 1 phút.","khi máy bơm hoạt động bình thường, nó thực hiện được công 106 J trong thời gian 1 giờ.","khi máy bơm hoạt động bình thường, nó thực hiện được công 3,6.10\u003csup>6\u003c/sup> J trong thời gian 1 giờ.","khi máy bơm hoạt động bình thường, nó thực hiện được công  106 J trong thời gian 1 ngày."],"question":"Một máy bơm nước trên nhãn mác có ghi 1kWh. Ý nghĩa của thông số đó là","difficulty":"de","explanation":"","difficultySource":"ai"}},{"id":685930,"ghiChu":"Phương án \"107 J\", \"109 J\" — nghi 10^7 J, 10^9 J.","deXuat":"","grade":"10","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Cơ năng và định luật bảo toàn cơ năng","answer":0,"options":["107 J.","9 J.","109 J.","98 J."],"question":"Một vật khối lượng 2 kg được ném thẳng đứng lên cao từ độ cao 5 m so với mặt đất với vận tốc 3 m/s. Chọn mốc thế năng tại mặt đất. Bỏ qua lực cản không khí, lấy g = 9,8 m/s\u003csup>2\u003c/sup>. Cơ năng của vật sau khi ném là","difficulty":"trung-binh","explanation":"","difficultySource":"ai"}},{"id":669537,"ghiChu":"\"2,3, 106 J là nhiệt hoá hơi\" — nghi 2,3.10^6 J/kg (dấu phẩy thay dấu chấm).","deXuat":"2,3.10^6 J/kg","grade":"12","qtype":"multiple_choice","q":{"form":"ly_thuyet","type":"multiple_choice","topic":"Nhiệt dung riêng, nhiệt nóng chảy riêng, nhiệt hoá hơi riêng","answer":3,"options":["2, 3.10\u003csup>6\u003c/sup> J là nhiệt nóng chảy của nước đá","2,3, 106 J là nhiệt hóa hơi của nước","2, 3.10\u003csup>6\u003c/sup> J/kg là nhiệt nóng chảy riêng của nước đá","2, 3.10\u003csup>6\u003c/sup> J/kg là nhiệt hóa hơi riêng của nước"],"question":"Mỗi kilôgam nước cần thu một lượng nhiệt là 2,3.10\u003csup>6\u003c/sup>J để bay hơi hoàn toàn ở nhiệt độ sôi và áp suất tiêu chuẩn. Nhận định nào sau đây là đúng?","difficulty":"de","explanation":"2, 3.10\u003csup>6\u003c/sup> J/kg là nhiệt hóa hơi riêng của nước","difficultySource":"ai"}},{"id":440060,"ghiChu":"\"cường độ dòng điện hiệu dụng … là 106 A\" (cùng đề với 440089, 592548, 626736) — có thể là 10√6 A hoặc 10^6… cần đọc cả câu.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Vận dụng phương trình trạng thái","answer":"5,9","question":"Khi người đó hít sâu, giả sử không khí trong phổi có 1,4.10\u003csup>23\u003c/sup> phân tử. Dung tích phổi khi đó là bao nhiêu lít (làm tròn kết quả đến chữ số hàng phần mười)?\u003cbr>Sử dụng các thông tin sau cho Câu 3 và Câu 4: Một dây dẫn thẳng nằm ngang, được dùng để truyền tải dòng điện xoay chiều đi xa. Cường độ dòng điện hiệu dụng trong dây dẫn này là 106 A.","difficulty":"trung-binh","explanation":"Đáp số 5,9\u003cbr>Phương pháp:\u003cbr>Áp dụng phương trình Clapeyron:  $pV=nRT$\u003cbr>Cách giải:\u003cbr>Số mol phân tử khí trong phổi là:\u003cbr>$n=\\frac{N}{N_A}=\\frac{1,4.10^{23}}{6,022.10^{23}}=0,2325\\left(mol\\right)$\u003cbr>Áp dụng phương trình Clapeyron:\u003cbr>$\\begin{aligned}\\end{aligned}pV=nRT\\Rightarrow V=\\frac{nRT}{p}=\\frac{0,2325.8,314.310}{101.10^3}=5,9.10^{−3}m^3=5,9\\left(ℓ\\right)$\u003cbr>Vậy thể tích phổi là 5,9l .","difficultySource":"ai"}},{"id":440089,"ghiChu":"Giống 440060.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Giá trị hiệu dụng của dòng điện xoay chiều","answer":"150","question":"Cường độ dòng điện cực đại trong dây dẫn trên là bao nhiêu ampe (làm tròn kết quả đến chữ số hàng đơn vị)?\u003cbr>Sử dụng các thông tin sau cho Câu 3 và Câu 4: Một dây dẫn thẳng nằm ngang, được dùng để truyền tải dòng điện xoay chiều đi xa. Cường độ dòng điện hiệu dụng trong dây dẫn này là 106 A.","difficulty":"de","explanation":"Đáp số 150\u003cbr>Phương pháp:\u003cbr>Vận dụng lí thuyết:  $I=\\frac{I_0}{\\sqrt2}$\u003cbr>Cách giải:\u003cbr>Ta có:  $I=\\frac{I_0}{\\sqrt2}\\Rightarrow I_0=I\\sqrt2=106\\sqrt2=150\\left(A\\right)$","difficultySource":"ai"}},{"id":592548,"ghiChu":"Giống 440060 (\"I=106 A\").","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Phương trình Clapeyron – Mendeleev","answer":"60","question":"Giả sử một người sử dụng bình oxygen và giảm số phân tử oxygen trong bình còn  $1,505.10^{24}$  phân từ ở nhiệt độ  $20^∘C$ . Khi đó, áp suất của oxygen trong bình là bao nhiêu atm? (Làm tròn kết quả đến chữ số hàng đơn vị).","difficulty":"trung-binh","explanation":"Phương pháp:\u003cbr>Áp dụng phương trình Clapeyron: pV = nRT.\u003cbr>Cách giải:\u003cbr>Tại thời điểm của đề bài:  $p_3V=n_2RT=\\frac{N_2}{N_A}RT$\u003cbr>Thay số vào ta được:\u003cbr>$p_3.10^{−3}=\\frac{1,505.10^{24}}{6,02.10^{23}}.8,31.\\left(20+273\\right)$\u003cbr>$Taøi lieäu ñöôïc phaùt haønh taïi Website: thukhoadaihoc.vn$\u003cbr>$\\Rightarrow p_3=6087075\\left(Pa\\right)\\approx 60\\left(atm\\right)$\u003cbr>Sử dụng các thông tin sau cho Câu 3 và Câu 4: Một dây dẫn thẳng nằm ngang truyền tải dòng điện xoay chiều từ nhà máy nhiệt điện Trà Vinh đến các khu vực xung quanh. Cường độ dòng điện hiệu dụng trong dây dẫn này là  $I=106 A$ . Thành phần nằm ngang của từ trưởng Trái Đất tại khu vực Trà Vinh có độ lớn  $B=4.10^{−5}T$  và tạo với dây dẫn một góc sao cho lực từ đạt cực đại.\u003cbr>Sử dụng các thông tin sau cho Câu 3 và Câu 4: Một dây dẫn thẳng nằm ngang truyền tải dòng điện xoay chiều từ nhà máy nhiệt điện Trà Vinh đến các khu vực xung quanh. Cường độ dòng điện hiệu dụng trong dây dẫn này là  $I=106 A$ . Thành phần nằm ngang của từ trưởng Trái Đất tại khu vực Trà Vinh có độ lớn  $B=4.10^{−5}T$  và tạo với dây dẫn một góc sao cho lực từ đạt cực đại.","difficultySource":"ai"}},{"id":626736,"ghiChu":"Giống 440060 (\"I = 106A\").","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Quá trình đẳng nhiệt và định luật Boyle","answer":"0,8","question":"Bình A có dung tích 4 lít chứa một khối khí lí tưởng ở áp suất 2 atm. Bình A được nối thông với bình B có dung tích 6 lít được hút chân không. Xem nhiệt độ của khí là không đổi trong quá trình thực hiện. Áp suất của khối khí sau khi hai bình được nối thông nhau là bao nhiêu atm (Làm tròn kết quả lấy đến chữ số hàng phần mười)?","difficulty":"de","explanation":"$pV=const\\Rightarrow 2.4=p.\\left(4+6\\right)\\Rightarrow p=0,08\\left(atm\\right)$\u003cbr>Sử dụng các thông tin sau cho Câu 3 và Câu 4: Một dây dẫn thẳng nằm ngang truyền tải dòng điện xoay chiều từ một nhà máy nhiệt điện đến các khu vực xung quanh. Cường độ dòng điện hiệu dụng trong dây dẫn này là I = 106A . Thành phần nằm ngang của từ trường Trái Đất tại khu vực nhà máy nhiệt điện có độ lớn B = 4.10\u003csup>−5\u003c/sup> T và tạo với dây dẫn một góc sao cho lực từ đạt cực đại.\u003cbr>Sử dụng các thông tin sau cho Câu 3 và Câu 4: Một dây dẫn thẳng nằm ngang truyền tải dòng điện xoay chiều từ một nhà máy nhiệt điện đến các khu vực xung quanh. Cường độ dòng điện hiệu dụng trong dây dẫn này là I = 106A . Thành phần nằm ngang của từ trường Trái Đất tại khu vực nhà máy nhiệt điện có độ lớn B = 4.10\u003csup>−5\u003c/sup> T và tạo với dây dẫn một góc sao cho lực từ đạt cực đại.","difficultySource":"ai"}},{"id":579728,"ghiChu":"Phương án \"105 T.\" — nghi 10^-5 T hoặc 10^5 T.","deXuat":"","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Từ trường của nam châm và của dòng điện","answer":0,"options":["105 T.","2.10\u003csup>5\u003c/sup> T.","3.10\u003csup>5\u003c/sup> T.","0,5.10\u003csup>5\u003c/sup> T."],"question":"Cho hai dây dẫn thẳng dài vô hạn, đặt song song lần lượt có dòng điện  $I_1=2$  A và  $I_2=4$  A chạy qua. Xét mặt phẳng (Oxy) vuông góc với cả hai dây dẫn và cắt hai dây dẫn lần lượt tại A và B như hình vẽ bên. Biết  $AB=8$  cm, độ lớn cảm ứng từ tại một điểm cách dây dẫn thẳng dài một khoảng r (m) được xác định bằng biểu thức  $B=2.{10}^{-7}.\\frac{I}{r}$ . Độ lớn cảm ứng từ do từ trường của hai dòng điện gây ra tại M (M là trung điểm AB) bằng\u003cbr>\u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/cat-1791045415982-hinh-10.webp\" alt=\"Hình 10\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"trung-binh","explanation":"Độ lớn cảm ứng từ do dòng điện  $I_1$  gây ra tại M là:  $B_1=2.{10}^{-7}.\\frac{I_1}{r_{AM}}=2.{10}^{-7}.\\frac{2}{0,04}={10}^{-5}$  T.\u003cbr>Độ lớn cảm ứng từ do dòng điện  $I_2$  gây ra tại M là:  $B_2=2.{10}^{-7}.\\frac{I_2}{r_{BM}}=2.{10}^{-7}.\\frac{4}{0,04}=2.{10}^{-5}$  T.\u003cbr>Do  $\\vec{B_1}$  ngược hướng với  $\\vec{B_2}$  nên độ lớn cảm ứng từ do hai dòng điện gây ra tại M là:\u003cbr>$B_M=B_2-B_1=2.{10}^{-5}-{10}^{-5}={10}^{-5}$  T.","difficultySource":"ai"}},{"id":1475712,"ghiChu":"Phương án \"105 T.\" (các phương án anh em đã sửa thành 2.10^5, 3.10^5 T) — nghi 10^5 hoặc 10^-5 T.","deXuat":"","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Từ trường của nam châm và của dòng điện","answer":0,"options":["105 T.","2.10\u003csup>5\u003c/sup> T.","3.10\u003csup>5\u003c/sup> T.","0,5.10\u003csup>5\u003c/sup> T."],"question":"Cho hai dây dẫn thẳng dài vô hạn, đặt song song lần lượt có dòng điện  $I_1=2$  A và  $I_2=4$  A chạy qua. Xét mặt phẳng (Oxy) vuông góc với cả hai dây dẫn và cắt hai dây dẫn lần lượt tại A và B như hình vẽ bên. Biết  $AB=8$  cm, độ lớn cảm ứng từ tại một điểm cách dây dẫn thẳng dài một khoảng r (m) được xác định bằng biểu thức  $B=2.{10}^{-7}.\\frac{I}{r}$ . Độ lớn cảm ứng từ do từ trường của hai dòng điện gây ra tại M (M là trung điểm AB) bằng\u003cbr>\u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/cat-1791045415982-hinh-10.webp\" alt=\"Hình 10\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"trung-binh","explanation":"Độ lớn cảm ứng từ do dòng điện  $I_1$  gây ra tại M là:  $B_1=2.{10}^{-7}.\\frac{I_1}{r_{AM}}=2.{10}^{-7}.\\frac{2}{0,04}={10}^{-5}$  T.\u003cbr>Độ lớn cảm ứng từ do dòng điện  $I_2$  gây ra tại M là:  $B_2=2.{10}^{-7}.\\frac{I_2}{r_{BM}}=2.{10}^{-7}.\\frac{4}{0,04}=2.{10}^{-5}$  T.\u003cbr>Do  $\\vec{B_1}$  ngược hướng với  $\\vec{B_2}$  nên độ lớn cảm ứng từ do hai dòng điện gây ra tại M là:\u003cbr>$B_M=B_2-B_1=2.{10}^{-5}-{10}^{-5}={10}^{-5}$  T.","difficultySource":"ai"}},{"id":433651,"ghiChu":"Đáp án \"107 mA.\" — nghi 10^7 mA hoặc số thật 107 mA.","deXuat":"","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Đại cương về dòng điện xoay chiều","answer":0,"options":["1,07 mA.","1,07 A.","107 mA.","10,7 mA."],"question":"Trong mô hình Bohr của nguyên tử hydrogen, electron chuyển động tròn đều quanh hạt nhân với chu kì là 1,5.10\u003csup>16\u003c/sup> s. Biết điện tích của electron có độ lớn là e = 1,6.10\u003csup>19\u003c/sup> C. Cường độ dòng điện tương ứng với chuyển động này có độ lớn xấp xỉ bằng","difficulty":"de","explanation":"Chọn đáp án A\u003cbr>Electron chuyển động tròn đều có thể coi như tạo thành một dòng điện có độ lớn cường độ dòng điện là:\u003cbr>$I=\\frac{e}{T}=\\frac{1,6.{10}^{-19}}{1,5.{10}^{-16}}\\approx 1,07$  mA.","distractorNotes":{"B":"Sai bậc lũy thừa khi chia: $10^{-19}/10^{-16}$ cho $10^{-3}$, rồi đổi đơn vị mA sang A sai.","C":"Sai lũy thừa mười: tính ra $10^{-3}$ A nhưng đọc thành hàng trăm mA.","D":"Lệch một bậc lũy thừa mười khi chia $10^{-19}$ cho $10^{-16}$ rồi đổi sang mA."},"difficultySource":"ai"}}]};
const KEY="duyet-"+D.batch;let fh=null,state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ACT=[["de_xuat","Sửa theo đề xuất của Claude"],["y_thay","Sửa theo ý thầy (ghi bên dưới)"],["bo","Bỏ câu này (ẩn khỏi ngân hàng)"],["giu","Giữ nguyên — không có lỗi"]];
function blocks(q){let h='<div class="q">'+(q.question||"")+'</div>';
 if(Array.isArray(q.options))h+='<div class="blk">'+q.options.map((o,i)=>'<div>'+"ABCD"[i]+'. '+(typeof o==="string"?o:(o.text??JSON.stringify(o)))+'</div>').join("")+'</div>';
 if(Array.isArray(q.statements))h+='<div class="blk">'+q.statements.map((s,i)=>'<div>'+"abcd"[i]+') '+s.text+' <b>['+(s.answer?"Đúng":"Sai")+']</b></div>').join("")+'</div>';
 if(q.answer!==undefined&&!Array.isArray(q.statements))h+='<div class="blk"><b>Đáp án:</b> '+esc(JSON.stringify(q.answer))+'</div>';
 if(q.explanation)h+='<div class="blk"><b>Lời giải:</b><br>'+q.explanation+'</div>';return h}
document.getElementById("m").innerHTML=D.rows.map(r=>{const s=state[r.id]||{};return '<section data-id="'+r.id+'"><h2>#'+r.id+' <span class="mut">lớp '+esc(r.grade)+' · '+esc(r.qtype)+'</span></h2>'
 +'<div class="note"><b>Nghi ngờ:</b> '+esc(r.ghiChu)+(r.deXuat?'<br><b>Đề xuất:</b> '+esc(r.deXuat):'')+'</div>'+blocks(r.q||{})
 +'<div class="blk">'+ACT.map(([v,t])=>'<label class="opt"><input type="radio" name="a'+r.id+'" value="'+v+'"'+(s.action===v?" checked":"")+'> '+t+'</label>').join("")
 +'<textarea placeholder="Yêu cầu sửa / ghi chú cho Claude (ví dụ: V₁ = 10.10^-3 m³, đổi cả phần đề lẫn đáp án)">'+esc(s.note||"")+'</textarea></div></section>'}).join("");
function out(){return JSON.stringify({batch:D.batch,savedAt:new Date().toISOString(),items:Object.fromEntries(Object.entries(state).map(([k,v])=>[k,v]))},null,2)}
const st=document.getElementById("st");
async function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
 if(!fh){return}try{const w=await fh.createWritable();await w.write(out());await w.close();st.className="ok";st.textContent="Đã lưu "+new Date().toLocaleTimeString("vi")+" → "+fh.name}catch(e){st.className="bad";st.textContent="Lưu lỗi: "+e.message}}
document.getElementById("m").addEventListener("input",e=>{const sec=e.target.closest("section");if(!sec)return;const id=sec.dataset.id;const o=state[id]||(state[id]={});
 if(e.target.type==="radio")o.action=e.target.value;else o.note=e.target.value;save()});
document.getElementById("pick").onclick=async()=>{if(!window.showSaveFilePicker){alert("Trình duyệt này không hỗ trợ tự lưu — dùng Chrome/Edge, hoặc bấm Tải JSON về.");return}
 try{fh=await showSaveFilePicker({suggestedName:"phan-hoi.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});await save()}catch(e){}};
document.getElementById("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out()],{type:"application/json"}));a.download="phan-hoi.json";a.click()};
addEventListener("load",()=>renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false}));
