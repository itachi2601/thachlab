const D={"batch":"so-mu-2026-10-16","rows":[{"id":1475529,"ghiChu":"Đề ghi \"10.103 m3\" và \"30.103 m3\". Lời giải dùng V₁ = 10.10^{-3} m³ (T₁ ≈ 722 K) nên chắc chắn mất cả dấu trừ.","deXuat":"Đề: 10.10^{-3} m³ và 30.10^{-3} m³ (đổi 2 chỗ trong phần đề).","grade":"12","qtype":"true_false","q":{"form":"bai_tap","type":"true_false","topic":"Vận dụng phương trình trạng thái","question":"Một mol khí helium chứa trong một xilanh đậy kín bởi một pit-tông (pit-tông có thể dịch chuyển không ma sát), khối khí thực hiện quá trình biến đổi trạng thái từ (1)  (2)  (3) theo đồ thị hình bên. Biết rằng ở trạng thái (1), khối khí có thể tích 10.103 m3 và áp suất 6.105 Pa. Ở trạng thái (2), khối khí có thể tích 30.103 m3 và áp suất 2.105 Pa.\u003cbr>\u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/cat-1790617073993-hinh-14.webp\" alt=\"Hình 14\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"kho","statements":[{"text":"Nhiệt độ của khối khí ở trạng thái (1) xấp xỉ bằng 722 K.","answer":true},{"text":"Trong quá trình biến đổi trạng thái từ (1)  (2), nhiệt độ lớn nhất của khối khí xấp xỉ bằng 963 K.","answer":true},{"text":"Trong quá trình biến đổi trạng thái từ (1)  (2), tỉ số giữa động năng tịnh tiến trung bình (của nguyên tử khí helium) cực đại và cực tiểu là  $\\frac{4}{3}$ .","answer":true},{"text":"Công mà khối khí nhận được trong quá trình biến đổi trạng thái từ (2)  (3) xấp xỉ 5 933 J.","answer":false}],"explanation":"a) đúng\u003cbr>Nhiệt độ của khối khí ở trạng thái (1):\u003cbr>Ta có:  $p_1.V_1=n.R.T_1$    $T_1=\\frac{p_1.V_1}{n.R}=\\frac{6.{10}^5.10.{10}^{-3}}{1.8,31}=\\frac{2.{10}^5}{277} K\\approx 722 K$ .\u003cbr>b) đúng\u003cbr>Trong quá trình biến đổi trạng thái từ (1)  (2), mối liên hệ giữa p và V được xác định bởi biểu thức:  $p=a.V+b$ .\u003cbr>Từ đồ thị, ta có:  $\\left\\{\\begin{aligned}6.{10}^5=a.10.{10}^{-3}+b \u003cbr>2.{10}^5=a.30.{10}^{-3}+b\\end{aligned}\\right.$    $\\left\\{\\begin{aligned}a=-2.{10}^7 \u003cbr>b=8.{10}^5\\end{aligned}\\right.$    $p=-2.{10}^7.V+8.{10}^5$\u003cbr>$p.V=-2.{10}^7.V^2+8.{10}^5.V$\u003cbr>Mà:  $p.V=n.R.T=1.8,31.T$\u003cbr>Suy ra:  $-2.{10}^7.V^2+8.{10}^5.V=8,31.T$    $T=\\frac{-2.{10}^7}{8,31}.V^2+\\frac{8.{10}^5}{8,31}.V$\u003cbr>$T^'=\\frac{-4.{10}^7}{8,31}.V+\\frac{8.{10}^5}{8,31}=0$    $V=0,02 m^3$    $T_{max}=\\frac{-2.{10}^7}{8,31}.{0,02}^2+\\frac{8.{10}^5}{8,31}.0,02=\\frac{8.{10}^5}{831} K\\approx 963 K$\u003cbr>c) đúng\u003cbr>Theo kết quả của câu b, ta có:  $T_{max}=\\frac{8.{10}^5}{831} K$  và  $T=\\frac{-2.{10}^7}{8,31}.V^2+\\frac{8.{10}^5}{8,31}.V$\u003cbr>Trong quá trình biến đổi trạng thái từ (1)  (2),  $T_{min}$  khi  $V=V_1$  hoặc  $V=V_2$\u003cbr>$T_{min}=T_1=T_2=\\frac{2.{10}^5}{277} K$ .\u003cbr>Và tỉ số giữa động năng tịnh tiến trung bình (của nguyên tử khí helium) cực đại và cực tiểu là:\u003cbr>$\\frac{W_{đ_{max}}}{W_{đ_{min}}}=\\frac{\\frac{3}{2}k.T_{max}}{\\frac{3}{2}k.T_{min}}=\\frac{T_{max}}{T_{min}}=\\frac{\\frac{8.{10}^5}{831}}{\\frac{2.{10}^5}{277}}=\\frac{4}{3}$\u003cbr>d) sai\u003cbr>Điểm biểu diễn trạng thái (1) và (3) nằm trên đường thẳng đi qua gốc tọa độ nên mối liện hệ giữa p và V có dạng:  $p=a.V$\u003cbr>Ở trạng thái (1), ta có:  $p_1=a.V_1$    $6.{10}^5=a.10.{10}^{-3}$    $a=6.{10}^7$\u003cbr>$p=6.{10}^7.V$\u003cbr>Ở trạng thái (3), ta có:  $p=6.{10}^7.V$    $2.{10}^5=6.{10}^7.V_3$    $V_3=\\frac{10}{3}.{10}^{-3} m^3$ .\u003cbr>Công mà khối khí nhận được trong quá trình biến đổi trạng thái từ (2)  (3) (nén đẳng áp) là:\u003cbr>$A=p.\\Delta V=2.{10}^5.\\left(30.{10}^{-3}-\\frac{10}{3}.{10}^{-3}\\right)\\approx 5 333$  J.","difficultySource":"ai"}},{"id":669975,"ghiChu":"\"V = 6.102 m³\" — không rõ là 6.10² hay 6.10⁻² m³. Xem số liệu cả câu để quyết.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Vận dụng phương trình trạng thái","answer":"32,3","question":"Bóng thám không như hình vẽ bên là một thiết bị thường dùng trong ngành khí tượng để hỗ trợ thu thập các thông số của các tầng khí quyển.  Một bóng thám không ở mặt đất được bơm khí (coi như khí lí tưởng) ở áp suất $p_0$ = 1,00 atm và nhiệt độ $t_0$ = 270C . Để bóng này khi lên đến tầng khí quyển có áp suất p = 0,04 atm, nhiệt độ t = -500C, thể tích V = 6.102 m\u003csup>3\u003c/sup> thì thể tích bóng khi được bơm ở mặt đất bằng bao nhiêu mét khối (làm tròn kết quả đến chữ số hàng phần mười)?\u003cbr>\u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/1791046654128-hinh-11.jpg\" alt=\"Hình 11\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"de","explanation":"$\\begin{aligned}\\end{aligned}\\frac{pV}{T}=const\\Rightarrow \\frac{1.V}{27+273}=\\frac{0,04.6.10^2}{−50+273}\\Rightarrow V\\approx 32,3m^3 Website: thukhoadaihoc.vn$\u003cbr>Sử dụng các thông tin sau cho Câu 5 và Câu 6: Trong một thí nghiệm đo khả năng hấp thụ photpho của tế bào, ban đầu (t = 0) người ta tiêm một lượng   ${}_{15}^{32}P$  có độ phóng xạ 0,016μCi vào môi trường chứa vi khuẩn nuôi cấy tế bào thì các tế bào hấp thụ dần  ${}_{15}^{32}P$ . Biết chu kì bán rã của  ${}_{15}^{32}P$  là 14 ngày.\u003cbr>Sử dụng các thông tin sau cho Câu 5 và Câu 6: Trong một thí nghiệm đo khả năng hấp thụ photpho của tế bào, ban đầu (t = 0) người ta tiêm một lượng   ${}_{15}^{32}P$  có độ phóng xạ 0,016μCi vào môi trường chứa vi khuẩn nuôi cấy tế bào thì các tế bào hấp thụ dần  ${}_{15}^{32}P$ . Biết chu kì bán rã của  ${}_{15}^{32}P$  là 14 ngày.","difficultySource":"ai"}},{"id":1178258,"ghiChu":"\"q = 5.10-2 μC\" — mất ^ (chưa sửa vì ký tự lạ).","deXuat":"q = 5.10^{-2} μC (nếu đúng là 5·10⁻² μC).","grade":"11","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Tụ điện và điện dung","answer":2,"options":["q = 5.10\u003csup>4\u003c/sup>  $\\mu C.$","q = 5.10\u003csup>4\u003c/sup> (nC).","q = 5.10-2  $\\mu C.$","q = 5.10\u003csup>−4\u003c/sup> (C)."],"question":"Một tụ điện có điện dung 500 (pF) được mắc vào hiệu điện thế 100 (V). Điện tích của tụ điện là:","difficulty":"de","explanation":"","difficultySource":"ai"}},{"id":398354,"ghiChu":"Lời giải có \"x.102%.V\" — ký tự rác % do Word, có thể là x.10^2 hoặc x.10^5; cần đối chiếu phép tính cả câu.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Vận dụng phương trình trạng thái","answer":"2,16","question":"Khi xe đứng yên, khối không khí trong lốp xe ô tô con có nhiệt độ 28°C, áp suất 2,0685.10\u003csup>5\u003c/sup> Pa. Khi lốp lăn trên đường thì khối không khí trong lốp có thể tích tăng thêm 2% so với khi đứng yên, nhiệt độ bằng 48°C và áp suất là x.10\u003csup>5\u003c/sup> Pa. Coi không khí trong lốp là lí tưởng. Giá trị của x là bao nhiêu (làm tròn kết quả đến hàng phần trăm)?","difficulty":"trung-binh","explanation":"$\\frac{2,0685.V}{28+273}=\\frac{x.102%.V}{48+273}\\Rightarrow x=2,16$","difficultySource":"ai"}},{"id":642757,"ghiChu":"Lời giải có \"10^5.103%\" — ký tự rác %, có thể là 10^3.","deXuat":"","grade":"12","qtype":"true_false","q":{"form":"bai_tap","type":"true_false","topic":"Phương trình Clapeyron – Mendeleev","question":"Một căn phòng có thể tích 120 m³, lúc đầu không khí trong phòng có nhiệt độ 27°C và áp suất 105 pa.\u003cbr>Sau đó, nhiệt độ trong phòng tăng thêm 10°C và áp suất không khí trong phòng tăng 3%. Coi không khí là khí lý tưởng, khối lượng mol của không khí là 29 g/mol. Cho hằng số khí R = 8,31 (J/mol.K)","difficulty":"trung-binh","statements":[{"text":"Khối lượng không khí ban đầu trong phòng là m ≈ 139,6 kg.","answer":true},{"text":"Khối lượng riêng của không khí ban đầu trong phòng là p ≈ 1,163 kg/m\u003csup>3\u003c/sup>.","answer":true},{"text":"Khối lượng không khí trong phòng lúc sau m’ ≈ 139,2 kg.","answer":false},{"text":"Khối lượng khí thoát ra khỏi phòng Δm ≈ 0,4 kg.","answer":false}],"explanation":"a) đúng\u003cbr>$\\begin{aligned}p.V=nRT\\Rightarrow pV=\\frac{m}{M}.RT\\Rightarrow 10^5.120=\\frac{m}{29}.8,31.30027+273 \u003cbr>Website: thukhoadaihoc.vn\\end{aligned}$\u003cbr>$Taøi lieäu ñöôïc phaùt haønh taïi Website: thukhoadaihoc.vn$\u003cbr>$\\Rightarrow m=139,6\\left(kg\\right)$\u003cbr>b) đúng\u003cbr>$\\begin{aligned}\\end{aligned}\\delta =\\frac{m}{V}=\\frac{139,6}{120}=1,163\\left(kg/m^3\\right)Website: thukhoadaihoc.vn$\u003cbr>c) sai\u003cbr>$\\begin{aligned}\\end{aligned}pV=nRT\\Rightarrow \\left(10^5.103%\\right)120=\\frac{m^/}{29}.8,31.310\\Rightarrow m^/=139,14\\left(kg\\right)Website: thukhoadaihoc.vn$\u003cbr>$Taøi lieäu ñöôïc phaùt haønh taïi Website: thukhoadaihoc.vn$\u003cbr>d) sai\u003cbr>$\\Delta m=m−m^/=0,45kg$","difficultySource":"ai"}},{"id":656420,"ghiChu":"Lời giải có \"V₁.101%\" — ký tự rác %, nghi là V₁·10^{…}/… hoặc 1,01.","deXuat":"","grade":"12","qtype":"multiple_choice","q":{"form":"bai_tap","type":"multiple_choice","topic":"Quá trình đẳng áp và định luật Charles","answer":1,"options":["770C","270C","370C","170C"],"question":"Đun nóng một lượng khí trong điều kiện đẳng áp thì nhiệt độ tăng thêm 3 K, còn thể tích tăng thêm 1% so với thể tích ban đầu. Nhiệt độ ban đầu của lượng khí này là","difficulty":"trung-binh","explanation":"Đẳng áp:  $\\frac{V}{T}=const\\Rightarrow \\frac{V_1}{T_1}=\\frac{V_2}{T_2}Website: thukhoadaihoc.vn$\u003cbr>$\\Rightarrow \\frac{V_1}{T_1}=\\frac{V_1.101%}{T_1+3}\\Rightarrow T_1=300K\\Rightarrow t^0C=300−273=27^0C$","difficultySource":"ai"}},{"id":455416,"ghiChu":"Lời giải có \"(22+273).1016 − (17+273).1016\" — nghi là .10^{16} nhưng có thể là số khác.","deXuat":"","grade":"12","qtype":"true_false","q":{"form":"bai_tap","type":"true_false","topic":"Vận dụng phương trình trạng thái","question":"Hai bình (1) và (II) giống nhau, mỗi bình có thể tích 1 lít, chứa cùng một lượng khí lí tưởng, cùng loại khí. Hai bình được nối với nhau bằng một ống nằm ngang dài 8 cm, có tiết diện ngang đều và bằng 4 cm\u003csup>2\u003c/sup>. Trong ống có một giọt thủy ngân với kích thước không đáng kể, ngăn cách hai khối khí như hình vẽ. Ban đầu, khối khí trong hai bình đều ở nhiệt độ 17 °C, giọt thủy ngân nằm giữa ống, cách đều hai đầu ống. Coi sự dãn nở của hai bình và ống là không đáng kể. Bỏ qua ma sát giữa giọt thủy ngân với thành ống. \u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/1790259893720-hinh-6.png\" alt=\"Hình 6\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"kho","statements":[{"text":"Khi giọt thủy ngân ở trạng thái cân bằng, áp suất của khối khí trong hai bình bằng nhau.","answer":true},{"text":"Nếu đun nóng bình (I) liên tục và giữ nguyên nhiệt độ bình (II) thì giọt thủy ngân dịch chuyển về phía bình (II).","answer":true},{"text":"Khi nhiệt độ của khối khí trong bình (I) tăng đến 22 °C và nhiệt độ của khối khí trong bình (II) được giữ không đổi, giọt thủy ngân dịch chuyển một đoạn 1 cm so với vị trí ban đầu.","answer":false},{"text":"Nếu tiếp tục đun nóng bình (I) trong khi vẫn giữa nguyên nhiệt độ của bình (II) thì khi nhiệt độ của khối khí trong bình (I) đạt 30 °C, giọt thủy ngân bắt đầu rơi vào trong bình (II).","answer":false}],"explanation":"a) đúng\u003cbr>Khi giọt thủy ngân ở trạng thái cân bằng, lực do khối khí ở phía bình (1) tác dụng lên giọt thủy ngân sẽ cân bằng với lực do khối khí ở phía bình (II) tác dụng lên giọt thủy ngân.\u003cbr>Mà áp suất của khối khí liên hệ với lực tác dụng lên giọt thủy ngân theo hệ thức:  $p=\\frac{F}{S}$  hay  $F=p.S$  (với S là tiết diện ngang của ống)\u003cbr>Suy ra: áp suất của khối khí trong hai bình bằng nhau.\u003cbr>b) đúng\u003cbr>Nếu đun nóng bình (I) liên tục và giữ nguyên nhiệt độ bình (II) thì áp suất khí trong bình (I) sẽ tăng và lớn hơn áp suất của khối khí trong bình (II). Khi đó, lực do khối khí phía bình (I) tác dụng lên giọt thủy ngân sẽ lớn hơn và đẩy giọt thủy ngân dịch chuyển về phía bình (II).\u003cbr>c) sai\u003cbr>Xét khối khí ở phía bình (I), ta có:  $\\frac{p_1.V_1}{T_1}=\\frac{{p'}_1.{V'}_1}{{T'}_1}=\\frac{{p'}_1.\\left(V_1+x.S\\right)}{{T'}_1}$    ${p'}_1=\\frac{p_1.V_1.{T'}_1}{\\left(V_1+x.S\\right).T_1}$\u003cbr>Xét khối khí ở phía bình (II), ta có:  $p_2.V_2={p'}_2.{V'}_2={p'}_2.\\left(V_2-x.S\\right)$    ${p'}_2=\\frac{p_2.V_2}{V_2-x.S}$\u003cbr>Khi giọt thủy ngân ở vị trí cân bằng mới, ta có:  ${p'}_1={p'}_2$\u003cbr>Suy ra:  $\\frac{p_1.V_1.{T'}_1}{\\left(V_1+x.S\\right).T_1}=\\frac{p_2.V_2}{V_2-x.S}$    $\\frac{{T'}_1}{\\left(V+x.S\\right).T_1}=\\frac{1}{V-x.S}$  (với  $V_1=V_2=V=1.{10}^3+\\frac{8}{2}.4=1016$  cm3).\u003cbr>Suy ra:  $x=\\frac{{T'}_1V-T_1V}{T_1S+{T'}_1S}$\u003cbr>Thay số, ta được:  $x=\\frac{\\left(22+273\\right).1016-\\left(17+273\\right).1016}{\\left(17+273\\right).4+\\left(22+273\\right).4}\\approx 2$  cm.\u003cbr>Vậy giọt thủy ngân dịch chuyển đi 2 cm so với vị trí ban đầu (về phía bình (II)).\u003cbr>d) sai\u003cbr>Nếu tiếp tục đun nóng bình (I) trong khi vẫn giữa nguyên nhiệt độ của bình (II) thì giọt thủy ngân bắt đầu rơi vào trong bình (II) khi  $x=\\frac{8}{2}=4$  cm.\u003cbr>Theo câu c, ta có:  $\\frac{{T''}_1}{\\left(V+x.S\\right).T_1}=\\frac{1}{V-x.S}$  (với  ${T''}_1$  là nhiệt độ của khối khí trong bình (I) khi giọt thủy ngân bắt đầu rơi vào trong bình (II)).\u003cbr>Suy ra:  ${T''}_1=\\frac{\\left(V+x.S\\right).T_1}{V-x.S}=\\frac{\\left(1016+4.4\\right).\\left(17+273\\right)}{1016-4.4}\\approx 299$  K   ${t''}_1=26$  C.","difficultySource":"ai"}},{"id":571235,"ghiChu":"Lời giải có \"2.1080 / 5.102000\" — có thể là 2·10^{80}? hoặc 2·1080 và 5·102000. Cần đọc cả câu.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Vận dụng ΔU = A + Q","answer":"0,42","question":"Một xi lanh hình trụ đặt thẳng đứng, diện tích tiết diện S = 100 cm\u003csup>2\u003c/sup>, chứa một lượng khí lí tưởng đơn nguyên tử. Khí được ngăn cách với môi trường bởi một piston khối lượng m = 2 kg có thể trượt không ma sát dọc theo thành xi lanh. Áp suất khí quyển là $p_0$ = 105 Pa, lấy g = 10 m/s\u003csup>2\u003c/sup>. Xi lanh và piston được làm bằng vật liệu cách nhiệt lý tưởng. Truyền cho khí nhiệt lượng Q = 1080 J để khí giãn nở và đẩy piston đi lên rất chậm. Biết độ biến thiên nội năng của khí lí tưởng đơn nguyên tử được xác định theo công thức $\\Delta U=\\frac{3}{2}mR\\Delta T$ . Độ dịch chuyển của piston bằng bao nhiêu mét? (làm tròn kết quả đến chữ số hàng phần trăm).","difficulty":"trung-binh","explanation":"Đổi đơn vị:\u003cbr>S = 100 cm2 = 0,01m\u003csup>2\u003c/sup>\u003cbr>Piston chuyển động rất chậm nên áp suất khí trong xi lanh coi như không đổi:\u003cbr>$p=p_0+\\frac{mg}{S}\\Rightarrow p=10^5+\\frac{2.10}{0,01}=102000Pa$\u003cbr>Với khí lí tưởng đơn nguyên tử:\u003cbr>$\\Delta U=\\frac{3}{2}nR\\Delta T$\u003cbr>Vì quá trình đẳng áp nên:  $nR\\Delta T=p\\Delta V$\u003cbr>Do đó:  $\\Delta U=\\frac{3}{2}p\\Delta V$\u003cbr>Công khí thực hiện:\u003cbr>A =  p∆V\u003cbr>Áp dụng nguyên lí I nhiệt động lực học:\u003cbr>$Q=\\Delta U+A$\u003cbr>$\\Rightarrow Q=\\frac{3}{2}p\\Delta V+p\\Delta V=\\frac{5}{2}p\\Delta V$\u003cbr>$\\Rightarrow \\Delta V=\\frac{2Q}{5p}=\\frac{2.1080}{5.102000}\\approx 0,00424m^3$\u003cbr>Mà ∆V = S.h , nên:\u003cbr>$h=\\frac{\\Delta V}{S}=\\frac{0,00424}{0,01}\\approx 0,424m$\u003cbr>Làm tròn đến hàng phần trăm: h  $\\approx$  0,42 m\u003cbr>Vậy độ dịch chuyển của piston là 0,42 m.","difficultySource":"ai"}},{"id":456929,"ghiChu":"Lời giải có \"2×101 = 202 kPa\" — có thể đúng (p₁ = 101 kPa), nghi nhầm do máy quét. Nếu đúng thì chọn Giữ nguyên.","deXuat":"","grade":"12","qtype":"short_answer","q":{"form":"bai_tap","type":"short_answer","topic":"Đọc đồ thị các đẳng quá trình","answer":"202","question":"Biết nhiệt độ tuyệt đối của khối khí ở trạng thái (3) gấp 4 lần so với trạng thái (1). Áp suất khí ở trạng thái (3) bằng bao nhiêu kPa? Làm tròn kết quả đến chữ số hàng đơn vị. Sử dụng thông tin sau cho Câu 3 và Câu 4: Cho một khung dây dẫn chữ nhật nhẹ gồm 200 vòng dây, được đặt trong mặt phẳng thẳng đứng sao cho cạnh phía dưới nằm trong vùng từ trường đều có vector cảm ứng từ vuông góc với mặt phẳng vòng dây (như hình vẽ). Cho chiều dài của khung dây là 10 cm. Dùng hai lực kế giống hệt nhau treo thẳng đứng vào hai đầu khung dây bằng hai sợi dây mảnh có khối lượng không đáng kể như hình vẽ. Ban đầu, khi khung dây không có dòng điện chạy qua thì số chỉ của mỗi lực kế là 0,25 N. Khi cho dòng điện có cường độ 1,0 A chạy trong khung dây thì tổng số chỉ của hai lực kế là 0,75 N. \u003cimg src=\"https://jgvbdbpvjdntdgzthumv.supabase.co/storage/v1/object/public/lesson-media/132/1790260181083-hinh-7.png\" alt=\"Hình 7\" class=\"mx-auto my-2 max-w-full rounded-lg\" />","difficulty":"trung-binh","explanation":"Đáp số 202\u003cbr>Áp suất khí ở trạng thái (3) là\u003cbr>$p_3=\\frac{nRT_3}{V_3}=\\frac{nR\\times 4T_1}{2V_1}=2\\times \\frac{nRT_1}{V_1}=2p_1=2\\times 101=202 kPa.$","difficultySource":"ai"}}]};
const KEY="duyet-"+D.batch;let fh=null,state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ACT=[["de_xuat","Sửa theo đề xuất của Claude"],["y_thay","Sửa theo ý thầy (ghi bên dưới)"],["bo","Bỏ câu này (ẩn khỏi ngân hàng)"],["giu","Giữ nguyên — không có lỗi"]];
function blocks(q){let h='<div class="q">'+(q.question||"")+'</div>';
 if(Array.isArray(q.options))h+='<div class="blk">'+q.options.map((o,i)=>'<div>'+"ABCD"[i]+'. '+(typeof o==="string"?o:(o.text??JSON.stringify(o)))+'</div>').join("")+'</div>';
 if(Array.isArray(q.statements))h+='<div class="blk">'+q.statements.map((s,i)=>'<div>'+"abcd"[i]+') '+s.text+' <b>['+(s.answer?"Đúng":"Sai")+']</b></div>').join("")+'</div>';
 if(q.answer!==undefined&&!Array.isArray(q.statements))h+='<div class="blk"><b>Đáp án:</b> '+esc(JSON.stringify(q.answer))+'</div>';
 if(q.explanation)h+='<div class="blk"><b>Lời giải:</b><br>'+q.explanation+'</div>';return h}
document.getElementById("m").innerHTML=D.rows.map(r=>{const s=state[r.id]||{};return '<section data-id="'+r.id+'"><h2>#'+r.id+' <span class="mut">lớp '+esc(r.grade)+' · '+esc(r.qtype)+'</span></h2>'
 +'<div class="note"><b>Nghi ngờ:</b> '+esc(r.ghiChu)+(r.deXuat?'<br><b>Đề xuất:</b> '+esc(r.deXuat):'')+'</div>'+blocks(r.q||{})
 +'<div class="blk">'+ACT.map(([v,t])=>'<label class="opt"><input type="radio" name="a'+r.id+'" value="'+v+'"'+(s.action===v?" checked":"")+'> '+t+'</label>').join("")
 +'<textarea placeholder="Yêu cầu sửa / ghi chú cho Claude (ví dụ: V₁ = 10.10^-3 m³, đổi cả phần đề lẫn đáp án)">'+esc(s.note||"")+'</textarea></div></section>'}).join("");
function out(){return JSON.stringify({batch:D.batch,savedAt:new Date().toISOString(),items:Object.fromEntries(Object.entries(state).map(([k,v])=>[k,v]))},null,2)}
const st=document.getElementById("st");
async function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
 if(!fh){return}try{const w=await fh.createWritable();await w.write(out());await w.close();st.className="ok";st.textContent="Đã lưu "+new Date().toLocaleTimeString("vi")+" → "+fh.name}catch(e){st.className="bad";st.textContent="Lưu lỗi: "+e.message}}
document.getElementById("m").addEventListener("input",e=>{const sec=e.target.closest("section");if(!sec)return;const id=sec.dataset.id;const o=state[id]||(state[id]={});
 if(e.target.type==="radio")o.action=e.target.value;else o.note=e.target.value;save()});
document.getElementById("pick").onclick=async()=>{if(!window.showSaveFilePicker){alert("Trình duyệt này không hỗ trợ tự lưu — dùng Chrome/Edge, hoặc bấm Tải JSON về.");return}
 try{fh=await showSaveFilePicker({suggestedName:"phan-hoi.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});await save()}catch(e){}};
document.getElementById("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out()],{type:"application/json"}));a.download="phan-hoi.json";a.click()};
