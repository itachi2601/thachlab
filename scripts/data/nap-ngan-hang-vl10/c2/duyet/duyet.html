<script>
const D={"rows": [{"key": "c2-1-mc-019", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường và độ dịch chuyển của một vật chuyển động có cùng độ lớn khi\u003c/p>", "options": ["vật chuyển động theo quỹ đạo thẳng.", "vật chuyển động theo quỹ đạo thẳng theo chiều âm.", "vật chuyển động theo quỹ đạo thẳng theo chiều dương.", "vật chuyển động theo quỹ đạo quỹ đạo cong."], "statements": null, "nguon": "A", "haiku": "C", "sonnet": "C", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường $s$ là độ dài quỹ đạo thực tế vật đi được (đại lượng không âm, cộng dồn). Độ dịch chuyển $d$ là độ biến thiên tọa độ (vectơ nối vị trí đầu và cuối).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Độ lớn độ dịch chuyển bằng quãng đường khi vật chuyển động thẳng và không đổi chiều.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A sai: chuyển động thẳng nhưng có đổi chiều thì $|d| \\lt s$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B: thẳng theo chiều âm thì $d \\lt 0$ nên $d \\ne s$ (về giá trị đại số), vì vậy theo cách hiểu của đề, quãng đường và độ dịch chuyển chỉ trùng nhau khi vật chuyển động thẳng theo chiều dương.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D sai: quỹ đạo cong thì $|d| \\lt s$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Chọn C.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề theo SGK: chuyển động thẳng theo chiều dương thì s = d. Nếu xét độ lớn thì B cũng thỏa, nhưng đáp án đề dự kiến là C."}, {"key": "c2-1-mc-021", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Phát biểu nào sau đây nói về độ dịch chuyển?\u003c/p>", "options": ["Con tàu đã đi 200 km về phía đông nam.", "Một xe ô tô đã đi 200 km từ Hà Nội đến Nam Định.", "Máy bay đã bay được 500 km về thành phố Hồ Chí Minh.", "Bạn An đã đi được 1km về phía sân vận động."], "statements": null, "nguon": "B", "haiku": "A", "sonnet": "A", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Độ dịch chuyển là đại lượng vectơ, cho biết độ dài và hướng của sự thay đổi vị trí. Vì vậy một phát biểu nói về độ dịch chuyển phải có đủ độ lớn và hướng xác định.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A: \"200 km về phía đông nam\" có độ lớn (200 km) và hướng (đông nam)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ là độ dịch chuyển.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B: \"đi 200 km từ Hà Nội đến Nam Định\" chỉ cho độ dài quãng đường, không nêu hướng\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ là quãng đường.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">C: \"bay được 500 km về thành phố Hồ Chí Minh\" là quãng đường bay, chưa xác định hướng và vị trí đầu cụ thể\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ không phải độ dịch chuyển.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D: \"đi được 1 km về phía sân vận động\" là quãng đường đi, hướng không rõ ràng\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ không phải độ dịch chuyển.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: chọn A.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-1-tf-045", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một người đi bằng thuyền với tốc độ 2 m/s về phía đông. Sau khi đi được 2,2 km, người này lên ô tô đi về phía bắc trong 15 phút với tốc độ 60 km/h. Xác định quãng đường và độ dịch chuyển mà người đó đi được.\u003c/p>", "options": null, "statements": [{"text": "Xe đi được 15 km trong 15 phút khi đi về phía Bắc.", "answer": true}, {"text": "Quãng đường xe đi được là 17 km.", "answer": true}, {"text": "Độ dịch chuyển mà người đó đi được là 17,2km.", "answer": false}, {"text": "Độ dịch chuyển người đó đi và về là 0.", "answer": true}], "nguon": [true, true, false, true], "haiku": [true, false, false, false], "sonnet": [true, false, false, false], "goc": "a. Phát biểu này **đúng.** Quãng đường người đó đi trong 15 phút là $s_{2}=v_{2}t_{2}=60.0,25=15$ km.\n\nb. Phát biểu này **đúng.**\n\nQuãng đường mà người đó đi được là s = s~1~ + s~2~ =s~1~ + v~2~t~2~ = 2,2 + 60.0,25 = 17,2 km.\n\nc. Phát biểu này **sai.** Độ dịch chuyển của người đó là $d=\\sqrt{2,2^{2}+15^{2}}=15,16 km.$\n\nd. Phát biểu này **đúng.** Độ dịch chuyển người đó đi và về là d = 0.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đổi $15$ phút $=0{,}25$ h. Đoạn đi ô tô về phía bắc: $s_2=vt=60\\cdot 0{,}25=15$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Đoạn đi thuyền về phía đông: $s_1=2{,}2$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường: $s=s_1+s_2=2{,}2+15=17{,}2$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Hai đoạn dịch chuyển vuông góc (đông và bắc) nên độ dịch chuyển:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$d=\\sqrt{s_1^2+s_2^2}=\\sqrt{2{,}2^2+15^2}\\approx 15{,}16$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Đúng: xe đi được $15$ km trong $15$ phút.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Sai: quãng đường là $17{,}2$ km, không phải $17$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Sai: độ dịch chuyển khoảng $15{,}16$ km; $17{,}2$ km là quãng đường.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Sai: đề không nêu người đó quay về vị trí đầu; với hành trình đã cho độ dịch chuyển là $\\approx 15{,}16$ km, khác $0$.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý d) đề mơ hồ ('đi và về'); đề gốc không có chiều về nên xét theo hành trình đã cho thì sai."}, {"key": "c2-1-tf-046", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một người đi xe máy từ nhà đến bến xe bus cách nhà 6$km$ về phía đông. Đến bến xe, người đó lên xe bus đi tiếp $20 km$ về phía bắc.\u003c/p>", "options": null, "statements": [{"text": "Quãng đường người đó đi được là 26 km.", "answer": true}, {"text": "Độ dịch chuyển của người đó đi được là 26 km.", "answer": false}, {"text": "Hướng dịch chuyển của người đó là 90$^{0}$.", "answer": true}, {"text": "Người này dịch chuyển theo hướng Đông – Bắc.", "answer": true}], "nguon": [true, false, true, true], "haiku": [true, false, false, false], "sonnet": [true, false, false, true], "goc": "a. Phát biểu này **đúng.** Quãng đường đi được $s=6+20=26 km.$\n\nb. Phát biểu này **sai.** Độ dịch chuyển vì ${\\overrightarrow{d}}_{1}\\bot{\\overrightarrow{d}}_{2}\\Rightarrowd = \\sqrt{d_{1}^{2} + d_{2}^{2}} = \\sqrt{6^{2} + 20^{2}} = 20,88 km.$\n\nc. Phát biểu này **đúng.**: Ta có:$\\tan\\alpha=\\frac{20}{6}\\Rightarrow\\alpha\\approx81^{0}26'$. Hướng dịch chuyển của người đó là 81^0^26^’^\n\nd. Phát biểu này **đúng.**", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn hệ trục: Ox hướng đông, Oy hướng bắc, gốc O tại nhà. Hai đoạn chuyển động vuông góc với nhau: $d_1 = 6$ km (đông), $d_2 = 20$ km (bắc).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Quãng đường bằng tổng độ dài các đoạn đi được: $s = 6 + 20 = 26$ km. Vậy ý a) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Độ dịch chuyển là vectơ tổng $\\vec d = \\vec d_1 + \\vec d_2$, có độ lớn $d = \\sqrt{d_1^2 + d_2^2}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow d = \\sqrt{6^2 + 20^2} = \\sqrt{436} \\approx 20{,}9$ km, khác 26 km. Vậy ý b) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Gọi $\\alpha$ là góc giữa $\\vec d$ và hướng đông: $\\tan\\alpha = \\dfrac{20}{6}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow \\alpha \\approx 73{,}3^\\circ$, không phải $90^\\circ$ (góc $90^\\circ$ chỉ là góc giữa hai đoạn chuyển động). Vậy ý c) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Vì $\\vec d$ có thành phần hướng đông và hướng bắc nên người này dịch chuyển theo hướng Đông – Bắc (lệch khoảng $73{,}3^\\circ$ so với hướng đông). Vậy ý d) \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-2-mc-014", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một ôtô đi từ A đến B theo đường thẳng. Nửa đoạn đường đầu ôtô đi với tốc độ 30 km/h. Trong nửa đoạn đường còn lại, nửa thời gian đầu ôtô đi với tốc độ 50 km/h và nửa thời gian sau ôtô đi với tốc độ 20 km/h. Tốc độ trung bình của ôtô trên cả quãng đường AB là\u003c/p>", "options": ["48 km/h.", "40 km/h.", "34 km/h.", "32 km/h."], "statements": null, "nguon": "C", "haiku": "D", "sonnet": "D", "goc": "$v_{tb}=\\frac{s}{t_{1}+t_{23}}=\\frac{s}{\\frac{0,5 s}{v_{1}}+\\frac{0,5 s}{\\frac{v_{2}+v_{3}}{2}}}=\\frac{1}{\\frac{0,5}{30}+\\frac{0,5}{\\frac{60+20}{2}}}=34,3 km/h.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Gọi chiều dài AB là $s$. Tốc độ trung bình $v_{tb}=\\dfrac{s}{t_1+t_2}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Nửa đoạn đầu: $t_1=\\dfrac{s/2}{30}=\\dfrac{s}{60}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Nửa đoạn sau, gọi thời gian đi là $t_2$: quãng đường $\\dfrac{t_2}{2}\\cdot 50+\\dfrac{t_2}{2}\\cdot 20=35t_2=\\dfrac{s}{2}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t_2=\\dfrac{s}{70}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Tổng thời gian: $t=\\dfrac{s}{60}+\\dfrac{s}{70}=\\dfrac{13s}{420}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_{tb}=\\dfrac{s}{t}=\\dfrac{420}{13}\\approx 32{,}3$ km/h.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giá trị gần nhất là 32 km/h. Chọn D.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Kết quả tính được 420/13 ≈ 32,3 km/h, làm tròn gần đúng với đáp án D (32 km/h)."}, {"key": "c2-2-tf-034", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một người bơi dọc theo chiều dài 80 m của bể bơi hết 25 s, rồi quay lại chỗ xuất phát trong 32 s.\u003c/p>", "options": null, "statements": [{"text": "Trong lần bơi đi vận tốc trung bình bằng tốc độ trung bình.", "answer": true}, {"text": "Trong lần bơi về vận tốc trung bình của người bơi là 2,5 m/s.", "answer": true}, {"text": "Tốc độ trung bình của người bơi khi bơi về là 2,5 m/s.", "answer": false}, {"text": "Vận tốc trung bình của người bơi khi bơi đi lẫn về là 2,8 m/s", "answer": true}], "nguon": [true, true, false, true], "haiku": [true, false, true, false], "sonnet": [true, false, true, false], "goc": "a. Phát biểu này **đúng.** Chọn gốc tọa độ tại vị trí xuất phát, chiều dương là chiều bơi đi. Vận tốc trung bình $v_{tb}=\\frac{s_{1}}{t_{1}}=\\frac{80}{25}=3,2 m/s,$ còn tốc độ trung bình $ v_{tb}=\\frac{x_{2}-x_{1}}{t_{1}}=\\frac{80-0}{25}=3,2 m/s.$\n\nb. Phát biểu này **đúng.** Vận tốc trung bình khi bơi về $v_{tb}=\\frac{s_{2}}{t_{2}}=\\frac{80}{32}=2,5 m/s.$\n\nc. Phát biểu này **sai.** Tốc độ trung bình khi bơi về $v_{tb}=\\frac{x_{2}-x'_{1}}{t_{2}}=\\frac{0-80}{32}= -2,5 m/s.$\n\nd. Phát biểu này **đúng.** Vận tốc trung bình khi bơi đi lẫn về$v_{tb}=\\frac{s_{1}+s_{2}}{t_{1}+t_{2}}=\\frac{80+80}{25+32}=2,8 m/s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương là chiều bơi đi. Quãng đường mỗi lượt là $80$ m; độ dịch chuyển lượt đi là $+80$ m, lượt về là $-80$ m, cả đi lẫn về là $0$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Lượt bơi đi, người bơi chuyển động thẳng theo một chiều nên độ lớn độ dịch chuyển bằng quãng đường. Do đó độ lớn vận tốc trung bình bằng tốc độ trung bình: $\\dfrac{80}{25}=3{,}2$ m/s. Ý a) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Lượt bơi về: $v_{tb}=\\dfrac{d}{t}=\\dfrac{-80}{32}=-2{,}5$ m/s. Vận tốc trung bình có độ lớn $2{,}5$ m/s nhưng mang giá trị âm (ngược chiều dương). Ý b) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Tốc độ trung bình lượt về: $\\dfrac{s}{t}=\\dfrac{80}{32}=2{,}5$ m/s. Ý c) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Cả đi lẫn về, người bơi trở về vị trí xuất phát nên độ dịch chuyển bằng $0$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_{tb}=\\dfrac{0}{25+32}=0$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giá trị $2{,}8$ m/s (gần với $\\dfrac{160}{57}\\approx 2{,}8$) là tốc độ trung bình, không phải vận tốc trung bình. Ý d) Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-2-tf-046", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một chiếc tàu chở hàng đang rời khỏi bên cảng để bắt đầu chuyến hành trình với tốc độ 15 hải lí/h. Tàu rời cảng trong hai trường hợp sau: nước chảy cùng chiều chuyển động của tàu với tốc độ 3 hải lí/h và nước chảy ngược chiều chuyển động của tàu với tốc độ 2 hải lí/h.\u003c/p>", "options": null, "statements": [{"text": "Khi tàu rời cảng với dòng nước chảy cùng chiều chuyển động của tàu thì tàu chuyển động nhanh dần.", "answer": true}, {"text": "Khi dòng nước chảy ngược chiều tàu thì tàu chuyển động với tốc độ 17 hải lí/h.", "answer": true}, {"text": "Vận tốc của tàu khi dòng nước chảy cùng chiều với tàu là 18 hải lí/h.", "answer": true}, {"text": "Tốc độ trung bình của tàu khi dòng nước chuyển động ngược chiều với tàu là 13 hải lí/h.", "answer": true}], "nguon": [true, true, true, true], "haiku": [false, false, true, true], "sonnet": [false, false, true, true], "goc": "Gọi (1) tàu, (2) dòng nước, (3) bến cản.\n\na. Phát biểu này **đúng.**\n\nb. Phát biểu này **đúng.**\n\nc. Phát biểu này **đúng.**\n\nd. Phát biểu này **đúng.**\n\nTa có $\\overrightarrow{v_{13}}=\\overrightarrow{v_{12}}+\\overrightarrow{v_{23}}$\n\n$v_{13}=v_{12}+v_{23}=15+3=18$(hải lí/h).\n\n$v_{13}=v_{12}-v_{23}=15-2=13$(hải lí/h).", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Giả thiết: tốc độ của tàu so với nước là $v_{tn}=15$ hải lí/h; tốc độ nước so với bờ là $v_{nb}$ (3 hải lí/h cùng chiều, 2 hải lí/h ngược chiều). Áp dụng công thức cộng vận tốc: $\\vec v_{tb}=\\vec v_{tn}+\\vec v_{nb}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Tàu chạy với tốc độ không đổi 15 hải lí/h so với nước, dòng nước đều nên vận tốc của tàu so với bờ không đổi, tàu chuyển động đều chứ không nhanh dần. Vậy ý a) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Nước chảy ngược chiều tàu: $v_{tb}=15-2=13$ hải lí/h, không phải 17 hải lí/h. Vậy ý b) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Nước chảy cùng chiều tàu: $v_{tb}=15+3=18$ hải lí/h. Vậy ý c) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Khi nước chảy ngược chiều, tàu chuyển động đều với $v_{tb}=15-2=13$ hải lí/h\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ tốc độ trung bình bằng 13 hải lí/h. Vậy ý d) \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Hiểu 15 hải lí/h là tốc độ của tàu so với nước."}, {"key": "c2-2-sa-060", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một người lái xuồng máy dự định mở máy cho xuồng chạy ngang con sông rộng 320 m, mũi xuồng luôn luôn vuông góc với bờ sông. Nhưng do nước chảy nên xuồng sang đến bờ bên kia tại một điểm cách bến dự định 240 m và mất 100 s. Xác định vận tốc của xuồng so với dòng sông.\u003c/p>", "options": null, "statements": null, "nguon": "4", "haiku": "3,2", "sonnet": "3,2", "goc": "Quãng đường thực tế mà xuồng đi được là $s = \\sqrt{240^{2} + 320^{2}} = 400 m.$\n\nVận tốc của xuồng so với dòng sông là$v = \\frac{s}{t} = \\frac{400}{100} = 4 m/s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Xuồng tham gia hai chuyển động: do máy (vuông góc bờ, so với nước) xt": "Vận tốc của ô tô đạt được khi chạy thêm 60 m là 6 m/s.", "answer": false}, {"text": "Khi ô tô chạy thêm 60 m mất 4,56 s.", "answer": true}], "nguon": [false, true, false, true], "haiku": [true, true, false, true], "sonnet": [true, true, false, true], "goc": "Chọn chiều dương là chiều chuyển động của ô tô, gốc tọa độ tại vị trí hãm phanh, gốc thời gian là lúc hãm phanh.\n\nTa có $\\left\\{ \\begin{array}{r}\n\\mathit{v}_{0}\\mathbf{=}\\frac{72}{3,6}\\mathbf{=}20\\ m/s \\\\\n\\mathit{v}_{1}\\mathbf{=}36\\ km/h\\mathbf{=}10\\ m/s\n\\end{array} \\right.\\$\n\na. Phát biểu này **sai**. Gia tốc của ô tô $v_{1}^{2}-v_{0}^{2}=2as\\Rightarrowa=\\frac{v_{1}^{2}-v_{0}^{2}}{2s}=\\frac{10^{2}-20^{2}}{2.50}= -3 m/s^{2}.$\n\nb. Phát biểu này **đúng**. Thời gian ô tô đi được 50 m là $t_{1}=\\frac{v_{1}-v_{0}}{a}=\\frac{10-20}{-3}=\\frac{10}{3} s.$\n\nc. Phát biểu này **sai**. Áp dụng công thức $v_{2}^{2}-v_{0}^{2}=2as\\Rightarrowv_{2}=\\sqrt{2as+v_{0}^{2}}=\\sqrt{2.\\left( -3 \\right).60+20^{2}}=2\\sqrt{10} m/s.$\n\nd. Phát biểu này **đúng**. Ta có $v_{2}=v_{0}+at_{2}\\Rightarrowt_{2}=\\frac{v_{2}-v_{0}}{a}=\\frac{2\\sqrt{10}-20}{-3}=4,56 s.$\n\n#### [Dạng 2 QUÃNG ĐƯỜNG VẬT ĐI TRONG GIÂY THỨ NVÀ TRONG N GIÂY CUỐI\n\n**I. PHƯƠNG PHÁP**\n\n\u003ctable style=\"width:98%;\">\n\u003ccolgroup>\n\u003ccol style=\"width: 97%\" />\n\u003c/colgroup>\n\u003cthead>\n\u003ctr>\n\u003cth style=\"text-align: left;\">\u003cp>\u003cstrong>1. Quãng đường vật đi trong giây thứ n\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Bước 1.\u003c/strong> Tính quãng đường vật đi trong n giây \u003cspan class=\"math inline\">$s_{n}=v_{0}n+\\frac{1}{2}an^{2}$\u003c/span>\u003c/p>\n\u003cp>\u003cstrong>Bước 2.\u003c/strong> Tính quãng đường vật đi trong (n – 1. giây\u003cspan class=\"math inline\">$s_{n-1}=v_{0}\\left( n-1 \\right)+\\frac{1}{2}a\\left( n-1 \\right)^{2}$\u003c/span>\u003c/p>\n\u003cp>\u003cstrong>Bước 3.\u003c/strong> Tính quãng đường vật đi trong giây thứ n \u003cspan class=\"math inline\">\u003cem>Δ\u003c/em>\u003cem>s\u003c/em>\u003cstrong>=\u003c/strong>\u003cem>s\u003c/em>\u003csub>\u003cem>n\u003c/em>\u003c/sub>\u003cstrong>−\u003c/strong>\u003cem>s\u003c/em>\u003csub>\u003cem>n\u003c/em>\u003cstrong>−\u003c/strong>1\u003c/sub>\u003c/span>\u003c/p>\n\u003cp>\u003cstrong>2. Quãng đường vật đi trong n giây cuối\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Bước 1.\u003c/strong> Tính quãng đường vật đi trong t giây \u003cspan class=\"math inline\">$s_{t}=v_{0}t+\\frac{1}{2}at^{2}$\u003c/span>\u003c/p>\n\u003cp>\u003cstrong>Bước 2.\u003c/strong> Tính quãng đường vật đi trong (t – n. giây \u003cspan class=\"math inline\">$s_{n}=v_{0}\\left( t-n \\right)+\\frac{1}{2}a\\left( t-n \\right)^{2}$\u003c/span>\u003c/p>\n\u003cp>\u003cstrong>Bước 3.\u003c/strong> Tính quãng đường vật đi trong n giây cuối\u003c/p>\n\u003cp>\u003cspan class=\"math inline\">$\\Deltas=s-s_{n}=v_{0}t+\\frac{1}{2}at^{2}-\\left\\lbrack v_{0}\\left( t-n \\right)+\\frac{1}{2}a\\left( t-n \\right)^{2} \\right\\rbrack=n\\left( v_{0}+at-\\frac{1}{2}an \\right)= -\\frac{1}{2}an^{2}$\u003c/span>\u003c/p>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003c/tbody>\n\u003c/table>", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đổi đơn vị: $v_0 = 72$ km/h $= 20$ m/s; $v_1 = 36$ km/h $= 10$ m/s. Chọn chiều dương là chiều chuyển động. Chuyển động thẳng chậm dần đều nên áp dụng $v^2 - v_0^2 = 2as$ và $v = v_0 + at$. Quãng đường 60 m được tính từ lúc bắt đầu hãm phanh.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $a = \\dfrac{v_1^2 - v_0^2}{2s_1} = \\dfrac{10^2-20^2}{2\\cdot 50}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a = -3$ m/s², tức độ lớn gia tốc là 3 m/s². Ý a) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $t_1 = \\dfrac{v_1 - v_0}{a} = \\dfrac{10-20}{-3}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t_1 = \\dfrac{10}{3}$ s. Ý b) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $v_2^2 = v_0^2 + 2as_2 = 400 - 2\\cdot 3\\cdot 60 = 40$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_2 \\approx 6{,}32$ m/s, khác 6 m/s. Ý c) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $t_2 = \\dfrac{v_2 - v_0}{a} = \\dfrac{6{,}32 - 20}{-3}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t_2 \\approx 4{,}56$ s. Ý d) Đúng.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Hiểu '60 m kể từ khi bắt đầu hãm phanh' là tổng quãng đường 60 m (nếu cộng thêm 50 m thì xe đã dừng, vô lí)."}, {"key": "c2-6-tf-090", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một xe đang chuyển động với vận tốc 7,2 km/h thì tăng tốc. Sau 4 s, xe đi thêm được 40 m. Cuối giây thứ 6, xe tắt máy, sau 13 s thì ngừng hẳn lại.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc chuyển động của xe khi tăng tốc 4 m/s$^{2}$.", "answer": true}, {"text": "Sau 6 giây thì vận tốc của xe là 20 m/s.", "answer": false}, {"text": "Sau khi xe tắt máy thì gia tốc của xe lúc này là 2 m/s.", "answer": false}, {"text": "Quãng đường xe đi được đến khi dừng hẳn là 169 m.", "answer": true}], "nguon": [true, false, false, true], "haiku": [true, false, true, false], "sonnet": [true, false, false, false], "goc": "Ta có v~o~ = 7,2 km/h = 2 m/s.\n\na. Phát biểu này **đúng**. Áp dụng công thức $s=v_{0}t+\\frac{1}{2}at^{2}\\Leftrightarrow40=2.4+\\frac{1}{2}a.4^{2}\\Rightarrowa=4 m/s^{2}.$\n\nb. Phát biểu này **sai**. Vận tốc của xe sau 6 s là $v=v_{0}+at=2+4.6=26 m/s.$\n\nc. Phát biểu này **sai**. Gia tốc của xe sau khi tắt máy $a'=\\frac{v'-v}{t'}=\\frac{0-26}{13}= -2 m/s^{2}.$\n\nd. Phát biểu này **đúng**. Quãng đường đi được cho đến khi dừng lại là $s'=2.13+\\frac{1}{2}.\\left( -2 \\right).13^{2}=169 m.$\n\n**[Dạng 3 PHƯƠNG TRÌNH CHUYỂN ĐỘNG THẲNG BIẾN ĐỔI ĐỀU**\n\n**1. Lập phương trình chuyển động**\n\n**Bước 1** Chọn hệ quy chiếu (nếu đề chưa chọn trước.\n\n\\- Chọn trục tọa độ Ox trùng với quỹ đạo chuyển động.\n\n\\- Gốc tọa độ O gắn với vị trí ban đầu vật 1 hoặc vật 2.\n\n\\- Chiều dương là chiều chuyển động của vật được chọn làm gốc.\n\n\\- Gốc thời gian (t = 0. là lúc vật 1 hoặc vật 2 bắt đầu chuyển động (thường chọn mốc thời gian gắn với vật xuất phát đầu tiên.\n\n**Bước 2** Biểu diễn vecto vận tốc và vecto gia tốc của từng vật trên hình vẽ\n\n\\- Vật chuyển động nhanh dần đều thì $\\overrightarrow{a}\\uparrow \\uparrow\\overrightarrow{v}.$ Vật chuyển động chậm dần đều thì $\\overrightarrow{a}\\uparrow \\downarrow\\overrightarrow{v}$\n\n**Bước 3** Từ hệ quy chiếu vừa chọn, xác định các thông số sau cho mỗi vật\n\n\\- Tọa độ đầu x~0~.\n\n\\- Vận tốc ban đầu v~0~ (bao gồm cả dấu).\n\n\\- Thời điểm đầu t~0~.\n\n**Bước 3** Thay các số liệu đã tìm được ở bước 2 vào phương trình tổng quát để thiết lập phương trình của chuyển động cho mỗi vật$\\left. \\ \\begin{matrix}\n\\mathit{x}_{1}\\mathbf{=}\\mathit{x}_{01}\\mathbf{+}\\mathit{v}_{01}.(\\mathit{t}\\mathbf{-}\\mathit{t}_{01})\\mathbf{+}\\frac{1}{2}.\\mathit{a}_{1}.(\\mathit{t}\\mathbf{-}\\mathit{t}_{01})^{2}\n\\end{matrix} \\right.\\$\n\n\\- Khi vật chuyển động theo chiều dương thì v \\> 0 và ngược lại v \\\u003c 0.\n\n\\- Vật ở phía dương của trục tọa độ x \\> 0, ở phía âm của trục tọa độ x \\\u003c 0.\n\n\\- Khi hai xe gặp nhau thì chúng có cùng tọa độ nên [x~1~ = x~2~\n\n\\- Khoảng cách giữa hai vật chuyển động cùng phương ![](media/c2-6/media/image432.wmf){width=\"0.7604166666666666in\" height=\"0.2604166666666667in\"}\n\n\\- Khoảng cách giữa hai vật chuyển động vuông góc nhau ![](media/c2-6/media/image433.wmf){width=\"0.84375in\" height=\"0.2916666666666667in\"}\n\n**2. Tìm vị trí và thời điểm 2 vật gặp nhau**\n\n**Bước 1** Lập phương trình chuyển động của mỗi vật.\n\n**Bước 2** Giải phương trình mối quan hệ khi gặp nhau [x~1~ = x~2~\n\nTùy vào từng bài toán mà kết luận về vị trí gặp nhau cho phù hợp yêu cầu của đầu bài", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đổi đơn vị: $v_0 = 7{,}2$ km/h $= 2$ m/s. Giai đoạn tăng tốc là chuyển động thẳng nhanh dần đều: $s = v_0 t + \\frac12 a t^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow 40 = 2\\cdot 4 + \\frac12 a \\cdot 4^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a = 4$ m/s².\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Gia tốc khi tăng tốc là 4 m/s². Ý này \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Vận tốc sau 6 s: $v = v_0 + at = 2 + 4\\cdot 6 = 26$ m/s, không phải 20 m/s. Ý này \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Sau khi tắt máy, xe dừng sau 13 s: $a' = \\dfrac{0 - 26}{13}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a' = -2$ m/s². Độ lớn gia tốc là 2 m/s², còn dấu âm cho biết gia tốc ngược chiều chuyển động. Đề viết \"2 m/s\" là sai đơn vị (phải là m/s²) và thiếu dấu âm. Ý này \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Quãng đường 6 s đầu: $s_1 = 2\\cdot 6 + \\frac12\\cdot 4\\cdot 6^2 = 84$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường từ lúc tắt máy đến khi dừng: $s_2 = \\dfrac{v^2 - 0}{2|a'|} = \\dfrac{26^2}{4} = 169$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s = s_1 + s_2 = 84 + 169 = 253$ m, không phải 169 m. Ý này \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý c) đề ghi đơn vị 'm/s' (thiếu mũ 2) và không có dấu âm nên coi là Sai; nếu hiểu là độ lớn 2 m/s² thì sẽ Đúng. Ý d) 169 m chỉ là quãng đường sau khi tắt máy; tổng là 253 m."}, {"key": "c2-6-tf-093", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Lúc $7 h,$ hai ô tô bắt đầu khởi hành từ hai điểm A, B cách nhau $2400 m,$ chuyển động nhanh dần đều và ngược chiều nhau. Ô tô đi từ A có gia tốc $1 m/s^{2},$ còn ô tô từ B có gia tốc $2 m/s ng-relaxed my-2\">Ô tô A: $x_A=0{,}5t^2$ (m). Ô tô B đi ngược chiều dương nên $a_B=-2$ m/s², do đó $x_B=2400-t^2$ (m).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) A xuất phát từ gốc tọa độ nên $x_A=0{,}5t^2$, không phải $2400+0{,}5t^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">⇒ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $x_B=2400-t^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">⇒ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) A đi được 300 m: $0{,}5t^2=300$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t^2=600$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s_B=t^2=600$ m $\\ne 1500$ m\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">⇒ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Gặp nhau khi $x_A=x_B$: $0{,}5t^2=2400-t^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t^2=1600$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t=40$ s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s_A=0{,}5\\cdot1600=800$ m $\\ne 1600$ m\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">⇒ Sai (1600 m là quãng đường của B).\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý a) đề ghi x_A = 2400 + 0,5t² là sai do A ở gốc tọa độ."}, {"key": "c2-6-tf-098", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Hai xe chuyển động ngược chiều nhau trên cùng một đường thẳng từ hai địa điểm A và B cách nhau 400 m. Lúc 6 giờ xe thứ nhất qua A với tốc độ $v_{1}$ = 20 m/s, ngay sau đó xe tắt máy chuyển động chậm dần đều với gia tốc 2 m/s$^{2}$. Cùng lúc đó xe thứ hai qua B chuyển động thẳng đều về phía A với tốc độ $v_{2}$ = 72 km/h. Chọn trục Ox trùng đường thẳng AB, gốc tọa độ tại A, chiều dương từ A đến B, gốc thời gian là lúc 6 giờ.\u003c/p>", "options": null, "statements": [{"text": "Sau 5 giây xe A đi được "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Trong $3 s$ cuối cùng trước khi chạm đất, vật rơi tự do được quãng đường $345 m.$ Lấy $ g=9,8 m/s^{2}.$\u003c/p>", "options": null, "statements": [{"text": "Thời gian vật rơi là 14 s.", "answer": true}, {"text": "Trong 10 giây đầu vật rơi được 490 m.", "answer": false}, {"text": "Trong giây thứ 10 vật rơi với quãng đường 100 m.", "answer": false}, {"text": "Thả vật với độ cao 857,66 m.", "answer": true}], "nguon": [true, false, false, true], "haiku": [false, true, false, false], "sonnet": [false, true, false, false], "goc": "a. Phát biểu này **đúng**. Ta có $\\Deltas=\\frac{1}{2}gt^{2}-\\frac{1}{2}g\\left( t-3 \\right)^{2}=\\frac{1}{2}gt^{2}-\\frac{1}{2}g\\left( t^{2}-6t+9 \\right)=345$ $\\Leftrightarrow\\Deltas=3gt-4,5g=345$ $\\Leftrightarrow345=29,4t-44,1\\Rightarrowt=13,23 s.$\n\nb. Phát biểu này **sai**. Trong 10 giây đầu vật rơi: $s=\\frac{1}{2}.9,8.10^{2}=490$ m.\n\nc. Phát biểu này **sai**. Trong giây thứ 10 vật rơi với quãng đường$\\Deltas_{10}=s_{10}-s_{9}=\\frac{1}{2}gt_{10}^{2}-\\frac{1}{2}gt_{9}^{2}=\\frac{1}{2}.9,8.10^{2}-\\frac{1}{2}.9,8.9^{2}=93,1$ m.\n\nd. Phát biểu này **đúng**. Độ cao của vật lúc thả là$s=\\frac{1}{2}gt^{2}=\\frac{1}{2}.9,8.13,23^{2}=857,66 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường vật rơi trong 3 s cuối: $s=\\frac12 g t^2-\\frac12 g (t-3)^2=\\frac12 g(6t-9)=345$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow 6t-9=\\dfrac{345}{4,9}\\approx 70,41$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t\\approx 13,23$ s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $t\\approx 13,23$ s, không phải 14 s. Kết luận: Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Quãng đường 10 s đầu: $s=\\frac12 g t^2=4,9\\cdot 10^2=490$ m. Kết luận: Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Giây thứ 10: $s=4,9\\cdot(10^2-9^2)=4,9\\cdot 19=93,1$ m, khô relaxed my-2\">c) Quãng đường 2 s cuối (từ giây 8 đến giây 10): $\\Delta s=s_{10}-s_8=500-320=180$ m. Vậy ý c) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Quãng đường trong giây thứ 8: $s_8-s_7=320-5\\cdot 7^2=320-245=75$ m $\\neq 80$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Ý d) \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-7-tf-094", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật rơi tự do không vận tốc đầu từ độ cao 80 m xuống đất. Lấy g = 10 m/s$^{2}$.\u003c/p>", "options": null, "statements": [{"text": "Thời gian vật rơi đến khi chạm đất là 8 s.", "answer": false}, {"text": "Đến khi chạm đất vật rơi với vận tốc 40 m/s.", "answer": true}, {"text": "Quãng đường vật rơi trong 2 s đầu tiên là 60 m.", "answer": true}, {"text": "Trong 2 giây cuối cùng vật đi được 60 m.", "answer": false}], "nguon": [false, true, true, false], "haiku": [false, true, false, true], "sonnet": [false, true, false, true], "goc": "a. Phát biểu này **sai**. Thời gian vật rơi đến khi chạm đất là $t=\\sqrt{\\frac{2h}{g}}=\\sqrt{\\frac{2.80}{10}}=4 s.$\n\nb. Phát biểu này **đúng**. Đến khi chạm đất vật rơi với vận tốc 40 m/s.\n\nc. Phát biểu này **đúng**. Quãng đường vật rơi trong 2 s đầu tiên là $s_{2}=\\frac{1}{2}gt_{2}^{2}=\\frac{1}{2}10.2^{2}=20 m.$\n\nd. Phát biểu này **sai**. Quãng đường vật rơi trong 2 s cuối cùng là$\\Deltas=h-s_{2}=80-20=60 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Rơi tự do không vận tốc đầu: $h=\\dfrac{1}{2}gt^2$, $v=gt$, chọn chiều dương hướng xuống, gốc tại vị trí thả.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $t=\\sqrt{\\dfrac{2h}{g}}=\\sqrt{\\dfrac{2\\cdot 80}{10}}=4$ s $\\neq$ 8 s. Ý a \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $v=gt=10\\cdot 4=40$ m/s. Ý b \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $s_2=\\dfrac{1}{2}\\cdot 10\\cdot 2^2=20$ m $\\neq$ 60 m. Ý c \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Quãng đường trong 2 s cuối: $\\Delta s=h-s_{(t-2)}$ với $t-2=2$ s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s_{(2)}=\\dfrac{1}{2}\\cdot 10\\cdot 2^2=20$ m\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow \\Delta s=80-20=60$ m. Ý d \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-7-tf-095", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật được thả rơi tự do không vận tốc đầu từ độ cao h so với mặt đất. Cho g = 10 m/s$^{2}$. Tốc độ của vật khi chạm đất là 30 m/s.\u003c/p>", "options": null, "statements": [{"text": "Thời gian vật rơi đến khi vật chạm mặt đất là 3 giây.", "answer": false}, {"text": "Độ cao của vật rơi được 60 m.", "answer": true}, {"text": "Quãng đường vật rơi trong 2 giây đầu tiên là 20 m.", "answer": true}, {"text": "Vật rơi được trong giây thứ 2 là 20 m.", "answer": false}], "nguon": [false, true, true, false], "haiku": [true, false, true, false], "sonnet": [true, false, true, false], "goc": "a. Phát biểu này **sai**. Thời gian vật rơi đến khi chạm đất là $t=\\frac{v}{g}=\\frac{30}{10}=3 s.$\n\nb. Phát biểu này **đúng**. Độ cao lúc vật bắt đầu rơi là $h=\\frac{v^{2}-v_{0}^{2}}{2g}=\\frac{30^{2}-0}{2g}=45 m.$\n\nc. Phát biểu này **đúng**. Quãng đường vật rơi trong 2s đầu tiên là $s_{2}=\\frac{1}{2}gt_{2}^{2}=\\frac{1}{2}10.2^{2}=20 m.$\n\nd. Phát biểu này **sai**. Quãng đường vật rơi trong giây thứ 2 là: $\\Deltas=s_{2}-s_{1}=20-5=15 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Rơi tự do không vận tốc đầu: chọn chiều dương hướng xuống, gốc tại vị trí thả, gốc thời gian lúc thả. Khi đó $v = gt$, $s = \\dfrac{1}{2}gt^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Khi chạm đất $v = 30$ m/s nên $t = \\dfrac{v}{g} = \\dfrac{30}{10} = 3$ s. Ý a) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $h = \\dfrac{v^2}{2g} = \\dfrac{30^2}{2\\cdot 10}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h = 45$ m, không phải 60 m. Ý b) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Quãng đường vật rơi trong 2 s đầu: $s_2 = \\dfrac{1}{2}\\cdot 10\\cdot 2^2 = 20$ m. Ý c) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Quãng đường vật rơi trong giây thứ 2 bằng $s_2 - s_1$ với $s_1 = \\dfrac{1}{2}\\cdot 10\\cdot 1^2 = 5$ m\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow \\Delta s = 20 - 5 = 15$ m, không phải 20 m. Ý d) \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-7-tf-096", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật được thả rơi tự do không vận tốc đầu từ độ cao$h$ so với mặt đất. Cho $g = 10 m/s^{2}.$ Thời gian vật rơi là $4$ giây.\u003c/p>", "options": null, "statements": [{"text": "Độ cao vật rơi so mặt đất là 80 m.", "answer": true}, {"text": "Khi vật chạm đất vật có vận tốc là 40 m/s.", "answer": true}, {"text": "Trong 3 giây đầu vật đi được 35 m.", "answer": true}, {"text": "Quãng đường vật rơi trong giây cuối cùng là 45 m.", "answer": true}], "nguon": [true, true, true, true], "haiku": [true, true, false, false], "sonnet": [true, true, false, false], "goc": "a. Phát biểu này **đúng**. Độ cao $h = \\frac{1}{2}gt^{2}=\\frac{1}{2}10.4^{2} = 80 m$\n\nb. Phát biểu này **đúng**. Tốc độ của vật khi vật chạm đất là $v = gt=10.4 = 40 m/s.$\n\nc. Phát biểu này **đúng**. Quãng đường vật rơi trong 3 giây đầu $s = \\frac{1}{2}gt^{2}=\\frac{1}{2}10.3^{2} = 45 m.$\n\nd. Phát biểu này **đúng**. Quãng đường vật rơi trong giây cuối cùng $s' = h - s = 80 - 45=35 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Vật rơi tự do không vận tốc đầu, chuyển động nhanh dần đều với gia tốc $g = 10\\ m/s^2$. Chọn chiều dương hướng xuống, gốc tại vị trí thả, $t=0$ lúc thả: $s = \\dfrac{1}{2}gt^2$, $v = gt$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $h = \\dfrac{1}{2}gt^2 = \\dfrac{1}{2}\\cdot 10\\cdot 4^2 = 80\\ m$. Vậy a) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $v = gt = 10\\cdot 4 = 40\\ m/s$. Vậy b) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Quãng đường trong 3 s đầu: $s_3 = \\dfrac{1}{2}\\cdot 10\\cdot 3^2 = 45\\ m \\neq 35\\ m$. Vậy c) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Quãng đường trong giây cuối: $\\Delta s = s_4 - s_3 = 80 - 45 = 35\\ m \\neq 45\\ m$. Vậy d) Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-7-tf-098", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật rơi tự do không vận tốc đầu tại nơi có gia tốc trọng trường $g.$ Trong giây thứ $3,$ quãng đường rơi được là $24,5 m$ và tốc độ của vật khi vừa chạm đất là $39,2 m/s.$\u003c/p>", "options": null, "statements": [{"text": "Gia tốc trọng trường trong trường hợp này là 10 m/s$^{2}$.", "answer": false}, {"text": "Quãng đường vật đi được trong 3 giây là 44,1 m.", "answer": true}, {"text": "Quãng đường vật đi được trong 2 giây là 24,5 m.", "answer": true}, {"text": "Vật được thả rơi tù độ cao 78,4 m.", "answer": true}], "nguon": [false, true, true, true], "haiku": [false, true, false, true], "sonnet": [false, true, false, true], "goc": "a. Phát biểu này **sai**. Theo đề bài ta có quãng đường đi được trong giây thứ 3 là $\\Delta s = 24,5 m$\n\nGọi$s_{1}$ là quãng đường đi được trong $3 giây$ $\\Rightarrows_{1} = \\frac{1}{2}gt_{1}^{2} = \\frac{1}{2}g3^{2} = 4,5g (1)$\n\nGọi$s_{2}$ là quãng đường đi được trong $2 giây$$\\Rightarrows_{2} = \\frac{1}{2}gt_{2}^{2} = \\frac{1}{2}g.2^{2} = 2g (2)$\n\nTa có phương trình$s_{1} - s_{2} = \\Delta s$$\\Leftrightarrow4,5g-2g=24,5\\Leftrightarrow2,5g=24,5\\Rightarrowg = 9,8 m/s^{2}.$\n\nb. Phát biểu này **đúng**. Quãng đường đi được trong $3 giây$ $\\Rightarrows_{1} = 4,5g =4,5.9,8=44,1$ m.\n\nc. Phát biểu này **đúng**. Quãng đường đi được trong $2 giây$$\\Rightarrows_{2} = 2.9,8 = 19,6$ m.\n\nd. Phát biểu này **đúng**. Áp dụng công thức $v^{2} = 2gh \\Rightarrow h = \\frac{v^{2}}{2g} = \\frac{39,2^{2}}{2.9,8} = 78,4 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Vật rơi tự do không vận tốc đầu: $s=\\frac{1}{2}gt^2$, $v=gt$. Quãng đường trong giây thứ 3 là hiệu quãng đường sau 3 s và sau 2 s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Delta s=\\frac{1}{2}g(3^2-2^2)=2,5g=24,5$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow g=9,8\\ m/s^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Sai, vì $g=9,8\\ m/s^2$ chứ không phải $10\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $s_3=\\frac{1}{2}\\cdot 9,8\\cdot 3^2=44,1$ m. Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $s_2=\\frac{1}{2}\\cdot 9,8\\cdot 2^2=19,6$ m $\\neq 24,5$ m. Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Thời gian rơi: $t=\\frac{v}{g}=\\frac{39,2}{9,8}=4$ s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h=\\frac{1}{2}gt^2=\\frac{1}{2}\\cdot 9,8\\cdot 4^2=78,4$ m. Đúng.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý d) trong đề viết 'tù' đã sửa thành 'từ'."}, {"key": "c2-7-sa-121", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật rơi tự do đi được $10 m$ cuối cùng của quãng đường trong khoảng thời gian $0,25 s.$ Cho $ g=9,8 m/s^{2}.$ Vận tốc của vật ngay trước khi chạm đất là bao nhiêu m/s? (kết quả làm tròn đến phần nguyên).\u003c/p>", "options": null, "statements": null, "nguon": "42", "haiku": "41", "sonnet": "41", "goc": "Ta có $\\left\\{ \\begin{array}{r}\n\\mathit{v}_{\\mathit{d}}^{2}\\mathbf{-}\\mathit{v}_{\\mathit{h}}^{2}\\mathbf{=}2\\mathit{gh\\ \\ \\ }(1) \\\\\n\\mathit{v}_{\\mathit{d}}\\mathbf{=}\\mathit{v}_{\\mathit{h}}\\mathbf{+}\\mathit{gt\\ \\ \\ \\ \\ \\ }(2)\n\\end{array} \\right.\\ \\mathbf{\\Rightarrow}\\left( \\mathit{v}_{\\mathit{h}}\\mathbf{+}\\mathit{gt} \\right)^{2}\\mathbf{-}\\mathit{v}_{\\mathit{h}}^{2}\\mathbf{=}2\\mathit{gh}\\mathbf{\\Rightarrow}\\left( \\mathit{v}_{\\mathit{h}}\\mathbf{+}9,8.0,25 \\right)^{2}\\mathbf{-}\\mathit{v}_{\\mathit{h}}^{2}\\mathbf{=}2.10.10\\mathbf{\\Rightarrow}\\mathit{v}_{\\mathit{h}}\\mathbf{=}39,59\\mathit{\\ }m/s$\nThế $v_{h}=39,59 m/s$ vào $(2)\\Rightarrowv_{d}=v_{h}+gt=39,59+9,8.0,25\\approx42 m/s.$\n![A black background with a black square Description automatically generated with medium confidence](media/c2-7/media/image742.png){width=\"0.96333552055993in\" height=\"1.745003280839895in\"}", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Rơi tự do (không vận tốc đầu), chọn chiều dương hướng xuống. Gọi $v$ là vận tốc ngay trước khi chạm đất, $t=0,25$ s, $s=10$ m là quãng đường đi được trong $t$ giây cuối.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Xét chuyển động nhanh dần đều của đoạn cuối, tính theo vận tốc cuối $v$: $s = vt - \\dfrac{1}{2}gt^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v = \\dfrac{s}{t} + \\dfrac{gt}{2}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v = \\dfrac{10}{0,25} + \\dfrac{9,8\\cdot 0,25}{2} = 41,225$ m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: $v \\approx 41$ m/s.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-8-tf-060", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Từ độ cao h = 20 m, một vật được ném ngang với vận tốc ban đầu $v$$_{0}$ = 5 m/s. Chọn hệ trục toạ độ $ Oxy$ như hình vẽ. Lấy g = 10 m/s$^{2}$.\u003c/p>", "options": null, "statements": [{"text": "Phương trình chuyển theo phương Ox và Oy lần lượt là: x = 5t và y = 5t$^{2}$.", "answer": true}, {"text": "Vận tốc của vật lúc chạm đất là 10$\\sqrt{2}$ m/s.", "answer": false}, {"text": "Phương trình quỹ đạo của vật có y = x$^{2}$.", "answer": true}, {"text": "Tại độ cao h’ = 10 m vật có vận tốc theo phương thẳng đứng là v = 15 m/s.", "answer": false}], "nguon": [true, false, true, false], "haiku": [true, false, false, false], "sonnet": [true, false, false, false], "goc": "a. Phát biểu này **đúng**.\n\nPhương trình chuyển động theo phương Ox là $x = v_{0}t = 5t$\n\nPhương trình chuyển động theo phương Oy là $y = \\frac{1}{2}gt^{2}$\n\nb. Phát biểu này **sai**. Khoảng thời gian t vật chạm đất, với $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2.20}{10}} = 2 s.$\n\nVận tốc của vật lúc chạm đất là $v = \\sqrt{\\left( v_{0}t \\right)^{2} + (gt)^{2}} = \\sqrt{(5.2)^{2} + (10.2)^{2}} = 22,36 m/s.$\n\nc. Phát biểu này **đúng**. Phương trình quĩ đạo của vật là$y = \\frac{g}{2v_{0}}x^{2}=\\frac{10}{2.5}x^{2}=x^{2}$\nd. Phát biểu này **sai**.\nThời gian vật chuyển động đến vị trí có độ cao 10 m là $t_{1} = \\sqrt{\\frac{2.h_{1}}{g}} = \\sqrt{\\frac{2.(20 - 10)}{10}} = \\sqrt{2} = 1,41 s.$\nVận tốc của vật theo phương Oy là $y = \\frac{1}{2}gt_{1}^{2} = \\frac{1}{2}10.2 = 10 m/s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Giả định (đề thiếu hình): gốc O tại vị trí ném, Ox nằm ngang theo hướng ném, Oy hướng thẳng đứng xuống. Chuyển động ném ngang gồm chuyển động thẳng đều theo Ox và rơi tự do theo Oy.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $x=v_0t=5t$; $y=\\frac{1}{2}gt^2=5t^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Thời gian rơi: $t=\\sqrt{2h/g}=2$ s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_y=gt=20$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v=\\sqrt{v_0^2+v_y^2}=\\sqrt{425}\\approx 20{,}6$ m/s $\\neq 10\\sqrt{2}$ m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Từ $t=x/5$ thay vào $y=5t^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow y=\\frac{x^2}{5}$, không phải $y=x^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Ở độ cao 10 m, vật đã rơi được 10 m: $v_y=\\sqrt{2g\\cdot 10}=\\sqrt{200}\\approx 14{,}1$ m/s $\\neq 15$ m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề thiếu hình vẽ; giả định gốc O tại vị trí ném, Oy hướng xuống (phù hợp với phương trình y = 5t² ở ý a)."}, {"key": "c2-8-tf-061", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật được ném ngang từ độ cao 20 m, có tầm ném xa 6 m. Cho g = 10 m/s$^{2}$. Tính:\u003c/p>", "options": null, "statements": [{"text": "Thời gian chuyển động của vật là 1,5 s.", "answer": false}, {"text": "Vận tốc ban đầu của vật là 2m/s.", "answer": false}, {"text": "Vận tốc của vật khi chạm đất là 20,88 m/s.", "answer": true}, {"text": "Phương trình quỹ đạo của vật có dạng y = $\\frac{5}{9}$ x$^{2}$.", "answer": true}], "nguon": [false, false, true, true], "haiku": [false, false, false, true], "sonnet": [false, false, false, true], "goc": "a. Phát biểu này **sai**. Thời gian chuyển động của vật $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2.20}{10}} = 2 s.$\nb. Phát biểu này **sai**. Vận tốc ban đầu $v_{0} = \\frac{L}{t} = \\frac{6}{2} = 3 m/s.$\nc. Phát biểu này **đúng**. Vận tốc của vật khi chạm đất $v = \\sqrt{(v_{0}.t)^{2} + (g.t)^{2}} = \\sqrt{(3.2)^{2} + (10.2)^{2}} = 20,88 m/s.$\nd. Phát biểu này **đúng.**\nPhương trình chuyển động theo phương Ox là x = $v_{0}$ t = 3t.\nPhương trình chuyển động theo phương Oy là y = $\\frac{1}{2}$ gt^2^ = 5t^2^ .\nPhương trình quỹ đạo y = 1/2 gt^2^ = 1/2 .10. (x/3)^2^ = 5/9.x^2^.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn gốc tọa độ tại vị trí ném, Ox nằm ngang theo $\\vec v_0$, Oy thẳng đứng hướng xuống. Chuyển động ném ngang là tổng hợp của chuyển động thẳng đều theo Ox và rơi tự do theo Oy.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Thời gian chuyển động: $t=\\sqrt{\\dfrac{2h}{g}}=\\sqrt{\\dfrac{2\\cdot 20}{10}}=2$ s, không phải 1,5 s. Vậy ý a \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Tầm ném xa: $L=v_0t$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_0=\\dfrac{L}{t}=\\dfrac{6}{2}=3$ m/s, không phải 2 m/s. Vậy ý b \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Khi chạm đất: $v_y=gt=10\\cdot 2=20$ m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v=\\sqrt{v_0^2+v_y^2}=\\sqrt{3^2+20^2}=\\sqrt{409}\\approx 20{,}22$ m/s, không phải 20,88 m/s. Vậy ý c \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Từ $x=v_0t$ và $y=\\dfrac{1}{2}gt^2$ suy ra $y=\\dfrac{g}{2v_0^2}x^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow y=\\dfrac{10}{2\\cdot 9}x^2=\\dfrac{5}{9}x^2$. Vậy ý d \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c2-8-tf-064", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Từ đỉnh một ngọn tháp cao 80m, một quả cầu được ném theo phương ngang với vận tốc ban đầu 20m/s.\u003c/p>", "options": null, "statements": [{"text": "Sau khi ném 2s vật có tọa độ tại A (40;20) .", "answer": true}, {"text": "Quỹ đạo của vật này là 1 đường parabol.", "answer": false}, {"text": "Sau 2,3 giây thì vật chạm đất.", "answer": false}, {"text": "Vận tốc của nó khi chạm đất là $20\\sqrt{5}$ m/s.", "answer": true}], "nguon": [true, false, false, true], "haiku": [false, true, false, true], "sonnet": [true, true, false, true], "goc": "a. Phát biểu này **đúng**. Phương trình tọa độ $\\left\\{ \\begin{array}{r}\n\\mathit{x}\\mathbf{=}\\mathit{v}_{0}\\mathit{t} \\\\\n\\mathit{y}\\mathbf{=}\\frac{1}{2}\\mathit{g}\\mathit{t}^{2}\n\\end{array} \\right.\\$\n\nSau khi ném 2 s thì tọa độ của vật là $\\left\\{ \\begin{array}{r}\n\\mathit{x}\\mathbf{=}\\mathit{v}_{0}\\mathit{t}\\mathbf{=}20.2\\mathbf{=}40\\mathit{\\ \\ }m. \\\\\n\\mathit{y}\\mathbf{=}\\frac{1}{2}\\mathit{g}.\\mathit{t}^{2}\\mathbf{=}\\frac{1}{2}10.2^{2}\\mathbf{=}20\\mathit{\\ \\ }m.\n\\end{array} \\right.\\$\n\nb. Phát biểu này **sai**. Phương trình quỹ đạo của quả cầu $y=\\frac{1}{2}\\frac{g}{v_{0}^{2}}.x^{2}=\\frac{1}{2}.\\frac{10}{20^{2}}.x^{2}=\\frac{x^{2}}{80}$\n\nQuỹ đạo này là một nửa đường parabol\n\nc. Phát biểu này **sai**. Thời gian chuyển động ném ngang $t=\\sqrt{\\frac{2h}{g}}=\\sqrt{\\frac{2.80}{10}}=4 (s)$\n\nd. Phát biểu này **đúng**. Phương trình vận tốc $\\left\\{ \\begin{array}{r}\n\\mathit{v}_{\\mathit{x}}\\mathbf{=}\\mathit{v}_{0} \\\\\n\\mathit{v}_{\\mathit{y}}\\mathbf{=}\\mathit{gt}\n\\end{array} \\right.\\$\n\nKhi quả bóng chạm đất $\\left\\{ \\begin{array}{r}\n\\mathit{v}_{\\mathit{x}}\\mathbf{=}\\mathit{v}_{0}\\mathbf{=}20 \\\\\n\\mathit{v}_{\\mathit{y}}\\mathbf{=}\\mathit{gt}\\mathbf{=}10.4\\mathbf{=}40\n\\end{array} \\right.\\ \\mathbf{\\Leftrightarrow}\\mathit{v}\\mathbf{=}\\sqrt{\\mathit{v}_{\\mathit{x}}^{2}\\mathbf{+}\\mathit{v}_{\\mathit{y}}^{2}}\\mathbf{=}\\sqrt{20^{2}\\mathbf{+}40^{2}}\\mathbf{=}20\\sqrt{5}\\mathit{\\ \\ }m/s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn gốc tại đỉnh tháp, Ox nằm ngang theo hướng ném, Oy thẳng đứng hướng xuống, $g=10$ m/s². Khi đó $x=v_0t=20t$ và $y=\\dfrac{1}{2}gt^2=5t^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Tại $t=2$ s: $x=40$ m, $y=5\\cdot 4=20$ m, tức tọa độ (40; 20). Vậy a) Đúng.\u003c/p>\u003cp clas
