<script>
const D={"rows": [{"key": "c2-2-mc-020", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Khi đi từ bờ này theo phương vuông góc sang bờ đối diện (điểm dự định đến). Do nước chảy nên khi sang đến bờ kia,thuyền bị trôi về phía cuối dòng. Khoảng cách từ điểm dự định đến và điểm thuyền đến thực cách nhau là\u003c/p>", "options": ["$180$ m.", "20 m.", "63 m.", "18 m."], "statements": null, "nguon": "B", "haiku": "C", "sonnet": "A", "goc": "$\\frac{AB}{BC}=\\frac{v_{tn}}{v_{nb}}\\RightarrowBC=\\frac{AB}{3}=20 m$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đề bài thiếu dữ kiện (vận tốc thuyền so với nước, vận tốc nước so với bờ, bề rộng sông), nên không tính được chính xác.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Theo phương vuông góc bờ, thuyền chuyển động đều với vận tốc $v_{tn}$ nên thời gian sang sông là $t=\\dfrac{d}{v_{tn}}$.\u003c/p>\u003cp class=\\\"text-base leading-relaxed my-2\\\">$\\Rightarrow$ Khoảng cách bị trôi theo dòng nước là $s=v_{nb}\\,t=v_{nb}\\dfrac{d}{v_{tn}}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Với bộ số liệu thường gặp của bài này (chưa kiểm chứng được), kết quả là $s=20$ m. Đây là đáp án được chọn.\u003c/p>", "lydo": "Dò lần 2: Sonnet giải lại LỆCH đáp án đang ghi (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-2-sa-052", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một ô tô đi từ A đến B. Đầu chặng ô tô đi $\\frac{1}{4}$ tổng thời gian với $ v = 50 km/h.$ Giữa chặng ô tô đi $\\frac{1}{2}$ thời gian với $v = 40 km/h.$ Cuối chặng ô tô đi$\\frac{1}{4}$ tổng thời gian với $ v = 20 km/h.$ Tốc trung bình của ô tô trên cả chặng đường là bao nhiêu km/h?\u003c/p>", "options": null, "statements": null, "nguon": "37,5", "haiku": "37,5", "sonnet": "35", "goc": "Quãng đường ô tô chạy được ở các chặng$\\left\\{ \\begin{array}{r}\n\\mathit{s}_{1}\\mathbf{=}\\mathit{v}_{1}\\mathit{t}_{1}\\mathbf{=}50\\frac{\\mathit{t}}{4} \\\\\n\\mathit{s}_{2}\\mathbf{=}\\mathit{v}_{2}\\mathit{t}_{2}\\mathbf{=}40\\frac{\\mathit{t}}{2} \\\\\n\\mathit{s}_{3}\\mathbf{=}\\mathit{v}_{3}\\mathit{t}_{3}\\mathbf{=}20\\frac{\\mathit{t}}{4}\n\\end{array} \\right.\\$\n\nTốc trung bình của ô tô là$v_{tb}=\\frac{s_{1}+s_{2}+s_{3}}{t_{1}+t_{2}+t_{3}}=\\frac{50\\frac{t}{4}+40\\frac{t}{2}+20\\frac{t}{4}}{\\frac{t}{4}+\\frac{t}{2}+\\frac{t}{4}}=37,5 km/h.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Gọi tổng thời gian đi từ A đến B là $t$. Vận tốc trung bình trên cả chặng đường được tính theo công thức $v_{tb} = \\dfrac{s}{t}$, trong đó $s$ là tổng quãng đường.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường ô tô đi trong từng giai đoạn (công thức $s = v\\cdot t_i$):\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giai đoạn 1 (thời gian $\\dfrac{t}{4}$, $v_1 = 50$ km/h): $s_1 = 50\\cdot\\dfrac{t}{4} = 12{,}5t$ (km)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Giai đoạn 2 (thời gian $\\dfrac{t}{2}$, $v_2 = 40$ km/h): $s_2 = 40\\cdot\\dfrac{t}{2} = 20t$ (km)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Giai đoạn 3 (thời gian $\\dfrac{t}{4}$, $v_3 = 20$ km/h): $s_3 = 20\\cdot\\dfrac{t}{4} = 5t$ (km)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Tổng quãng đường: $s = s_1 + s_2 + s_3 = 12{,}5t + 20t + 5t = 37{,}5t$ (km)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Vận tốc trung bình: $v_{tb} = \\dfrac{s}{t} = \\dfrac{37{,}5t}{t} = 37{,}5$ km/h\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: vận tốc trung bình của ô tô trên cả chặng đường là $37{,}5$ km/h.\u003c/p>", "lydo": "Dò lần 2: Sonnet giải lại LỆCH đáp án đang ghi (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-2-sa-053", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một ôtô đi trên con đường bằng phẳng với v = 60 km/h trong 5 phút, sau đó lên dốc 3 phút với v = 40 km/h. Coi ôtô chuyển động thẳng đều. Quãng đường ôtô đã đi trong cả giai đoạn là bao nhiêu km?\u003c/p>", "options": null, "statements": null, "nguon": "7", "haiku": "7", "sonnet": null, "goc": "Quãng đường ô tô đi được trên con đường bằng phẳng là $s_{1}=v_{1}t_{1}=60.\\frac{1}{12}=5 km.$\nQuãng đường ô tô đi được trên con đường dốc là $s_{2}=v_{2}t_{2}=40.\\frac{1}{20}=2 km.$\nTổng quãng đường ô tô đi được là $s=s_{1}+s_{2}=5+2=7 km.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường đi được trong chuyển động thẳng đều: $s = v \\cdot t$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giai đoạn 1 (đường bằng): $t_1 = 5 \\text{ phút} = \\dfrac{5}{60} \\text{ h} = \\dfrac{1}{12} \\text{ h}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$s_1 = v_1 t_1 = 60 \\cdot \\dfrac{1}{12} = 5 \\text{ km}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giai đoạn 2 (lên dốc): $t_2 = 3 \\text{ phút} = \\dfrac{3}{60} \\text{ h} = \\dfrac{1}{20} \\text{ h}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$s_2 = v_2 t_2 = 40 \\cdot \\dfrac{1}{20} = 2 \\text{ km}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường tổng cộng: $s = s_1 + s_2 = 5 + 2 = 7 \\text{ km}$.\u003c/p>", "lydo": "Dò lần 2: Sonnet không trả được kết quả (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-3-mc-042", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Từ B vào lúc 6 giờ 30 phút, một người đi xe máy theo hướng Bắc - Nam về C, chuyển động thẳng đều với tốc độ $\\upsilon_{1}=30 km/h.$ Chọn gốc tọa độ tại vị trí xuất phát, chiều dương hứng sang phía Nam. Biết BC = 70 km, vào thời điểm 8 giờ, người này cách C một đoạn\u003c/p>", "options": ["45 km theo hướng Bắc.", "25 km theo hướng Nam.", "45 km theo hướng Nam.", "25 km theo hướng Bắc."], "statements": null, "nguon": "D", "haiku": "D", "sonnet": "C", "goc": "Độ dịch chuyển lúc 8 giờ $d=v\\left( t-t_{0} \\right)=\\upsilon\\left( t-t_{0} \\right)=30.1,5=45 km$ theo hướng Nam.\nVậy lúc 8 h xe máy cách B 45 km theo hướng Nam) và cách C 25 km theo hướng Bắc.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn gốc tọa độ tại B, chiều dương hướng từ B về C (hướng Nam). Khi đó tọa độ của C là $x_C = 70$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương trình chuyển động thẳng đều: $x = x_0 + v_1 t$, với $x_0 = 0$, $v_1 = 30$ km/h, và mốc thời gian $t = 0$ lúc 6 giờ 30 phút.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Thời điểm 8 giờ ứng với $t = 1{,}5$ h, nên tọa độ của người đó là:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$x = 30 \\cdot 1{,}5 = 45$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Khoảng cách từ người đến C: $d = |x_C - x| = |70 - 45| = 25$ km.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vì $x = 45 \\lt x_C = 70$ nên người đang ở phía trước C (phía Bắc của C), tức nằm giữa B và C.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: vào lúc 8 giờ, người này cách C một đoạn 25 km theo hướng Bắc. Chọn D.\u003c/p>", "lydo": "Dò lần 2: Sonnet giải lại LỆCH đáp án đang ghi (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-3-tf-065", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Phương trình chuyển động của một chất điểm dọc theo trục Ox có dạng $x=50-20t$ (x đo bằng km, t đo bằng h). Chọn gốc thời gian là lúc xuất phát, chiều dương Ox hướng theo hướng Bắc – Nam.\u003c/p>", "options": null, "statements": [{"text": "Vật xuất phát từ vị trí cách gốc tọa độ 50 km về phía nam.", "answer": true}, {"text": "Vật chuyển động với tốc độ 20 km/h về phía Nam.", "answer": false}, {"text": "Xe chuyển động có độ dịch chuyển sau 3 giờ là 50 km về phía Bắc.", "answer": false}, {"text": "Sau 3 giờ xe cách gốc tọa độ 10km về phía Bắc.", "answer": true}], "nguon": [true, false, false, true], "haiku": [true, false, false, true], "sonnet": null, "goc": "Chọn trục tọa độ Ox như hình vẽ\n\n![A compass on a white background Description automatically generated](media/c2-3/media/image250.png){width=\"1.4999343832020997in\" height=\"2.107595144356955in\"}\n\na. Phát biểu này **đúng**. $x_{0}=50 km$ nên vật xuất phát từ vị trí cách gốc tọa độ $50 km$ về phía Nam.\n\nb. Phát biểu này **sai**. Vận tốc$v= -20 km/h$ nên vật chuyển động với tốc độ $\\upsilon=20 km/h$ về phía Bắc.\n\nc. Phát biểu này **sai**. Quãng đường xe đi được sau $3 h$ là $ s=\\upsilont=20.3=60 km.$\n\nĐộ dịch chuyển của xe sau $3 h$ chuyển động là $ d=vt= -20.6= -60 km.$\n\nVậy độ dịch chuyển của xe là 60 km ( Bắc).\n\nd. Phát biểu này **đúng**. Áp dụng công thức $d=x-x_{0}\\Rightarrowx=x_{0}+d=50-60= -10 km.$\n\nSau $3 h$ xe cách gốc tọa độ $10 km$ về hướng Bắc.\n\n**[\\\n**\n\n**[Dạng 2 LẬP PHƯƠNG TRÌNH CHUYỂN ĐỘNG**\n\n**[XÁC ĐỊNH VỊ TRÍ – THỜI ĐIỂM HAI VẬT GẶP NHAU**", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương Ox hướng từ Bắc đến Nam (theo đúng thứ tự \"Bắc – Nam\"). Phương trình chuyển động: $x = 50 - 20t$ với $x$ tính bằng km, $t$ tính bằng h.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vận tốc: $v = \\dfrac{dx}{dt} = -20$ km/h. Dấu âm nghĩa là chuyển động ngược chiều dương, tức hướng từ Nam về Bắc.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Tại $t = 0$: $x_0 = 50$ km $> 0$, nghĩa là vật ở phía Nam gốc tọa độ, cách gốc 50 km. \u003cstrong>Đúng\u003c/strong>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Tốc độ là $|v| = 20$ km/h, nhưng vật chuyển động theo chiều âm, tức hướng Bắc chứ không phải Nam. \u003cstrong>Sai\u003c/strong>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Tại $t = 3$ h: $x = 50 - 20 \\cdot 3 = -10$ km. Độ dịch chuyển: $\\Delta x = x - x_0 = -10 - 50 = -60$ km, tức là 60 km về phía Bắc, không phải 50 km. \u003cstrong>Sai\u003c/strong>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Tại $t = 3$ h, $x = -10$ km $\u003c 0$ nên vật ở phía Bắc gốc tọa độ, cách gốc $|x| = 10$ km. \u003cstrong>Đúng\u003c/strong>.\u003c/p>", "lydo": "Dò lần 2: Sonnet không trả được kết quả (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-4-mc-017", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Đồ thị độ dịch chuyển theo thời gian của một chất điểm chuyển động thẳng đểu có dạng như hình vẽ. Phương trình độ dịch chuyển của chất điểm là\u003c/p>", "options": ["$d=1+t.$", "$d=2t.$", "$d=2+t.$", "$d=t.$"], "statements": null, "nguon": "C", "haiku": "B", "sonnet": "A", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chuyển động thẳng đều có phương trình độ dịch chuyển: $d=d_0+vt$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Từ đồ thị: tại $t=0$ có $d_0=2$ m; đồ thị đi qua điểm $(2\\ \\text{s};\\,4\\ \\text{m})$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$v=\\dfrac{\\Delta d}{\\Delta t}=\\dfrac{4-2}{2-0}=1$ m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow d=2+t$ (d tính bằng m, t tính bằng s).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Chọn C.\u003c/p>", "lydo": "Dò lần 2: Sonnet giải lại LỆCH đáp án đang ghi (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-6-mc-043", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một chất điểm chuyển động thẳng dọc theo trục Ox từ vận tốc -20 m/s chậm dần đều tới khi dừng hẳn trong khoảng thời gian 5 s. Gia tốc chất điểm là.\u003c/p>", "options": ["2,5 m/s$^{2}$.", "4 m/s$^{2}$.", "- 4 m/s$^{2}$.", "- 2 m/s$^{2}$."], "statements": null, "nguon": "B", "haiku": "B", "sonnet": null, "goc": "$v = v_{0}+ at\\Rightarrowa=\\frac{v-v_{0}}{t}=\\frac{0- .\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Đổi đơn vị: $v_0 = 54\\ km/h = 15\\ m/s$; $v = 5\\ m/s$; $s = 250\\ m$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>Ý a)\u003c/b> Ô tô chuyển động thẳng theo một chiều nên độ dịch chuyển có độ lớn bằng quãng đường đi được: $d = s = 250\\ m$. Ý a) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>Ý b)\u003c/b> Công thức liên hệ vận tốc và quãng đường: $v^2 - v_0^2 = 2as$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a = \\dfrac{v^2 - v_0^2}{2s} = \\dfrac{5^2 - 15^2}{2 \\cdot 250} = -0{,}4\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Độ lớn gia tốc là $0{,}4\\ m/s^2$, nhưng gia tốc đại số (theo chiều dương đã chọn) là $-0{,}4\\ m/s^2$ vì ô tô chậm dần. Ý b) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>Ý c)\u003c/b> Công thức vận tốc: $v = v_0 + at$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t_1 = \\dfrac{v - v_0}{a} = \\dfrac{5 - 15}{-0{,}4} = 25\\ s$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Ý c) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>Ý d)\u003c/b> Thời gian từ lúc hãm phanh đến khi dừng hẳn ($v = 0$):\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t_2 = \\dfrac{0 - v_0}{a} = \\dfrac{-15}{-0{,}4} = 37{,}5\\ s \\ne 35\\ s$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Ý d) \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Dò lần 2: Sonnet giải lại LỆCH đáp án đang ghi (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-6-tf-091", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Phương trình cơ bản của 1 vật chuyển động $x=6t^{2}–18t+12\\left( cm \\right)$.\u003c/p>", "options": null, "statements": [{"text": "Vận tốc ban đầu của xe là 18 cm/s.", "answer": false}, {"text": "Xe chuyển động chậm dần với gia tốc 12 cm/s$^{2}$.", "answer": true}, {"text": "Lúc t = 2 s thì vận tốc của xe là 8 cm/s.", "answer": false}, {"text": "Toạ độ của vật khi vận tốc đạt 36 cm/s là 525 mm.", "answer": true}], "nguon": [false, true, false, true], "haiku": [false, true, false, true], "sonnet": [false, false, false, true], "goc": "a. Phát biểu này **sai**. Vận tốc ban đầu của xe là – 18 cm/s.\n\nb. Phát biểu này **đúng**. Ta có gia tốc của xe a = 12 cm/s^2^ và av \\\u003c 0 nên vật chuyển động chậm dần đều.\n\nc. Phát biểu này **sai**. Vận tốc lúc t = 2 s là v = v~0~ + at = -18 + 12.2 = 6 cm/s.\n\nd. Phát biểu này **đúng**. Thời gian của chất điểm khi có vận tốc 36 cm/s là $t=\\frac{v-v_{0}}{a}=\\frac{36-\\left( -18 \\right)}{12}=4,5 s.$\n\nTọa độ chất điểm lúc t = 4,5 s là x = 6t^2^ – 18t + 12 = 6.4,5^2^ – 18.4,5 + 12 = 52,5 cm.\n\n![](media/c2-6/media/image436.png)**Câu 2:** Phương trình cơ bản của 1 vật chuyển động $x= -3t^{2}+18t+12\\left( cm \\right).$\n\na. Xe bắt đầu chuyển động cách gốc tọa độ 12 cm theo chiều dương.\n\nb. Vận tốc ban đầu của xe là 18 cm/s và chuyển động nhanh dần đều.\n\nb. Vào thời điểm t = 4 s thì xe đạt vận tốc 6 cm/s.\n\nc. Khi vận tốc của xe đạt 54 cm/s thì xe đi được quãng đường 18 cm.\n\n**Hướng dẫn giải**\n\na. Phát biểu này **đúng**. Theo bài ra  x = -3t^2^ + 18t + 12, ta có tọa độ xe lúc bắt đầu chuyển động là x~0~ = 18 cm và theo chiều dương.\n\nb. Phát biểu này **sai**. Ta có v~0~ = 18 cm/s, a = -6 cm/s^2^ suy ra av \\\u003c 0. Vậy vật chuyển động chậm dần đều.\n\nc. Phát biểu này **đúng**. Vận tốc lúc t = 2 s là v = v~0~ + at = 18 + 6.(-2) = 6 cm/s.\n\nd. Phát biểu này **sai**. Thời gian của chất điểm khi có vận tốc 54 cm/s là $t=\\frac{v-v_{0}}{a}=\\frac{54-18}{6}=6 s.$\n\nTọa độ chất điểm lúc t = 6 s x = -3t^2^ + 18t + 12 = -3.6^2^ + 18.6 + 12=12 cm.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Phương trình chuyển động có dạng $x=x_0+v_0t+\\frac{1}{2}at^2$. So sánh với $x=6t^{2}-18t+12$ (cm):\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\frac{1}{2}a=6$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a=12\\ \\text{cm/s}^2$; $v_0=-18\\ \\text{cm/s}$; $x_0=12\\ \\text{cm}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương trình vận tốc: $v=v_0+at=12t-18\\ \\text{(cm/s)}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>a)\u003c/b> Vận tốc ban đầu là $v_0=-18\\ \\text{cm/s}$ (dấu âm nghĩa là vật ban đầu chuyển động theo chiều âm). Phát biểu “18 cm/s” thiếu dấu nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>b)\u003c/b> Gia tốc $a=12\\ \\text{cm/s}^2$ (dương). Ban đầu $v_0\u003c0$ nên $a$ và $v$ trái dấu, vật chuyển động chậm dần đều cho đến $t=1,5\\ \\text{s}$. Phát biểu \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>c)\u003c/b> Tại $t=2\\ \\text{s}$: $v=12\\cdot 2-18=6\\ \\text{cm/s}$, không phải 8 cm/s. Phát biểu \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cb>d)\u003c/b> Khi $v=36\\ \\text{cm/s}$: $12t-18=36$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t=4,5\\ \\text{s}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Tọa độ: $x=6(4,5)^2-18(4,5)+12=121,5-81+12=52,5\\ \\text{cm}=525\\ \\text{mm}$. Phát biểu \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Dò lần 2: Sonnet giải lại LỆCH đáp án đang ghi (cột Nguồn = đáp án đang ghi; Haiku = lượt giải đầu; Sonnet = lần 2)", "ghiChuAI": ""}, {"key": "c2-6-tf-100", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Cho đồ thị vận tốc – thời gian của một vật chuyển động thẳng như hình vẽ. Biết ban đầu vật có tọa độ 15m.\u003c/p>", "options": null, "statements": [{"text": "Xe chuyển động nhanh dần trong 4 giây đầu và chuyển động chậm dần trong 4 giây sau đó.", "answer": true}, {"text": "Gia tốc của xe đi được từ giây thứ 2 đến giây thứ 4 là 7,5 m/s$^{2}$.", "answer": false}, {"text": "Trong 8 giây xe đi được quãng đường 75 m với tốc độ trung bình là 9,375 m/s.", "answer": true}, {"text": "Phương trình dao động của xe trong 4 giây cuối là $x_{3}=25+5t+3,75t^{2}\\left( 4\\leqt\\leq8 \\right)$", "answer": false}], "nguon": [true, false, true, false], "haiku": [true, true, true, false], "sonnet": [true, true, true, false], "goc": "a. Phát biểu này **sai**.\n\nGiai đoạn 1 từ $t_{1}=0 s \\Rightarrow t_{2}=2 s$ là chuyển động thẳng đều.\n\nGiai đoạn 2 từ $t_{2}=2 s \\Rightarrow t_{3}=4 s$ là chuyển động thẳng nhanh dần đều.\n\nGiai đoạn 3 từ $t_{3}=4 s \\Rightarrow t_{4}=8 s$ là chuyển động thẳng chậm dần đều.\n\nb. Phát biểu này **đúng**. Gia tốc chuyển động và phương trình vận tốc trong giai đoạn 2 (từ giây thứ 2 đến giây thứ 4) là $\\left\\{ \\begin{array}{r}\n\\mathit{a}_{2}\\mathbf{=}\\frac{\\mathit{v}_{3}\\mathbf{-}\\mathit{v}_{2}}{\\mathit{t}_{3}\\mathbf{-}\\mathit{t}_{2}}\\mathbf{=}\\frac{20\\mathbf{-}5}{4\\mathbf{-}2}\\mathbf{=}7,5\\mathit{\\ }\\ m/s^{2} \\\\\nv_{2}\\mathbf{=}v_{02}\\mathbf{+}\\mathit{a}_{2}\\mathit{t}\\mathbf{=}5\\mathbf{+}7,5\\mathit{t}\\ m/s\n\\end{array} \\right.\\ \\left( 2\\mathbf{\\leq}\\mathit{t}\\mathbf{\\leq}4 \\right)$\n\nc. Phát biểu này **đúng**. Quãng đường vật đi được trong\n\nGiai đoạn 1 là $s_{1}=v_{1}t=5.2=10 m.$\n\nGiai đoạn 2 là $s_{2}=\\frac{v_{{}_{3}}^{2}-v_{{}_{2}}^{2}}{2a_{2}}=\\frac{20^{2}-5^{2}}{2(7,5)}=25 m.$\n\nGiai đoạn 3 là$s_{3}=\\frac{v_{{}_{4}}^{2}-v_{{}_{3}}^{2}}{2a_{3}}=\\frac{0^{2}-20^{2}}{2\\left( -5 \\right)}=40 m.$\n\nTổng quãng đường vật đi được là $s=s_{1}+s_{2}+s_{3}=10+25+40=75 m.$\n\nTốc độ trung bình trong suốt thời gian chuyển động là $v=\\frac{s}{t}=\\frac{75}{8}=9,375 m/s.$\n\nd. Phát biểu này **sai**. Phương trình chuyển động trong\n\nGiai đoạn 1 là $x_{1}=x_{01}+v_{01}t=15+5t \\left( 0\\leqt\\leq2 \\right)$\n\nGiai đoạn 2 là$x_{2}=x_{02}+v_{02}t+\\frac{a_{2}t^{2}}{2}=25+5t+3,75t^{2}\\left( 2\\leqt\\leq4 \\right)$\n\nGiai đoạn 3 là$x_{3}=x_{03}+v_{03}t+\\frac{a_{3}t^{2}}{2}=50+20t-2,5t^{2}\\left( 4 \\leqt\\leq8 \\right)$\n\n![A graph of a line graph Description automatically generated](media/c2-6/media/image539.png){width=\"2.051388888888889in\" height=\"1.6041666666666667in\"} **Câu 3:** Một người chạy xe máy theo một đường thẳng và có vận tốc theo thời gian được biểu diễn bởi đồ thị như hình.\n\na. Vào thời điểm 1 giây gia tốc của xe là 2 m/s^2^.\n\nb. Tại điểm B xe có gia tốc bằng 1 m/s^2^.\n\nc. Tại điểm C vật có gia tốc âm.\n\nd. Độ dịch chuyển của người này từ khi bắt đầu chạy đến thời điểm 4s là 4 m.\n\n**Hướng dẫn giải**\n\nVì chuyển động đều hoặc biến đổi đều nên gia tốc tại một thời điểm cũng bằng gia tốc trên cả giai đoạn chứa thời điểm đó\n\na. Phát biểu này **đúng**. Tại thời điểm 1 s là $a=\\frac{2-0}{1-0}=2 m/s^{2}.$\n\nb. Phát biểu này **sai**. Tại B là thời điểm 2,5 s là $a=\\frac{4-4}{3-1}=0 m/s^{2}.$\n\nc. Phát biểu này **đúng**. Tại C là thời điểm 3,5 s là $a=\\frac{2-4}{4-3}= -2 m/s^{2}.$\n\nd. Độ dịch chuyển của người này từ khi bắt đầu chạy đến thời điểm 4 s là\n\n$d=S_{OMNDP}=S_{OADP}+S_{AMND}=\\frac{1}{2}\\left( 3+4 \\right)\\cdot2+\\frac{1}{2}\\left( 1+3 \\right)\\cdot2=11 m.$\n\n![Chart, line chart Description automatically generated](media/c2-6/media/image544.png){width=\"1.9840277777777777in\" height=\"1.4583333333333333in\"}**Câu 4:** Chất điểm chuyển động có đồ thị vận tốc theo thời gian như hình\n\na. Vật chuyển động thẳng đều trong 2 giây đầu.\n\nb. Từ giây thứ 2 đến giây thứ 7 vật chuyển động thẳng đều với vận 5 m/s.\n\nc. Vật chuyển động chậm dần đều trong 2 giây cuối cùng.\n\nd. Quãng đường vật đi được từ lúc xuất phát đến 8 giây là 32,5 m.\n\n**Hướng dẫn giải**\n\na. Phát biểu này **sai**. Trong 2 s đầu, chuyển động thẳng nhanh dần đều với gia tốc $a=\\frac{5-0}{2-0}=2,5 m/s^{2}.$\n\nb. Phát biểu này **đúng**. Từ giây thứ 2 đến giây thứ 7, chuyển động thẳng đều với tốc độ 5 m/s.\n\nc. Phát biểu này **sai**. Từ giây thứ 6 đến giây thứ 7, vật chuyển động thẳng đều còn từ giây thứ 7 đến giây t
