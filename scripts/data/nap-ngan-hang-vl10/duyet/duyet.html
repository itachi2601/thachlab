<script>
const D={"rows": [{"key": "c3-4-mc-022", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Phát biểu nào sau đây là \u003cstrong>sai\u003c/strong> khi nói về định luật III Newton?\u003c/p>", "options": ["Định luật III Newton cho biết mối liên hệ về gia tốc khi các vật tương tác nhau.", "Nội dung định luật III Newton là \"Những lực tương tác giữa hai vật là hai lực cân bằng, nghĩa là cùng độ lớn, cùng giá nhưng ngược chiều \".", "Nội dung định luật III Newton là \"Những lực tương tác giữa hai vật là hai lực trực đối, nghĩa là cùng độ lớn, cùng giá nhưng ngược chiều \".", "Định luật III Newton thể hiện mối quan hệ giữa lực tác dụng và phản lực."], "statements": null, "nguon": "C", "haiku": "A", "sonnet": "B", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Định luật III Newton: khi vật A tác dụng lên vật B một lực thì vật B cũng tác dụng lại vật A một lực. Hai lực này cùng giá, cùng độ lớn, ngược chiều và đặt lên hai vật khác nhau, gọi là hai lực trực đối.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương án A: từ $\\vec{F}_{AB}=-\\vec{F}_{BA}$ suy ra $m_A a_A = m_B a_B$ (về độ lớn), nên định luật cho biết mối liên hệ về gia tốc của các vật tương tác. Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương án B: hai lực tương tác đặt vào hai vật khác nhau nên không thể triệt tiêu nhau, do đó không phải hai lực cân bằng (hai lực cân bằng cùng đặt lên một vật). Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương án C: phát biểu đúng nội dung định luật (hai lực trực đối). Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương án D: định luật mô tả quan hệ giữa lực tác dụng và phản lực. Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy phát biểu sai là B.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-4-tf-092", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một xe khối lượng 1 tấn đang chạy với tốc độ $36 km/h$ thì hãm phanh (thắng lại). Biết lực hãm là $250 N.$ Tính quãng đường xe còn chạy thêm được đến khi dừng hẳn.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của xe là $0,25 m/s^{2}.$", "answer": false}, {"text": "Vận tốc của xe khi dừng hẳn là 10 m/s.", "answer": false}, {"text": "Quãng đường xe đi thêm được đến khi dừng hẳn là 200 m.", "answer": true}, {"text": "Thời gian xe đi thêm được đến khi dừng hẳn là 50 giây.", "answer": false}], "nguon": [false, false, true, false], "haiku": [true, false, true, false], "sonnet": [true, false, true, false], "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đổi đơn vị: $v_0 = 36$ km/h $= 10$ m/s; $m = 1$ tấn $= 1000$ kg. Chọn chiều dương là chiều chuyển động, lực hãm ngược chiều chuyển động nên xe chuyển động chậm dần đều.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Độ lớn gia tốc: $a = \\dfrac{F_h}{m} = \\dfrac{250}{1000} = 0{,}25$ m/s². Gia tốc có độ lớn $0{,}25$ m/s² (chiều ngược chiều chuyển động). Ý này \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Khi dừng hẳn thì $v = 0$, không phải 10 m/s. Ý này \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Từ $v^2 - v_0^2 = 2as$ với $v = 0$ và $a = -0{,}25$ m/s²:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s = \\dfrac{-v_0^2}{2a} = \\dfrac{-100}{2\\cdot(-0{,}25)} = 200$ m. Ý này \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Từ $v = v_0 + at$ với $v = 0$:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t = \\dfrac{-v_0}{a} = \\dfrac{-10}{-0{,}25} = 40$ s, không phải 50 s. Ý này \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-4-tf-094", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một ô tô khối lượng 2 tấn đang chạy với vận tốc $v_{0}$ thì hãm phanh, xe đi thêm được quãng đường $15 m$ trong $3 s$ thì dừng hẳn.\u003c/p>", "options": null, "statements": [{"text": "Vận tốc ban đầu của ô tô là 10 m/s.", "answer": true}, {"text": "Khi ô tô dừng hẳn vận tốc của ô tô là 0 m/s.", "answer": true}, {"text": "Gia tốc của ô tô có giá trị là $\\frac{10}{3} m/s^{2}.$", "answer": false}, {"text": "Lực hãm gây ra cho ô tô là 667 N.", "answer": false}], "nguon": [true, true, false, false], "haiku": [true, true, true, false], "sonnet": [true, true, true, false], "goc": "Chọn chiều dương của trục Ox là chiều chuyển động của vật.\n\nTheo đề ta có $\\left\\{ \\begin{array}{r}\n\\mathit{s}\\mathbf{=}\\mathit{v}_{0}\\mathit{t}\\mathbf{+}\\frac{1}{2}\\mathit{a}\\mathit{t}^{2} \\\\\n\\mathit{v}\\mathbf{=}\\mathit{v}_{0}\\mathbf{+}\\mathit{at}\n\\end{array} \\right.\\ \\mathbf{\\Leftrightarrow}\\left\\{ \\begin{array}{r}\n15\\mathbf{=}\\mathit{v}_{0}3\\mathbf{+}\\frac{1}{2}\\mathit{a}.3^{2} \\\\\n0\\mathbf{=}\\mathit{v}_{0}\\mathbf{+}\\mathit{a}3\n\\end{array} \\right.\\ \\mathbf{\\Leftrightarrow}\\left\\{ \\begin{array}{r}\n\\mathit{v}_{0}\\mathbf{=}10\\ m/s \\\\\n\\mathit{a}\\mathbf{= -}\\frac{10}{3}\\ m/s^{2}\n\\end{array} \\right.\\$\n\nVậy vận tốc ban đầu $v_{}$\n\nLực gây ra gia tốc cho ô tô là lực hãm.\n\nTheo định luật II Newton độ lớn lực hãm là $F_{h}=ma=2000.\\frac{10}{3}\\approx6667 N.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Ô tô chuyển động thẳng chậm dần đều đến khi dừng: $v=0$, $s=15$ m, $t=3$ s, $m=2000$ kg.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$s=\\dfrac{v_0+v}{2}t=\\dfrac{v_0}{2}\\cdot 3=15$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_0=10$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Vận tốc ban đầu là 10 m/s: \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Khi dừng hẳn thì $v=0$ m/s: \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $a=\\dfrac{v-v_0}{t}=\\dfrac{0-10}{3}=-\\dfrac{10}{3}$ m/s².\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Độ lớn gia tốc là $\\dfrac{10}{3}$ m/s² (gia tốc ngược chiều chuyển động): \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $F=m|a|=2000\\cdot\\dfrac{10}{3}\\approx 6667$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Lực hãm khác 667 N: \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý c) hiểu 'giá trị' là độ lớn gia tốc (10/3 m/s²); nếu hiểu theo giá trị đại số (-10/3) thì ý c sai."}, {"key": "c3-4-tf-098", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một ô - tô có khối lượng 3 tấn, chuyển động trên đường thẳng nằm ngang. Sau khi khởi hành 10 s đi được quãng đường 25 m. Bỏ qua ma sát.\u003c/p>", "options": null, "statements": [{"text": "Lực phát động của động cơ xe có giá trị là 15000 N.", "answer": false}, {"text": "Quãng đường xe đi được sau 20 s là $100 m.$", "answer": false}, {"text": "Gia tốc của xe khi khởi hành 10 m đạt vận tốc $10 m/s$ là$4 m/s^{2}.$", "answer": true}, {"text": "Muốn sau khi khởi hành 10 m đạt vận tốc $10 m/s$ thì lực phát động của động cơ phải tăng đến giá trị là 15000 N.", "answer": true}], "nguon": [false, false, true, true], "haiku": [false, true, false, true], "sonnet": [false, true, false, true], "goc": "a. Gia tốc chuyển động của ô tô là $s=\\frac{1}{2}at^{2}\\Rightarrowa = \\frac{2s}{t^{2}}=\\frac{2.25}{10^{2}}=0,5 m/s^{2}$ (vì vận tốc ban đầu bằng không).\n\n\\+ Trong quá trình chuyển động vật chịu tác dụng của 3 lực trọng lực $\\overrightarrow{P},$ phản lực $\\overrightarrow{N}$ và lực phát động $\\overrightarrow{F}.$\n\n\\+ Áp dụng định luật II Newton ta có $\\overrightarrow{P} + \\overrightarrow{N} + \\overrightarrow{F}=m\\overrightarrow{a} \\left( \\ast \\right)$\n\n\\+ Chiếu biểu thức $\\left( \\ast \\right)$ lên phương chuyển động, chiều dương trùng chiều chuyển động của ô tô ta được$ F=ma=3000.0,5=1500 N.$\n\nb. Vận tốc xe đi được sau 20 s là $v=v_{0}+at=0+0,5.20=10 m/s.$\n\nQuãng đường xe đi được sau 20 s là $s=v_{0}t+\\frac{1}{2}at^{2}=0+\\frac{1}{2}0,5.20^{2}=100 m.$\n\nc. Gia tốc của xe khi khởi hành 10 m đạt vận tốc $10 m/s$ là$ v^{2}-v_{0}^{2}=2a's\\Rightarrowa'=\\frac{v^{2}-v_{0}^{2}}{2s}=5 m/s^{2}.$\n\nd. Muốn sau khi khởi hành 10 m đạt vận tốc $10 m/s$ thì lực phát động của động cơ phải tăng đến giá trị là $F'=ma'=3000.5=15000 N.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Xe khởi hành từ trạng thái nghỉ, chuyển động thẳng nhanh dần đều: $s=\\frac{1}{2}at^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a=\\dfrac{2s}{t^2}=\\dfrac{2\\cdot 25}{10^2}=0,5\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Bỏ qua ma sát nên $F=ma=3000\\cdot 0,5=1500$ N, không phải 15000 N. Ý a) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $s=\\frac{1}{2}\\cdot 0,5\\cdot 20^2=100$ m. Ý b) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Từ $v^2=2as$ (với $s=10$ m, $v=10$ m/s):\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a=\\dfrac{v^2}{2s}=\\dfrac{100}{20}=5\\ m/s^2$, không phải $4\\ m/s^2$. Ý c) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $F=ma=3000\\cdot 5=15000$ N. Ý d) Đúng.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề c), d) có lẽ thiếu chữ: hiểu là 'sau khi khởi hành đi được 10 m thì đạt vận tốc 10 m/s'."}, {"key": "c3-4-tf-099", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một ô - tô khối lượng 2 tấn đang chuyển động trên đường thẳng nằm ngang với vận tốc 72 km/h thì hãm phanh. Sau khi hãm phanh, ô - tô chạy thêm 50 m nữa thì dừng hẳn lại. Bỏ qua các lực bên ngoài.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc chuyển động của ô tô có giá trị là $4 m/s^{2}.$", "answer": false}, {"text": "Lực hãm phanh có giá trị là 8000 N.", "answer": false}, {"text": "Gia tốc ô tô đi được 20 m rồi dừng lại là$-1 m/s^{2}.$", "answer": true}, {"text": "Lực hãm cần để ô tô đi được 20 m sau khoảng thời gian 10 s có giá trị là$-2000 N.$", "answer": true}], "nguon": [false, false, true, true], "haiku": [true, true, false, false], "sonnet": [false, true, false, false], "goc": "a. Gia tốc chuyển động của ô tô là $v^{2}-v_{0}^{2}=2as\\Rightarrowa=\\frac{v^{2}-v_{0}^{2}}{2s}=\\frac{0-20^{2}}{2.50}= -4 m/s^{2}.$\n\nb Trong quá trình chuyển động vật chịu tác dụng của 3 lực trọng lực $\\overrightarrow{P},$ phản lực $\\overrightarrow{N}$ và lực phát động $\\overrightarrow{F}.$\n\n\\+ Áp dụng định luật II Newton ta có $\\overrightarrow{P} + \\overrightarrow{N} + {\\overrightarrow{F}}_{h}=m\\overrightarrow{a} (\\ast)$\n\n\\+ Chiếu biểu thức $(\\ast)$ lên phương chuyển động, chiều dương trùng chiều chuyển động của ô tô $ F_{h}=ma=2000\\left( -4 \\right)= -8000 N.$\n\nVậy dấu âm thể hiện lực hãm phanh ngược chiều chuyển động và có độ lớn là 8000 N.\n\nc. Gia tốc ô tô đi được 20 m rồi dừng lại là$v^{2}-v_{0}^{2}=2a's\\Rightarrowa'=\\frac{v^{2}-v_{0}^{2}}{2s}=\\frac{0-20^{2}}{2.20}= -1 m/s^{2}.$\n\nd. Lực hãm cần để ô tô đi được 20 m sau khoảng thời gian 10 s là$F'_{h}=ma'=2000.(-1)= -2000 N.$\n\nVậy dấu âm thể hiện lực hãm phanh ngược chiều chuyển động và có độ lớn là 2000 N.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đổi: $m = 2000$ kg, $v_0 = 72$ km/h $= 20$ m/s. Chọn chiều dương là chiều chuyển động; ô tô chuyển động thẳng chậm dần đều dưới tác dụng của lực hãm.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $a = \\dfrac{v^2 - v_0^2}{2s} = \\dfrac{0 - 20^2}{2\\cdot 50} = -4\\ \\text{m/s}^2$ (độ lớn 4 nhưng giá trị đại số là $-4$)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $F = ma = 2000\\cdot(-4) = -8000$ N, độ lớn lực hãm là 8000 N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $a = \\dfrac{0 - 20^2}{2\\cdot 20} = -10\\ \\text{m/s}^2 \\ne -1\\ \\text{m/s}^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Dừng lại sau 20 m trong 10 s thì $s = \\dfrac{v_0}{2}t$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_0 = 4$ m/s, mâu thuẫn với $v_0 = 20$ m/s. Nếu lấy $v_0 = 4$ m/s thì $a = -0{,}4\\ \\text{m/s}^2$, $F = -800$ N, khác $-2000$ N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý a) coi là Sai vì gia tốc có giá trị đại số -4 m/s² (chậm dần), đề ghi +4. Ý d) đề dữ kiện 20 m và 10 s không nhất quán với v0 = 20 m/s; theo mọi cách hiểu đều không cho -2000 N nên chọn Sai."}, {"key": "c3-4-tf-100", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một xe có khối lượng 5 kg chuyển động trên đường thẳng nằm ngang bởi lực kéo F = 20N có phương nằm ngang trong 5 s. Sau đó lực kéo không tác dụng nữa nên xe chuyển động chậm dần đều và dừng hẳn lại. Biết lực cản tác dụng vào xe luôn bằng 15 N.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của xe có lực kéo là 20 N là $4 m/s^{2}.$", "answer": true}, {"text": "Vận tốc xe sau 5 s là $30 m/s.$", "answer": false}, {"text": "Độ lớn gia tốc của xe có lực cản 15 N là$3 m/s^{2}.$", "answer": true}, {"text": "Quãng đường xe đi được từ lúc khởi hành cho đến khi dừng hẳn là $106,6 m.$", "answer": false}], "nguon": [true, false, true, false], "haiku": [false, false, true, false], "sonnet": [false, false, true, false], "goc": "Chọn chiều dương là chiều chuyển động của xe.\n\na. Gia tốc của xe có lực kéo là 20 N là $a_{1}=\\frac{F_{1}}{m}=\\frac{20}{5}=4 m/s^{2}.$\n\nb. Vận tốc xe sau 5 s là $v=at=4.5 = 20 m/s.$\n\nc. Độ lớn gia tốc của xe có lực cản 15 N là$a_{2}=\\frac{F_{2}}{m}=\\frac{15}{5} = 3 m/s^{2}.$\n\nd. Quãng đường xe đi được trong 5 s đầu là $s_{1}=\\frac{at^{2}}{2}=\\frac{4.5^{2}}{2} = 50 m.$\n\nQuãng đường xe đi được đến khi dừng lại là $s_{2}=\\frac{v_{2}^{2}-v_{02}^{2}}{2a_{2}}=\\frac{0^{2}-20_{2}^{}}{2\\left( -3 \\right)} = 66,67m.$\n\nQuãng đường xe đi được từ lúc khởi hành cho đến khi dừng hẳn là $s=s_{2}+s_{2}=50+66,67 = 116,6 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Giả sử xe bắt đầu chuyển động từ trạng thái nghỉ ($v_0 = 0$). Chọn chiều dương là chiều chuyển động. Áp dụng định luật II Newton cho từng giai đoạn.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giai đoạn có lực kéo: $a_1 = \\dfrac{F - F_c}{m} = \\dfrac{20 - 15}{5} = 1\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Gia tốc khi có lực kéo là $1\\ m/s^2$ chứ không phải $4\\ m/s^2$ (không được bỏ qua lực cản) nên ý a) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $v = a_1 t = 1 \\cdot 5 = 5\\ m/s$, không phải $30\\ m/s$ nên ý b) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Khi không còn lực kéo: $a_2 = \\dfrac{F_c}{m} = \\dfrac{15}{5} = 3\\ m/s^2$ nên ý c) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Quãng đường giai đoạn 1: $s_1 = \\dfrac{1}{2}a_1t^2 = \\dfrac{1}{2}\\cdot 1\\cdot 5^2 = 12{,}5$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường giai đoạn 2: $s_2 = \\dfrac{v^2}{2a_2} = \\dfrac{5^2}{2\\cdot 3} \\approx 4{,}17$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s = s_1 + s_2 \\approx 16{,}67$ m, khác $106{,}6$ m nên ý d) Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề không nêu vận tốc ban đầu nên giả sử xe xuất phát từ trạng thái nghỉ (từ 'khởi hành'). Theo cách giải này, ý d) có đáp số khoảng 16,67 m nên ý d) Sai."}, {"key": "c3-4-sa-108", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật có khối lượng 250 gam bắt đàu chuyển động nhanh dần đều, nó đi được 1,2 m trong 4 s. Sau quãng đường ấy lực kéo phải bằng bao nhiêu để vật có thể chuyển động thẳng đều?\u003c/p>", "options": null, "statements": null, "nguon": "0,04", "haiku": "0", "sonnet": "0", "goc": "\\+ Để vật chuyển động thẳng đều thì $a = 0 m/s^{2}.$\n\n\\+ Theo định luật II Newton ta có $\\overrightarrow{F}+{\\overrightarrow{F}}_{c}=m\\overrightarrow{a}\\RightarrowF=F_{C}=0,04 N.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chuyển động nhanh dần đều không vận tốc đầu: $s=\\frac{1}{2}at^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a=\\frac{2s}{t^2}=\\frac{2\\cdot 1,2}{4^2}=0,15\\ \\text{m/s}^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Hợp lực lúc đầu: $F_{hl}=ma=0,25\\cdot 0,15=0,0375\\ \\text{N}$ (đây là lực kéo nếu bỏ qua ma sát).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Để vật chuyển động thẳng đều thì hợp lực tác dụng lên vật phải bằng 0 (định luật I Newton): $\\vec F_{kéo}+\\vec F_{cản}=\\vec 0$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Bỏ qua lực cản (đề không cho ma sát) thì $F_{kéo}=0$: vật chuyển động thẳng đều theo quán tính với vận tốc $v=at=0,6$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: lực kéo cần thiết bằng $0$ N.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề không cho lực cản/ma sát nên giả thiết bỏ qua ma sát; khi đó lực kéo để chuyển động thẳng đều bằng 0. Nếu đề gốc muốn hỏi lực gây ra gia tốc thì đáp số là 0,0375 N."}, {"key": "c3-5-mc-011", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật đặt trên bàn nằm ngang. Các lực tác dụng vào vật và vào bàn được xác định như hình vẽ dưới\u003cstrong>.\u003c/strong> Cặp lực và phản lực của trọng lực ${\\overrightarrow{P}}_{1}$ của vật là  \u003ctable>  \u003ccolgroup>  \u003ccol style=\"width: 50%\" />  \u003ccol style=\"width: 49%\" />  \u003c/colgroup>  \u003cthead>  \u003ctr>  \u003cth style=\"text-align: center;\">\u003cp>\u003cimg src=\"media/image13.png\" style=\"width:2.39471in;height:1.53043in\" alt=\"A diagram of a diagram Description automatically generated\" />\u003c/p>  \u003cp>Các lực tác dụng vào vật\u003c/p>\u003c/th>  \u003cth style=\"text-align: center;\">\u003cp>\u003cimg src=\"media/image14.png\" style=\"width:2.21609in;height:1.54167in\" alt=\"A diagram of a rectangular object with arrows and lines Description automatically generated\" />\u003c/p>  \u003cp>Các lực tác dụng vào bàn\u003c/p>\u003c/th>  \u003c/tr>  \u003c/thead>  \u003ctbody>  \u003c/tbody>  \u003c/table>\u003c/p>", "options": ["phản lực ${\\overrightarrow{N}}_{1}$ của mặt bàn.", "phản lực $\\overrightarrow{N_{2}}$ của mặt đất ($N_{2}$ = $ P_{1}$+$ P_{2}$).", "lực nén $\\overrightarrow{F}$ của vật lên bàn (F =$ P_{1}$ =$ N_{1}$).", "Trọng lực của bàn và phản lực của mặt đất."], "statements": null, "nguon": "A", "haiku": "C", "sonnet": "C", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Theo định luật III Newton, lực và phản lực có cùng bản chất, cùng độ lớn, cùng phương, ngược chiều và đặt vào hai vật khác nhau.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Trọng lực $\\overrightarrow{P}_1$ là lực Trái Đất hút vật. Phản lực của nó là lực vật hút Trái Đất, có cùng bản chất (lực hấp dẫn).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Các phương án:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A. Sai. $\\overrightarrow{N}_1$ cùng đặt vào vật với $\\overrightarrow{P}_1$, nên chúng không phải cặp lực và phản lực. Hai lực này chỉ cân bằng nhau.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B. Sai. $\\overrightarrow{N_2}$ là lực của mặt đất tác dụng lên bàn.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">C. Lực nén $\\overrightarrow{F}$ của vật lên bàn có độ lớn $F=P_1=N_1$. Lực này là phản lực của $\\overrightarrow{N}_1$, không phải của $\\overrightarrow{P}_1$. Tuy nhiên, trong hình, đây là lực duy nhất của vật đặt vào bàn bằng độ lớn $P_1$. Đề muốn chọn phương án này theo cách hiểu của đề.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D. Sai. Trọng lực của bàn và phản lực của mặt đất không liên quan đến $\\overrightarrow{P}_1$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Chọn C (đáp án theo cách hiểu của đề).\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Về mặt chặt chẽ, phản lực thật sự của P1 là lực vật hút Trái Đất, không có trong các phương án. Trong bốn phương án, C là đáp án gần đúng nhất theo ý đề (phương án A và B, D đều sai rõ ràng). Cần đối chiếu lại đáp án gốc."}, {"key": "c3-5-tf-034", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Cho viên bi A chuyển động tới va chạm vào bi B đang đứng yên, $v_{A}$ = 4 m/s sau va chạm bi A tiếp tục chuyển động theo phương cũ với v = 3 m/s, thời gian xảy ra va chạm là 0,4 s. Biết $m_{A}$ = 200 gam, $m_{B}$ = 100 gam.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của viên bi A là $2,5 m/s^{2}.$", "answer": false}, {"text": "Lực tác dụng của viên bi A vào viên bi B là 0,5 N.", "answer": true}, {"text": "Gia tốc của viên bi B sau va chạm là $5 m/s^{2}.$", "answer": true}, {"text": "Vận tốc của viên bi B sau va chạm là $4 m/s.$", "answer": false}], "nguon": [false, true, true, false], "haiku": [true, true, true, false], "sonnet": [true, true, true, false], "goc": "a. Ta có $a_{A}=\\frac{v-v_{0}}{\\Deltat}=\\frac{3-4}{0,4}= -2,5 m/s^{2}.$\n\nb. Lực tác dụng của bi A vào bi B là $F_{AB}= -m_{1}a_{1}= -0,2.(-2,5)=0,5 N.$\n\nc. Theo định luật III Newton $\\overrightarrow{F_{AB}}= -\\overrightarrow{F_{BA}}$$\\Rightarrowa_{B}= -\\frac{m_{A}a_{A}}{m_{B}}= -\\frac{0,2.\\left( -2,5 \\right)}{0,1}=5 m/s^{2}.$\n\nd. Vận tốc của bi B sau va chạm $v_{2}=v_{02}+a_{2}.t=0+5.0,2=1 m/s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương là chiều chuyển động ban đầu của bi A. Trong thời gian va chạm, hệ hai bi coi là kín nên động lượng bảo toàn: $m_A v_A = m_A v_A' + m_B v_B'$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow 0,2\\cdot 4 = 0,2\\cdot 3 + 0,1\\cdot v_B'$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_B' = 2$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $a_A = \\dfrac{3-4}{0,4} = -2,5$ m/s², độ lớn 2,5 m/s²\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $F = m_A |a_A| = 0,2\\cdot 2,5 = 0,5$ N. Theo định luật III Newton, lực của A lên B có độ lớn 0,5 N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $a_B = \\dfrac{F}{m_B} = \\dfrac{0,5}{0,1} = 5$ m/s²\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $v_B' = 2$ m/s, khác 4 m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-5-tf-035", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một xe lăn bằng gỗ có khối lượng $300 gam$ đang chuyển động với vận tốc $3 m/s$ thì va chạm vào một xe lăn bằng thép có khối lượng $600 gam$ đang đứng yên trên bàn nhẵn nằm ngang. Sau thời gian va chạm $0,2 s$ xe lăn thép đạt vận tốc $0,5 m/s$ theo hướng của v.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của xe thép là $-2,5 m/s^{2}.$", "answer": true}, {"text": "Lực tác dụng lên xe thép có độ lớn 2 N.", "answer": false}, {"text": "Gia tốc của xe gỗ là $5 m/s^{2}.$", "answer": true}, {"text": "Vận tốc của xe gỗ sau va chạm là $2 m/s.$", "answer": false}], "nguon": [true, false, true, false], "haiku": [false, false, false, true], "sonnet": [false, false, false, true], "goc": "![](media/image98.emf){width=\"2.564583333333333in\" height=\"1.3611111111111112in\"} Chọn chiều hệ trục Ox như hình vẽ.\n\nXe 1 là xe thép, xe 2 là xe gỗ\n\na. Gia tốc của xe thép là $a_{1}=\\frac{v-v_{0}}{t}=\\frac{-0,5-0}{0,2}= -2,5 m/s^{2}$(do xe 1 chuyển động ngược chiều dương nên khi chiếu nên chiều dương vân tốc tốc mang dấu âm).\n\nb. Hợp lực tác dụng lên xe 1 là$F_{hl1}= -F_{21}=m_{1}a_{1}\\Leftrightarrow -F_{21}=0,6\\left( -2,5 \\right)\\LeftrightarrowF_{21}=1,5 N$(do xe 1 chuyển động ngược chiều dương nên khi chiếu nên chiều dương gia tốc mang dấu âm).\n\nc. Theo định luật III Nui tơn thì $\\left| \\overrightarrow{F_{21}} \\right|=\\left| \\overrightarrow{F_{12}} \\right|=1,5 N.$\n\nGia tốc của xe gỗ là $F_{hl2}=F_{12}=m_{2}.a_{2}\\Leftrightarrowa_{2}=5 m/s^{2}.$\n\nd. Vận tốc của xe gỗ sau va chạm là $v_{2}=v_{01}+a_{2}.t= -3+5.0,2= -2 m/s.$\n\nSau va chạm xe gỗ chuyển động với vận tốc $2m/s$ và chịu tác dụng của xe thép là $1,5N$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương là chiều chuyển động ban đầu của xe gỗ. Bàn nhẵn nên chỉ có lực tương tác giữa hai xe theo phương ngang.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $a_2=\\dfrac{v_2-v_{02}}{\\Delta t}=\\dfrac{0,5-0}{0,2}=2,5$ m/s² (dương). Ý cho $-2,5$ m/s² nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $F_2=m_2a_2=0,6\\cdot 2,5=1,5$ N, không phải 2 N nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Theo định luật III Newton, lực của xe thép lên xe gỗ có độ lớn 1,5 N và ngược chiều.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a_1=\\dfrac{-F_2}{m_1}=\\dfrac{-1,5}{0,3}=-5$ m/s².\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Gia tốc xe gỗ là $-5$ m/s² chứ không phải $+5$ m/s² nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $v_1=v_{01}+a_1\\Delta t=3+(-5)(0,2)=2$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kiểm tra bảo toàn động lượng: $0,3\\cdot 3=0,3\\cdot 2+0,6\\cdot 0,5=0,9$ (đúng). Vậy ý d \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý c: độ lớn gia tốc xe gỗ là 5 m/s² nhưng giá trị đại số là -5 m/s² (ngược chiều chọn dương), nên xét là Sai."}, {"key": "c3-5-tf-036", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Hai quả cầu chuyển động trên mặt phẳng nằm ngang, quả cầu 1 chuyển động với vận tốc $4 m/s$ đến va chạm vào quả cầu 2 đang đứng yên. Sau va chạm, cả hai quả cầu cùng chuyển động theo hướng cũ của quả cầu 1 với cùng vận tốc $2 m/s$.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của quả cầu 1 mang giá trị âm.", "answer": true}, {"text": "Hợp lực tác dụng lên quả cầu 1 cùng chiều chuyển động.", "answer": false}, {"text": "Sau va chạm, hai quả cầu chuyển động ngược chiều nhau.", "answer": true}, {"text": "Tỉ số khối lượng của hai quả cầu bằng 1.", "answer": true}], "nguon": [true, false, true, true], "haiku": [true, false, false, true], "sonnet": [true, false, false, true], "goc": "![](media/image108.emf){width=\"2.6798611111111112in\" height=\"1.2833333333333334in\"}a. Gia tốc của quả cầu 1 là $a_{1}=\\frac{v-v_{0}}{t}=\\frac{2-4}{t}= -\\frac{2}{t} m/s^{2}.$\n\nGia tốc của quả cầu 2 là$a_{2}=\\frac{v-v_{0}}{t}=\\frac{2-0}{t}=\\frac{2}{t} m/s^{2}.$\n\nb. Hợp lực tác dụng lên quả cầu 1 là $F_{hl1}= -F_{21}=m_{1}a_{1}(1)$\n\nHợp lực tác dụng lên quả cầu 2 là $F_{hl2}=F_{12}=m_{2}a_{2}(2)$\n\nc. Sau va chạm xe 1 bật ngược trở lại còn xe 2 chuyển động cùng chiều chuyển động.\n\nd. Theo định luật III Newton  ta có $F_{21}=F_{12}(3)$\n\nTừ (1) (2) (3) ta có $m_{1}a_{1}= -m_{2}a_{2}\\Leftrightarrowm_{1}\\left( -\\frac{2}{t} \\right)= -m_{2}\\left( \\frac{2}{t} \\right)\\Leftrightarrow\\frac{m_{1}}{m_{2}}=1.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Định luật bảo toàn động lượng cho hệ hai quả cầu (hệ kín theo phương ngang, bỏ qua ma sát). Chọn chiều dương là chiều chuyển động ban đầu của quả cầu 1.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$m_1v_1 = (m_1+m_2)v'$ với $v_1=4$ m/s, $v'=2$ m/s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow 4m_1 = 2(m_1+m_2)$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow m_1 = m_2$, tỉ số khối lượng bằng 1.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Vận tốc quả cầu 1 giảm từ 4 m/s xuống 2 m/s nên $a=\\dfrac{\\Delta v}{\\Delta t}\\lt 0$ trong hệ chọn chiều dương theo chuyển động. Ý a) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Quả cầu 1 chuyển động chậm dần nên hợp lực (cùng chiều gia tốc) ngược chiều chuyển động. Ý b) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Sau va chạm hai quả cầu cùng chuyển động theo hướng cũ với cùng vận tốc 2 m/s nên cùng chiều nhau. Ý c) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $\\dfrac{m_1}{m_2}=1$. Ý d) Đúng.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-5-sa-040", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một xe lăn bằng gỗ có khối lượng $300 gam$ đang chuyển động với vận tốc $ v = 3 m/s$ thì va chạm vào một xe lăn bằng thép có khối lượng $600 gam$ đang đứng yên trên mặt bàn nhẵn nằm ngang. Sau thời gian va chạm là $0,2 s,$ xe lăn thép đạt vận tốc $0,5 m/s$ theo hướng của v. Xác định lực F tác dụng vào xe lăn gỗ khi tương tác theo đơn vị là Newton.\u003c/p>", "options": null, "statements": null, "nguon": "0,75", "haiku": "1,5", "sonnet": "1,5", "goc": "Gọi $v_{1},v'_{1}$ là vận tốc xe lăng bằng gỗ trước và sau khi va chạm.\n\nGọi $v_{2},v'_{2}$ là vận tốc xe lăng bằng thép trước và sau khi va chạm.\n\nTheo định luật III Newton ta có $\\overrightarrow{F_{21}} = \\overrightarrow{F_{12}} \\Leftrightarrowm_{1}\\overrightarrow{a_{1}} = m_{2}\\overrightarrow{a_{2}}(*)$\n\nĐộ lớn của lực tác dụng vào xe lăn gỗ\n\n$F_{21} = F_{12} = m_{2}\\left| a_{2} \\right| = m_{2}\\frac{\\left| v'_{2}^{} - v_{2} \\right|}{\\Deltat} = 0,3.\\frac{0,5 - 0}{0,2} = 0,75 N.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Mặt bàn nhẵn nằm ngang nên hệ hai xe là hệ kín theo phương ngang; lực tương tác giữa hai xe là cặp lực trực đối (định luật III Newton).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương cùng chiều $\\vec v$. Xét xe thép: $m_2 = 0,6$ kg, $v_{2}=0$, $v_2'=0,5$ m/s, $\\Delta t = 0,2$ s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$F_{2} = \\dfrac{m_2(v_2'-v_2)}{\\Delta t}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow F_2 = \\dfrac{0,6\\cdot 0,5}{0,2} = 1,5$ N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Theo định luật III Newton, lực tác dụng vào xe gỗ có độ lớn $F = F_2 = 1,5$ N, ngược chiều với $\\vec v$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kiểm tra: bảo toàn động lượng $0,3\\cdot 3 = 0,3 v_1' + 0,6\\cdot 0,5$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v_1' = 2$ m/s\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow F = \\dfrac{0,3\\cdot|2-3|}{0,2} = 1,5$ N (phù hợp).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Đáp số: $F = 1,5$ N.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Lấy độ lớn lực; lực lên xe gỗ ngược chiều chuyển động ban đầu."}, {"key": "c3-6-mc-008", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật có khối lượng $m$ đặt ở nơi có gia tốc trọng trường $ g.$Phát biểu nào sau đây \u003cstrong>sai\u003c/strong>?\u003c/p>", "options": ["Trọng lực có độ lớn được xác định bởi biểu thức $P=mg.$", "Điểm đặt của trọng lực là trọng tâm của vật.", "Trọng lực tỉ lệ với khối lượng của vật.", "Trọng lực là lực hút của trái đất tác dụng lên vật."], "statements": null, "nguon": "C", "haiku": "D", "sonnet": "D", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Trọng lực tác dụng lên vật có độ lớn $P=mg$, điểm đặt tại trọng tâm của vật, hướng thẳng đứng từ trên xuống.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A đúng: $P=mg$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B đúng: điểm đặt của trọng lực là trọng tâm của vật.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">C đúng: tại một nơi xác định, $g$ không đổi nên $P$ tỉ lệ với $m$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D: chặt chẽ thì trọng lực là hợp của lực hút của Trái Đất và lực quán tính li tâm do Trái Đất tự quay, nên không hoàn toàn đồng nhất với lực hút của Trái Đất. Đây là phát biểu không chính xác nhất trong bốn phát biểu.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy chọn D.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Theo SGK, trọng lực thường được coi là lực hút của Trái Đất nên cả bốn phát biểu đều có thể coi là đúng; D được chọn vì là phát biểu kém chính xác nhất (bỏ qua ảnh hưởng của sự tự quay của Trái Đất). Nên kiểm tra lại đề gốc."}, {"key": "c3-6-tf-041", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Trong phòng thí nghiệm vật lý ở 1 trường THPT X có 1 số quả nặng bị mờ số chỉ khối lượng. Một học sinh Y cần dùng số quả nặng đó để làm thí nghiệm. Để xác định khối lượng của các quả nặng đó, học sinh này đã lấy 1 lực kế 10 N và lần lượt treo từng quả nặng vào lực kế, đọc số chỉ lực kế và thu được bảng số liệu dưới. Biết gia tốc rơi tự do tại đây là $g=10 m/s^{2}.$\u003c/p>", "options": null, "statements": [{"text": "Quả nặng thứ nhất có khối lượng 1000 gam.", "answer": false}, {"text": "Trong 4 quả nặng trên thì quả nặng thứ 4 có khối lượng lớn nhất.", "answer": true}, {"text": "Trọng lượng của quả nặng 1, 2 và 3 là 8 N.", "answer": true}, {"text": "Trọng lượng của quả nặng thứ 2 và hai quả nặng thứ 3 là 10 N.", "answer": false}], "nguon": [false, true, true, false], "haiku": [true, false, false, false], "sonnet": [false, true, true, true], "goc": "a. Số chỉ lực kế là trọng lượng các quả nặng.\n\nÁp dụng công thức $P_{1}=m_{1}g\\Rightarrowm_{1}=\\frac{P_{1}}{g}=\\frac{1}{10}=0,1kg=100g.$\n\nb. Khối lượng các quả nặng\n\n|  **Lần treo**  |                            **Khối lượng**                             |\n|:--------------:|:---------------------------------------------------------------------:|\n| Quả nặng thứ 1 | $m_{1}=0,1 kg=100 gam$ |\n| Quả nặng thứ 2 | $m_{2}=0,2 kg=200 gam$ |\n| Quả nặng thứ 3 | $m_{3}=0,5 kg=500 gam$ |\n| Quả nặng thứ 4 | $m_{4}=1 kg=1000 gam$  |\n\nc. Số chỉ lực kế là trọng lượng nhóm quả nặng tương đương trọng lượng 1 vật có khối lượng$\\left\\{ \\begin{array}{r}\n\\mathit{m}\\mathbf{=}\\mathit{m}_{1}\\mathbf{+}\\mathit{m}_{2}\\mathbf{+}\\mathit{m}_{3}\\mathbf{=}0,1\\mathbf{+}0,2\\mathbf{+}0,5\\mathbf{=}0,8\\ \\mathit{kg} \\\\\n\\mathit{P}\\mathbf{=}\\mathit{mg}\\mathbf{=}8\\ \\mathit{N}\n\\end{array} \\right.\\$\n\nd. Số chỉ lực kế là trọng lượng nhóm quả nặng tương đương trọng lượng 1 vật có khối lượng $\\left\\{ \\begin{array}{r}\n\\mathit{m}^{/}\\mathbf{=}2\\mathit{m}_{3}\\mathbf{+}\\mathit{m}_{2}\\mathbf{=}2.0,5\\mathbf{+}0,2\\mathbf{=}1,2\\ \\mathit{kg} \\\\\n\\mathit{P}^{/}\\mathbf{=}\\mathit{m}.\\mathit{g}\\mathbf{=}12\\ \\mathit{N}\n\\end{array} \\right.\\$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Quả nặng treo yên trên lực kế nên số chỉ lực kế bằng trọng lượng: $P=mg$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow m=\\dfrac{P}{g}$ với $g=10\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Lực kế chỉ tối đa 10 N nên quả nặng 1000 g (trọng lượng 10 N) không phải quả thứ nhất, vì quả này nhẹ hơn nhiều (khoảng 1 N, tức 100 g). Vậy ý a) Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Khối lượng tỉ lệ với số chỉ lực kế ($m=P/g$), quả thứ 4 có số chỉ lớn g dây $T$ (hướng lên). Chọn chiều dương hướng lên, áp dụng định luật II Newton: $T-mg=ma_y$ với $a_y$ là gia tốc theo chiều dương.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Vật đứng yên: $a=0$ nên $T=mg=4\\cdot10=40$ N. Ý a) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Vật đi lên với gia tốc $8$ m/s² (hướng lên, $a_y=+8$): $T=m(g+a)=4\\cdot(10+8)=72$ N. Ý b) Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Vật đi xuống với gia tốc $6$ m/s² (hiểu là gia tốc hướng xuống, $a_y=-6$): $T=m(g-a)=4\\cdot(10-6)=16$ N. Theo cách hiểu này thì độ lớn là 16 N, nhưng cần xét kỹ ý d) và cách hiểu của đề.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Đề ghi \"Lực căng khi di chuyển vật xuống với gia tốc 6 m/s² 16 N\" — nếu hiểu gia tốc hướng xuống thì $T=16$ N, ý c) Đúng. Tuy nhiên đáp án được chọn dưới đây dựa trên cách hiểu khác (xem ghi chú).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Kéo lên: $T=72$ N; kéo xuống: $T=16$ N. Lực căng khi kéo lên lớn hơn, nên ý d) Sai.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Ý c) mơ hồ: nếu gia tốc 6 m/s² hướng xuống thì T=16 N (Đúng). Trong đáp án trên tôi đã đặt c) = false, nhưng tính toán thuận theo cách hiểu thông thường cho c) = Đúng; nên đáp án đúng nên là [true,true,true,false]. Vui lòng dùng [true,true,true,false]."}, {"key": "c3-7-mc-008", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Phát biểu nào sau đây là \u003cstrong>đúng\u003c/strong>?\u003c/p>", "options": ["Khi xe đang chạy, lực ma sát giữa vành bánh xe và bụi đất bám vào vành là ma sát lăn.", "Lực ma sát giữa xích và đĩa xe đạp khi đĩa xe đang quay là ma sát lăn.", "Lực ma sát giữa trục bi khi bánh xe đang quay là ma sát trượt.", "Khi đi bộ, lực ma sát giữa chân và mặt đất là lực ma sát nghỉ."], "statements": null, "nguon": "B", "haiku": "D", "sonnet": "D", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Phân loại lực ma sát: ma sát nghỉ giữ vật không trượt trên bề mặt tiếp xúc; ma sát trượt xuất hiện khi các bề mặt trượt lên nhau; ma sát lăn xuất hiện khi vật lăn trên bề mặt.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A: Bụi đất bám vào vành bánh xe đứng yên so với vành, không có chuyển động tương đối giữa chúng nên đây không phải ma sát lăn\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B: Xích trượt trên răng đĩa khi đĩa quay (có chuyển động trượt tương đối giữa các bề mặt), nên là ma sát trượt, không phải ma sát lăn\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">C: Trong trục bi, các viên bi lăn giữa trục và ổ nên là ma sát lăn, không phải ma sát trượt\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D: Khi đi bộ, bàn chân đặt trên mặt đất không trượt, lực ma sát nghỉ tác dụng lên chân hướng về phía trước giúp người tiến lên\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: chọn D.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-7-mc-009", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Phát biểu nào sau đây là \u003cstrong>đúng\u003c/strong>?\u003c/p>", "options": ["Quyển sách nằm yên trên mặt bàn nằm ngang vì trọng lực và lực ma sát nghỉ tác dụng lên quyển sách cân bằng nhau.", "Khi một vật chịu tác dụng của ngoại lực mà vẫn đứng yên thì lực ma sát nghỉ lớn hon ngoại lực.", "Lực ma sát trượt phụ thuộc vào bản chất của các mặt tiếp xúc.", "Lực ma sát nghỉ phụ thuộc vào diện tích mặt tiếp xúc."], "statements": null, "nguon": "A", "haiku": "C", "sonnet": "C", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Xét từng phương án:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A sai: quyển sách nằm yên trên mặt bàn nằm ngang chịu tác dụng của trọng lực $\\vec{P}$ và phản lực pháp tuyến $\\vec{N}$ của mặt bàn. Hai lực này cân bằng nhau. Lực ma sát nghỉ không xuất hiện vì không có xu hướng trượt, và nó cũng không cùng phương với trọng lực.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B sai: vật vẫn đứng yên khi chịu ngoại lực nên hợp lực bằng 0\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ lực ma sát nghỉ cân bằng với thành phần ngoại lực song song với mặt tiếp xúc, tức là có độ lớn bằng ngoại lực (không lớn hơn).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">C đúng: độ lớn lực ma sát trượt $F_{mst}=\\mu_t N$, trong đó hệ số ma sát trượt $\\mu_t$ phụ thuộc vào bản chất, vật liệu và tình trạng của các mặt tiếp xúc.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D sai: lực ma sát nghỉ có độ lớn thay đổi theo ngoại lực, cực đại là $F_{msn\\,max}=\\mu_n N$, không phụ thuộc diện tích mặt tiếp xúc.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy chọn C.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-7-mc-021", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Tìm phát biểu \u003cstrong>sai\u003c/strong> sau đây về lực ma sát trượt?\u003c/p>", "options": ["Lực ma sát trượt luôn cản lại chuyển động của vật bị tác dụng.", "Lực ma sát nghỉ chỉ xuất hiện khi có chuyển động trượt giữa 2 vật.", "Lực ma sát trượt có chiều ngược lại chuyển động (tương đối) của vật\u003cstrong>.\u003c/strong>", "Lực ma sát trượt có độ lớn tỉ lệ với áp lực ở mặt tiếp xúc."], "statements": null, "nguon": "A", "haiku": "B", "sonnet": "B", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Cần chọn phát biểu sai về lực ma sát trượt, xét từng phương án.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">A: Lực ma sát trượt xuất hiện ở mặt tiếp xúc khi các vật trượt trên nhau, có chiều ngược chiều chuyển động tương đối nên cản chuyển động của vật. Phát biểu này đúng theo cách hiểu thông thường của SGK.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">B: Lực ma sát nghỉ xuất hiện khi vật có xu hướng chuyển động nhưng chưa trượt, giữ cho vật đứng yên so với bề mặt tiếp xúc. Không cần có chuyển động trượt. Phát biểu B nói ma sát nghỉ chỉ xuất hiện khi có chuyển động trượt nên \u003cb>sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">C: Lực ma sát trượt ngược chiều chuyển động tương đối của vật so với bề mặt tiếp xúc. Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">D: Độ lớn $F_{ms}=\\mu N$ nên tỉ lệ với áp lực $N$ ở mặt tiếp xúc. Đúng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy đáp án là \u003cb>B\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-7-tf-030", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một quảt bóng đang có khối lượng 100kg đứng yên thì truyền cho vật với vận tốc đầu $10 m/s$ trượt trên mặt phẳng. Hệ số ma sát trượt giữa bóng và mặt phảng là 0,1. Cho $g = 10 m/s^{2}.$\u003c/p>", "options": null, "statements": [{"text": "Lực ma sát có độ lớn 10 N.", "answer": false}, {"text": "Lực ma sát luôn nhỏ hơn trọng lực.", "answer": false}, {"text": "Gia tốc của vật trong chuyển động trên là $-1 m/s^{2}$", "answer": true}, {"text": "Quãng đường của quả bóng đi được trước khi dừng lại là 50 m.", "answer": true}], "nguon": [false, false, true, true], "haiku": [false, true, true, true], "sonnet": [false, true, true, true], "goc": "a. Độ lớn lực ma sát trượt $F_{ms}=\\muN=\\mumg=0,1.100.10=100 N.$\n\nb. Mối quan hệ giữa lực ma sát và trọng lực còn phụ thuộc vào nhiều yếu tố, bao gồm: bề mặt tiếp xúc, hệ số ma sát và lực tác dụng lên vật. Nên lực ma sát có thể lớn hơn trọng lực nếu hệ số ma sát cao.\n\nc. Độ lớn gia tốc $a=\\frac{-F_{ms}}{m}= -\\mug= -0,1.10= -1 m/s^{2}.$\n\nd. Chiều dài quãng đường cần tìm $-v^{2}=2as\\Rightarrow -10^{2}= -2.1s\\Rightarrows=50 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương là chiều chuyển động. Trên mặt phẳng ngang, $N = P = mg$. Lực ma sát trượt: $F_{ms} = \\mu N = \\mu mg$. Gia tốc: $a = -F_{ms}/m = -\\mu g$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $F_{ms} = 0{,}1\\cdot100\\cdot10 = 100$ N, không phải 10 N. \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $F_{ms} = \\mu P = 0{,}1P \\lt P$ nên lực ma sát luôn nhỏ hơn trọng lực. \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $a = -\\mu g = -0{,}1\\cdot10 = -1\\ m/s^2$. \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $v^2 - v_0^2 = 2as$ với $v = 0$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s = \\dfrac{-v_0^2}{2a} = \\dfrac{-10^2}{2\\cdot(-1)} = 50$ m. \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề ghi khối lượng 100 kg (có thể sai đề, vật thực tế có thể là 1 kg). Ý a) vẫn sai với m = 1 kg (F = 1 N); các ý b, c, d không phụ thuộc khối lượng."}, {"key": "c3-7-tf-032", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Người ta truyền vận tốc 7 m/s cho một vật có khối lượng 50 kg đang năm yên trên mặt sàn nằm ngang. Biết hệ số ma sát trượt giữa vật và sàn là 0,5. Lấy g = 9,8 m/s$^{2}$.\u003c/p>", "options": null, "statements": [{"text": "Lực ma sát giữa vật và sàn là 49 N.", "answer": false}, {"text": "Gia tốc của vật là $-4 m/s^{2}$", "answer": true}, {"text": "Vật đi được 5 m thì dừng lại.", "answer": true}, {"text": "Thời gian đến khi vật dừng là 1 s.", "answer": false}], "nguon": [false, true, true, false], "haiku": [false, false, true, false], "sonnet": [false, false, true, false], "goc": "a. Lực ma sát giữa vật và sàn là: $F_{ms}=\\mumg=0,5.50.9,8=245 N.$\n\nb. Gia tốc của quả bóng $a=\\frac{-F_{ms}}{m}=\\frac{-\\mumg}{m}= -\\mug= -4,9 m/s^{2}.$\n\nc. Quãng đường quả bóng đi được đến khi dừng lại (v = 0) $s=\\frac{-v_{0}^{2}}{2a}=5 m.$\n\nd. Thời gian đến khi vật dừng lại: $t=\\frac{v-v_{0}}{a}=\\frac{0-7}{-4,9}=1,4 s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Vật chuyển động chậm dần đều trên sàn nằm ngang dưới tác dụng của lực ma sát trượt (chọn chiều dương là chiều chuyển động).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Lực ma sát: $F_{ms}=\\mu mg=0,5\\cdot 50\\cdot 9,8=245$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Gia tốc: $a=-\\dfrac{F_{ms}}{m}=-\\mu g=-4,9$ m/s$^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường đến khi dừng: $s=\\dfrac{0-v_0^2}{2a}=\\dfrac{49}{9,8}=5$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Thời gian đến khi dừng: $t=\\dfrac{0-v_0}{a}=\\dfrac{7}{4,9}\\approx 1,43$ s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Sai, vì $F_{ms}=245$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Sai, vì $a=-4,9$ m/s$^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Đúng, vì $s=5$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Sai, vì $t\\approx 1,43$ s.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề ghi 'năm yên' hiểu là 'nằm yên'."}, {"key": "c3-7-tf-033", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Vận động viên môn hockey (môn khúc côn cầu) dùng gậy gạt quả bóng có khối lượng 160 gam để truyền cho nó một tốc độ đầu 10 m/s. Hệ số ma sát giữa quả bóng và mặt bằng là 0,1. Lấy $g = 10 m/s^{2}.$\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của quả bóng là $0,98 m/s^{2}.$", "answer": false}, {"text": "Lực ma sát giữa bóng và mặt bằng là 0,16 N.", "answer": true}, {"text": "Quả bóng đi được 15 m thì dừng lại.", "answer": false}, {"text": "Thời gian quả bóng đi được 15 m đến khi dừng lại là 10,2 s.", "answer": true}], "nguon": [false, true, false, true], "haiku": [false, true, false, false], "sonnet": [false, true, false, false], "goc": "a. Theo định luật II Niu–tơn ta có $-F_{ms}=ma$\n\n$-F_{ms}=ma\\Leftrightarrow -\\mumg=ma\\Rightarrowa= -\\mug= -0,98 m/s^{2}.$\n\nb. Lực ma sát giữa bóng và mặt phẳng là $F_{ms}=\\mumg=0,16.0,1.10=0,16 N.$\n\nc. Từ $v^{2}-v_{0}^{2}=2as\\overset{v = 0}{\\rightarrow}-v_{0}^{2}=2as\\Rightarrows= -\\frac{v_{0}^{2}}{2a}=51 m.$\n\nd. Thời gian quả bóng đi 15 m đến khi dừng lại là $t=\\frac{v-v_{0}}{a}=\\frac{0-10}{-0,98}=10,2 s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương là chiều chuyển động. Theo định luật II Newton: $-F_{ms} = ma$, với $F_{ms} = \\mu m g$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a = -\\mu g = -0{,}1\\cdot 10 = -1\\ m/s^2$, tức độ lớn gia tốc là $1\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Gia tốc có độ lớn $1\\ m/s^2$ chứ không phải $0{,}98\\ m/s^2$. Ý a) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $F_{ms} = \\mu m g = 0{,}1\\cdot 0{,}16\\cdot 10 = 0{,}16$ N. Ý b) \u003cb>Đúng\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Quãng đường đến khi dừng: $s = \\dfrac{v_0^2}{2|a|} = \\dfrac{10^2}{2\\cdot 1} = 50$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Bóng đi được 50 m mới dừng, không phải 15 m. Ý c) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Thời gian đến khi dừng: $t = \\dfrac{v_0}{|a|} = \\dfrac{10}{1} = 10$ s.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Thời gian là 10 s, không phải 10,2 s. Ý d) \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-7-tf-038", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Cho một vật có khối lượng 10 kg đặt trên một sàn nhà. Một người tác dụng một lực là 30 N kéo vật theo phương ngang, hệ số ma sát giữa vật và sàn nhà là $\\mu=0,2.$ Cho $ g = 10 m/s^{2}.$ Nếu bỏ qua ma sát và lực kéo hợp với phương chuyển động một góc$60^{0}.$\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của xe là $1 m/s^{2}$", "answer": true}, {"text": "Vận tốc của xe sau 5 s là $2 m/s.$", "answer": false}, {"text": "Lực nâng của mặt phẳng lên vật là 120 N.", "answer": false}, {"text": "Quãng đường xe đi được sau 10 s là 50 m.", "answer": true}], "nguon": [true, false, false, true], "haiku": [false, false, false, false], "sonnet": [false, false, false, false], "goc": "Chọn hệ quy chiếu Oxy như hình vẽ, chiều dương (+) Ox là chiều chuyển động.\n\n![](media/image109.emf)\n\na. Theo định luật II Newton ta có $\\overrightarrow{F}+\\overrightarrow{N}+\\overrightarrow{P}=m\\overrightarrow{a}(1)$\n\nChiếu (1) lên Ox ta được$Fcos\\alpha=ma\\Rightarrowa=\\frac{Fcos\\alpha}{m}=\\frac{30.cos60^{0}}{10}=1 m/s^{2}.$\n\nb. Mà $v=v_{0}+at\\Rightarrowv=0+1.5=5 m/s.$\n\nc. Lục nâng của mặt phẳng: Chiếu (1) lên Oy ta được$N-P+Fsin\\alpha=0$\n\n$\\RightarrowN=mg-Fsin\\alpha=10.10-30.sin60^{0}=74 N.$\n\nd. Quãng đường xe đi được sau 10 s: $s=v_{0}t+\\frac{1}{2}at^{2}=0.10+\\frac{1}{2}.1.10^{2}=50 m.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Bỏ qua ma sát, vật xuất phát từ nghỉ. Chọn chiều dương theo chiều chuyển động. Theo phương ngang, định luật II Newton: $F\\cos60^\\circ = ma$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a = \\dfrac{30\\cdot 0,5}{10} = 1,5\\ m/s^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Gia tốc là $1,5\\ m/s^2$, không phải $1\\ m/s^2$ nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $v = at = 1,5\\cdot 5 = 7,5\\ m/s$, không phải $2\\ m/s$ nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Theo phương thẳng đứng, vật không chuyển động theo phương này nên $N + F\\sin60^\\circ = P$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow N = 100 - 30\\cdot\\dfrac{\\sqrt3}{2} \\approx 74,0\\ N$, không phải 120 N nên \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $s = \\dfrac12 at^2 = \\dfrac12\\cdot1,5\\cdot10^2 = 75\\ m$, không phải 50 m nên \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Giả thiết vật bắt đầu chuyển động từ trạng thái nghỉ; lực kéo hướng lên hợp góc 60° với phương ngang."}, {"key": "c3-7-tf-039", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật có m = 1 kg đang đứng yên. Tác dụng một lực F = 5 N hợp với phương chuyển động một góc là $30^{0}.$ Sau khi chuyển động 4 s, vật đi được một quãng đường là 4 m, cho g = 10 m/s$^{2}$.\u003c/p>", "options": null, "statements": [{"text": "Gia tốc của vật là $1 m/s^{2}$", "answer": false}, {"text": "Hệ số ma sát giữa vật và sàn là 0,51.", "answer": true}, {"text": "Lực ma sát có độ lớn là 5,1 N.", "answer": true}, {"text": "Độ lớn lực nâng của sàn lên vật là 4,9 N.", "answer": false}], "nguon": [false, true, true, false], "haiku": [false, true, false, false], "sonnet": [false, true, false, false], "goc": "Chọn hệ quy chiếu như hình vẽ vật chịu tác dụng của các lực $\\overrightarrow{N}, \\overrightarrow{P}, \\overrightarrow{F_{ms}}, \\overrightarrow{F}$\n\n![](media/image119.emf)\n\na. Ta có $s=v_{0}t+\\frac{1}{2}at^{2}\\Rightarrowa=\\frac{2.s}{t^{2}}=\\frac{2.4}{4^{2}}=0,5 m/s^{2}.$\n\nb. Theo định lụât II Newton ta có $\\overrightarrow{N}+\\overrightarrow{P}+\\overrightarrow{F_{ms}}+\\overrightarrow{F}=m\\overrightarrow{a}(1)$\n\nChiếu $(1)$ lên trục Ox ta được $Fcos\\alpha-F_{ms}=ma(2)$\n\nChiếu $(1)$ lên trục Oy ta được $N-P+Fsin\\alpha=0\\RightarrowN=P-Fsin\\alpha(3)$\n\nTừ (2) và (3) $\\RightarrowFcos\\alpha-\\mu(P-Fsin\\alpha)=ma\\Rightarrow\\mu=\\frac{Fcos\\alpha-ma}{P-Fsin\\alpha}$\n\nVậy $\\Rightarrow\\mu=\\frac{5cos30^{0}-1.0,5}{1.10-5sin30^{0}}=0,51.$\n\nc. Lực ma sát có độ lớn: $F_{ms}=\\mumg=0,51.1.10=5,1 N.$\n\nd. Độ lớn của lực nâng: $N=P-Fsin\\alpha=1.10-5.sin30^{0}=7,5 N.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương theo chiều chuyển động, lực kéo $\\vec F$ hợp với phương ngang góc $30^\\circ$ và hướng lên (theo cách hiểu khớp với số liệu của đề). Vật xuất phát từ nghỉ nên $s=\\frac{1}{2}at^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) $a=\\dfrac{2s}{t^2}=\\dfrac{2\\cdot4}{4^2}=0{,}5$ m/s²\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ a) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương ngang (định luật II Newton): $F\\cos30^\\circ-F_{ms}=ma$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow F_{ms}=5\\cdot\\dfrac{\\sqrt3}{2}-1\\cdot0{,}5\\approx3{,}83$ N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $F_{ms}\\approx3{,}83$ N, không phải 5,1 N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ c) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Phương thẳng đứng (vật cân bằng): $N+F\\sin30^\\circ=mg$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow N=10-5\\cdot0{,}5=7{,}5$ N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $N=7{,}5$ N, không phải 4,9 N\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ d) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) $\\mu=\\dfrac{F_{ms}}{N}=\\dfrac{3{,}83}{7{,}5}\\approx0{,}51$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ b) \u003cb>Đúng\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề không nêu rõ lực F hướng lên hay xuống so với phương ngang. Giả định F kéo hướng lên (N = mg − F sin30° = 7,5 N) thì μ ≈ 0,51 khớp ý b). Nếu F hướng xuống thì μ ≈ 0,31, không khớp."}, {"key": "c3-7-tf-040", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật khối lượng 1 kg đang đứng yên trên mặt phẳng nằm ngang. Tác dụng một lực có độ lớn là $2\\sqrt{2}$ N và hợp với phương ngang một góc $45^{0},$ cho g = 10 m/s$^{2}$ và biết hệ số ma sát giữa sàn và vật là 0,2.\u003c/p>", "options": null, "statements": [{"text": "Độ lớn của lực ma sát và sàn là 2 N.", "answer": true}, {"text": "Gia tốc của vật là $1 m/s^{2}$.", "answer": false}, {"text": "Lực nâng của sàn có độ lớn là 10 N.", "answer": false}, {"text": "Quãng đường vật đi được sau 10 s là 20 m.", "answer": true}], "nguon": [true, false, false, true], "haiku": [false, false, false, true], "sonnet": [false, false, false, true], "goc": "Chọn hệ quy chiếu như hình vẽ vật chịu tác dụng của các lực $\\overrightarrow{N},\\overrightarrow{P},\\overrightarrow{F_{ms}},\\overrightarrow{F}$\n\n![](media/image134.emf)\n\na. Độ lớn của lực ma sát $F_{ms}=\\mumg=0,2.1.10=2 N.$\n\nb. Theo định lụât II Newton ta có $\\overrightarrow{N}+\\overrightarrow{P}+\\overrightarrow{F_{ms}}+\\overrightarrow{F}=m\\overrightarrow{a}(1)$\n\nChiếu $(1)$ lên trục Ox ta được $ F.cos\\alpha-F_{ms}=ma(2)$\n\nChiếu $(1)$ lên trục Oy ta được $N-P+Fsin\\alpha=0\\RightarrowN=P-Fsin\\alpha(3)$\n\nTừ (2) và (3) $\\RightarrowFcos\\alpha-\\mu\\left( P-Fsin\\alpha \\right)=ma\\Rightarrowa=\\frac{2.\\sqrt{2}.cos45^{0}-0,2\\left( 1.10-2\\sqrt{2}.sin45^{0} \\right)}{1}=0,4 m/s^{2}.$\n\nc. Lực nâng của mặt sàn: $N=P-Fsin\\alpha=1.10-2\\sqrt{2}.sin45^{0}=8 N.$\n\nd. Quãng đường vật chuyển động sau 10s là$s=v_{0}t+\\frac{1}{2}at^{2}=0.10+\\frac{1}{2}.0.4.10^{2}=20m$\n\n**[\\\n**\n\n**[Dạng 3 VẬT CHUYỂN ĐỘNG TRÊN MẶT PHẲNG NGHIÊNG CÓ MA SÁT**", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Giả thiết lực kéo hợp với phương ngang góc $45^0$ hướng chếch lên. Chọn chiều dương theo phương ngang cùng chiều chuyển động, phương thẳng đứng hướng lên.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Các thành phần của lực: $F_x=F_y=2\\sqrt2\\cos45^0=2$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Theo phương thẳng đứng vật cân bằng: $N+F_y=P$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow N=mg-F_y=10-2=8$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow F_{ms}=\\mu N=0{,}2\\cdot 8=1{,}6$ N. Vì $F_x=2\\gt 1{,}6$ nên vật trượt.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Theo phương ngang: $a=\\dfrac{F_x-F_{ms}}{m}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a=\\dfrac{2-1{,}6}{1}=0{,}4\\ \\text{m/s}^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Quãng đường sau 10 s: $s=\\frac12at^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow s=\\frac12\\cdot0{,}4\\cdot10^2=20$ m.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Sai, vì $F_{ms}=1{,}6$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Sai, vì $a=0{,}4\\ \\text{m/s}^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) Sai, vì $N=8$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) Đúng, vì $s=20$ m.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề không nói rõ hướng lực; giả sử lực kéo chếch lên so với phương ngang (khi đó ý d đúng, khớp số liệu)."}, {"key": "c3-7-tf-043", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một chiếc xe khối lượng 1 tấn bắt đầu lên một con dốc dài 100 m, cao 25 m với vận tốc ban đầu là 5 m/s. Lực phát động là 3250 N, hệ số ma sát là $\\frac{13}{50\\sqrt{15}},$ lấy g = 10 m/s$^{2}$.\u003c/p>", "options": null, "statements": [{"text": "Lực nâng của con dốc lên xe là 2500 N.", "answer": false}, {"text": "Gia tốc của xe khi lên dốc là $2,35 m/s^{2}.$", "answer": true}, {"text": "Vận tốc của xe khi lên dốc là$2,17 m/s$", "answer": false}, {"text": "Thời gian để xe lên hết dốc là 7,1 s.", "answer": true}], "nguon": [false, true, false, true], "haiku": [false, false, false, false], "sonnet": [false, false, false, false], "goc": "a. Các lực tác dụng vào xe $P,N,F_{ms},F_{K}$\n\nÁp dụng định luật II Niuton ta có $F_{K}+F_{ms}+N+P=ma (1)$\n\nChiếu (1) lên Oy ta có $N-P.cos\\alpha=0\\LeftrightarrowN=P.cos\\alpha=1000.10.\\frac{\\sqrt{100^{2}-25^{2}}}{100}=2500\\sqrt{15} N.$\n\nb. Chiếu (1) lên Ox ta có$F_{k}-F_{ms}-P.sin\\alpha=ma$\n\n$\\Rightarrowa=\\frac{F_{k}-F_{ms}-P.sin}{}=\\frac{3250-\\frac{13}{50\\sqrt{15}}.2500\\sqrt{15}-1000.10.\\frac{1}{4}}{1000}=2,35 m/s2.$\n\nc. Áp dụng công thức $v^{2}-v_{0}^{2}=2as\\Rightarrowv^{2}-5^{2}=2.2,35.100\\Leftrightarrowv=21,7 m/s.$\n\nd. Vậy thời gian xe lên hết dốc là $v=v_{0}+at\\Rightarrowt=\\frac{v-v_{0}}{a}=\\frac{21,7-5}{2,35}\\approx7,1s$\n\n**[\\\n**\n\n**[Dạng 4 BÀI TOÁN CƠ HỆ NHIỀU VẬT**\n\n![A long black line with a brown box Description automatically generated](media/image183.png){width=\"1.7527777777777778in\" height=\"0.5798611111111112in\"} **Câu 1:** Cho cơ hệ như hình vẽ. Vật A có khối lượng $m_{1}=200 gam,$ vật B có khối lượng $ m_{2}=120 gam$ nối với nhau bởi một sợi dây nhẹ, không dãn. Biết hệ số ma sát trượt giữa hai vật và mặt phẳng ngang là $\\mu=0,4.$ Tác dụng vào A một lực kéo $ F=1,5 N$ theo phương ngang. Lấy $ g=10 m/s^{2}.\\$\n\n| **Phát biểu**                                                         | **Đ – S** |\n|:----------------------------------------------------------------------|:---------:|\n| a. Lực nâng của mặt phẳng lên vật A là 2 N.                          |   **Đ**   |\n| b. Độ lớn lực ma sát giữa mặt phẳng và vật B là 1 N.                 |   **S**   |\n| c. Gia tốc chuyển động của hệ là $0,6875 m/s^{2}$ |   **Đ**   |\n| d. Lực căng dây nối hai vật A và B là 0,8 N.                         |   **S**   |\n\n**Hướng dẫn giải**\n\nĐổi $\\left\\{ \\begin{array}{r}\n\\mathit{m}_{1}\\mathbf{=}200\\ \\mathit{gam}\\mathbf{=}0,2\\ \\mathit{kg} \\\\\n\\mathit{m}_{2}\\mathbf{=}120\\ \\mathit{gam}\\mathbf{=}0,12\\ \\mathit{kg}\n\\end{array} \\right.\\$\n\n![A diagram of a box with a line and a line with a box Description automatically generated with medium confidence](media/image191.png){width=\"3.3895833333333334in\" height=\"1.5534722222222221in\"}\n\na. Ta có$N_{1}=P_{1}=m_{1}g=0,2.10=2 N$\n\nb. Độ lớn lực ma sát lên vật B: $F_{ms2}=\\muN_{2}=\\mum_{2}g=0,4.0,12.10=0,48 N.$\n\nc. Áp dụng định luật II Newton cho hệ vật\n\n$F+F_{ms1}+P_{1}+N_{1}+T_{1}+F_{ms2}+P_{2}+N_{2}+T_{2}=\\left( m_{1}+m_{2} \\right)a(1)$\n\nChọn hệ Oxy như hình vẽ\n\nChiếu (1) lên phương Ox, ta có $F-F_{ms_{1}}-F_{ms_{2}}=\\left( m_{1}+m_{2} \\right)a$\n\n$\\Rightarrowa=\\frac{F-\\muN_{1}-\\muN_{2}}{m_{1}+m_{2}}=\\frac{F-\\mug(m_{1}+m_{2})}{m_{1}+m_{2}}=\\frac{F}{m_{1}+m_{2}}-\\mug$\n\n$\\Rightarrowa=\\frac{1,5}{0,2+0,12}-0,4.10=0,6875 m/s^{2}$\n\nd. Lực căng dây $T_{1}=T_{2}=T,$ áp dụng định luật II Newton cho vật A ta có $ T+P+N+F_{ms1}=m_{1}a(2)$\n\nChiếu (2) lên phương Ox, ta có $T-F_{ms1}=m_{1}a\\RightarrowT=F_{ms1}+m_{1}a=\\mum_{1}g+m_{1}a=m_{1}\\left( \\mug+a \\right)=0,9375 N$\n\n![A wooden box with a black line Description automatically generated](media/image201.png){width=\"2.2868055555555555in\" height=\"1.0604166666666666in\"} **Câu 2:** Cho cơ hệ như hình vẽ. Vật thứ nhất có khối lượng $m_{1}=1 kg,$ vật thứ hai có khối lượng $ m_{2}=3 kg$ nối với nhau bởi một sợi dây nhẹ, không dãn. Biết hệ số ma sát trượt giữa hai vật và mặt phẳng ngang là $\\mu=0,1.$ Tác dụng vào A một lực kéo $ F=5 N$ theo phương hợp với phương ngang một góc $\\alpha=30^{0}.$ Lấy g = 9,8 m/s^2^.\n\n| **Phát biểu**                                     | **Đ – S** |\n|:--------------------------------------------------|:---------:|\n| a. Lực nâng của mặt phẳng lên vật 2 là 26,9 N.   |   **Đ**   |\n| b. Tổng lực ma sát tác dụng lên hệ là 3 N.       |   **S**   |\n| c. Gia tốc chuyển động của hệ là $0,71 m/s^{2}$ |   **Đ**   |\n| d. Lực căng dây nối hai vật là 1 N.              |   **S**   |\n\n**Hướng dẫn giải**\n\n![A diagram of a box with a line and arrows Description automatically generated](media/image208.png){width=\"3.5395833333333333in\" height=\"1.7659722222222223in\"}\n\na. Áp dụng định luật II Newton cho hệ vật $F+F_{ms1}+P_{1}+N_{1}+T_{1}+F_{ms2}+P_{2}+N_{2}+T_{2}=\\left( m_{1}+m_{2} \\right)a(1)$\n\nChọn trục Oxy như hình vẽ\n\nDễ thấy $\\left\\{ \\begin{array}{r}\n\\mathit{N}_{1}\\mathbf{=}\\mathit{P}_{1}\\mathbf{=}\\mathit{m}_{1}\\mathit{g}\\mathbf{=}1.9,8\\mathbf{=}9,8\\mathit{\\ N} \\\\\n\\mathit{N}_{2}\\mathbf{=}\\mathit{P}_{2}\\mathbf{-}\\mathit{F}sin\\alpha\\mathbf{=}\\mathit{m}_{2}\\mathit{g}\\mathbf{-}\\mathit{F}sin\\alpha\\mathbf{=}3.9,8\\mathbf{-}5.sin30^{0}\\mathbf{=}26,9\\mathit{\\ N}\n\\end{array} \\right.\\$\n\nb. Ta có $F_{ms1}+F_{ms2}=\\muN_{1}+\\muN_{2}=0,1.9,8+0,1.26,9=3,7 N.$\n\nc. Chiếu (1) lên phương Ox\n\n$F.cos\\alpha-F_{ms1}-F_{ms2}=\\left( m_{1}+m_{2} \\right)a\\Rightarrowa=\\frac{Fcos\\alpha-\\mum_{1}g-\\mu\\left( m_{2}g-Fsin\\alpha \\right)}{m_{1}+m_{2}}$\n$\\Rightarrowa = \\frac{Fcos\\alpha-\\mug\\left( m_{1}+m_{2}-Fsin\\alpha \\right)}{m_{1}+m_{2}} = 0,71 m/s^{2}$\n\nd. Áp dụng định luật II Newton cho vật m~1~\n\n$-F_{ms1}+T=m_{1}a\\RightarrowT=\\mum_{1}g+m_{1}a=m_{1}\\left( \\mug+a \\right)=1,71 N$\n\n![A car pulling a rope Description automatically generated](media/image215.png){width=\"2.3722222222222222in\" height=\"1.0520833333333333in\"} **Câu 3:** Một chiếc xe mô hình khối lượng $m_{1}=5 kg$ và quả nặng có khối lượng $ m_{2}=2 kg$được nối với nhau bằng một sợi dây vắt qua ròng tóc như hình vẽ. Biết răng sợi dây không dãn, khối lượng của dây và ròng rọc không đáng kể. Hệ số ma sát $\\mu=0,1,$ lấy $ g=10 m/s^{2},$ góc $\\alpha=30^{0}.$ Tìm gia tốc chuyển động và lực căng dây.\n\n| **Phát biểu**                                                            | **Đ – S** |\n|:-------------------------------------------------------------------------|:---------:|\n| a. Trọng lực của xe theo phương song song mặt phẳng là 20 N.            |   **S**   |\n| b. Xe trượt lên mặt phẳng nghiêng còn quả nặng chuyển động hướng xuống. |   **S**   |\n| c. Gia tốc chuyển động của xe là $8 m/s^{2}$                           |   **S**   |\n| d. Lực căng dây có độ lớn 31,6 N.                                       |   **Đ**   |\n\n**Hướng dẫn giải**\n\na. Áp dụng định luật II Newton cho hai vật\n\nChiếc xe mô hình $P_{1}+N_{1}+F_{ms}+T_{1}=m_{1}a (1)$\n\nQuả nặng $P_{2}+T_{2}=m_{2}a (2)$\n\n![A diagram of a car with a car and a car with a car and a car with a car with a car with a car with a car with a car with a car with a car with Description automatically generated](media/image224.png){width=\"3.415277777777778in\" height=\"1.5972222222222223in\"}\n\nTa có $\\left\\{ \\begin{array}{r}\n\\mathit{P}_{1\\mathit{x}}\\mathbf{=}\\mathit{P}_{1}sin30^{0}\\mathbf{=}\\mathit{m}_{1}\\mathit{g}sin30^{0}\\mathbf{=}25\\ \\mathit{N} \\\\\n\\mathit{P}_{2}\\mathbf{=}\\mathit{m}_{2}\\mathit{g}\\mathbf{=}20\\ \\mathit{N}\n\\end{array} \\right.\\$\n\nb. Vì $P_{1x}>P_{2}$ nên xe trượt xuống dốc và quả nặng chuyển động lên trên với cùng gia tốc và $T_{1}=T_{2}=T$\n\nc. Chọn chiều (+) như hình vẽ\n\nChiếu (1) và (2) lên chiều (+) ta có $\\left. \\ \\begin{matrix}\n{\\mathit{P}_{1}}_{\\mathit{x}}\\mathbf{-}\\mathit{F}_{\\mathit{ms}}\\mathbf{-}\\mathit{T}\\mathbf{=}\\mathit{m}_{1}\\mathit{a}\n\\end{matrix} \\right.\\$\n\n$\\LeftrightarrowP_{1x}-\\mum_{1}gcos30^{0}+P_{2}=\\left( m_{1}+m_{2} \\right)a\\Rightarrowa=\\frac{P_{1x}-\\mum_{1}gcos30^{0}+P_{2}}{m_{1}+m_{2}}=5,8 m/s^{2}$\n\nd. Áp dụng định luật II Newton lên quả nặng $-P_{2}+T=m_{2}a\\RightarrowT=m_{2}a+P_{2}=31,6 N$\n\n![A pulley with a weight attached to it Description automatically generated](media/image231.png){width=\"0.6597222222222222in\" height=\"1.5in\"}", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Điều kiện: dốc dài 100 m, cao 25 m nên $\\sin\\alpha = 0,25$, $\\cos\\alpha = \\frac{\\sqrt{15}}{4}$. Chọn chiều dương dọc dốc hướng lên.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Lực nâng của dốc là phản lực $N = mg\\cos\\alpha = 2500\\sqrt{15} \\approx 9682$ N, không phải 2500 N. Vậy ý a) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">b) Lực ma sát: $F_{ms} = \\mu N = \\frac{13}{50\\sqrt{15}}\\cdot 2500\\sqrt{15} = 650$ N.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow a = \\frac{F - F_{ms} - mg\\sin\\alpha}{m} = \\frac{3250 - 650 - 2500}{1000} = 0,1$ m/s².\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Giá trị này khác 2,35 m/s². Vậy ý b) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">c) $v^2 = v_0^2 + 2as = 25 + 2\\cdot 0,1\\cdot 100 = 45$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v \\approx 6,7$ m/s (ở cuối dốc), khác 2,17 m/s. Vậy ý c) \u003cb>Sai\u003c/b>.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">d) $100 = 5t + 0,05t^2$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t^2 + 100t - 2000 = 0$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow t \\approx 17,1$ s, khác 7,1 s. Vậy ý d) \u003cb>Sai\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Các ý a, b, c, d đều sai theo tính toán. Ý c) không nói rõ vận tốc tại thời điểm nào; vận tốc cuối dốc là 6,7 m/s, và vận tốc không bao giờ xuống 2,17 m/s vì xe tăng tốc đều với a = 0,1 m/s²."}, {"key": "c3-7-sa-054", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Cho một vật có khối lượng m đang đứn yên trên mặt phẳng nằm ngang, tác dụng một lực là 48N có phương hợp với phương ngang một góc $60^{0}$. Sau khi đi được 4s thì đạt được vận tốc 6m/s. Giả sử hệ số ma sát giữa vật và sàn là 0,1 thì sau khi đi được quãng đường 16 m thì vận tốc của vật là bao nhiêu m/s? Cho $ g = 10 m/s^{2}.$\u003c/p>", "options": null, "statements": null, "nguon": "13,4", "haiku": "6,93", "sonnet": "4,9", "goc": "Chọn hệ quy chiếu Oxy như hình vẽ, chiều dương (+) Ox là chiều chuyển động.\n\n![](media/image346.emf)\n\nÁp dụng định luật II Newton ta có $F_{x}+F_{y}+F_{ms}+N+P=ma(1)$\n\nChiếu (1) lên Ox ta được $Fcos\\alpha-F_{ms}=ma(2)$\n\nChiếu (1) lên Oy ta được$N-P+Fsin\\alpha=0\\RightarrowN=mg-Fsin\\alpha(3)$\n\nThay (3) vào (2) suy ra $Fcos\\alpha-\\mu\\left( mg-Fsin\\alpha \\right)=ma$\n\n$\\Rightarrowa=\\frac{48.cos45^{0}-0,1\\left( m.10-48.sin45^{0} \\right)}{m}=5,59 m/s^{2}.$\n\nÁp dụng công thức $v^{2}-v_{0}^{2}=2as\\Rightarrowv=\\sqrt{2as}=\\sqrt{2.5,59.16}=13,4 m/s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Phần đầu (không ma sát): $a=\\dfrac{v}{t}=\\dfrac{6}{4}=1,5\\ m/s^2$ và $F\\cos60^0=ma$\u003c/p>\u003cp class=\\\"text-base leading-relaxed my-2\\\">$\\Rightarrow m=\\dfrac{48\\cdot0,5}{1,5}=16\\ kg$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Khi có ma sát, lực kéo hướng lên nên phản lực: $N=mg-F\\sin60^0=160-24\\sqrt3\\approx118,4\\ N$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow F_{ms}=\\mu N\\approx11,84\\ N$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Định luật II Newton theo phương ngang: $a'=\\dfrac{F\\cos60^0-F_{ms}}{m}=\\dfrac{24-11,84}{16}\\approx0,76\\ m/s^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vật xuất phát từ nghỉ: $v^2=2a's$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow v=\\sqrt{2\\cdot0,76\\cdot16}\\approx4,9\\ m/s$.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề mơ hồ: dữ kiện 4 s đạt 6 m/s được hiểu là khi chưa có ma sát (cho m = 16 kg); sau đó giả sử có ma sát μ = 0,1, lực kéo hướng lên trên, vật bắt đầu từ trạng thái nghỉ. Kết quả xấp xỉ 4,9 m/s."}, {"key": "c3-8-mc-026", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Khi vật nổi trên chất lỏng thì lực đẩy Archimedes\u003c/p>", "options": ["bằng trọng lượng riêng của nước nhân với thể tích của vật.", "bằng trọng lượng vật.", "bằng trọng lượng của phần nước bị vật chiếm chỗ.", "bằng ích thước, khối lượng không trực tiếp quyết định giới hạn tốc độ), nên D sai.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: chọn \u003cb>B\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": ""}, {"key": "c3-8-tf-043", "type": "true_false", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một vật có khối lượng là 10 kg rơi với vận tốc ban đầu $v_{0}$ = 1 m/s với độ cao là 10 m xuống đất theo hướng thẳng đứng. Trong quá trình vật rơi trong không khí nó chịu luôn chịu lực cản không đổi là 20 N. Lấy g = 10 m/s$^{2}$.\u003c/p>", "options": null, "statements": [{"text": "Lực cản cùng chiều với trọng lực của vật.", "answer": true}, {"text": "Gia tốc của vật trong quá trình rơi là $8 m/s^{2}.$", "answer": true}, {"text": "Vận tốc khi chạm đất có độ lớn là $10 m/s.$", "answer": false}, {"text": "Thời gian vật rơi là 2 s.", "answer": false}], "nguon": [true, true, false, false], "haiku": [false, true, false, false], "sonnet": [false, true, false, false], "goc": "a. Chọn trục 0x theo phương thẳng đứng, chiều dương hướng xuống dưới\n\n![](media/image37.png){width=\"0.46875in\" height=\"1.0833333333333333in\"}\n\nTrong quá trình vật rơi vật chịu 2 lực tác dụng.\n\nTrọng lực hướng xuống và lực cản của không khí hướng lên.\n\nb. Áp dụng định luật II Newton ta có$\\overrightarrow{P}+\\overrightarrow{F_{C}}=m.\\overrightarrow{a}$\n\nChiếu phương trình lên trục Ox ta được$P-F_{C}=m.a$ $\\Rightarrowa=8 m/s^{2}.$\n\nc. Độ lớn vận t ốc khi vật vừa chạm đất $v=\\sqrt{v_{0}^{2}+2as}=\\sqrt{161} m/s.$\n\nd. Thời gian vật rơi là: $t=\\frac{v-v_{0}}{a}=\\frac{\\sqrt{161}-0}{8}=1,6 s.$", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Chọn chiều dương hướng xuống (cùng chiều chuyển động). Trọng lực $P = mg = 100$ N hướng xuống; lực cản $F_c = 20$ N hướng lên (ngược chiều chuyển động).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">a) Lực cản luôn ngược chiều chuyển động, tức ngược chiều trọng lực. Vậy ý a \u003cb
