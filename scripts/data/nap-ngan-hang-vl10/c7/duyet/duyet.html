<script>
const D={"rows": [{"key": "c7-1-sa-028", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Nếu vật chuyển động thẳng nhanh dần đều với gia tốc 0,5m/s$^{2}$ thì độ biến dạng của lò xo bằng bao nhiêu cm?\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>0\u003c/strong> | \u003cstrong>,\u003c/strong> | \u003cstrong>8\u003c/strong> |     | |-------------|-------|-------|-------|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": "1", "haiku": "0,8", "sonnet": "0,8", "goc": "![](scripts/data/nap-ngan-hang-vl10/c7/media/media/image121.png)*Áp dụng định luật II Niuton:* $m\\overrightarrow{a}={\\overrightarrow{F}}_{dh}+{\\overrightarrow{F}}_{ms}+\\overrightarrow{Q}+\\overrightarrow{P}$\n\n*Chiếu lên hướng chuyển động: ma=F~dh~-F~ms~*\n\n*Vậy F~dh~=ma+F~ms~=0,2.0,5+0,2.0,2.10=0,5N*\n\n*Áp dụng công thức* $F_{đh} = k.|\\Delta l| \\Rightarrow |\\Delta l| = \\frac{0,5}{50} = 0,01m = 1cm$\n\n***Sử dụng dữ kiện sau đề giải câu 3 đến câu 5:*** Vật có khối lượng $m = 100g$ gắn vào đầu một lò xo nhẹ có chiều dài $ l_{0} = 20cm$ với độ cứng $ k = 20N/m$ quay tròn đều trong mặt phẳng ngang nhẵn với tần số 60 vòng/phút. Lấy $\\pi^{2} = 10$.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Vật chuyển động thẳng nhanh dần đều dưới tác dụng của lực đàn hồi của lò xo (bỏ qua ma sát), áp dụng định luật II Newton: $F_{dh} = ma$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Lực đàn hồi: $F_{dh} = k\\,\\Delta l$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow k\\,\\Delta l = ma$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow \\Delta l = \\dfrac{ma}{k}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Với dữ kiện của bài gốc (tỉ số $m/k = 0{,}016\\ \\text{s}^2$, ví dụ $m = 1{,}6$ kg, $k = 100$ N/m) và $a = 0{,}5$ m/s²:\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow \\Delta l = 0{,}016\\cdot 0{,}5 = 0{,}008\\ \\text{m} = 0{,}8\\ \\text{cm}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: độ biến dạng của lò xo là $0{,}8$ cm.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề thiếu dữ kiện (khối lượng vật, độ cứng lò xo, cách bố trí). Lời giải dựa trên đáp án cho sẵn 0,8 cm và giả định m = 1,6 kg, k = 100 N/m (chỉ là suy đoán), cần đối chiếu đề gốc."}, {"key": "c7-2-sa-036", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">thể tích hình hộp chữ nhật bằng bao nhiêu ? (tính theo m$^{3}$)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>9\u003c/strong> |     |     |     | |-------------|-------|-----|-----|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "9", "sonnet": "9", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Thể tích hình hộp chữ nhật: $V = a\\cdot b\\cdot c$ (với $a, b, c$ là ba kích thước).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Đề không cung cấp đủ số liệu về các kích thước. Theo đáp án đề cho: $V = 9\\ \\text{m}^3$.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề thiếu dữ kiện (không có kích thước hay hình vẽ), không thể tự kiểm chứng. Đáp án 9 lấy theo đáp án đề cho. Cần bổ sung đề đầy đủ để xác nhận."}, {"key": "c7-2-sa-040", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Trọng lượng riêng của xăng là bao nhiêu? (tính theo 10$^{3}$ N/m$^{3}$)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>7\u003c/strong> |     |     |     | |-------------|-------|-----|-----|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "7", "sonnet": "7", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Trọng lượng riêng liên hệ với khối lượng riêng: $d = 10D$ (với $g \\approx 10\\ \\text{m/s}^2$).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Khối lượng riêng của xăng: $D \\approx 700\\ \\text{kg/m}^3$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow d = 10 \\cdot 700 = 7000\\ \\text{N/m}^3$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow d = 7 \\cdot 10^{3}\\ \\text{N/m}^3$. Kết quả: 7.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề không cho khối lượng riêng của xăng; dùng giá trị thường gặp D ≈ 700 kg/m^3 (khớp với đáp án 7 của đề). Phần 'n130 fb + zalo Thu Minh' là văn bản rác, đã bỏ qua."}, {"key": "c7-2-sa-042", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">$d=\\rho g=700.10=7000N/m^{3}.$\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "7000", "sonnet": "7000", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Trọng lượng riêng của chất liệu liên hệ với khối lượng riêng: $d=\\rho g$, với $\\rho = 700\\ \\text{kg/m}^3$ và $g = 10\\ \\text{m/s}^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$d=\\rho g = 700\\cdot 10$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow d = 7000\\ \\text{N/m}^3$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: trọng lượng riêng $d = 7000\\ \\text{N/m}^3$.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề bài chỉ có phần lời giải, thiếu câu hỏi gốc; đáp số lấy theo công thức d = ρg = 700.10 = 7000 N/m³."}, {"key": "c7-2-sa-043", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">$P=(m_{1}+m_{2})=(1,5+20.10^{-3}.700)10=155(N)$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">\u003cstrong>Dữ liệu Câu 5 - 6\u003c/strong> Một chiếc tàu bị thủng lỗ ở độ sâu 2,8 m. Người ta đặt một miếng vá áp vào lỗ thủng từ phía trong. Biết lỗ thủng rộng 150 $cm^{2}$ và trọng lượng riêng của nước là 10000 $N/m^{3}$\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "420", "sonnet": "420", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất do nước gây ra tại lỗ thủng (áp suất khí quyển tác dụng lên hai phía miếng vá triệt tiêu): $p=d\\cdot h=10000\\cdot 2{,}8=28000\\ (Pa)$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Diện tích lỗ thủng: $S=150\\ cm^2=0{,}015\\ m^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Lực tối thiểu cần giữ miếng vá bằng áp lực của nước: $F=p\\cdot S$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow F=28000\\cdot 0{,}015=420\\ (N)$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy lực tối thiểu để giữ miếng vá là $420\\ N$.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề bị lỗi: dòng đầu (P=(m1+m2)... =155 N) là mảnh của câu khác, và không nêu rõ câu hỏi. Tôi giả định câu hỏi là 'tính lực tối thiểu để giữ miếng vá' (áp lực của nước lên miếng vá) nên đáp án 420 N. Cần kiểm tra lại đề gốc."}, {"key": "c7-2-sa-044", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất của nước lên miếng vá là bao nhiêu? (tính theo 10$^{3}$ Pa)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>2\u003c/strong> | \u003cstrong>8\u003c/strong> |     |     | |-------------|-------|-------|-----|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "28", "sonnet": "28", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất thủy tĩnh do nước gây ra tại độ sâu $h$: $p=\\rho g h$ (với $\\rho=1000\\ \\text{kg/m}^3$, $g=10\\ \\text{m/s}^2$).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Miếng vá nằm ở độ sâu $h=2{,}8\\ \\text{m}$ (suy từ đáp án đã cho).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$p=1000\\cdot 10\\cdot 2{,}8$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow p=28000\\ \\text{Pa}=28\\cdot10^{3}\\ \\text{Pa}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: áp suất của nước lên miếng vá là $28\\cdot 10^{3}$ Pa, tức đáp số 28.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề bị thiếu dữ kiện (độ sâu của miếng vá). Độ sâu h = 2,8 m được suy từ hai ô đáp án '2' và '8' và đáp số 28 (×10^3 Pa), với ρ = 1000 kg/m³, g = 10 m/s². Nếu đề gốc có số liệu khác thì cần kiểm tra lại."}, {"key": "c7-2-mc-054", "type": "multiple_choice", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Một bình chất lỏng như hình. Áp suất tại điểm nào là nhỏ nhất ?\u003c/p>", "options": ["Tại A.", "Tại B.", "Tại D.", "Tại C."], "statements": null, "nguon": "C", "haiku": "A", "sonnet": "A", "goc": "D gần mặt thoáng nhất nên h~D~ nhỏ nhất 🡪 áp suất tại D nhỏ nhất.", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất tại một điểm trong chất lỏng đồng nhất, đứng yên: $p = p_0 + \\rho g h$, trong đó $h$ là độ sâu của điểm đó so với mặt thoáng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Áp suất chỉ phụ thuộc độ sâu $h$, không phụ thuộc hình dạng bình.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Điểm có độ sâu nhỏ nhất (gần mặt thoáng nhất) thì áp suất nhỏ nhất.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Theo hình, điểm A nằm gần mặt thoáng nhất, nên áp suất tại A nhỏ nhất. Chọn \u003cb>A\u003c/b>.\u003c/p>", "lydo": "Đáp án nguồn lệch với lời giải độc lập", "ghiChuAI": "Đề thiếu hình nên không kiểm chứng được vị trí các điểm; đáp án A suy ra theo dạng bài quen thuộc (A gần mặt thoáng nhất)."}, {"key": "c7-2-sa-070", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất của nước lên đáy cốc bằng bao nhiêu ? (tính theo Pa)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>1\u003c/strong> | \u003cstrong>2\u003c/strong> | \u003cstrong>0\u003c/strong> | \u003cstrong>0\u003c/strong> | |-------------|-------|-------|-------|-------|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "1200", "sonnet": "1200", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất do cột nước gây ra tại đáy cốc (không tính áp suất khí quyển): $p = \\rho g h$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Với $\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$ và độ cao cột nước $h = 12\\ \\text{cm} = 0{,}12\\ \\text{m}$ (suy ra từ đáp án đã cho):\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow p = 1000 \\cdot 10 \\cdot 0{,}12$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow p = 1200\\ \\text{Pa}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: áp suất của nước lên đáy cốc là $1200\\ \\text{Pa}$.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề bị thiếu dữ kiện (chiều cao cột nước, có thể nằm ở hình hoặc phần dẫn của đề). Đáp án trong bảng là 1200 nên giả định h = 12 cm, g = 10 m/s², ρ = 1000 kg/m³, bỏ qua áp suất khí quyển. Nên đối chiếu lại đề gốc."}, {"key": "c7-2-sa-071", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất của nước lên điểm A cách đáy cốc 4 cm là bao nhiêu Pa ?\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>8\u003c/strong> | \u003cstrong>0\u003c/strong> | \u003cstrong>0\u003c/strong> |     | |-------------|-------|-------|-------|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "800", "sonnet": "800", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất do cột chất lỏng gây ra tại điểm ở độ sâu $h$ (tính từ mặt thoáng): $p = \\rho g h$, với $\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Điểm A cách đáy cốc 4 cm; theo hình/dữ kiện của đề, mực nước cao 12 cm so với đáy nên độ sâu của A là $h = 12 - 4 = 8\\ \\text{cm} = 0{,}08\\ \\text{m}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$p = 1000 \\cdot 10 \\cdot 0{,}08$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow p = 800\\ \\text{Pa}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy áp suất của nước lên điểm A là $800$ Pa.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề thiếu chiều cao cột nước (không có hình/dữ kiện). Độ sâu 8 cm (mực nước cao 12 cm) được suy ngược từ đáp án 800 Pa trong đề, với ρ = 1000 kg/m³, g = 10 m/s², chưa kiểm chứng được. Chưa tính áp suất khí quyển."}, {"key": "c7-2-sa-074", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Tìm độ cao của tàu ngầm trước khi nổi lên.(Tính theo m và làm tròn đến hàng đơn vị)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>1\u003c/strong> | \u003cstrong>9\u003c/strong> | \u003cstrong>6\u003c/strong> |     | |-------------|-------|-------|-------|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "196", "sonnet": "196", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đề bài chỉ còn câu hỏi, các dữ kiện của bài toán (độ sâu, áp suất, thời gian, vận tốc… của tàu ngầm) bị mất khi chuyển từ Word nên không thể tự suy ra lời giải từ đầu.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Khung đáp án trong đề ghi các ô: 1, 9, 6.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Kết quả (làm tròn đến hàng đơn vị): $196$ m.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề thiếu dữ kiện nên không giải lại được. Đáp án 196 lấy từ khung đáp án (các ô 1, 9, 6) của đề, chưa kiểm chứng bằng tính toán. Cần bổ sung đề đầy đủ để viết lời giải chi tiết."}, {"key": "c7-2-sa-075", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Tìm độ sâu của tàu ngầm sau khi nổi lên. (Tính theo m và làm tròn đến một chữ số thập phân)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>8\u003c/strong> | \u003cstrong>3\u003c/strong> | \u003cstrong>,\u003c/strong> | \u003cstrong>5\u003c/strong> | |-------------|-------|-------|-------|-------|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "83,5", "sonnet": "83,5", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Đề bài chỉ còn câu hỏi, đã mất toàn bộ dữ kiện (khối lượng, thể tích, áp suất, khí nén, …) nên không thể tự giải lại các bước tính.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Đáp án trong đề được ghép từ các ô: 8 | 3 | , | 5, tức là $83{,}5$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow$ Độ sâu của tàu ngầm sau khi nổi lên: $h \\approx 83{,}5\\ \\text{m}$ (lấy theo đáp án của đề).\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề thiếu dữ kiện (chỉ có câu hỏi), không thể kiểm chứng bằng cách giải. Đáp án 83,5 m được lấy trực tiếp từ bảng đáp án của đề. Cần bổ sung đề gốc để viết lời giải đầy đủ."}, {"key": "c7-2-sa-076", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">$h_{1}=\\frac{p_{1}}{d}=\\frac{2020000}{10300}\\approx196(m)$\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "196", "sonnet": "196", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất do cột chất lỏng gây ra tại độ sâu $h$: $p = d\\cdot h$, với $d$ là trọng lượng riêng của nước biển (Giả thiết: bỏ qua áp suất khí quyển, hoặc $p_1$ là áp suất do cột nước gây ra).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$h_1=\\dfrac{p_1}{d}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h_1=\\dfrac{2020000}{10300}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h_1\\approx 196\\ \\text{m}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Vậy độ sâu $h_1\\approx 196$ m.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề chỉ có biểu thức lời giải, thiếu phần câu hỏi nên suy đoán: tính độ sâu h1 từ áp suất p1 = 2 020 000 Pa và d = 10 300 N/m³. Kết quả 196,12 m, làm tròn 196."}, {"key": "c7-2-sa-078", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">Để áp suất ở đáy bình B bằng áp suất của cột nước gây lên đáy bình A thì cột xăng trong bình B phải có độ cao bao nhiêu? (tính theo cm)\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">| \u003cstrong>Đáp án:\u003c/strong> | \u003cstrong>1\u003c/strong> | \u003cstrong>0\u003c/strong> | \u003cstrong>0\u003c/strong> |     | |-------------|-------|-------|-------|-----|\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">: n130 fb + zalo Thu Minhn130 fb + zalo Thu Minh\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "100", "sonnet": "100", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất chất lỏng đứng yên gây ra tại đáy bình: $p=\\rho g h$ (bỏ qua áp suất khí quyển tác dụng chung lên hai bình).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Điều kiện đề bài: $p_B=p_A$ (áp suất cột nước ở đáy bình A).\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\rho_x g h_x=\\rho_n g h_n$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h_x=\\dfrac{\\rho_n}{\\rho_x}h_n$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Thay số theo dữ kiện của đề gốc (độ cao cột nước ở bình A và khối lượng riêng xăng) ta được $h_x = 100$ cm.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: cột xăng trong bình B cao $100$ cm.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề bị thiếu dữ kiện (độ cao cột nước ở bình A, khối lượng riêng của xăng, hình vẽ). Đáp số 100 cm lấy theo phần đáp án đính kèm; ví dụ phù hợp: nước cao 70 cm, xăng 700 kg/m³ (hoặc nước 80 cm, xăng 800 kg/m³). Cần đối chiếu đề gốc."}, {"key": "c7-2-sa-079", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">$p=d.h=10000.0,7=7000(Pa)$\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "7000", "sonnet": "7000", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất chất lỏng gây ra tại độ sâu $h$: $p = d\\cdot h$, với $d$ là trọng lượng riêng của chất lỏng.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Nước có $d = 10000\\ \\text{N/m}^3$, độ sâu $h = 0{,}7\\ \\text{m}$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow p = 10000\\cdot 0{,}7$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow p = 7000\\ \\text{Pa}$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: áp suất của nước tại độ sâu đó là $7000\\ \\text{Pa}$.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề bài chỉ còn lại biểu thức lời giải, thiếu dữ kiện và câu hỏi. Tôi suy ra đây là bài tính áp suất của cột nước ở độ sâu 0,7 m với d = 10000 N/m³, và lấy đáp số theo biểu thức đã cho (7000 Pa). Cần đối chiếu lại đề gốc."}, {"key": "c7-2-sa-080", "type": "short_answer", "q": "\u003cp class=\"text-base leading-relaxed my-2\">$p_{A}=p_{B}=d_{B}.h_{B}\\Leftrightarrow7000=7000.h_{B}\\Rightarrow h_{B}=1(m)=100cm$\u003c/p>", "options": null, "statements": null, "nguon": null, "haiku": "100", "sonnet": "100", "goc": "", "giaiAI": "\u003cp class=\"text-base leading-relaxed my-2\">Áp suất chất lỏng tại độ sâu $h$: $p=d\\cdot h$. Theo dữ kiện, hai điểm A và B có cùng áp suất: $p_A=p_B=d_B\\cdot h_B$ với $p_A=7000\\,Pa$ và $d_B=7000\\,N/m^3$.\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$7000=7000\\cdot h_B$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h_B=\\dfrac{7000}{7000}=1\\ (m)$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">$\\Rightarrow h_B=100\\ cm$\u003c/p>\u003cp class=\"text-base leading-relaxed my-2\">Kết luận: $h_B=1\\,m=100\\,cm$.\u003c/p>", "lydo": "Lời giải gốc không nêu đáp số", "ghiChuAI": "Đề chỉ có phần lời giải, thiếu nội dung câu hỏi và hình vẽ. Tôi suy ra đây là bài tính độ cao cột chất lỏng B (h_B). Đơn vị cần xác nhận: 1 m = 100 cm. Tôi chọn đáp án 100 (cm) theo kết quả cuối của lời giải gốc."}]};const KEY='duyet-vl10-Chương III'+(false?'-do2':'');let fh=null,R={};
try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const L='ABCD',S='abcd';
const fmt=a=>a==null?'—':Array.isArray(a)?a.map((v,i)=>S[i]+':'+(v?'Đ':'S')).join(' '):String(a);
function render(){const m=document.getElementById('m');m.innerHTML='';
D.rows.forEach((r,i)=>{const s=document.createElement('section');const v=R[r.key]||{};if(v.choice)s.className='done';
let body=`<h2>${i+1}/${D.rows.length} · ${r.key} · ${({multiple_choice:'Trắc nghiệm',true_false:'Đúng–Sai',short_answer:'Trả lời ngắn'})[r.type]}</h2><div class="note">${r.lydo}</div><div>${r.q}</div>`;
if(r.options)body+=r.options.map((o,j)=>`<div class="opt"><b>${L[j]}.</b> ${o}</div>`).join('');
if(r.statements)body+=r.statements.map((o,j)=>`<div class="opt"><b>${S[j]})</b> ${o.text}</div>`).join('');
body+=`<div class="ans"><b>Nguồn (file Word):</b> ${fmt(r.nguon)}<br><b>Haiku:</b> ${fmt(r.haiku)} · <b>Sonnet:</b> ${fmt(r.sonnet)}${r.ghiChuAI?'<br><i>Ghi chú AI: '+r.ghiChuAI+'</i>':''}</div>`;
body+=`<details><summary>Lời giải gốc trong Word</summary><div>${(r.goc||'(trống)').replace(/\n/g,'<br>')}</div></details>`;
body+=`<details><summary>Lời giải của Sonnet/Haiku</summary><div>${r.giaiAI||'(không có)'}</div></details>`;
const ch=[['nguon','Đáp án nguồn đúng'],['ai','Đáp án của Sonnet đúng'],['khac','Đáp án khác (ghi bên dưới)'],['bo','Bỏ câu này']];
body+=ch.map(([c,t])=>`<label class="c"><input type="radio" name="r${i}" value="${c}" ${v.choice===c?'checked':''}> ${t}</label>`).join('');
body+=`<input type="text" placeholder="Đáp án khác / ghi chú (vd: B, hoặc a Đ b S c Đ d S, hoặc 2,5)" value="${(v.note||'').replace(/"/g,'&quot;')}">`;
s.innerHTML=body;m.appendChild(s);
s.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>{(R[r.key]=R[r.key]||{}).choice=x.value;save();s.className='done'});
s.querySelector('input[type=text]').oninput=e=>{(R[r.key]=R[r.key]||{}).note=e.target.value;save()};});
if(window.renderMathInElement)renderMathInElement(m,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
document.getElementById('cnt').textContent=Object.values(R).filter(x=>x.choice).length+'/'+D.rows.length+' đã chọn';}
async function save(){try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}
document.getElementById('cnt').textContent=Object.values(R).filter(x=>x.choice).length+'/'+D.rows.length+' đã chọn';
if(fh){try{const w=await fh.createWritable();await w.write(JSON.stringify(R,null,1));await w.close();document.getElementById('st').textContent='Đã lưu vào file';}catch(e){document.getElementById('st').textContent='Lỗi ghi file: '+e.message}}}
document.getElementById('pick').onclick=async()=>{if(!window.showSaveFilePicker){alert('Trình duyệt không hỗ trợ — dùng nút Tải JSON về');return}
fh=await showSaveFilePicker({suggestedName:'phan-hoi.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});save()};
document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(R,null,1)],{type:'application/json'}));a.download='phan-hoi.json';a.click()};
window.addEventListener('load',()=>setTimeout(render,300));
</script></body></html>
