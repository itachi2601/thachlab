<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Nền thẻ chuẩn ThachLab -->
  <rect width="400" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Tiêu đề & Nhãn lớp -->
  <rect x="20" y="18" width="76" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="58" y="34" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">KHTN 9</text>
  <text x="380" y="34" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">Quang học · Thấu kính hội tụ</text>

  <!-- Trục chính Delta -->
  <line x1="30" y1="150" x2="370" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="375" y="154" fill="#64748b" font-size="12" font-weight="600">Δ</text>

  <!-- Thấu kính hội tụ tại x = 180 -->
  <line x1="180" y1="60" x2="180" y2="240" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 72 L180 60 L188 72" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M172 228 L180 240 L188 228" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quang tâm O & Tiêu điểm F, F' -->
  <circle cx="180" cy="150" r="3.5" fill="#1e293b"/>
  <text x="170" y="168" fill="#1e293b" font-size="13" font-weight="700">O</text>

  <circle cx="115" cy="150" r="3.5" fill="#1e293b"/>
  <text x="115" y="170" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">F</text>

  <circle cx="245" cy="150" r="3.5" fill="#1d4ed8"/>
  <text x="245" y="170" fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle">F&apos;</text>

  <!-- Vật sáng AB tại x = 60, cao 45 (y từ 150 lên 105) -->
  <line x1="60" y1="150" x2="60" y2="105" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M54 115 L60 105 L66 115" fill="none" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="103" fill="#1e293b" font-size="12" font-weight="700">B</text>
  <text x="48" y="165" fill="#1e293b" font-size="12" font-weight="700">A</text>

  <!-- Tia 1: Song song trục chính -> qua F' -->
  <line x1="60" y1="105" x2="180" y2="105" stroke="#0284c7" stroke-width="2"/>
  <path d="M115 101 L124 105 L115 109" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="105" x2="340" y2="216" stroke="#0284c7" stroke-width="2"/>
  <path d="M255 152 L264 158 L258 166" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>

  <!-- Tia 2: Qua quang tâm O truyền thẳng -->
  <line x1="60" y1="105" x2="340" y2="210" stroke="#b45309" stroke-width="2"/>
  <path d="M120 124 L129 127 L124 133" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Tia 3: Qua F -> khúc xạ song song trục chính -->
  <line x1="60" y1="105" x2="180" y2="203" stroke="#047857" stroke-width="2"/>
  <path d="M96 130 L104 137 L98 143" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="203" x2="340" y2="203" stroke="#047857" stroke-width="2"/>
  <path d="M255 199 L264 203 L255 207" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>

  <!-- Ảnh thật A'B' tại x = 320, cao 52 (ngược chiều) -->
  <line x1="320" y1="150" x2="320" y2="202" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M314 192 L320 202 L326 192" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="210" fill="#b91c1c" font-size="12" font-weight="700">B&apos;</text>
  <text x="330" y="146" fill="#b91c1c" font-size="12" font-weight="700">A&apos;</text>

  <!-- Vạch đo tiêu cự f -->
  <line x1="180" y1="256" x2="245" y2="256" stroke="#64748b" stroke-width="1.2"/>
  <line x1="180" y1="251" x2="180" y2="261" stroke="#64748b" stroke-width="1.2"/>
  <line x1="245" y1="251" x2="245" y2="261" stroke="#64748b" stroke-width="1.2"/>
  <text x="212" y="268" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">tiêu cự f</text>

  <!-- Chân thẻ: Công thức chuẩn -->
  <text x="20" y="282" fill="#0f172a" font-size="12" font-weight="600">Tạo ảnh qua thấu kính</text>
  <text x="380" y="282" fill="#475569" font-size="12" font-weight="500" text-anchor="end">1/f = 1/d + 1/d&apos;</text>
</svg>