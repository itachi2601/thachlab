<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Nền thẻ chuẩn ThachLab -->
  <rect width="400" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Tiêu đề & Nhãn lớp -->
  <rect x="20" y="18" width="88" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="34" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">VẬT LÝ 12</text>
  <text x="380" y="34" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">Vật lý Nhiệt &amp; Khí lý tưởng</text>

  <!-- NỬA TRÁI: Mô hình Xilanh & Piston chứa khí lý tưởng -->
  <!-- Khối khí bên trong xilanh -->
  <rect x="36" y="125" width="118" height="100" fill="#f0f9ff"/>

  <!-- Thành xilanh (U-shape) -->
  <path d="M35 85 L35 225 L155 225 L155 85" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Piston di động -->
  <rect x="37" y="117" width="116" height="16" rx="2" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <line x1="95" y1="117" x2="95" y2="80" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Áp suất p / Lực nén F từ ngoài -->
  <line x1="95" y1="56" x2="95" y2="76" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M91 70 L95 76 L99 70" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="105" y="70" fill="#b91c1c" font-size="11" font-weight="700">p, F</text>

  <!-- Các phân tử khí chuyển động nhiệt hỗn loạn (kèm đuôi vận tốc) -->
  <!-- Hạt 1 -->
  <circle cx="58" cy="150" r="3.5" fill="#0284c7"/>
  <line x1="58" y1="150" x2="72" y2="158" stroke="#64748b" stroke-width="1.2"/>

  <!-- Hạt 2 -->
  <circle cx="82" cy="175" r="3.5" fill="#0284c7"/>
  <line x1="82" y1="175" x2="94" y2="165" stroke="#64748b" stroke-width="1.2"/>

  <!-- Hạt 3 -->
  <circle cx="120" cy="155" r="3.5" fill="#0284c7"/>
  <line x1="120" y1="155" x2="108" y2="150" stroke="#64748b" stroke-width="1.2"/>

  <!-- Hạt 4 -->
  <circle cx="68" cy="198" r="3.5" fill="#0284c7"/>
  <line x1="68" y1="198" x2="56" y2="190" stroke="#64748b" stroke-width="1.2"/>

  <!-- Hạt 5 -->
  <circle cx="112" cy="202" r="3.5" fill="#0284c7"/>
  <line x1="112" y1="202" x2="126" y2="202" stroke="#64748b" stroke-width="1.2"/>

  <!-- Hạt 6 -->
  <circle cx="132" cy="182" r="3.5" fill="#0284c7"/>
  <line x1="132" y1="182" x2="122" y2="174" stroke="#64748b" stroke-width="1.2"/>

  <!-- Hạt 7 -->
  <circle cx="95" cy="142" r="3.5" fill="#0284c7"/>
  <line x1="95" y1="142" x2="95" y2="154" stroke="#64748b" stroke-width="1.2"/>

  <!-- Nhiệt lượng Q từ đáy -->
  <path d="M75 240 Q80 234 85 240 T95 240 M95 240 Q100 234 105 240 T115 240" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="95" y="255" fill="#ea580c" font-size="11" font-weight="700" text-anchor="middle">Nhiệt lượng Q</text>

  <!-- NỬA PHẢI: Đồ thị trạng thái p - V (Đẳng nhiệt Boyle - Mariotte) -->
  <!-- Trục toạ độ p và V -->
  <line x1="205" y1="225" x2="205" y2="70" stroke="#64748b" stroke-width="1.8"/>
  <path d="M201 78 L205 70 L209 78" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="75" fill="#64748b" font-size="12" font-weight="700">p</text>

  <line x1="205" y1="225" x2="370" y2="225" stroke="#64748b" stroke-width="1.8"/>
  <path d="M362 221 L370 225 L362 229" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="372" y="238" fill="#64748b" font-size="12" font-weight="700">V</text>

  <text x="195" y="238" fill="#64748b" font-size="11" font-weight="600">O</text>

  <!-- Đường cong đẳng nhiệt hypebol (T = hằng số) -->
  <path d="M 228 100 Q 252 170, 348 195" fill="none" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round"/>
  <text x="328" y="165" fill="#1d4ed8" font-size="11" font-weight="700">T = const</text>

  <!-- Mũi tên chiều quá trình giãn nở trên đường cong -->
  <path d="M 276 160 L 286 167 L 283 155" fill="#1d4ed8"/>

  <!-- Trạng thái 1 (p1, V1) -->
  <circle cx="238" cy="118" r="4" fill="#b91c1c"/>
  <text x="246" y="116" fill="#b91c1c" font-size="11" font-weight="700">(1)</text>
  <line x1="238" y1="118" x2="205" y2="118" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="238" y1="118" x2="238" y2="225" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="194" y="122" fill="#475569" font-size="10" font-weight="600">p₁</text>
  <text x="238" y="237" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">V₁</text>

  <!-- Trạng thái 2 (p2, V2) -->
  <circle cx="318" cy="188" r="4" fill="#047857"/>
  <text x="326" y="194" fill="#047857" font-size="11" font-weight="700">(2)</text>
  <line x1="318" y1="188" x2="205" y2="188" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="318" y1="188" x2="318" y2="225" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="194" y="192" fill="#475569" font-size="10" font-weight="600">p₂</text>
  <text x="318" y="237" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">V₂</text>

  <!-- Chân thẻ: Phương trình trạng thái & Định luật Boyle -->
  <text x="20" y="282" fill="#0f172a" font-size="12" font-weight="600">Phương trình trạng thái khí lý tưởng</text>
  <text x="380" y="282" fill="#475569" font-size="12" font-weight="500" text-anchor="end">p·V = n·R·T  ·  p₁V₁ = p₂V₂</text>
</svg>