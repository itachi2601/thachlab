<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />

  <!-- Tiêu đề -->
  <text x="270" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Đồ thị dao động của đỉnh tháp: Có TMD vs Không có TMD</text>
  <text x="270" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Piston dầu nuốt cơ năng giúp giảm 40% biên độ và dập tắt lắc nhanh chóng</text>

  <!-- Lưới toạ độ mờ -->
  <line x1="70" y1="100" x2="490" y2="100" stroke="#f1f5f9" stroke-width="1" />
  <line x1="70" y1="160" x2="490" y2="160" stroke="#e2e8f0" stroke-width="1.5" /> <!-- Trục 0 -->
  <line x1="70" y1="220" x2="490" y2="220" stroke="#f1f5f9" stroke-width="1" />

  <!-- Trục toạ độ x - t -->
  <!-- Trục tung x (Li độ) -->
  <line x1="70" y1="260" x2="70" y2="65" stroke="#334155" stroke-width="2" />
  <polygon points="70,60 66,72 74,72" fill="#334155" />
  <text x="55" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">x (m)</text>
  <text x="52" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">+1,5</text>
  <text x="58" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">0</text>
  <text x="52" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">-1,5</text>

  <!-- Trục hoành t (Thời gian) -->
  <line x1="70" y1="160" x2="495" y2="160" stroke="#334155" stroke-width="2" />
  <polygon points="500,160 488,156 488,164" fill="#334155" />
  <text x="495" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start">t (s)</text>

  <!-- ĐƯỜNG 1: KHÔNG CÓ CON LẮC (Đỏ nét đứt - tắt rất chậm, biên độ lớn) -->
  <!-- Đỉnh 1 (+80), Đáy 1 (-75), Đỉnh 2 (+70), Đáy 2 (-65), Đỉnh 3 (+60)... -->
  <path d="M 70 160 
           Q 95 65, 120 160 
           T 170 160 
           T 220 160 
           T 270 160 
           T 320 160 
           T 370 160 
           T 420 160 
           T 470 160" 
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- ĐƯỜNG 2: CÓ CON LẮC GIẢM CHẤN TMD (Xanh dương nét liền - dập tắt nhanh, biên độ giảm 40%) -->
  <!-- Đỉnh 1 (+48), Đáy 1 (-36), Đỉnh 2 (+22), Đáy 2 (-12), Đỉnh 3 (+5)... -->
  <path d="M 70 160 
           C 85 105, 100 115, 115 160
           C 130 195, 145 190, 160 160
           C 175 135, 190 140, 205 160
           C 220 175, 235 170, 250 160
           C 265 152, 280 154, 295 160
           C 310 165, 325 163, 340 160
           L 470 160" 
        fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />

  <!-- CHÚ THÍCH (LEGEND) -->
  <rect x="235" y="65" width="250" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="0.95" />
  
  <line x1="248" y1="83" x2="278" y2="83" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,3" />
  <text x="286" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Không có TMD (lắc mạnh, lâu tắt)</text>

  <line x1="248" y1="107" x2="278" y2="107" stroke="#2563eb" stroke-width="3" />
  <text x="286" y="111" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Có TMD (giảm ~40% lắc, dập tắt nhanh)</text>

  <!-- Mũi tên chỉ khoảng giảm biên độ -->
  <path d="M 120 75 L 120 115" stroke="#059669" stroke-width="1.5" />
  <polygon points="120,75 117,83 123,83" fill="#059669" />
  <polygon points="120,115 117,107 123,107" fill="#059669" />
  <text x="130" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">Giảm ~40%</text>

  <!-- Chân trang -->
  <text x="270" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Sau vài chu kỳ, cơ năng truyền sang con lắc và tiêu tán trong piston dầu thành nhiệt.</text>
</svg>