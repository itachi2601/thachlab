<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />

  <!-- Tiêu đề sơ đồ -->
  <text x="270" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Thí nghiệm tại nhà: Xoay mô-tơ đồ chơi thắp sáng đèn LED</text>
  <text x="270" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Quay trục bằng tay → đèn sáng &amp; ngón tay cảm nhận lực hãm</text>

  <!-- MÔ-TƠ ĐỒ CHƠI (BÊN TRÁI) -->
  <g transform="translate(60, 80)">
    <!-- Trục mô-tơ -->
    <rect x="0" y="60" width="45" height="10" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    
    <!-- Mũi tên xoay trục bằng tay -->
    <path d="M 15 45 A 25 25 0 1 1 5 75" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="5,75 2,65 12,68" fill="#2563eb" />
    <text x="18" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Xoay nhanh</text>

    <!-- Mũi tên phản lực hãm ngược chiều -->
    <path d="M 30 85 A 20 20 0 0 1 18 55" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" />
    <polygon points="18,55 24,62 16,66" fill="#dc2626" />
    <text x="25" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Cảm nhận lực ghì</text>

    <!-- Vỏ thân mô-tơ -->
    <rect x="45" y="30" width="95" height="70" rx="10" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <!-- Khối gờ kim loại mô-tơ -->
    <rect x="55" y="40" width="75" height="50" rx="6" fill="#475569" />
    <text x="92" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Mô-tơ nhỏ</text>
    <text x="92" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">(làm máy phát)</text>

    <!-- Hai cực nối ra sau -->
    <rect x="140" y="45" width="12" height="10" rx="2" fill="#d97706" />
    <rect x="140" y="75" width="12" height="10" rx="2" fill="#d97706" />
  </g>

  <!-- DÂY DẪN ĐIỆN NỐI SANG ĐÈN LED -->
  <!-- Dây dương (đỏ) -->
  <path d="M 212 130 C 260 130, 290 110, 340 110" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <!-- Dây âm (xanh đen) -->
  <path d="M 212 160 C 260 160, 290 180, 340 180" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Mũi tên dòng điện chạy qua dây -->
  <polygon points="280,120 270,115 272,125" fill="#ef4444" />
  <text x="275" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ef4444" text-anchor="middle">Dòng điện nạp</text>

  <!-- ĐÈN LED PHÁT SÁNG (BÊN PHẢI) -->
  <g transform="translate(340, 95)">
    <!-- Chân LED -->
    <line x1="0" y1="15" x2="35" y2="40" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="0" y1="85" x2="35" y2="60" stroke="#94a3b8" stroke-width="2.5" />

    <!-- Quầng sáng LED -->
    <circle cx="55" cy="50" r="38" fill="#fef08a" opacity="0.6" />
    <circle cx="55" cy="50" r="28" fill="#fde047" opacity="0.7" />

    <!-- Các tia sáng toả ra -->
    <line x1="55" y1="10" x2="55" y2="0" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />
    <line x1="85" y1="20" x2="95" y2="12" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />
    <line x1="98" y1="50" x2="108" y2="50" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />
    <line x1="85" y1="80" x2="95" y2="88" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="90" x2="55" y2="100" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />

    <!-- Thân bóng LED -->
    <path d="M 40 32 C 40 22, 70 22, 70 32 L 70 65 C 70 68, 40 68, 40 65 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <rect x="37" y="65" width="36" height="5" rx="2" fill="#ca8a04" />

    <text x="55" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">Đèn LED loé sáng</text>
  </g>

  <!-- Ghi chú chốt cơ chế ở chân hình -->
  <rect x="50" y="240" width="440" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="270" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">💡 Cơ năng quay → Điện năng thắp sáng LED &amp; Định luật Lenz sinh lực cản ngược chiều</text>
</svg>