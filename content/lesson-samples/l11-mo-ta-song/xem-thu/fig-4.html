<!doctype html><html lang="vi"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="file:///Users/MAC/Projects/thachlab/node_modules/katex/dist/katex.min.css">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0f172a;color:#e2e8f0;font:16px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
.exam-content{display:block}
h1{font-size:20px;margin:0 0 4px} .sub{color:#94a3b8;font-size:13px;margin:0 0 16px}
/* Hình vẽ SVG nội tuyến (đồ thị, sơ đồ vẽ lại) — không nền trắng, nét theo currentColor */
.exam-content figure.fig {
  max-width: min(100%, 420px);
  margin: 0.9rem auto;
}
.exam-content figure.fig svg {
  display: block;
  width: 100%;
  height: auto;
}
.exam-content figure.fig figcaption {
  margin-top: 0.35rem;
  font-size: 0.85em;
  color: #94a3b8;
  text-align: center;
}

/* Bài lý thuyết tương tác (không JS): hộp dự đoán/định nghĩa, <details> bấm mở, trắc nghiệm tự chấm
   bằng radio + :checked (HTML lưu DB không được chứa <script>/on*=). Mẫu: content/lesson-samples/. */
.exam-content .tl-box { margin: 16px 0; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.07); }
.exam-content .tl-box--rule { border-color: rgba(250,204,21,.35); background: rgba(250,204,21,.08); }
.exam-content .tl-box > p:last-child, .exam-content .tl-box > ul:last-child { margin-bottom: 0; }
.exam-content .tl-label { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em; color: #22d3ee; text-align: left; }
.exam-content .tl-box--rule .tl-label { color: #fbbf24; }
.exam-content .tl-details { margin: 14px 0; border: 1px solid rgba(148,163,184,.35); border-radius: 12px; background: rgba(148,163,184,.08); }
.exam-content .tl-details > summary { cursor: pointer; padding: 11px 14px; font-weight: 700; list-style: none; }
.exam-content .tl-details > summary::-webkit-details-marker { display: none; }
.exam-content .tl-details > summary::after { content: "▾"; float: right; transition: transform .15s; }
.exam-content .tl-details[open] > summary::after { transform: rotate(180deg); }
.exam-content .tl-details > :not(summary) { margin-left: 14px; margin-right: 14px; }
.exam-content .tl-details > :last-child { margin-bottom: 14px; }
.exam-content .tl-quiz { display: grid; gap: 8px; margin-top: 10px; }
.exam-content .tl-quiz > input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.exam-content .tl-opt { display: block; padding: 10px 14px; border: 1px solid rgba(148,163,184,.4); border-radius: 10px; cursor: pointer; line-height: 1.5; transition: background-color .15s, border-color .15s; }
.exam-content .tl-opt:hover { border-color: #22d3ee; }
.exam-content .tl-quiz > input:focus-visible + .tl-opt { outline: 2px solid #22d3ee; outline-offset: 2px; }
.exam-content .tl-quiz > input:checked + .tl-opt.tl-ok { border-color: #34d399; background: rgba(52,211,153,.18); }
.exam-content .tl-quiz > input:checked + .tl-opt.tl-no { border-color: #f87171; background: rgba(248,113,113,.16); }
.exam-content .tl-fb { display: none; padding: 10px 14px; border-radius: 10px; }
.exam-content .tl-fb p { margin: 0; text-align: left; }
.exam-content .tl-fb--ok { background: rgba(52,211,153,.14); }
.exam-content .tl-fb--no { background: rgba(248,113,113,.12); }
.exam-content .tl-quiz:has(input:checked + .tl-ok) > .tl-fb--ok { display: block; }
.exam-content .tl-quiz:has(input:checked + .tl-no) > .tl-fb--no { display: block; }
.exam-content .tl-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: .95em; }
.exam-content .tl-table :is(th, td) { padding: 8px 10px; border: 1px solid rgba(148,163,184,.4); text-align: left; vertical-align: top; }
.exam-content .tl-table th { background: rgba(148,163,184,.14); }
html[data-theme="light"] .exam-content .tl-label { color: #0e7490; }
html[data-theme="light"] .exam-content .tl-box--rule .tl-label { color: #b45309; }
html[data-theme="light"] .exam-content .tl-opt { border-color: rgba(15,23,42,.25); }
/* Bài lý thuyết tương tác — thí nghiệm/ví dụ (Làm–Quan sát–Rút ra), bảng "đề → dữ liệu → kiến thức", danh sách bước */
.exam-content .tl-box--exp { border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
.exam-content .tl-box--exp .tl-label { color: #34d399; }
.exam-content .tl-steps { margin: 0 0 12px; padding-left: 22px; }
.exam-content .tl-steps > li { margin-bottom: 8px; }
.exam-content .tl-table--data td:nth-child(2) { color: #fbbf24; font-weight: 600; }
.exam-content .tl-box .tl-details { background: transparent; }
html[data-theme="light"] .exam-content .tl-box--exp .tl-label { color: #047857; }
html[data-theme="light"] .exam-content .tl-table--data td:nth-child(2) { color: #b45309; }

/* ============================================================
   TRANG CHƯƠNG — chế độ "pick" (đồng bộ khung với trang bài học)
     < 1024px   accordion cả khoá ở cột giữa như trước, KHÔNG cột trái, không dải sticky
     >= 1024px  cột trái 272px là cây chương, cột giữa chỉ hiện chương đang chọn
   ============================================================ */
.class-pick-desktop { display: none; }
.class-pick-mobile { display: grid; gap: 28px; }

@media (max-width: 1023px) {
  /* Giữ nguyên hình học cũ: .lesson-main--single vẫn tự căn 760px và giữ padding của nó. */
  .lesson-layout--pick { display: block; max-width: none; padding: 0; }
  .lesson-layout--pick .lesson-nav { display: none; }
}

@media (min-width: 1024px) {
  .lesson-layout--pick .class-pick-desktop { display: grid; gap: 28px; }
  .lesson-layout--pick .class-pick-mobile { display: none; }
  /* Cột giữa chỉ còn một chương nên "Mở tất cả / Thu gọn" không còn việc. */
  .lesson-layout--pick .class-toc-toolbar { display: none; }
  /* Thẻ "Tiếp tục học" đã chuyển sang cột trái. */
  .lesson-layout--pick .class-continue--main { display: none; }
  /* Cột giữa rộng đúng bằng cột giữa trang bài: bỏ padding/max-width của .lesson-main--single. */
  .lesson-layout--pick > .lesson-main { margin: 0; max-width: none; padding: 0; }
  /* Cột trái 272px: thẻ "Tiếp tục học" xếp dọc cho vừa. */
  .lesson-layout--pick .lesson-nav .class-continue { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
  .lesson-layout--pick .lesson-nav .class-continue .lesson-btn { justify-content: center; }
}

/* Chưa có rail bên phải (đợt 4) -> giữ 2 cột kể cả >= 1320px, không để trống cột 3. */
@media (min-width: 1320px) {
  .lesson-layout--pick { grid-template-columns: 272px minmax(0, 1fr); }
}

/* ---------- < 640px: thanh đáy 3 nút của trang chương thay tabbar toàn site ----------
   Hai thanh đều position:fixed ở đáy nên không thể cùng hiện; chọn thanh của trang chương
   (giống trang bài: nơi có thanh riêng thì tabbar tự ẩn). Chừa đúng 62px như trang bài. */
@media (max-width: 639px) {
  body:has(.lesson-bottombar--pick) .mobile-tabbar { display: none; }
  body:has(.lesson-bottombar--pick) { padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
}

/* Trang bài học (tối) — phong cách đọc phẳng theo trang mẫu: nền xanh đen #0f172a không quầng sáng,
   chữ sans-serif hệ thống 16px/1.75, công thức KaTeX nằm liền dòng (không khung, không cuộn riêng).
   Nền phẳng áp cho mọi .lesson-shell (trang lớp/chương, bài, khoá học) để đồng bộ với trang bài; phần chữ chỉ cho .lesson-page; giao diện tối; giao diện sáng giữ nguyên. */
html:not([data-theme="light"]) .lesson-shell { background: #0f172a; }
html:not([data-theme="light"]) .lesson-shell::before { display: none; }
.lesson-page .exam-content { font-family: var(--font-body), ui-sans-serif, system-ui, sans-serif; font-size: 1rem; line-height: 1.75; }
.lesson-page .exam-content .katex { display: inline; max-width: none; overflow: visible; vertical-align: baseline; }
.lesson-page .exam-content .katex-display { margin: 1em 0; padding: 0; border: 0; border-radius: 0; background: none; text-align: center; }
.lesson-page .exam-content .katex-display > .katex { display: block; }

/* ==================================================================
   CHẾ ĐỘ TRÌNH CHIẾU BÀI GIẢNG — dạy lý thuyết trên lớp, chiếu tivi/máy chiếu
   (components/lessons/LessonPresenter.tsx, mở từ nút ở tab Lý thuyết của /lop-hoc/bai)

   Nguyên tắc thiết kế:
   - Nội dung là nhân vật chính: không navbar, không cây chương, không nút thường
     trực — thanh điều khiển tự ẩn sau ~3 giây, đụng chuột/chạm là hiện lại.
   - Nền mặc định SÁNG (chữ đậm trên nền sáng) vì phòng học bật đèn; nút "Nền tối"
     dành cho phòng tối cho đỡ chói. Nền SÁNG cũng là lý do phải tắt đảo màu ảnh
     công thức (img.eq) ở dưới — ảnh gốc vốn là nét đen trên nền trắng.
   - Cỡ chữ do --presenter-zoom quyết định (nhân vào 1,3rem) để Ctrl +/− chỉnh ngay
     trong lúc chiếu cho vừa tầm nhìn của từng phòng/từng tivi.
   - Trang chiếu TRÀN gần hết bề ngang màn hình, chỉ chừa lề nhỏ (xem .presenter-slide):
     tivi/máy chiếu lớp học là 16:9, cap bề ngang cũ 1180px làm hụt ~740px trên tivi
     1920 (nội dung co thành một cột hẹp giữa màn hình, chữ xuống dòng sớm).
   - Khung vẽ (canvas) nằm TRÊN nội dung nhưng DƯỚI thanh điều khiển: đang bật bút
     vẫn bấm được nút, mà nét vẽ lại nằm trên chữ.
   ================================================================== */

/* Nút mở chế độ trình chiếu ở đầu tab Lý thuyết. Nói rõ công dụng ngay trên nút để
   lần đầu thầy phân biệt được với nút "Toàn màn hình" của trình duyệt. */
.lesson-present { display: flex; width: 100%; align-items: center; gap: 14px; margin-bottom: 18px; border: 1px solid var(--lesson-accent-line); border-radius: 14px; background: var(--lesson-accent-soft); padding: 13px 16px; color: var(--color-ink); text-align: left; cursor: pointer; transition: border-color .15s, background-color .15s, transform .15s; }
.lesson-present:hover { border-color: var(--lesson-accent); transform: translateY(-1px); }
.lesson-present > svg { flex: 0 0 auto; color: var(--lesson-accent-text); }
.lesson-present > span:not(.lesson-present-go) { display: grid; gap: 2px; min-width: 0; }
.lesson-present strong { font-size: 15px; font-weight: 700; }
.lesson-present small { color: var(--color-muted); font-size: 12.5px; line-height: 1.45; }
.lesson-present-go { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 6px; margin-left: auto; color: var(--lesson-accent-text); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
@media (max-width: 639px) {
  .lesson-present { align-items: flex-start; gap: 11px; }
  .lesson-present-go { display: none; }
}

/* Lớp phủ chờ chunk / báo lỗi chunk — cùng nền với lớp phủ thật để không chớp sáng. */
.lesson-presenter-loading { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; background: #0b1220; padding: 24px; color: #e2e8f0; font-size: 15px; text-align: center; }
.lesson-presenter-loading.is-error { color: #fca5a5; }

.lesson-presenter {
  --pres-text: #e8eefc;
  --pres-muted: #9fb0cc;
  --pres-heading: #fff;
  --pres-accent: #60a5fa;
  --pres-line: rgba(148,163,184,.24);
  --pres-surface: rgba(15,23,42,.86);
  --pres-panel: #101a2e;
  position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; overflow: hidden;
  background: #0b1220; color: var(--pres-text); font-family: var(--font-body);
}
.lesson-presenter[data-bg="light"] {
  --pres-text: #17233a;
  --pres-muted: #59678a;
  --pres-heading: #0b1220;
  --pres-accent: #1d4ed8;
  --pres-line: rgba(15,23,42,.16);
  --pres-surface: rgba(255,255,255,.92);
  --pres-panel: #fff;
  background: #f4f6fb;
}

/* Khung vẽ tay: luôn hiện (nét cũ còn nguyên khi tắt bút), chỉ nhận chuột khi đang bật bút. */
.presenter-canvas { position: absolute; inset: 0; z-index: 15; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
.presenter-canvas.is-active { pointer-events: auto; cursor: crosshair; }

/* Thanh trên/dưới: tự ẩn, và khi ẩn thì không chặn cả nét vẽ lẫn cú bấm. */
.presenter-top { position: absolute; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 16px 20px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.presenter-bar { position: absolute; z-index: 20; bottom: clamp(14px, 3vh, 28px); left: 50%; display: flex; width: max-content; max-width: min(96vw, 1120px); align-items: center; gap: 6px; border: 1px solid var(--pres-line); border-radius: 999px; background: var(--pres-surface); backdrop-filter: blur(10px); padding: 7px 9px; box-shadow: 0 18px 40px -22px rgba(2,6,23,.6); opacity: 0; transform: translate(-50%, 12px); transition: opacity .2s, transform .2s; }
.presenter-top, .presenter-bar { pointer-events: none; }
.lesson-presenter.is-chrome .presenter-top { opacity: 1; }
.lesson-presenter.is-chrome .presenter-bar { opacity: 1; transform: translate(-50%, 0); }
.lesson-presenter.is-chrome .presenter-top > *, .lesson-presenter.is-chrome .presenter-bar > * { pointer-events: auto; }

.presenter-info { display: grid; gap: 3px; min-width: 0; max-width: 46vw; border: 1px solid var(--pres-line); border-radius: 12px; background: var(--pres-surface); backdrop-filter: blur(8px); padding: 8px 14px; }
.presenter-info strong { overflow: hidden; font-size: 13.5px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.presenter-info span { color: var(--pres-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.presenter-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.presenter-actions button, .presenter-bar button { display: inline-flex; min-height: 36px; align-items: center; gap: 6px; border: 1px solid var(--pres-line); border-radius: 10px; background: var(--pres-surface); backdrop-filter: blur(8px); padding: 0 11px; color: var(--pres-text); font-family: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: border-color .15s, color .15s, background-color .15s; }
.presenter-bar button { border-radius: 999px; }
.presenter-actions button:hover, .presenter-bar button:hover:not(:disabled) { border-color: var(--pres-accent); color: var(--pres-accent); }
.presenter-actions button:disabled, .presenter-bar button:disabled { opacity: .35; cursor: default; }
.presenter-actions .presenter-close:hover { border-color: #f87171; color: #f87171; }
.presenter-bar button.is-on { border-color: var(--pres-accent); background: rgba(96,165,250,.18); color: var(--pres-accent); }
.lesson-presenter[data-bg="light"] .presenter-bar button.is-on { background: rgba(29,78,216,.12); }
.presenter-bar .presenter-page { font-variant-numeric: tabular-nums; }
.presenter-bar-sep { flex: 0 0 auto; width: 1px; align-self: stretch; margin: 0 4px; background: var(--pres-line); }
.presenter-zoom { min-width: 46px; color: var(--pres-muted); font-size: 11.5px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.presenter-colors { display: inline-flex; align-items: center; gap: 5px; padding: 0 3px; }
.presenter-colors button { width: 22px; height: 22px; min-height: 22px; border: 2px solid transparent; border-radius: 50%; background: var(--dot); padding: 0; box-shadow: 0 0 0 1px var(--pres-line); }
.presenter-colors button.is-current { border-color: var(--pres-heading); box-shadow: 0 0 0 2px var(--pres-surface); }

/* Lề ngang chỉ để nội dung không dính sát mép màn hình (và không chui dưới nét vẽ ở rìa):
   bề ngang thật của trang chiếu do .presenter-slide quyết định, không cap ở đây. */
.presenter-stage { position: relative; z-index: 10; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: clamp(64px, 9vh, 108px) clamp(16px, 2.4vw, 48px) clamp(96px, 13vh, 150px); scrollbar-width: thin; }
.presenter-stage::-webkit-scrollbar { width: 10px; }
.presenter-stage::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(148,163,184,.32); }

/* Trang chiếu dùng hết bề ngang còn lại của khung (không cap max-width): trên tivi 1920
   chữ chạy tới sát hai mép, chỉ chừa lề của .presenter-stage. Muốn chữ to/nhỏ thì dùng
   Ctrl +/− (--presenter-zoom) chứ không thu hẹp cột nội dung. */
.presenter-slide { max-width: none; margin: 0 auto; color: var(--pres-text); font-size: calc(1.3rem * var(--presenter-zoom, 1)); line-height: 1.68; animation: presenter-slide-in .22s ease-out; }
@keyframes presenter-slide-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .presenter-slide { animation: none; } }

.presenter-kicker { margin: 0 0 8px; color: var(--pres-muted); font-family: var(--font-mono), monospace; font-size: .7em; letter-spacing: .12em; text-transform: uppercase; }
.presenter-heading { margin: 0 0 .62em; color: var(--pres-heading); font-family: var(--font-display), sans-serif; font-size: 1.5em; font-weight: 700; letter-spacing: -.015em; line-height: 1.24; }

/* Nội dung lý thuyết trong trang chiếu. Ghi đè .exam-content (1,125rem, ảnh công thức đảo màu,
   khung công thức khối) vì ở đây chữ phải to theo --presenter-zoom và phẳng như slide. */
.presenter-prose.exam-content { display: block; color: var(--pres-text); font-family: var(--font-body), sans-serif; font-size: 1em; line-height: 1.68; }
.presenter-prose p { margin: 0 0 .85em; }
.presenter-prose > :last-child { margin-bottom: 0; }
.presenter-prose :is(ul, ol) { margin: 0 0 .85em; padding-left: 1.45em; }
.presenter-prose li { margin-bottom: .3em; }
.presenter-prose :is(h3, h4) { margin: 1.05em 0 .45em; color: var(--pres-heading); font-size: 1.1em; font-weight: 700; line-height: 1.3; }
.presenter-prose :is(strong, b) { color: var(--pres-heading); }
.presenter-prose :is(img, svg, table, .table-scroll) { max-width: 100%; }
.presenter-prose .katex-display { margin: .85em 0; border: 0; border-radius: 0; background: none; padding: 0; text-align: center; }
.presenter-prose .katex { vertical-align: baseline; }
.presenter-prose .exam-content-raw-tex { background: rgba(148,163,184,.18); color: inherit; }
/* Ảnh công thức trong bài là nét đen trên nền trắng: nền tối thì đảo màu, nền sáng để nguyên. */
.lesson-presenter[data-bg="dark"] .presenter-prose img.eq { filter: invert(.88) hue-rotate(180deg); }
.lesson-presenter[data-bg="light"] .presenter-prose img.eq { filter: none; }
/* Khối "tl-*" soạn cho nền tối (nhãn cyan/vàng trên nền mờ) — đổi sang bảng màu đọc được trên nền sáng. */
.lesson-presenter[data-bg="light"] .presenter-prose :is(.tl-box, .tl-details) { border-color: rgba(15,23,42,.18); background: rgba(15,23,42,.045); }
.lesson-presenter[data-bg="light"] .presenter-prose .tl-label { color: #0e7490; }
.lesson-presenter[data-bg="light"] .presenter-prose .tl-box--rule .tl-label { color: #b45309; }
.lesson-presenter[data-bg="light"] .presenter-prose :is(.tl-table th, .tl-table td, .tl-opt) { border-color: rgba(15,23,42,.22); }

.presenter-cover { display: grid; justify-items: center; gap: 16px; padding: clamp(20px, 7vh, 80px) 0; text-align: center; }
