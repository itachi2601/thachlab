/* ==========================================================================
   NỀN SÁNG — QUÉT NỐT MÀU TỐI / NEON HARD-CODE TRONG JSX (11/10/2026)
   ==========================================================================
   Vì sao có khối này: trước đây theme TỐI là mặc định, nên hàng trăm chỗ trong JSX viết
   thẳng class màu của nền tối — `bg-[#0B1020]`, `bg-white/5` (ô sáng mờ trên nền đen),
   `border-white/10`, gradient `from-[#172c46]`, quầng sáng `shadow-[0_0_24px_…]`. Bật nền
   sáng lên thì những chỗ đó thành mảng xám bết hoặc mảng tối lẫn trong trang trắng — đúng
   cảm giác "màu không đẹp" mà thầy thấy.

   Cách xử lý ở đây là LƯỚI AN TOÀN theo token, không phải nguồn màu:
   · quét bằng attribute selector KHÔNG phân biệt hoa/thường (`i`) vì JSX viết lẫn
     `bg-[#0B1020]` và `bg-[#0b1020]`, kèm cả biến thể mờ `/80`, `/[0.98]`;
   · `[class~="…"]` (khớp ĐÚNG một token class) cho các idiom `bg-white/10` để KHÔNG đụng
     `hover:bg-white/20` — biến thể hover xử riêng, nếu không nút mất phản hồi khi trỏ;
   · mọi giá trị lấy từ token ở @theme, nên đổi bảng màu chỉ sửa một nơi.
   Sửa gốc vẫn phải làm ở component (bỏ hex, dùng bg-panel/text-ink/border-line) — lưới này
   chỉ để không còn ô tối nào lọt ra ngoài. Khi component đã sạch thì các rule dưới thành vô hại.
   ========================================================================== */

/* (1) Nền tối hard-code → mặt thẻ. Mọi biến thể hoa/thường + độ mờ đều khớp. */
html[data-theme="light"] [class*="bg-[#04060a]" i],
html[data-theme="light"] [class*="bg-[#05070b]" i],
html[data-theme="light"] [class*="bg-[#050914]" i],
html[data-theme="light"] [class*="bg-[#070b16]" i],
html[data-theme="light"] [class*="bg-[#080d18]" i],
html[data-theme="light"] [class*="bg-[#080d1a]" i],
html[data-theme="light"] [class*="bg-[#080d1d]" i],
html[data-theme="light"] [class*="bg-[#0a1020]" i],
html[data-theme="light"] [class*="bg-[#0b1020]" i],
html[data-theme="light"] [class*="bg-[#0b1220]" i],
html[data-theme="light"] [class*="bg-[#0b1324]" i],
html[data-theme="light"] [class*="bg-[#10192a]" i],
html[data-theme="light"] [class*="bg-[#111a2e]" i],
html[data-theme="light"] [class*="bg-[#172033]" i] {
  background-color: var(--color-panel) !important;
}

/* (2) Ô sáng mờ trên nền tối (`bg-white/5`) → ô xám nhạt trên nền sáng. Giữ nguyên thứ bậc
   đậm/nhạt giữa các mức để chỗ nào đậm hơn vẫn nổi hơn. */
html[data-theme="light"] [class~="bg-white/5"],
html[data-theme="light"] [class~="hover:bg-white/5"]:hover,
html[data-theme="light"] [class~="bg-white/[.01]"],
html[data-theme="light"] [class~="bg-white/[0.01]"] { background-color: rgba(15, 23, 42, .035) !important; }
html[data-theme="light"] [class~="bg-white/[.02]"],
html[data-theme="light"] [class~="bg-white/[0.02]"],
html[data-theme="light"] [class~="bg-white/[.025]"],
html[data-theme="light"] [class~="bg-white/[0.025]"],
html[data-theme="light"] [class~="bg-white/[.03]"],
html[data-theme="light"] [class~="bg-white/[0.03]"],
html[data-theme="light"] [class~="bg-white/[.035]"],
html[data-theme="light"] [class~="bg-white/[0.035]"],
html[data-theme="light"] [class~="bg-white/[.04]"],
html[data-theme="light"] [class~="bg-white/[0.04]"],
html[data-theme="light"] [class~="bg-white/[.05]"],
html[data-theme="light"] [class~="bg-white/[0.05]"],
html[data-theme="light"] [class~="bg-white/[.06]"],
html[data-theme="light"] [class~="bg-white/[0.06]"],
html[data-theme="light"] [class~="bg-white/[.07]"],
html[data-theme="light"] [class~="bg-white/[0.07]"],
html[data-theme="light"] [class~="bg-white/[.08]"],
html[data-theme="light"] [class~="bg-white/[0.08]"] { background-color: rgba(15, 23, 42, .05) !important; }
html[data-theme="light"] [class~="bg-white/10"],
html[data-theme="light"] [class~="hover:bg-white/10"]:hover { background-color: rgba(15, 23, 42, .055) !important; }
html[data-theme="light"] [class~="bg-white/[0.14]"],
html[data-theme="light"] [class~="bg-white/15"],
html[data-theme="light"] [class~="hover:bg-white/15"]:hover { background-color: rgba(15, 23, 42, .075) !important; }
html[data-theme="light"] [class~="bg-white/20"],
html[data-theme="light"] [class~="hover:bg-white/20"]:hover { background-color: rgba(15, 23, 42, .09) !important; }

/* (3) Viền trắng mờ trên nền tối → viền xám trên nền sáng. Không đụng /60 và /70: đó là khung
   trắng cố ý đè LÊN ảnh/camera (QrScannerCard), phải giữ trắng. */
html[data-theme="light"] [class~="border-white/5"],
html[data-theme="light"] [class~="hover:border-white/5"]:hover { border-color: rgba(15, 23, 42, .06) !important; }
html[data-theme="light"] [class~="border-white/10"],
html[data-theme="light"] [class~="hover:border-white/10"]:hover { border-color: rgba(15, 23, 42, .10) !important; }
html[data-theme="light"] [class~="border-white/15"],
html[data-theme="light"] [class~="hover:border-white/15"]:hover { border-color: rgba(15, 23, 42, .14) !important; }
html[data-theme="light"] [class~="border-white/20"],
html[data-theme="light"] [class~="hover:border-white/20"]:hover { border-color: rgba(15, 23, 42, .18) !important; }
html[data-theme="light"] [class~="border-white/25"],
html[data-theme="light"] [class~="hover:border-white/25"]:hover { border-color: rgba(15, 23, 42, .22) !important; }
html[data-theme="light"] [class~="border-white/30"],
html[data-theme="light"] [class~="hover:border-white/30"]:hover { border-color: rgba(15, 23, 42, .26) !important; }
html[data-theme="light"] [class~="border-white/40"],
html[data-theme="light"] [class~="hover:border-white/40"]:hover { border-color: rgba(15, 23, 42, .34) !important; }
html[data-theme="light"] [class~="divide-white/5"] > :not([hidden]) ~ :not([hidden]) { border-color: rgba(15, 23, 42, .06) !important; }
html[data-theme="light"] [class~="divide-white/10"] > :not([hidden]) ~ :not([hidden]) { border-color: rgba(15, 23, 42, .10) !important; }

/* (4) Gradient nền tối + quầng sáng neon (M6: không gradient/glow ở vùng đọc và làm bài).
   `background-image: none` là cách chắc nhất vì Tailwind dựng gradient qua biến --tw-gradient-*. */
html[data-theme="light"] [class*="from-[#172c46]" i],
html[data-theme="light"] [class*="via-[#0e1c32]" i],
html[data-theme="light"] [class*="to-[#071426]" i],
html[data-theme="light"] [class*="to-[#091627]" i],
html[data-theme="light"] [class*="to-[#101a3a]" i],
html[data-theme="light"] [class*="from-[#183a4a]" i],
html[data-theme="light"] [class*="from-[#0b1020]" i],
html[data-theme="light"] [class*="to-[#0b1020]" i] { background-image: none !important; }
html[data-theme="light"] [class*="shadow-[0_0_"],
html[data-theme="light"] [class*="shadow-[0_2px_4px_rgba(0,0,0"] { box-shadow: 0 1px 2px rgb(15 23 42 / .06) !important; }

/* (5) Hai chỗ đặc biệt, phải đổi cả nền lẫn chữ vì chữ thừa hưởng màu của nền tối:
   · badge 📖 của bài học (nền navy đậm, không đặt màu chữ) → chip nhấn nhạt;
   · dải cảnh báo rời trang khi làm bài (nền nâu đậm + chữ amber) → nền amber rất nhạt. */
html[data-theme="light"] [class*="bg-[#1d3461]" i] {
  background-color: var(--color-primary-soft) !important;
  color: var(--color-primary-dark) !important;
}
html[data-theme="light"] [class*="bg-[#2a2210]" i] {
  background-color: #fffbeb !important;
  border-color: #fcd34d !important;
}
/* Nút đặc màu teal đậm ở trang chủ (bg-[#155e75] + chữ trắng, hover bg-[#0e7490]): theo M3 chỉ
   giữ MỘT màu nhấn cho hành động, nên đưa về primary thay vì thêm sắc độ bão hoà thứ hai. */
html[data-theme="light"] [class*="bg-[#155e75]" i],
html[data-theme="light"] [class*="bg-[#0e7490]" i] { background-color: var(--color-primary) !important; }

/* (6) Không gian học CNC: vài mảng tối viết trong CSS (không phải class JSX) nên lưới ở trên
   không với tới. Khung code thì CỐ Ý giữ tối (như trình soạn thảo) — chỉ đổi các mảng UI. */
html[data-theme="light"] .cnc-embedded .cnc-programming-tabs button,
html[data-theme="light"] .cnc-embedded .cnc-programming-suite > div.grid > div.bg-white,
html[data-theme="light"] .cnc-embedded .cnc-rubric-group {
  border-color: var(--color-line) !important;
  background: var(--color-panel) !important;
  color: var(--color-muted);
}
html[data-theme="light"] .cnc-embedded .cnc-rubric-group > header { background: var(--color-surface-2) !important; color: var(--color-ink); }

/* ==========================================================================
   PHẠM VI THEO NHÓM NGƯỜI XEM — cùng một bảng màu, khác số đo thị giác
   ==========================================================================
   Không phải "mỗi trang một bộ màu" (như vậy là phá N4/M3 và làm site rối), mà là: cùng hệ
   thần, đổi đúng những chỗ nghiên cứu nói phải đổi cho từng lứa tuổi. */

/* PHỤ HUYNH 45–60 — docs/QUY-TAC-THIET-KE-PHU-HUYNH.md (P1, P2, P5, P6).
   Nền hơi ngả ấm (không dùng trắng tinh để giảm chói với người lão thị), chữ phụ tối hơn để
   đạt ≥7:1 (AAA), nhấn dùng xanh navy đậm cho trang trọng và đủ tương phản. Cỡ chữ và đích
   chạm đã có ở khối "P1/P2/P4 — khối PHỤ HUYNH" phía trên.

   `html:not(.is-dim)` là BẮT BUỘC: "Dịu mắt" đặt token trên <html>, mà token khai ở phần tử con
   luôn thắng token thừa hưởng — thiếu điều kiện này thì bật Dịu mắt ở /phu-huynh vẫn ra nền trắng
   ấm thay vì nền kem, tức là vô hiệu hoá đúng tính năng dành cho người lão thị. */
html:not(.is-dim) .parent-page {
  --color-bg: #f7f7f4;
  --color-panel: #ffffff;
  --color-surface-2: #f1f1ec;
  --color-ink: #14181f;          /* 15,9:1 trên #f7f7f4 */
  --color-muted: #3d4653;        /* 8,9:1 trên #f7f7f4, 9,8:1 trên trắng — vượt AAA 7:1 */
  --color-line: rgba(20, 24, 31, .14);
  /* Phụ huynh phải thấy rõ ô nhập/viền hơn học sinh ⇒ viền đậm hơn (4,2:1 trên trắng). */
  --color-line-strong: #767f8d;
  --color-primary: #1e40af;      /* 8,7:1 với chữ trắng */
  --color-primary-dark: #1e3a8a;
  --color-primary-soft: #eef1f8;
  /* P2 đòi 7:1 (AAA) cho khối phụ huynh, mà tông chung của ba màu trạng thái chỉ đạt
     5,1 / 4,7 / 6,0 trên nền ấm #f7f7f4 — vẫn qua AA nhưng hụt mức tài liệu đặt ra. Ba mã dưới
     đây là bản đậm hơn, đo lại trên #f7f7f4: ok 7,4 · warn 8,5 · danger 7,7:1. */
  --color-ok: #065f46;
  --color-warn: #78350f;
  --color-danger: #991b1b;
}
/* Nền ấm của trang phụ huynh phải phủ hết chiều cao màn hình, nếu không mép dưới lộ nền trung
   tính của site và trang trông "lai" hai tông. Để RIÊNG ngoài khối token trên, nhờ vậy chế độ
   Dịu mắt vẫn đổi được nền sang kem. */
.parent-page { background: var(--color-bg); }

/* KHU GIÁO VIÊN / QUẢN TRỊ — mật độ cao, nhiều bảng, không cần "không khí" của trang học sinh:
   nền xám trung tính hơn một bậc để vùng dữ liệu (bảng trắng) tách khỏi nền, và cỡ chữ gốc
   nhỏ hơn (14px, đã đặt ở .admin-shell) vì người dùng là giáo viên trên laptop. */
html[data-theme="light"] .teacher-dashboard {
  --color-bg: #f4f5f7;
  --color-panel: #ffffff;
  --color-surface-2: #eceef2;
  --color-line: rgba(15, 23, 42, .12);
}

/* RP bài lý thuyết: thanh nộp câu tự chấm (đích chạm >=44px) */
.theory-rp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: var(--fs-sm); color: #cbd5e1; }
.theory-rp-bar .lesson-done { min-height: 44px; color: #6ee7b7; border-color: rgba(16,185,129,.5); }
.theory-rp-bar .lesson-done:disabled { opacity: .5; cursor: not-allowed; }
html[data-theme="light"] .theory-rp-bar { color: #334155; }

/* Bảng dữ liệu trong câu hỏi (lib/question-table.ts): kẻ ô, giãn ô, cuộn ngang trên điện thoại (N1, M2). */
.q-table-wrap { overflow-x: auto; margin: 10px 0; max-width: 100%; }
.q-table { border-collapse: collapse; font-size: .95em; min-width: 50%; }
.q-table :is(th, td) { border: 1px solid rgba(100,116,139,.55); padding: 7px 14px; text-align: center; vertical-align: middle; white-space: nowrap; }
.q-table th { background: rgba(148,163,184,.18); font-weight: 600; }
.q-table :is(th, td):has(br) { white-space: normal; }

/* Bài Anh văn chuyên ngành (AVCN, lớp avcn): thẻ từ vựng có ảnh, câu đọc chạm hiện dịch, nút nghe 🔊
   (<button data-tl-speak> — trang bài học xử lý uỷ quyền, HTML lưu DB không chứa JS). Mẫu: content/lesson-samples/avcn-*. */
.exam-content .avcn-photo img { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; border-radius: 12px; }
.exam-content .avcn-photo figcaption { opacity: .85; }
.exam-content .avcn-cards { display: grid; gap: 10px; margin: 10px 0 14px; }
.exam-content .avcn-card { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: start; padding: 10px; border: 1px solid rgba(148,163,184,.35); border-radius: 12px; }
.exam-content .avcn-card--noimg { grid-template-columns: 1fr; }
.exam-content .avcn-card img { width: 112px; height: 84px; object-fit: cover; border-radius: 8px; }
.exam-content .avcn-card__body p { margin: 0 0 4px; text-align: left; }
.exam-content .avcn-term { font-weight: 700; font-size: 1.1rem; }
.exam-content .avcn-term small { font-weight: 400; font-size: .9rem; opacity: .8; }
.exam-content .avcn-star { font-size: .8rem; }
.exam-content .avcn-vi { color: #22d3ee; font-weight: 600; }
html[data-theme="light"] .exam-content .avcn-vi { color: #0e7490; }
.exam-content .avcn-def { font-size: .95rem; }
.exam-content .tl-speak { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 32px; padding: 0 6px; border: 1px solid rgba(148,163,184,.4); border-radius: 8px; background: transparent; color: inherit; cursor: pointer; font-size: 1rem; vertical-align: middle; }
.exam-content .tl-speak:hover { border-color: #22d3ee; }
.exam-content .avcn-sent { margin: 6px 0; }
.exam-content .avcn-sent > summary { font-weight: 400; line-height: 1.6; }
.exam-content .avcn-n { font-weight: 700; opacity: .7; margin-right: 4px; }
.exam-content .avcn-trans { opacity: .9; }
.exam-content .avcn-list { padding-left: 18px; }
.exam-content .avcn-list li { margin: 6px 0; text-align: left; }
.exam-content .avcn-box { padding: 8px 12px; border: 1px dashed rgba(148,163,184,.6); border-radius: 10px; text-align: left; }
.exam-content .avcn-passage { padding: 12px 14px; border-left: 3px solid #22d3ee; background: rgba(148,163,184,.08); border-radius: 0 10px 10px 0; margin: 10px 0; }
.exam-content .avcn-passage p { margin: 0; text-align: left; line-height: 1.7; }
@media (max-width: 420px) { .exam-content .avcn-card { grid-template-columns: 88px 1fr; } .exam-content .avcn-card img { width: 88px; height: 66px; } }
.exam-content .avcn-card.avcn-card--noimg { grid-template-columns: 1fr; }
.exam-content .avcn-tbl :is(th, td):first-child { white-space: nowrap; }
.exam-content .avcn-sent > summary::after { font-size: 1.3rem; line-height: 1; }
.exam-content .avcn-term .tl-speak { margin-left: 2px; }
.exam-content .avcn-photo figcaption { font-size: .9rem; }

/* Vinh danh tuần: hiệu ứng chạy MỘT lần khi cuộn tới bục (sao băng + pháo hoa quanh hạng 1); tắt khi giảm chuyển động (B4). */
.honor-fx { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .honor-fx { display: block; }
  .honor-play .honor-shoot { animation: honor-shoot 1.4s ease-out 0.3s 1 both; }
  .honor-play .honor-shoot-2 { animation-delay: 1.1s; }
  .honor-play .honor-spark { animation: honor-spark 1.6s ease-out 0.5s 1 both; }
  .honor-play .honor-glint { animation: honor-glint 1.2s ease-in-out 0.4s 2 both; }
}
@keyframes honor-shoot {
  0% { transform: translate(0, 0) rotate(35deg); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(190px, 130px) rotate(35deg); opacity: 0; }
}
@keyframes honor-spark {
  0% { transform: rotate(var(--a)) translateX(0) scale(1); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: rotate(var(--a)) translateX(var(--d)) scale(0.2); opacity: 0; }
}
@keyframes honor-glint {
  0%, 100% { opacity: 0; transform: scale(0.4); }
  50% { opacity: 1; transform: scale(1); }
}

/* Nhãn đã làm/điểm cao nhất dưới tên đề ở kệ đề lớp (ExamShelf, 17/10/2026, N3). */
.class-done-tag { display: block; margin-top: 2px; color: #94a3b8; font-size: 13px; font-weight: 600; }
.class-done-tag.is-pass { color: #6ee7b7; }
.class-done-tag.is-fail { color: #fbbf24; }
html[data-theme="light"] .class-done-tag { color: #475569; }
html[data-theme="light"] .class-done-tag.is-pass { color: #047857; }
html[data-theme="light"] .class-done-tag.is-fail { color: #b45309; }

/* Danh sách "Dạng" trong bài lý thuyết: mỗi dạng một khối, mỗi ý một dòng, có khoảng thở giữa các dạng (N1, N5, B2) */
.exam-content ul.tl-dang { padding-left: 1.1em; }
.exam-content ul.tl-dang > li { margin: 0 0 1em; line-height: 1.7; }
.exam-content ul.tl-dang > li:last-child { margin-bottom: 0; }

/* Khối công thức của bài lý thuyết (.tl-fx): tên → công thức giữa khung → bảng "trong đó" canh cột (thầy chốt 21/10/2026).
   Mayer: tiệm cận không gian (công thức và chú giải liền nhau), báo hiệu một cấp (N1, N7, B2). */
.exam-content .tl-fx > p { margin: 0; }
.exam-content .tl-fx-name { font-weight: 700; margin-bottom: 6px !important; text-align: left; }
.exam-content .tl-fx-cond { margin-top: 10px !important; font-size: .9em; opacity: .85; text-align: center; }
.exam-content .tl-fx .katex-display { margin: 4px 0; padding: 6px 0; border: 0; background: none; text-align: center; overflow-x: auto; overflow-y: hidden; }
.exam-content .tl-fx .katex-display > .katex { display: block; }
.exam-content ul.tl-fx-def { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--color-line, rgba(148,163,184,.4)); display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: baseline; text-align: left; }
.exam-content ul.tl-fx-def > li { display: contents; }
.exam-content ul.tl-fx-def .tl-sym { text-align: right; white-space: nowrap; }
.exam-content ul.tl-fx-def .tl-sym::after { content: " :"; }
.exam-content .tl-fx-note { margin-top: 10px !important; font-size: .95em; text-align: left; }
/* Dòng có công thức nội dòng cần dòng cao hơn để phân số (cao ~2,4 dòng chữ) không đè dòng kề */
.lesson-page .exam-content :where(p, li):has(.katex) { line-height: 2; }
.lesson-page .exam-content :where(p, li) .katex { line-height: 1.3; }

/* Hệ khung có nghĩa (thầy chốt 21/10/2026, bài mới chọn dùng bằng cách thêm lớp; bài cũ không đổi).
   CHỈ BA loại khung, icon tròn ở góc phải trên, màu theo ĐÚNG token của docs/MAU-NEN-SANG.md (M3):
     📌 phải nhớ (.tl-fx công thức, .tl-keep mang về) — viền trung tính đậm (màu mực), KHÔNG dùng màu nhấn/trạng thái
     ⚠️ bẫy mất điểm (.tl-trap) — --color-warn (cần chú ý); không dùng đỏ vì đỏ chỉ để "sai" ở phản hồi quiz bên trong
     ✍️ tự kiểm tra (.tl-check) — --color-primary (khối có thứ bấm được)
   Mọi thứ còn lại là ghi chú: .tl-note (vạch trái mỏng trung tính), .tl-more (mục bấm xem). Không để khung nằm trong khung.
   Tương phản viền ≥ 3:1 ở cả hai theme (WCAG 1.4.11); nghĩa nằm ở icon + nhãn, không chỉ ở màu (M4). */
.exam-content :is(.tl-fx, .tl-keep, .tl-trap, .tl-check) { --kc: var(--color-ink, #0f172a); position: relative; margin: 30px 0 18px; padding: 16px 14px 14px; border: 2px solid var(--kc); border-radius: 16px; background: var(--color-surface-2, rgba(148,163,184,.08)); }
.exam-content :is(.tl-fx, .tl-keep)::before { content: "📌"; }
.exam-content .tl-trap { --kc: var(--color-warn, #b45309); background: color-mix(in srgb, var(--kc) 7%, var(--color-panel, #fff)); }
.exam-content .tl-trap::before { content: "⚠️"; }
.exam-content .tl-check { --kc: var(--color-primary, #1d4ed8); background: color-mix(in srgb, var(--kc) 6%, var(--color-panel, #fff)); }
.exam-content .tl-check::before { content: "✍️"; }
.exam-content :is(.tl-fx, .tl-keep, .tl-trap, .tl-check)::before { position: absolute; top: -17px; right: 14px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--color-panel, #fff); border: 2px solid var(--kc); font-size: 17px; line-height: 1; transform: rotate(8deg); }
.exam-content :is(.tl-trap, .tl-check) > :is(h4, .tl-label):first-child { margin-top: 0; }
.exam-content .tl-box.tl-note { border: 0; border-left: 3px solid var(--color-line-strong, #8b93a1); border-radius: 0; background: none; padding: 2px 0 2px 14px; margin: 18px 0; }
.exam-content .tl-details.tl-more { border: 0; border-left: 3px solid var(--color-line-strong, #8b93a1); border-radius: 0; background: none; margin: 12px 0; }
.exam-content .tl-more > summary { padding: 6px 12px; }
.exam-content .tl-more > :not(summary) { margin-left: 12px; margin-right: 0; }
.exam-content .tl-more > :last-child { margin-bottom: 6px; }
.exam-content :is(.tl-fx, .tl-keep, .tl-trap, .tl-check) > :is(h4, .tl-label, .tl-fx-name):first-child { padding-right: 40px; }

/* ============================================================================================
   KHUNG ĐỒNG BỘ TRANG CHƯƠNG ↔ TRANG BÀI (thầy duyệt 26/10/2026, bản xem thử "Trang chương và trang bài")
   Rail trái luôn là "mình đang ở đâu" (B5): trang chương = danh sách chương, trang bài = mục lục bài.
   Đầu trang cùng mẫu: đường dẫn + công cụ một hàng, H1 cùng cỡ (C3), một dòng meta. Một điểm nổi mỗi trang (B2).
   4 cỡ: ≥1024 (máy tính, iPad ngang) 2 cột · 640–1023 (iPad dọc) 1 cột + thanh đáy + ngăn kéo trái · <640 điện thoại.
   ============================================================================================ */

/* ---- Đầu trang bài: một lưới cho mọi cỡ ---- */
.lesson-page .lesson-head {
  position: relative; display: grid; align-items: center; column-gap: 8px; row-gap: 2px;
  grid-template-columns: auto minmax(0, 1fr) auto auto auto;
  grid-template-areas: "back crumb present aa drawer" "title title title title title" "meta meta meta meta meta";
}
.lesson-page .lesson-head-text { display: contents; }
.lesson-page .lesson-head-back { grid-area: back; }
.lesson-page .lesson-head .lesson-breadcrumb { grid-area: crumb; min-width: 0; align-self: center; }
.lesson-page .lesson-head h1 { grid-area: title; margin-top: 4px; }
.lesson-page .lesson-head .lesson-meta { grid-area: meta; }
.lesson-page .lesson-head .lesson-tool-toggle { grid-area: aa; display: inline-flex; width: 44px; height: 44px; }
.lesson-page .lesson-head .lesson-drawer-toggle { display: none; }
.lesson-present-btn { grid-area: present; display: inline-flex; height: 44px; align-items: center; gap: 6px; border: 1px solid var(--lesson-line); border-radius: 10px; background: none; padding: 0 12px; color: var(--color-ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.lesson-present-btn:hover { border-color: var(--lesson-accent-line); }
/* Cỡ chữ, Dịu mắt, Toàn màn hình gom vào bảng Aa (N2): bảng nổi ngay dưới nút. */
.lesson-page .lesson-head .lesson-tools { position: absolute; top: 48px; right: 0; z-index: 30; display: none; min-width: 200px; flex-direction: column; align-items: stretch; gap: 6px; border: 1px solid var(--lesson-line); border-radius: 12px; background: var(--color-panel); padding: 8px; box-shadow: 0 14px 30px -18px rgba(15,23,42,.45); }
.lesson-page .lesson-head .lesson-tools.is-open { display: flex; }
.lesson-page .lesson-head .lesson-tools .lesson-tool { justify-content: flex-start; min-height: 44px; }
.lesson-page .lesson-head .lesson-fonttools button { min-height: 44px; }

/* ---- Bài trước / Bài sau ở cuối bài ---- */
.lesson-pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 28px 0 8px; }
.lesson-pager-link { display: grid; gap: 2px; min-height: 56px; align-content: center; border: 1px solid var(--lesson-line); border-radius: 12px; background: var(--lesson-panel); padding: 10px 16px; color: var(--color-ink); font-size: 15px; font-weight: 600; line-height: 1.35; text-decoration: none; }
.lesson-pager-link small { color: var(--color-muted); font-size: 13px; font-weight: 500; }
.lesson-pager-link:hover { border-color: var(--lesson-accent-line); }
.lesson-pager-link--next { grid-column: 2; border-color: var(--lesson-accent-line); text-align: right; color: var(--lesson-accent-text); }

/* ---- Rail trái trang bài ---- */
.lesson-rail-back { display: flex; min-height: 44px; align-items: center; gap: 6px; color: var(--color-muted); font-size: 14px; font-weight: 600; line-height: 1.35; text-decoration: none; }
.lesson-rail-back:hover { color: var(--lesson-accent-text); }
.lesson-nav--rail { display: grid; gap: 12px; align-content: start; }
.lesson-nav--rail .lesson-toc ol { max-height: none; }
.lesson-nav--rail .lesson-toc a { min-height: 40px; align-content: center; padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 14px; }

/* Cột chữ ≤ ~62 ký tự (C2): giới hạn đoạn văn, không giới hạn hình/bảng. */
.lesson-page .lesson-prose :is(p, li, h3, h4) { max-width: 36em; }

@media (min-width: 1024px) {
  .lesson-layout--rail { grid-template-columns: 248px minmax(0, 1fr); gap: 40px; max-width: 1200px; }
  .lesson-layout--rail .lesson-nav--rail { position: sticky; top: 92px; max-height: calc(100vh - 112px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-bottom: 72px; }
  .lesson-layout--rail .lesson-main { max-width: 760px; }
  .lesson-layout--rail .lesson-body { --lesson-read-width: 760px; max-width: 760px; }
  .lesson-page .lesson-head { margin: 0 0 16px; }
  .lesson-page .lesson-head-back { display: none; }
  .lesson-page .lesson-head h1, .lesson-layout--pick .lesson-main--single > .lesson-head h1 { font-size: 32px; line-height: 1.2; }
}
/* iPad ngang (1024–1279): rail hẹp lại, nút Trình chiếu chỉ còn icon. */
@media (min-width: 1024px) and (max-width: 1279px) {
  .lesson-layout--rail { grid-template-columns: 220px minmax(0, 1fr); gap: 28px; padding-inline: 24px; }
  .lesson-present-btn { width: 44px; justify-content: center; padding: 0; }
  .lesson-present-btn .lesson-tool-text { display: none; }
}

/* ---- < 1024 (iPad dọc + điện thoại): thanh bài thay thanh site, thanh đáy + ngăn kéo ---- */
@media (max-width: 1023px) {
  body:has(.lesson-page) header[data-site-navbar] { display: none; }
  /* Chỉ khi bài đã dựng (.lesson-page có mặt) — lúc tải/lỗi navbar vẫn hiện nên phải giữ khoảng đệm. */
  body:has(.lesson-page) main.lesson-page-main { padding-top: 0 !important; }
  .lesson-layout--rail .lesson-nav--rail { display: none; }
  .lesson-page .lesson-tabs { top: 0; }
  .lesson-page .lesson-review-banner { top: 56px; }
  .lesson-page .lesson-head { padding-top: 8px; }
  .lesson-page .lesson-head .lesson-tools { top: 56px; }
  .lesson-page .lesson-head-back { display: inline-flex; width: 44px; height: 44px; }
  /* Tên chương nhỏ ở hàng đầu thay cho cả đường dẫn (biết mình ở chương nào, không lặp tên bài — N4). */
  .lesson-page .lesson-breadcrumb { display: flex; flex-wrap: nowrap; overflow: hidden; }
  .lesson-page .lesson-crumb-class { display: none !important; }
  .lesson-page .lesson-crumb-chapter { display: block !important; overflow: hidden; color: var(--color-muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
  .lesson-page .lesson-pager { display: none; }
  .lesson-present-btn { width: 44px; justify-content: center; padding: 0; }
  .lesson-present-btn .lesson-tool-text { display: none; }
}
@media (min-width: 640px) and (max-width: 1023px) {
  /* Trước đây Bài trước/Bài sau treo ở đầu trang tablet; giờ là thanh đáy giống điện thoại, rộng tối đa 560px (D3/B6). */
  .lesson-page .lesson-head h1 { font-size: 26px; }
  .lesson-page .lesson-body { font-size: calc(1.0625rem * var(--lesson-read-scale, 1)); }
  .lesson-page .lesson-tabs ol { justify-content: center; }
  body:has(.lesson-page) { padding-bottom: calc(var(--lesson-bottombar-h, 72px) + env(safe-area-inset-bottom, 0px)); }
  .lesson-page .lesson-bottombar { position: fixed; inset: auto 0 0; z-index: 45; display: grid; grid-template-columns: 48px repeat(3, minmax(0, 1fr)); align-items: center; gap: 10px; border-top: 1px solid var(--lesson-line); background: var(--color-panel); padding: 10px max(16px, calc((100vw - 600px) / 2)) calc(10px + env(safe-area-inset-bottom, 0px)); }
  .lesson-page .lesson-bottom-link, .lesson-page .lesson-bottom-done { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--lesson-line); border-radius: 12px; background: none; color: var(--color-ink); font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .lesson-page .lesson-bottom-link--next { border-color: var(--lesson-accent); background: var(--lesson-accent); color: #fff; }
  .lesson-page .lesson-bottom-done { border-color: var(--lesson-accent-line); background: var(--lesson-accent-soft); color: var(--lesson-accent-text); }
  .lesson-page .lesson-bottom-done.is-done { color: var(--color-ok, #047857); }
  .lesson-page .lesson-checkbox { width: 17px; height: 17px; border: 2px solid currentColor; border-radius: 5px; }
  .lesson-page .lesson-bottom-step { display: none; }
  .lesson-page.is-drawer-open .lesson-bottombar { display: none; }
  /* Đề kiểm tra: Bài trước/Bài sau đã ở thanh đáy — bỏ hàng lặp ở đầu trang (D3). */
  .lesson-layout--exam .lesson-nav--compact { display: none; }
  /* Ngăn kéo mục lục trượt từ cạnh TRÁI — đúng cạnh của rail trên máy tính (B5/B7). */
  .lesson-page .lesson-drawer { display: block; position: fixed; inset: 0; z-index: 60; }
  .lesson-page .lesson-drawer-scrim { position: absolute; inset: 0; width: 100%; border: 0; background: rgba(2, 6, 15, .45); cursor: pointer; }
  .lesson-page .lesson-drawer-sheet { position: absolute; inset: 0 auto 0 0; display: flex; width: min(380px, 86vw); flex-direction: column; border-right: 1px solid var(--lesson-line); background: var(--color-panel); }
  .lesson-page .lesson-drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--lesson-line); padding: 14px 16px 12px; }
  .lesson-page .lesson-drawer-title { margin: 0; color: var(--color-ink); font-size: 16px; font-weight: 700; }
  .lesson-page .lesson-drawer-head small { display: block; margin-top: 3px; color: var(--color-muted); font-size: 13px; }
  .lesson-page .lesson-drawer-head button { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 1px solid var(--lesson-line); border-radius: 12px; background: none; color: var(--color-ink); cursor: pointer; }
  .lesson-page .lesson-drawer-body { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 24px; }
  .lesson-page .lesson-bottom-link.is-empty { opacity: .35; }
  body:has(.lesson-bottombar) .bug-fab { bottom: calc(var(--lesson-bottombar-h, 72px) + 12px); z-index: 46; }
  .lesson-page .lesson-drawer-body .lesson-toc ol { max-height: none; }
  .lesson-page .lesson-drawer-body .lesson-toc a { min-height: 44px; align-content: center; font-size: 15px; }
}
@media (max-width: 639px) {
  .lesson-page .lesson-head h1 { font-size: 22px; }
}

/* Cây chương, ô tìm, thẻ tiến độ trong ngăn kéo: dùng chung điện thoại + iPad dọc (ngăn kéo có ở mọi cỡ < 1024px từ 26/10/2026). */
@media (max-width: 1023px) {
  /* Hộp trong ngăn kéo (mục lục bài, mức nắm vững, cây khoá) cách nhau đều 14px. */
  .lesson-page .lesson-drawer-body { display: grid; gap: 14px; align-content: start; }
  .lesson-drawer-body .lesson-panel { border: 1px solid var(--lesson-line); border-radius: 12px; background: var(--lesson-surface); padding: 14px; }
  .lesson-drawer-body .lesson-nav-search { display: flex; align-items: center; gap: 8px; margin: 10px 0; border: 1px solid var(--lesson-line); border-radius: 10px; background: var(--lesson-surface); padding: 8px 10px; color: var(--color-muted); }
  .lesson-drawer-body .lesson-nav-search input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--color-ink); font-size: 16px; }
  .lesson-drawer-body .lesson-toc a { font-size: 13.5px; }
  .lesson-drawer-body .lesson-progress-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px solid var(--lesson-line); border-radius: 12px; background: var(--lesson-surface); padding: 12px; }
  .lesson-drawer-body .lesson-progress-summary > div:last-child { flex: 1 1 140px; min-width: 0; }
  .lesson-drawer-body .lesson-continue-btn { display: flex; width: max-content; max-width: 100%; min-height: 36px; align-items: center; gap: 6px; margin-top: 10px; border-radius: 9px; background: var(--lesson-accent); padding: 8px 12px; color: #fff; font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .lesson-drawer-body .lesson-progress-summary p { margin: 0; color: var(--color-ink); font-size: 14px; font-weight: 700; }
  .lesson-drawer-body .lesson-progress-summary small { display: block; margin-top: 2px; color: var(--color-muted); font-size: 12px; }
  .lesson-drawer-body .lesson-tree-chapter { width: 100%; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: 6px; border: 0; background: none; padding: 10px 2px; color: var(--color-ink); font-family: var(--font-display), sans-serif; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
  .lesson-drawer-body .lesson-tree-chapter em { display: flex; width: 22px; height: 22px; align-items: center; justify-content: center; border: 1px solid var(--lesson-line); border-radius: 50%; color: var(--color-muted); font-size: 12px; font-style: normal; font-weight: 700; }
  .lesson-drawer-body .lesson-tree-chapter small { color: var(--color-muted); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lesson-drawer-body .lesson-tree-chapter.is-current { background: var(--lesson-accent-soft); color: var(--lesson-accent-text); }
  .lesson-drawer-body .lesson-tree ol { display: grid; gap: 1px; margin: 2px 0 8px; padding: 0; list-style: none; }
  .lesson-drawer-body .lesson-tree a, .lesson-drawer-body .lesson-tree .lesson-tree-current { display: grid; min-height: 44px; grid-template-columns: 18px minmax(0,1fr); align-items: center; gap: 8px; border-left: 2px solid transparent; border-radius: 0 8px 8px 0; padding: 8px; color: var(--color-muted); font-size: 13.5px; line-height: 1.35; text-decoration: none; }
  .lesson-drawer-body .lesson-tree .is-current { border-left-color: var(--lesson-accent); background: var(--lesson-accent-soft); color: var(--color-ink); font-weight: 700; }
  .lesson-drawer-body .lesson-tree .is-done i { color: #34d399; }
  .lesson-drawer-body .lesson-tree .is-exam i { font-size: 12px; font-weight: 700; letter-spacing: .02em; }
  .lesson-drawer-body .lesson-section h2 { font-size: 14px; }
  .lesson-drawer-body .lesson-note-panel { padding: 0; }
}

/* ---- Trang chương ---- */
/* "Học tiếp": khối màu đặc, điểm nổi duy nhất (B2/L5). */
.lesson-shell .class-next-line:not(.class-next-line--done) { min-height: 64px; gap: 14px; border: 0; background: var(--color-primary, #1d4ed8); padding: 14px 18px; color: #fff; }
.lesson-shell .class-next-line:not(.class-next-line--done):hover { background: var(--color-primary-dark, #1e40af); }
.class-next-line-text { display: grid; flex: 1 1 auto; min-width: 0; gap: 1px; }
.lesson-shell .class-next-line-label { color: rgba(255,255,255,.85); font-size: 12px; letter-spacing: .08em; }
.lesson-shell .class-next-line-title { color: #fff; font-size: 17px; }
.lesson-shell .class-next-line-why { color: rgba(255,255,255,.9); font-size: 14px; white-space: normal; }
.class-next-line-go { display: inline-flex; flex: 0 0 auto; min-height: 44px; align-items: center; gap: 6px; border-radius: 10px; background: #fff; padding: 0 14px; color: var(--color-primary, #1d4ed8); font-size: 15px; font-weight: 700; }
.lesson-shell .class-next-line:not(.class-next-line--done) svg { color: inherit; }
/* Buổi ôn ở nhà: một dòng phụ, hạn nộp màu cần-chú-ý. */
.class-task-row { display: flex; flex-wrap: wrap; min-height: 48px; align-items: center; gap: 4px 10px; border: 1px solid var(--lesson-line); border-radius: 12px; background: var(--lesson-panel); padding: 10px 14px; color: var(--color-ink); font-size: 14px; text-decoration: none; }
.class-task-row:hover { border-color: var(--lesson-accent-line); }
.class-task-title { font-weight: 600; }
.class-task-sub { color: var(--color-muted); }
.class-task-due { margin-left: auto; color: var(--color-warn, #b45309); font-weight: 600; white-space: nowrap; }
/* "Ôn thêm:" — lối tắt cuối danh sách; tự ẩn khi không còn chip. */
.class-more { align-items: center; }
.class-more-label { color: var(--color-muted); font-size: 14px; }
.class-more:not(:has(.class-chip, a, button)) { display: none; }
/* Dải chương cho iPad dọc. */
.class-chapter-chips { display: none; }
@media (min-width: 640px) and (max-width: 1023px) {
  /* Trang chương iPad dọc: dải chương thay thanh đáy site, như bản duyệt (B1/N3). */
  body:has(.lesson-layout--pick) .mobile-tabbar { display: none; }
  body:has(.lesson-layout--pick) { padding-bottom: 0; }
  body:has(.lesson-layout--pick) .bug-fab { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .class-chapter-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .class-chapter-chips button { flex: 0 0 auto; min-height: 44px; border: 1px solid var(--lesson-line); border-radius: 12px; background: var(--lesson-panel); padding: 0 14px; color: var(--color-ink); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .class-chapter-chips button.is-active { border-color: transparent; background: var(--lesson-accent-soft); color: var(--lesson-accent-text); font-weight: 700; }
  .lesson-layout--pick .class-pick-desktop { display: grid; gap: 20px; }
  .lesson-layout--pick .class-pick-mobile { display: none; }
  .lesson-layout--pick .class-toc-toolbar { display: none; }
  .lesson-layout--pick .lesson-main--single > .lesson-head h1 { font-size: 28px; }
}

/* ============================================================================================
   VÙNG ĐỌC LÝ THUYẾT — 6 cách trình bày lấy từ trang iPad mini của Apple (thầy duyệt 26/10/2026)
   Khối mới chỉ cần HTML + CSS (không JS, lọt qua DOMPurify). Cách soạn: skill soan-bai-ly-thuyet-tuong-tac.
   ============================================================================================ */
/* (5) Nhịp: giữa hai mục (mốc h3) ~56px, giữa hai đoạn ~14px — tỉ lệ ≥ 1:3 (B3). */
.lesson-page .theory-section[data-open="1"] + .theory-section[data-open="1"] { margin-top: 56px; }
@media (max-width: 639px) { .lesson-page .theory-section[data-open="1"] + .theory-section[data-open="1"] { margin-top: 40px; } }

/* (1) Câu chốt đầu mục: <p class="tl-claim"> ngay sau <h3>. h3 thu thành nhãn nhỏ, câu chốt là chữ to (N5, G3). */
.exam-content h3:has(+ .tl-claim) { margin-bottom: 4px; color: var(--color-primary, #1d4ed8); font-size: .82rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.exam-content .tl-claim, .lesson-body .lesson-prose .exam-content p.tl-claim { margin: 0 0 16px; color: var(--color-ink); font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; text-wrap: balance; }

/* (2) Một chỗ in đậm mỗi đoạn — không có CSS, kiểm bằng scripts/kiem-dam-moi-doan.mts. */

/* (3) Ô "Số cần nhớ": <div class="tl-nums"><details class="tl-num"><summary>nhãn</summary><b>giá trị</b></details>…</div>
   Che sẵn, học sinh nhớ lại rồi bấm để kiểm (L1 — truy xuất). */
.exam-content .tl-nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 16px; }
.exam-content .tl-num { display: flex; min-height: 96px; flex-direction: column; justify-content: space-between; gap: 6px; border: 1px solid var(--lesson-line, rgba(15,23,42,.1)); border-radius: 12px; background: var(--color-bg); padding: 12px 14px; }
.exam-content .tl-num > summary { list-style: none; cursor: pointer; color: var(--color-muted); font-size: .9rem; line-height: 1.4; }
.exam-content .tl-num > summary::-webkit-details-marker { display: none; }
.exam-content .tl-num > summary::after { content: "Bấm để hiện"; display: block; margin-top: 8px; color: var(--color-primary, #1d4ed8); font-size: .9rem; font-weight: 600; }
.exam-content .tl-num[open] > summary::after { content: none; }
.exam-content .tl-num > :not(summary) { margin: 0; color: var(--color-ink); font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.exam-content .tl-num:hover { border-color: var(--lesson-accent-line, #1d4ed8); }

/* (4) Bảng đặt cạnh nhau cho bẫy: <table class="tl-table tl-cmp">, ô khác nhau <td class="tl-diff">. */
.exam-content .tl-cmp tbody th { width: 30%; color: var(--color-muted); font-size: .9rem; font-weight: 600; }
.exam-content .tl-cmp .tl-diff { background: rgba(245, 158, 11, .12); }
.exam-content .tl-cmp :is(th, td) { padding: 10px 12px; }

/* (6) Thuật ngữ mở tại chỗ (N8): <span class="tl-term"><input type="checkbox" id="…"><label for="…">từ</label><span class="tl-def">định nghĩa</span></span>
   Chú thích số mũ chỉ cho nguồn/điều kiện: <sup class="tl-fn"><a href="#tl-fn-1">1</a></sup> … <ol class="tl-fns"><li id="tl-fn-1">…</li></ol> */
.exam-content .tl-term > input { position: absolute; opacity: 0; pointer-events: none; }
.exam-content .tl-term > label { border-bottom: 1.5px dashed currentColor; color: var(--color-primary, #1d4ed8); font-weight: 500; cursor: pointer; }
.exam-content .tl-term > input:focus-visible + label { outline: 2px solid var(--color-primary, #1d4ed8); outline-offset: 2px; border-radius: 3px; }
.exam-content .tl-term > .tl-def { display: none; }
.exam-content .tl-term > input:checked ~ .tl-def { display: block; margin: 8px 0 4px; border-radius: 10px; background: var(--color-surface-2, rgba(15,23,42,.05)); padding: 10px 14px; color: var(--color-ink); font-size: .92em; line-height: 1.6; }
.exam-content .tl-fn { margin-left: 1px; font-size: .7em; font-weight: 700; line-height: 0; }
.exam-content .tl-fn a { color: var(--color-primary, #1d4ed8); text-decoration: none; }
.exam-content .tl-fns { margin: 36px 0 0; border-top: 1px solid var(--lesson-line, rgba(15,23,42,.1)); padding: 12px 0 0 20px; color: var(--color-muted); font-size: .82rem; line-height: 1.6; }

/* ============================================================================================
   TRANG BÀI KHỚP BẢN DUYỆT 26/10/2026 (đợt 2) — số đo lấy đúng CSS của bản xem thử "Trang chương và trang bài".
   ============================================================================================ */
/* Thân bài 17px (iPad dọc 18px), dòng ≤ 62 ký tự (C1/C2). */
.lesson-page .lesson-body { font-size: calc(1.0625rem * var(--lesson-read-scale, 1)); }
.lesson-page .lesson-prose :is(p, li, h3, h4) { max-width: 62ch; }
/* .lesson-page .exam-content đặt 1rem cứng (16px, bỏ qua cả nút A−/A+) — trong thẻ lý thuyết theo cỡ của thân bài. */
.lesson-page .lesson-prose .exam-content { font-size: 1em; }
/* Hộp mục tiêu: viền trái màu nhấn, nhãn in hoa, không in đậm bên trong (N7); dòng ⏱ đã bỏ lúc render (N4). */
.lesson-page .exam-content .tl-box.tl-goal { margin: 0 0 24px; border: 0; border-left: 3px solid var(--color-primary, #1d4ed8); border-radius: 0 10px 10px 0; background: var(--color-primary-soft, #eef2ff); padding: 12px 16px; font-size: 1rem; line-height: 1.65; }
.lesson-page .exam-content .tl-goal > .tl-label { display: block; margin: 0 0 4px; color: var(--color-primary, #1d4ed8); font-size: .875rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.lesson-page .exam-content .tl-goal :is(strong, b) { font-weight: inherit; }
.lesson-page .exam-content .tl-goal ul { margin: 0; padding-left: 18px; }
/* Nhịp B3 khi vẫn giữ mốc gập: nút "Tiếp" (đầu mục sau) cách cuối mục đang mở như khoảng giữa hai mục mở. */
.lesson-page .theory-section[data-open="1"] > .theory-next { margin-top: 56px; }
/* Dòng meta: ngay dưới H1; bản dưới dải tab chỉ dùng < 1024. */
.lesson-page .lesson-meta { gap: 6px 10px; font-size: 14px; }
.lesson-page .lesson-meta--below-tabs { display: none; }
/* Rail mục lục: khung, tiêu đề in hoa + số đếm, ✓ mục đã đọc, tô mục đang đọc (B5/B7). */
.lesson-page .lesson-toc { border: 1px solid var(--lesson-line); border-radius: 14px; background: var(--color-panel); padding: 10px; }
.lesson-page .lesson-toc-title { display: flex; justify-content: space-between; margin: 0; padding: 6px 10px 8px; color: var(--color-slate-500, #64748b); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lesson-page .lesson-toc-title span { font-variant-numeric: tabular-nums; letter-spacing: 0; }
.lesson-page .lesson-toc a, .lesson-nav--rail .lesson-toc a { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: start; gap: 8px; border: 0; border-radius: 9px; padding: 9px 10px; color: var(--color-ink); font-size: 14px; line-height: 1.4; }
.lesson-page .lesson-toc-n { padding-top: 1px; color: var(--color-slate-500, #64748b); font-size: 12px; font-style: normal; font-variant-numeric: tabular-nums; }
.lesson-page .lesson-toc a.is-done .lesson-toc-n { color: var(--color-ok, #047857); }

.lesson-page .lesson-toc a.is-active .lesson-toc-n { color: inherit; }

.lesson-page .lesson-nav--rail .lesson-side-link { min-height: 32px; padding: 0 10px; color: var(--color-primary, #1d4ed8); font-size: 14px; font-weight: 500; }

}
