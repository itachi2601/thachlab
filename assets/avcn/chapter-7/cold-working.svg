<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,sans-serif">
<rect width="800" height="600" fill="#f8fafc"/>
<!-- press frame -->
<rect x="150" y="40" width="360" height="60" fill="#64748b" stroke="#1e293b" stroke-width="5"/>
<rect x="150" y="500" width="360" height="60" fill="#64748b" stroke="#1e293b" stroke-width="5"/>
<rect x="110" y="40" width="40" height="520" fill="#94a3b8" stroke="#1e293b" stroke-width="5"/>
<!-- ram and punch -->
<rect x="290" y="100" width="80" height="120" fill="#94a3b8" stroke="#1e293b" stroke-width="5"/>
<polygon points="270,220 390,220 360,300 300,300" fill="#475569" stroke="#1e293b" stroke-width="5"/>
<path d="M330 120 L330 190 M312 168 L330 192 L348 168" stroke="#0284c7" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- die -->
<polygon points="190,420 270,420 300,360 360,360 390,420 470,420 470,500 190,500" fill="#475569" stroke="#1e293b" stroke-width="5"/>
<!-- sheet bent into die (blue = cold metal) -->
<path d="M170 400 L290 400 L300 306 L360 306 L370 400 L490 400" stroke="#38bdf8" stroke-width="22" fill="none" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M170 400 L290 400 L300 306 L360 306 L370 400 L490 400" stroke="#0369a1" stroke-width="4" fill="none" stroke-linejoin="round"/>
<!-- thermometer -->
<rect x="590" y="90" width="60" height="330" rx="30" fill="#ffffff" stroke="#1e293b" stroke-width="6"/>
<circle cx="620" cy="450" r="52" fill="#38bdf8" stroke="#1e293b" stroke-width="6"/>
<rect x="606" y="360" width="28" height="90" rx="14" fill="#38bdf8"/>
<g stroke="#1e293b" stroke-width="5"><line x1="660" y1="140" x2="690" y2="140"/><line x1="660" y1="200" x2="690" y2="200"/><line x1="660" y1="260" x2="690" y2="260"/><line x1="660" y1="320" x2="690" y2="320"/></g>
<text x="620" y="580" text-anchor="middle" font-size="64" font-weight="800" fill="#0369a1">20 °C</text>
</svg>
