<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <!-- 1 CAD software: laptop -->
  <rect x="30" y="140" width="190" height="120" rx="8" fill="#e2e8f0" stroke="#1e293b" stroke-width="3"/>
  <rect x="44" y="152" width="162" height="96" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <path d="M10 270 L240 270 L228 290 L22 290 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="3"/>
  <!-- 2 3D model on screen -->
  <g stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round">
    <path d="M95 200 L135 182 L175 200 L135 218 Z" fill="#bae6fd"/>
    <path d="M95 200 L135 218 L135 238 L95 220 Z" fill="#7dd3fc"/>
    <path d="M175 200 L135 218 L135 238 L175 220 Z" fill="#38bdf8"/>
  </g>
  <!-- arrow 1 -->
  <path d="M245 210 L300 210" stroke="#1e293b" stroke-width="4" fill="none"/><path d="M300 198 L322 210 L300 222 Z" fill="#1e293b"/>
  <!-- 3 toolpath -->
  <rect x="335" y="150" width="130" height="120" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
  <path d="M352 170 L448 170 L448 188 L352 188 L352 206 L448 206 L448 224 L352 224 L352 242 L448 242" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
  <!-- arrow 2 -->
  <path d="M480 210 L520 210" stroke="#1e293b" stroke-width="4" fill="none"/><path d="M520 198 L542 210 L520 222 Z" fill="#1e293b"/>
  <!-- 4 CNC machine -->
  <rect x="555" y="120" width="150" height="170" rx="10" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <rect x="570" y="190" width="120" height="80" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="570" y="132" width="50" height="40" rx="4" fill="#38bdf8" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 5 cutting tool -->
  <rect x="624" y="132" width="14" height="40" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
  <path d="M624 172 L638 172 L631 200 Z" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
  <!-- 6 finished part -->
  <g stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round">
    <rect x="610" y="228" width="60" height="34" rx="3" fill="#fbbf24"/>
    <circle cx="640" cy="245" r="9" fill="#f1f5f9"/>
  </g>
  <!-- leader lines -->
  <g stroke="#0284c7" stroke-width="2.5" fill="none">
    <line x1="125" y1="66" x2="125" y2="140"/>
    <line x1="150" y1="338" x2="148" y2="228"/>
    <line x1="400" y1="66" x2="400" y2="150"/>
    <line x1="630" y1="66" x2="630" y2="120"/>
    <line x1="724" y1="132" x2="638" y2="160"/>
    <line x1="560" y1="338" x2="635" y2="258"/>
  </g>
  <g font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="125" cy="46" r="20" fill="#0284c7"/><text x="125" y="54">1</text>
    <circle cx="150" cy="358" r="20" fill="#0284c7"/><text x="150" y="366">2</text>
    <circle cx="400" cy="46" r="20" fill="#0284c7"/><text x="400" y="54">3</text>
    <circle cx="630" cy="46" r="20" fill="#0284c7"/><text x="630" y="54">4</text>
    <circle cx="744" cy="124" r="20" fill="#0284c7"/><text x="744" y="132">5</text>
    <circle cx="560" cy="358" r="20" fill="#0284c7"/><text x="560" y="366">6</text>
  </g>
</svg>
