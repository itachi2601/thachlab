<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="520" fill="#ffffff"/>
  <!-- legs -->
  <rect x="352" y="330" width="42" height="120" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="406" y="330" width="42" height="120" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 7 safety shoes -->
  <path d="M340 450 H394 V484 H330 Q326 460 340 450 Z" fill="#b45309" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M406 450 H460 Q474 460 470 484 H406 Z" fill="#b45309" stroke="#1e293b" stroke-width="2.5"/>
  <!-- torso + arms -->
  <rect x="332" y="196" width="136" height="140" rx="14" fill="#60a5fa" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M332 206 L282 322" stroke="#60a5fa" stroke-width="34" stroke-linecap="round"/>
  <path d="M468 206 L518 322" stroke="#60a5fa" stroke-width="34" stroke-linecap="round"/>
  <!-- 6 apron -->
  <path d="M362 200 H438 L452 336 H348 Z" fill="#d6a15c" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="362" y1="200" x2="372" y2="196" stroke="#1e293b" stroke-width="3"/>
  <line x1="438" y1="200" x2="428" y2="196" stroke="#1e293b" stroke-width="3"/>
  <!-- 5 gloves -->
  <circle cx="276" cy="334" r="22" fill="#fde047" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="524" cy="334" r="22" fill="#fde047" stroke="#1e293b" stroke-width="2.5"/>
  <!-- head -->
  <circle cx="400" cy="130" r="52" fill="#fcd9b6" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 3 ear protectors: band + cups -->
  <path d="M352 122 Q400 54 448 122" fill="none" stroke="#334155" stroke-width="7"/>
  <rect x="336" y="108" width="24" height="46" rx="10" fill="#f97316" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="440" y="108" width="24" height="46" rx="10" fill="#f97316" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 1 safety helmet -->
  <path d="M342 106 Q342 58 400 58 Q458 58 458 106 Z" fill="#facc15" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="330" y="102" width="140" height="10" rx="4" fill="#facc15" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 2 goggles -->
  <rect x="368" y="116" width="30" height="20" rx="8" fill="#bae6fd" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="402" y="116" width="30" height="20" rx="8" fill="#bae6fd" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="398" y1="126" x2="402" y2="126" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 4 mask -->
  <path d="M370 146 Q400 140 430 146 Q426 176 400 180 Q374 176 370 146 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="400" cy="162" r="7" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>
  <!-- leader lines -->
  <g stroke="#0284c7" stroke-width="2.5" fill="none">
    <line x1="112" y1="70" x2="352" y2="76"/>
    <line x1="112" y1="140" x2="372" y2="126"/>
    <line x1="688" y1="110" x2="464" y2="130"/>
    <line x1="688" y1="190" x2="428" y2="164"/>
    <line x1="112" y1="334" x2="254" y2="334"/>
    <line x1="688" y1="290" x2="446" y2="290"/>
    <line x1="112" y1="470" x2="330" y2="470"/>
  </g>
  <g font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="92" cy="70" r="20" fill="#0284c7"/><text x="92" y="78">1</text>
    <circle cx="92" cy="140" r="20" fill="#0284c7"/><text x="92" y="148">2</text>
    <circle cx="708" cy="110" r="20" fill="#0284c7"/><text x="708" y="118">3</text>
    <circle cx="708" cy="190" r="20" fill="#0284c7"/><text x="708" y="198">4</text>
    <circle cx="92" cy="334" r="20" fill="#0284c7"/><text x="92" y="342">5</text>
    <circle cx="708" cy="290" r="20" fill="#0284c7"/><text x="708" y="298">6</text>
    <circle cx="92" cy="470" r="20" fill="#0284c7"/><text x="92" y="478">7</text>
  </g>
</svg>
